# Imported from Void Linux's template for 'apvlv'. Review before relying on it.
# needs, but Forge has no recipe for yet: libwebkit2gtk41
[package]
name = "apvlv"
version = "0.5.0"
archive = "https://github.com/naihe2010/apvlv/archive/v0.5.0.tar.gz"
sha256 = "4e7f18c19851f48ee00d4b424b5dd9c47887f9459e481d486b76c16998133afb"
strip_components = 1
description = "Vim-like PDF/DJVU/TXT viewer"
homepage = "http://naihe2010.github.io/apvlv/"
license = "GPL-2.0-only"
deps = ["desktop-file-utils", "djvulibre", "ebook-tools", "gtk+3", "poppler"]
patches = ["patches/cxxflags_from_env.patch", "patches/use_dist_manpdf.patch"]

[build]
system = "cmake"
configure_args = ["-DAPVLV_WITH_UMD=no", "-DAPVLV_WITH_DJVU=yes", "-DAPVLV_WITH_TXT=yes"]
tools = ["pkg-config"]

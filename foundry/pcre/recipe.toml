# Imported from Void Linux's template for 'pcre'. Review before relying on it.
# needs, but Forge has no recipe for yet: bzip2
[package]
name = "pcre"
version = "8.45"
archive = "https://downloads.sourceforge.net/sourceforge/pcre/pcre/8.45/pcre-8.45.tar.bz2"
sha256 = "4dae6fdcd2bb0bb6c37b5f97c33c2be954da743985369cddac3546e3218bffb8"
strip_components = 1
description = "Perl Compatible Regular Expressions"
homepage = "https://www.pcre.org/"
license = "BSD-3-Clause"
deps = ["libedit", "zlib"]
patches = ["patches/ppc-icache-flush.patch"]

[build]
system = "autotools"
configure_args = ["--enable-utf8", "--enable-unicode-properties", "--with-pic", "--enable-pcregrep-libz", "--enable-pcregrep-libbz2", "--enable-newline-is-anycrlf", "--enable-pcretest-libedit", "--enable-jit", "--enable-static"]

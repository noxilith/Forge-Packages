# Imported from Void Linux's template for 'libticonv'. Review before relying on it.
# hooks not translated: pre_configure
# needs, but Forge has no recipe for yet: intltool
[package]
name = "libticonv"
version = "1.1.5"
archive = "https://downloads.sourceforge.net/sourceforge/tilp/tilp2-linux/tilp2-1.18/libticonv-1.1.5.tar.bz2"
sha256 = "316da6a73bf26b266dd23443882abc4c9fe7013edc3a53e5e301d525c2060878"
strip_components = 1
description = "TI character set conversion library"
homepage = "https://www.ticalc.org"
license = "GPL-2.0-or-later"
deps = ["glib"]

[build]
system = "autotools"
configure_args = ["--enable-iconv"]
tools = ["bison", "pkg-config"]
deps = ["groff"]

# Imported from Void Linux's template for 'xmount'. Review before relying on it.
# hooks not translated: post_install
[package]
name = "xmount"
version = "1.3.1"
archive = "https://code.sits.lu/foss/xmount/-/archive/1.3.1/xmount-1.3.1.tar.gz"
sha256 = "080c2a715af294fe723bf7df6fdaf4a07fe0db69d876350001928af2884b9cd9"
strip_components = 1
description = "Tool to crossmount between multiple harddisk image files"
homepage = "https://code.sits.lu/foss/xmount"
license = "GPL-3.0-or-later"
deps = ["afflib", "fuse3", "libewf", "libxml2", "lz4", "raptor", "snappy", "zlib"]

[build]
system = "cmake"
configure_args = ["-DCMAKE_BUILD_TYPE=Release"]
tools = ["pkg-config"]

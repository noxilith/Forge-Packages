# Imported from Void Linux's template for 'kscreenlocker'. Review before relying on it.
# needs, but Forge has no recipe for yet: kde-plasma-base, qt6-tools
[package]
name = "kscreenlocker"
version = "6.7.5"
archive = "https://download.kde.org/stable/plasma/6.7.5/kscreenlocker-6.7.5.tar.xz"
sha256 = "6c41ce2cb79d2b85d4fbe5a3a61c09e40c70e5a869ae6f0352c7e1cb3b44606b"
strip_components = 1
description = "KDE Library and components for secure lock screen architecture"
homepage = "https://invent.kde.org/plasma/kscreenlocker"
license = "GPL-2.0-or-later"
deps = ["kf6-kcmutils", "kf6-kcrash", "kf6-kglobalaccel", "kf6-ki18n", "kf6-kidletime", "kf6-kio", "kf6-knotifications", "kf6-ksvg", "kf6-kwindowsystem", "kf6-kxmlgui", "kf6-solid", "layer-shell-qt", "libX11", "libkf6screen", "libplasma", "libxcb", "pam", "qt6-base", "qt6-declarative", "wayland", "xcb-util-keysyms"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
tools = ["pkg-config"]
deps = ["elogind", "extra-cmake-modules", "gettext", "kf6-kconfig", "kf6-kpackage"]

# Imported from Void Linux's template for 'curl'. Review before relying on it.
# 14 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, pre_check, pre_configure
# needs, but Forge has no recipe for yet: ca-certificates
[package]
name = "curl"
version = "8.22.0"
archive = "https://curl.se/download/curl-8.22.0.tar.gz"
sha256 = "d54dd598bf05927a726deb38df31c6a255ba83ff1de57c5d1464dac3ed8f44a1"
strip_components = 1
description = "Client that groks URLs"
homepage = "https://curl.se"
license = "MIT"
deps = ["nghttp2", "zlib"]

[build]
system = "autotools"
configure_args = ["ac_cv_sizeof_off_t=8", "--enable-threaded-resolver", "--enable-ipv6", "--with-random=/dev/urandom", "--with-fish-functions-dir", "--with-zsh-functions-dir"]
tools = ["perl", "pkg-config"]
deps = ["mdocml"]

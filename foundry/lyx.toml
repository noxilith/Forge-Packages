# Imported from Void Linux's template for 'lyx'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: bc, boost, qt5
[package]
name = "lyx"
version = "2.3.7r1"
archive = "https://ftp.lip6.fr/pub/lyx/stable/2.3.x/lyx-2.3.7-1.tar.gz"
sha256 = "910bb48d9b19c0cfeb6ec845eb318515f33a63ea7892a99b2e7b67c6b518bacd"
strip_components = 1
description = "Document Processor WYSIWYM Editor & Latex frontend"
homepage = "https://www.lyx.org/Home"
license = "GPL-2.0-or-later"
deps = ["GraphicsMagick", "enchant2", "file", "mythes"]

[build]
system = "autotools"
configure_args = ["--enable-qt5", "--without-included-mythes", "--without-included-boost"]
tools = ["pkg-config"]

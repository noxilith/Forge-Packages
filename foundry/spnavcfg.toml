# Imported from Void Linux's template for 'spnavcfg'. Review before relying on it.
# needs, but Forge has no recipe for yet: qt5
[package]
name = "spnavcfg"
version = "1.1"
archive = "https://github.com/FreeSpacenav/spnavcfg/releases/download/v1.1/spnavcfg-1.1.tar.gz"
sha256 = "02dfd91d6d761185baffa5e695515cdb64f3e26d2dc3abe790d6452163c75392"
strip_components = 1
description = "Spacenav interactive configuration GUI"
homepage = "http://spacenav.sourceforge.net"
license = "GPL-3.0-or-later"
deps = ["libspnav"]

[build]
system = "autotools"
tools = ["pkg-config"]

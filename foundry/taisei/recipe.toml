# Imported from Void Linux's template for 'taisei'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: libwebp, opusfile, python3-docutils
[package]
name = "taisei"
version = "1.3.2"
archive = "https://github.com/taisei-project/taisei/releases/download/v1.3.2/taisei-v1.3.2.tar.xz"
sha256 = "dbc05f1b5c31981d8711130ac283355b7bfad403895f4096a6bb7e9a3d73a3bc"
strip_components = 1
description = "Free and open-source Touhou Project clone and fangame"
homepage = "https://taisei-project.org"
license = "MIT"
deps = ["SDL2_mixer", "cglm", "freetype", "libzip"]
patches = ["patches/openssl1.patch", "patches/openssl2.patch"]

[build]
system = "meson"
tools = ["pkg-config"]

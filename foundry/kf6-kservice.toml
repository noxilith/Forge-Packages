# Imported from Void Linux's template for 'kf6-kservice'. Review before relying on it.
# needs, but Forge has no recipe for yet: kf6-base, qt6-tools
[package]
name = "kf6-kservice"
version = "6.30.0"
archive = "https://download.kde.org/stable/frameworks/6.30/kservice-6.30.0.tar.xz"
sha256 = "e63062504ede4ebfda4c93e3484a63817731e1157cdcac6e33fb47fe6abc1657"
strip_components = 1
description = "KDE Plugin framework for desktop services"
homepage = "https://invent.kde.org/frameworks/kservice"
license = "LGPL-2.1-or-later"
deps = ["kf6-kconfig", "kf6-kcoreaddons", "kf6-kdoctools", "kf6-ki18n"]

[build]
system = "cmake"
deps = ["extra-cmake-modules", "gettext", "qt6-base"]

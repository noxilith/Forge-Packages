# Imported from Void Linux's template for 'corectrl'. Review before relying on it.
# needs, but Forge has no recipe for yet: botan, hicolor-icon-theme, qt6-charts, qt6-qt5compat, qt6-svg, qt6-tools
[package]
name = "corectrl"
version = "1.5.2"
archive = "https://gitlab.com/corectrl/corectrl/-/archive/v1.5.2/corectrl-v1.5.2.tar.gz"
sha256 = "6eccc6ea82a62e8491ad516a589e12e14d52ad0aaa74166ea74f35bf1c10c38e"
strip_components = 1
description = "User-friendly hardware control application"
homepage = "https://gitlab.com/corectrl/corectrl"
license = "GPL-3.0-or-later"
deps = ["dbus", "mesa-demos", "polkit", "pugixml", "qt6-declarative", "quazip", "spdlog"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "qt6-base"]

# Imported from Void Linux's template for 'pcmanx-gtk2'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, post_patch
# needs, but Forge has no recipe for yet: intltool
[package]
name = "pcmanx-gtk2"
version = "1.3"
archive = "https://github.com/pcman-bbs/pcmanx/releases/download/1.3/pcmanx-gtk2-1.3.tar.xz"
sha256 = "3f5d7eaf5daa7dcf3843a01e239cea312045ded03dd77b364fa1082b9356968a"
strip_components = 1
description = "Easy-to-use telnet client mainly for BBS users"
homepage = "https://github.com/pcman-bbs/pcmanx"
license = "GPL-2.0-only"
deps = ["gtk+"]

[build]
system = "autotools"
configure_args = ["--enable-iplookup", "--enable-proxy"]
tools = ["pkg-config"]
deps = ["gettext"]

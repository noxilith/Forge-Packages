# Imported from Void Linux's template for 'osg'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: build_helper, CFLAGS, CXXFLAGS
# needs, but Forge has no recipe for yet: ffmpeg6, mesa
[package]
name = "osg"
version = "3.6.5"
archive = "https://github.com/openscenegraph/OpenSceneGraph/archive/OpenSceneGraph-3.6.5.tar.gz"
sha256 = "aea196550f02974d6d09291c5d83b51ca6a03b3767e234a8c0e21322927d1e12"
strip_components = 1
description = "OpenSceneGraph: high performance real-time graphics toolkit"
homepage = "https://www.openscenegraph.org"
license = "LGPL-2.1-or-later, WxWindows-exception-3.1, custom:OpenSceneGraph"
deps = ["SDL2", "collada-dom", "curl", "giflib", "gst-plugins-base1", "gtkglext", "jasper", "libgdal", "libgta", "librsvg", "tiff", "xine-lib", "xrandr"]
patches = ["patches/ffmpeg5.patch", "patches/musl-endianess.patch", "patches/musl-pthread.patch"]

[build]
system = "cmake"
configure_args = ["-DLIB_POSTFIX="]
tools = ["pkg-config"]

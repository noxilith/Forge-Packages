# Imported from Void Linux's template for 'kquickimageeditor'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "kquickimageeditor"
version = "0.6.0"
archive = "https://download.kde.org/stable/kquickimageeditor/kquickimageeditor-0.6.0.tar.xz"
sha256 = "11ed4ce1c164a8b6d50bbc1548b5849ab75d5fb837619b90f2cea51ed122547a"
strip_components = 1
description = "QML image editing components"
homepage = "https://invent.kde.org/libraries/kquickimageeditor"
license = "LGPL-2.1-or-later, BSD-2-Clause, CC0-1.0"
deps = ["kf6-kconfig", "qt6-base", "qt6-declarative"]

[build]
system = "cmake"
configure_args = ["-DBUILD_WITH_QT6=ON", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
deps = ["extra-cmake-modules"]

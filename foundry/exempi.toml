# Imported from Void Linux's template for 'exempi'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: boost
[package]
name = "exempi"
version = "2.6.6"
archive = "https://libopenraw.freedesktop.org/download/exempi-2.6.6.tar.xz"
sha256 = "900fb9957be2095c78e5111b99c49378adac58161a358f52f93c55126f34eb8f"
strip_components = 1
description = "Library for easy parsing of XMP metadata"
homepage = "https://libopenraw.freedesktop.org/exempi/"
license = "BSD-3-Clause"
deps = ["expat", "zlib"]

[build]
system = "autotools"
configure_args = ["--disable-static", "--disable-unittest"]

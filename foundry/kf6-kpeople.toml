# Imported from Void Linux's template for 'kf6-kpeople'. Review before relying on it.
# needs, but Forge has no recipe for yet: kf6-base, qt6-tools
[package]
name = "kf6-kpeople"
version = "6.30.0"
archive = "https://download.kde.org/stable/frameworks/6.30/kpeople-6.30.0.tar.xz"
sha256 = "094868f11c8c46e57a077c2788a39c6ee0b0ebc2b64279c6f7c70a5152f518e7"
strip_components = 1
description = "Library that provides access to all contacts and people who hold them"
homepage = "https://invent.kde.org/frameworks/kpeople"
license = "LGPL-2.1-or-later"
deps = ["kf6-kcontacts", "kf6-kcoreaddons", "kf6-ki18n", "kf6-kitemviews", "kf6-kwidgetsaddons"]

[build]
system = "cmake"
configure_args = ["-DKDE_INSTALL_QMLDIR=lib/qt6/qml", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
deps = ["extra-cmake-modules", "gettext", "kf6-kconfig", "qt6-base", "qt6-declarative"]

# Imported from Void Linux's template for 'ht'. Review before relying on it.
# hooks not translated: post_install, pre_build
# settings not translated: CXXFLAGS
# needs, but Forge has no recipe for yet: ncurses
[package]
name = "ht"
version = "2.1.0"
archive = "https://downloads.sourceforge.net/sourceforge/hte/ht-source/ht-2.1.0.tar.bz2"
sha256 = "31f5e8e2ca7f85d40bb18ef518bf1a105a6f602918a0755bc649f3f407b75d70"
strip_components = 1
description = "File editor/viewer/analyzer for executables"
homepage = "http://hte.sourceforge.net/"
license = "GPL-2.0-only"
deps = ["lzo"]
patches = ["patches/fix-build.patch"]

[build]
system = "autotools"

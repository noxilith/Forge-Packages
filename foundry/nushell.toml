# Imported from Void Linux's template for 'nushell'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: sqlite
[package]
name = "nushell"
version = "0.115.1"
archive = "https://github.com/nushell/nushell/archive/refs/tags/0.115.1.tar.gz"
sha256 = "06df93281a0f858019d09ea6cf821b19a7cd9017cdfb9e898cfe8dd4bd8101c2"
strip_components = 1
description = "Modern shell for the GitHub era"
homepage = "https://www.nushell.sh/"
license = "MIT"
deps = ["libgit2-1.9", "openssl"]

[build]
system = "cargo"
configure_args = ["--no-default-features", "--features=plugin,trash-support,sqlite,network,native-tls,helix,lsp"]
tools = ["pkg-config"]

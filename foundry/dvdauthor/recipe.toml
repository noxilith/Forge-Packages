# Imported from Void Linux's template for 'dvdauthor'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: pre_configure
[package]
name = "dvdauthor"
version = "0.7.2"
archive = "https://downloads.sourceforge.net/sourceforge/dvdauthor/dvdauthor-0.7.2.tar.gz"
sha256 = "3020a92de9f78eb36f48b6f22d5a001c47107826634a785a62dfcd080f612eb7"
strip_components = 1
description = "DVD authoring tools, generate a DVD movie from MPEG2 stream"
homepage = "http://dvdauthor.sourceforge.net/"
license = "GPL-2.0-or-later"
deps = ["freetype", "fribidi", "gettext", "libdvdnav", "libpng", "libxml2"]
patches = ["patches/freetype-pkg_config.patch"]

[build]
system = "autotools"
configure_args = ["--enable-localize-filenames", ")"]
tools = ["pkg-config"]

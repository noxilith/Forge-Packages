# Imported from Void Linux's template for 'kmail-account-wizard'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "kmail-account-wizard"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/kmail-account-wizard-26.08.1.tar.xz"
sha256 = "4ace348a96e1080882ddb768af2414da8299727b11f94d336f1f6594a367ec8b"
strip_components = 1
description = "KMail account wizard"
homepage = "https://community.kde.org/KDE_PIM"
license = "GPL-2.0-or-later"
deps = ["kf6-knotifyconfig", "kf6-ktexteditor", "kidentitymanagement", "kmailtransport", "libkleo", "pimcommon"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "gettext", "kf6-kconfig", "kf6-kcoreaddons", "kf6-kdoctools", "qt6-base", "qt6-declarative"]

# Imported from Void Linux's template for 'gjs'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: dbus-glib, libreadline8
[package]
name = "gjs"
version = "1.88.0"
archive = "https://download.gnome.org/sources/gjs/1.88/gjs-1.88.0.tar.xz"
sha256 = "30a0b9f3317e8e60b1896db2903c70e8b0cd33df953c328755803a75191dc453"
strip_components = 1
description = "Mozilla-based javascript bindings for the GNOME platform"
homepage = "https://gitlab.gnome.org/GNOME/gjs"
license = "MIT, LGPL-2.0-or-later"
deps = ["gobject-introspection", "mozjs140", "sysprof"]
patches = ["patches/ignore-encoding-test.patch"]

[build]
system = "meson"
configure_args = ["-Dprofiler=disabled", "-Dinstalled_tests=false"]
tools = ["pkg-config"]
deps = ["glib"]

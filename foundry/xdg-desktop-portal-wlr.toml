# Imported from Void Linux's template for 'xdg-desktop-portal-wlr'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: mesa
[package]
name = "xdg-desktop-portal-wlr"
version = "0.8.4"
archive = "https://github.com/emersion/xdg-desktop-portal-wlr/archive/v0.8.4.tar.gz"
sha256 = "3122966d46ab108f505525bcb2498f9121b446ee8438fbfceb73a7a1fa1ad400"
strip_components = 1
description = "Backend of xdg-desktop-portal for wlroots"
homepage = "https://github.com/emersion/xdg-desktop-portal-wlr"
license = "MIT"
deps = ["elogind", "inih", "libdrm", "pipewire", "wayland", "wayland-protocols", "xdg-desktop-portal"]

[build]
system = "meson"
configure_args = ["-Dc_args=-Wno-error"]
tools = ["pkg-config"]
deps = ["scdoc"]

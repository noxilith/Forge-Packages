# Imported from Void Linux's template for 'distcc'. Review before relying on it.
# hooks not translated: post_install, pre_configure
# settings not translated: conf_files
# needs, but Forge has no recipe for yet: avahi
[package]
name = "distcc"
version = "3.4"
archive = "https://github.com/distcc/distcc/releases/download/v3.4/distcc-3.4.tar.gz"
sha256 = "2b99edda9dad9dbf283933a02eace6de7423fe5650daa4a728c950e5cd37bd7d"
strip_components = 1
description = "Distributed compilation for faster C/C++ builds"
homepage = "https://distcc.github.io"
license = "GPL-2.0-or-later"
deps = ["popt"]
patches = ["patches/dcc_gcc_rewrite_fqn-avoid-heap-corruption.patch", "patches/gcc-10.patch", "patches/python-3.9.patch"]

[build]
system = "autotools"
configure_args = ["--disable-Werror"]
tools = ["pkg-config"]
deps = ["which"]

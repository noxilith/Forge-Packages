# Imported from Void Linux's template for 'xfce4-pulseaudio-plugin'. Review before relying on it.
# needs, but Forge has no recipe for yet: libcanberra
[package]
name = "xfce4-pulseaudio-plugin"
version = "0.5.1"
archive = "https://archive.xfce.org/src/panel-plugins/xfce4-pulseaudio-plugin/0.5/xfce4-pulseaudio-plugin-0.5.1.tar.xz"
sha256 = "8e1f3a505f37aa3bc2816a58bec5f9555366f1c476f10eab59fd0e6581d08c47"
strip_components = 1
description = "Pulseaudio volume control plugin for Xfce4 panel"
homepage = "https://goodies.xfce.org/projects/panel-plugins/xfce4-pulseaudio-plugin"
license = "GPL-2.0-or-later"
deps = ["exo", "glib", "libkeybinder3", "libnotify", "pavucontrol", "pulseaudio", "xfce4-panel"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["gettext"]

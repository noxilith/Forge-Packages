# Imported from Void Linux's template for 'spdlog'. Review before relying on it.
[package]
name = "spdlog"
version = "1.17.0"
archive = "https://github.com/gabime/spdlog/archive/v1.17.0.tar.gz"
sha256 = "d8862955c6d74e5846b3f580b1605d2428b11d97a410d86e2fb13e857cd3a744"
strip_components = 1
description = "Fast C++ logging library"
homepage = "https://github.com/gabime/spdlog"
license = "MIT"
deps = ["fmt"]
patches = ["patches/fix-musl.patch"]

[build]
system = "cmake"
configure_args = ["-DSPDLOG_BUILD_EXAMPLE=OFF", "-DSPDLOG_FMT_EXTERNAL=ON", "-DSPDLOG_BUILD_SHARED=ON"]
tools = ["pkg-config"]

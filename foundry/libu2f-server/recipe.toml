# Imported from Void Linux's template for 'libu2f-server'. Review before relying on it.
# hooks not translated: post_install, pre_configure
[package]
name = "libu2f-server"
version = "1.1.0"
archive = "https://github.com/Yubico/libu2f-server/archive/libu2f-server-1.1.0.tar.gz"
sha256 = "6551109e692c9c4fea61e99f1cd8377e8e54e3033e421cc191da6d673311c860"
strip_components = 1
description = "Yubico Universal 2nd Factor (U2F) Server C Library"
homepage = "https://developers.yubico.com/libu2f-server/"
license = "BSD"
deps = ["check", "hidapi", "json-c", "openssl"]
patches = ["patches/lowercase-boolean.patch", "patches/no-help2man.patch", "patches/src-no-help.patch"]

[build]
system = "autotools"
tools = ["pkg-config"]
deps = ["gengetopt"]

# Imported from Void Linux's template for 'libxo'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: CFLAGS
[package]
name = "libxo"
version = "2.0.0"
archive = "https://github.com/Juniper/libxo/releases/download/2.0.0/libxo-2.0.0.tar.gz"
sha256 = "982de1877309dd9d57f4cabf2c8bbf42c1c15dc402cd8586ab1e4eabaea298eb"
strip_components = 1
description = "Library for programs to output XML, JSON and HTML"
homepage = "https://juniper.github.io/libxo/libxo-manual.html"
license = "BSD-2-Clause"
patches = ["patches/fix-gettext.patch", "patches/fix-musl.patch"]

[build]
system = "autotools"
configure_args = ["--disable-gettext"]
deps = ["byacc"]

# Imported from Void Linux's template for 'libfyaml'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, pre_configure
# needs, but Forge has no recipe for yet: python3-pip
[package]
name = "libfyaml"
version = "0.9.6"
archive = "https://github.com/pantoniou/libfyaml/archive/refs/tags/v0.9.6.tar.gz"
sha256 = "2d016379a69f6cf6beaf06d12bcefe1ad1784bab28fbb41a6fa8d49d25f1bc0a"
strip_components = 1
description = "Fully feature complete YAML parser and emitter"
homepage = "https://github.com/pantoniou/libfyaml"
license = "MIT"
deps = ["check", "libyaml"]
patches = ["patches/cherry-pick-commit-1026d76.patch", "patches/fix-32bit.patch", "patches/fix-none-required.patch"]

[build]
system = "autotools"
configure_args = ["--disable-network"]
tools = ["pkg-config"]
deps = ["jq"]

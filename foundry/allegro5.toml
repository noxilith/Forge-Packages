# Imported from Void Linux's template for 'allegro5'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: jack, libtheora, opusfile, physfs
[package]
name = "allegro5"
version = "5.2.11.3"
archive = "https://github.com/liballeg/allegro5/releases/download/5.2.11.3/allegro-5.2.11.3.tar.gz"
sha256 = "aba4679a5b1f2bf62482eba6e8814a94de7ffc86de5f8587ba199fcc61b4a04f"
strip_components = 1
description = "Portable library mainly aimed at video game and multimedia programming"
homepage = "https://liballeg.org/"
license = "Allegro License (MIT alike)"
deps = ["alsa-lib", "flac", "freetype", "glu", "gtk+3", "libXcursor", "libXpm", "libXxf86dga", "libXxf86vm", "libjpeg-turbo", "libopenal", "libpng", "libvorbis", "opus", "pulseaudio", "zlib"]

[build]
system = "cmake"
configure_args = ["-DWANT_DOCS=1", "-DWANT_PHYSFS=1"]
tools = ["pkg-config"]

# Imported from Void Linux's template for 'gnome-podcasts'. Review before relying on it.
# hooks not translated: post_patch
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: sqlite
[package]
name = "gnome-podcasts"
version = "25.3"
archive = "https://gitlab.gnome.org/World/podcasts/-/archive/25.3/podcasts-25.3.tar.gz"
sha256 = "b2d012e31f20385bbba9919dacf5783ea20fb3e60c86dfd21fdf7d8ea640d600"
strip_components = 1
description = "Listen to your favorite podcasts"
homepage = "https://apps.gnome.org/Podcasts/"
license = "GPL-3.0-or-later"
deps = ["gst-plugins-bad1", "gst-plugins-base1", "gstreamer1", "gtk4", "libadwaita", "openssl", "texinfo"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["desktop-file-utils", "gettext", "glib", "gtk+3"]

# Imported from Void Linux's template for 'qterminal'. Review before relying on it.
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "qterminal"
version = "2.4.0"
archive = "https://github.com/lxqt/qterminal/archive/2.4.0.tar.gz"
sha256 = "dc17658372b3d275b40950f36ae28faa94ffebf6be1b2caa77a84e246a694f74"
strip_components = 1
description = "Lightweight terminal emulator written in Qt"
homepage = "https://lxqt-project.org"
license = "GPL-2.0-or-later"
deps = ["layer-shell-qt", "qt6-base", "qtermwidget-qt6"]

[build]
system = "cmake"
tools = ["perl"]
deps = ["lxqt-build-tools"]

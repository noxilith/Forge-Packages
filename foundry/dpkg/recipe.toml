# Imported from Void Linux's template for 'dpkg'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: bzip2, ncurses, perl, po4a, zstd
[package]
name = "dpkg"
version = "1.23.7"
archive = "https://ftp.debian.org/debian/pool/main/d/dpkg/dpkg_1.23.7.tar.xz"
sha256 = "60fe2be72e5f0a4bb0ac7baff3b1697ebc5cfaac1885f66649521571a97440ad"
strip_components = 1
description = "Debian Package Manager"
homepage = "http://packages.debian.org/dpkg"
license = "GPL-2.0-or-later"
deps = ["libmd", "xz", "zlib"]
patches = ["patches/musl-tests.patch"]

[build]
system = "autotools"
configure_args = ["--disable-start-stop-daemon", "--with-libz", "--with-libbz2", "--with-liblzma"]
tools = ["perl", "pkg-config"]
deps = ["tar"]

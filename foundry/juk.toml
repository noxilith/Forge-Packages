# Imported from Void Linux's template for 'juk'. Review before relying on it.
# needs, but Forge has no recipe for yet: hicolor-icon-theme, qt6-svg, qt6-tools
[package]
name = "juk"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/juk-26.08.1.tar.xz"
sha256 = "aedbb4558959a4fb6e854461ed47afa84ca07726423c9a223f8eac3b339af816"
strip_components = 1
description = "Jukebox, tagger and music collection manager"
homepage = "https://juk.kde.org/"
license = "GPL-2.0-or-later"
deps = ["kf6-kcompletion", "kf6-kconfig", "kf6-kcoreaddons", "kf6-kcrash", "kf6-kdoctools", "kf6-kglobalaccel", "kf6-ki18n", "kf6-kiconthemes", "kf6-kio", "kf6-kjobwidgets", "kf6-knotifications", "kf6-kstatusnotifieritem", "kf6-ktextwidgets", "kf6-kwallet", "kf6-kwidgetsaddons", "kf6-kwindowsystem", "kf6-kxmlgui", "phonon", "taglib"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "gettext", "qt6-base"]

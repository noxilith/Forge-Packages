# Imported from Void Linux's template for 'lxinput'. Review before relying on it.
# hooks not translated: pre_configure
# needs, but Forge has no recipe for yet: intltool
[package]
name = "lxinput"
version = "0.3.6"
archive = "https://github.com/lxde/lxinput/archive/refs/tags/0.3.6.tar.gz"
sha256 = "2f15c2a17f970afb152cbd024503da26c1e15135e76e9f516e0ca97e909d6c37"
strip_components = 1
description = "LXDE Keyboad/Mouse configurator"
homepage = "http://lxde.org/"
license = "GPL-2.0-or-later"
deps = ["desktop-file-utils", "gtk+3"]

[build]
system = "autotools"
configure_args = ["--enable-gtk3"]
tools = ["pkg-config"]
deps = ["gettext", "glib"]

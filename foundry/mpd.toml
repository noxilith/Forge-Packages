# Imported from Void Linux's template for 'mpd'. Review before relying on it.
# 13 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# settings not translated: LDFLAGS, make_dirs, conf_files
# needs, but Forge has no recipe for yet: avahi-discover, ffmpeg6, python3-Sphinx
[package]
name = "mpd"
version = "0.24.13"
archive = "https://www.musicpd.org/download/mpd/0.24/mpd-0.24.13.tar.xz"
sha256 = "9f215a081cc1f7c98fcccc6620f4cb705b14ba2d87fd99e062dd0804e2e3d96e"
strip_components = 1
description = "Flexible, powerful, server-side application for playing music"
homepage = "https://www.musicpd.org/"
license = "GPL-2.0-or-later"
deps = ["audiofile", "curl", "faad2", "fmt", "json-c++", "libcap", "libicu78", "libid3tag", "libmad", "libmikmod", "libmms", "libmodplug", "libmpdclient", "libnfs", "libnpupnp", "libsamplerate", "libsoxr", "mpg123", "opus", "pcre2", "twolame", "zziplib"]

[build]
system = "meson"
configure_args = ["-Dopus=enabled", "-Dmikmod=enabled", "-Dneighbor=true", "-Dpipe=true", "-Dtwolame=enabled", "-Dbzip2=enabled", "-Dzzip=enabled", "-Dsmbclient=disabled", "-Dsystemd=disabled", "-Dqobuz=disabled", "-Dchromaprint=disabled", "-Dsoxr=enabled", "-Dadplug=disabled", "-Dfluidsynth=disabled", "-Dgme=disabled", "-Dwildmidi=disabled", "-Dsidplay=disabled", "-Dshine=disabled", "-Ddocumentation=enabled", "-Daudiofile=enabled", "-Dtremor=disabled", "-Dsolaris_output=disabled", "-Dhtml_manual=false", "-Dmanpages=true"]
tools = ["pkg-config"]

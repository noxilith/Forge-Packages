# Imported from Void Linux's template for 'kf6-baloo'. Review before relying on it.
# needs, but Forge has no recipe for yet: kf6-base, lmdb, qt6-tools
[package]
name = "kf6-baloo"
version = "6.30.0"
archive = "https://download.kde.org/stable/frameworks/6.30/baloo-6.30.0.tar.xz"
sha256 = "a59d33a919bfa1d164c8f3a6f992c609edaf2131ac5f52ea4ecb77f6fbc53be1"
strip_components = 1
description = "Framework for searching and managing metadata"
homepage = "https://invent.kde.org/frameworks/baloo"
license = "LGPL-2.1-or-later"
deps = ["kf6-kconfig", "kf6-kcoreaddons", "kf6-kcrash", "kf6-kdbusaddons", "kf6-kfilemetadata", "kf6-ki18n", "kf6-kidletime", "kf6-kio", "kf6-solid", "qt6-declarative"]

[build]
system = "cmake"
configure_args = ["-DKDE_INSTALL_QMLDIR=lib/qt6/qml", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
deps = ["extra-cmake-modules", "gettext", "qt6-base"]

# Imported from Void Linux's template for 'abi-dumper'. Review before relying on it.
# hooks not translated: pre_install
# needs, but Forge has no recipe for yet: ctags, perl
[package]
name = "abi-dumper"
version = "1.4"
archive = "https://github.com/lvc/abi-dumper/archive/1.4.tar.gz"
sha256 = "aa7a52bf913ab1a64743551d64575f921df3faa4a592a0f6614e047bc228708a"
strip_components = 1
description = "Dump ABI of an ELF object containing DWARF debug info"
homepage = "https://github.com/lvc/abi-dumper"
license = "LGPL-2.1-or-later"
deps = ["elfutils", "vtable-dumper"]

[build]
system = "make"
tools = ["perl"]

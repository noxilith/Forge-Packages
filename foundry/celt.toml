# Imported from Void Linux's template for 'celt'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
[package]
name = "celt"
version = "0.11.3"
archive = "https://downloads.us.xiph.org/releases/celt/celt-0.11.3.tar.gz"
sha256 = "7e64815d4a8a009d0280ecd235ebd917da3abdcfd8f7d0812218c085f9480836"
strip_components = 1
description = "Audio codec for use in low-delay speech and audio communication"
homepage = "https://www.celt-codec.org/"
license = "BSD-2-Clause"
deps = ["libogg"]

[build]
system = "autotools"
configure_args = ["--enable-float-approx", "--enable-custom-modes", "--disable-oggtest"]
tools = ["pkg-config"]

# Imported from Void Linux's template for 'rizin'. Review before relying on it.
# needs, but Forge has no recipe for yet: zstd
[package]
name = "rizin"
version = "0.7.3"
archive = "https://github.com/rizinorg/rizin/releases/download/v0.7.3/rizin-src-v0.7.3.tar.xz"
sha256 = "e0ed25ada6be42098d38da9ccef4befbd549e477e80f8dffa5ca1b8ff9fbda74"
strip_components = 1
description = "UNIX-like reverse engineering framework and command-line toolset"
homepage = "https://rizin.re"
license = "LGPL-3.0-only"
deps = ["capstone", "file", "libmspack", "libzip", "lz4", "openssl", "pcre2", "tree-sitter", "xxHash", "xz", "zlib"]
patches = ["patches/cross.patch"]

[build]
system = "meson"
configure_args = ["-D", "use_sys_capstone=enabled", "-D", "use_capstone_version=v5", "-D", "use_sys_magic=enabled", "-D", "use_sys_libzip=enabled", "-D", "use_sys_zlib=enabled", "-D", "use_sys_lz4=enabled", "-D", "use_sys_libzstd=enabled", "-D", "use_sys_lzma=enabled", "-D", "use_sys_xxhash=enabled", "-D", "use_sys_openssl=enabled", "-D", "use_sys_libmspack=enabled", "-D", "use_sys_tree_sitter=enabled", "-D", "use_sys_pcre2=enabled", "-D", "local=disabled", "-D", "packager=VoidLinux", "-D", "packager_version=0.7.3_5"]
tools = ["pkg-config"]

# Imported from Void Linux's template for 'libgit2-1.8'. Review before relying on it.
# hooks not translated: post_install, post_patch
# settings not translated: CFLAGS
[package]
name = "libgit2-1.8"
version = "1.8.7"
archive = "https://github.com/libgit2/libgit2/archive/refs/tags/v1.8.7.tar.gz"
sha256 = "a548a2209c3e99d6bb685d843396fff3a7d3ffd8340adb5d8851637cfe8cd134"
strip_components = 1
description = "Git linkable library 1.8"
homepage = "https://libgit2.org"
license = "GPL-2.0-only WITH GCC-exception-2.0"
deps = ["llhttp", "openssh", "openssl", "zlib"]
patches = ["patches/disable-test-validate_current_user_ownership.patch"]

[build]
system = "cmake"
configure_args = ["-DENABLE_REPRODUCIBLE_BUILDS=ON", "-DBUILD_CLI=OFF", "-DUSE_SSH=exec", "-DUSE_HTTP_PARSER=llhttp"]
tools = ["pkg-config"]

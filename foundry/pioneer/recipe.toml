# Imported from Void Linux's template for 'pioneer'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# settings not translated: make_build_target
# needs, but Forge has no recipe for yet: SDL2_image, glew, lua52
[package]
name = "pioneer"
version = "20260907"
archive = "https://github.com/pioneerspacesim/pioneer/archive/20260907.tar.gz"
sha256 = "11d1fbf745f5fc710f30cce02065b60e5aeb05f7c79b2cfdde8b4c64ec132491"
strip_components = 1
description = "Space adventure game set in our galaxy at the turn of the 31st century"
homepage = "https://pioneerspacesim.net"
license = "GPL-3.0-or-later"
deps = ["assimp", "freetype", "libopenal", "libsigc++", "libvorbis"]
patches = ["patches/endian.patch", "patches/missing-includes.patch"]

[build]
system = "cmake"
configure_args = ["-DUSE_SYSTEM_LIBLUA=ON", "-DUSE_SYSTEM_LIBGLEW=ON", "-DUSE_SSE42=OFF"]
tools = ["pkg-config"]

# Imported from Void Linux's template for 'akregator'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "akregator"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/akregator-26.08.1.tar.xz"
sha256 = "efdbec77e803012072c3bebcf53e810e17e48461a166124840f6fe429a336f01"
strip_components = 1
description = "KDE feed reader"
homepage = "https://www.kde.org/applications/internet/akregator"
license = "GPL-2.0-or-later, GFDL-1.2-only"
deps = ["kf6-knotifyconfig", "kf6-kstatusnotifieritem", "kf6-ktexteditor", "kf6-syndication", "kontactinterface", "messagelib"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "gettext", "kf6-kcmutils", "kf6-kconfig", "kf6-kcoreaddons", "kf6-kdoctools", "qt6-base"]

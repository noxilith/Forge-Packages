# Imported from Void Linux's template for 'rlwrap'. Review before relying on it.
# hooks not translated: pre_configure
# needs, but Forge has no recipe for yet: libptytty, libreadline8, perl
[package]
name = "rlwrap"
version = "0.48"
archive = "https://github.com/hanslub42/rlwrap/archive/refs/tags/v0.48.tar.gz"
sha256 = "b2721b1c0147aaafc98e6a31d875316ba032ad336bec7f2a8bc538f9e3c6db60"
strip_components = 1
description = "Adds readline-style editing and history to programs"
homepage = "https://github.com/hanslub42/rlwrap"
license = "GPL-2.0-or-later"

[build]
system = "autotools"

# Imported from Void Linux's template for 'rssguard'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: qt6-multimedia, qt6-qt5compat, qt6-tools
[package]
name = "rssguard"
version = "4.7.4"
archive = "https://github.com/martinrotter/rssguard/archive/4.7.4.tar.gz"
sha256 = "2230f80a800171f8ef9f4085046b9a277eed0b059f13f194408a88df900306d4"
strip_components = 1
description = "Simple (yet powerful) Qt6 feed reader"
homepage = "https://github.com/martinrotter/rssguard"
license = "GPL-3.0-only"
deps = ["desktop-file-utils", "mpv", "qt6-base", "qt6-declarative"]

[build]
system = "cmake"
configure_args = ["-DNO_LITE=OFF"]

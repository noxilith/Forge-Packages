# Imported from Void Linux's template for 'gnome-icon-theme-extras'. Review before relying on it.
# needs, but Forge has no recipe for yet: icon-naming-utils, intltool
[package]
name = "gnome-icon-theme-extras"
version = "3.12.0"
archive = "https://download.gnome.org/sources/gnome-icon-theme-extras/3.12/gnome-icon-theme-extras-3.12.0.tar.xz"
sha256 = "4eec6cea8a7b09c4ed6ebab1a3b42539b9c61a53bec4b8872e774611cc619608"
strip_components = 1
description = "GNOME Desktop icon theme (additional icons)"
homepage = "http://gnome.org/"
license = "CC-BY-SA-3.0"
deps = ["gnome-icon-theme"]

[build]
system = "autotools"
tools = ["pkg-config"]
deps = ["gtk+3"]

# Imported from Void Linux's template for 'xorg-server'. Review before relying on it.
# 3 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, pre_configure
# settings not translated: LDFLAGS, conf_files, lib32disabled
# needs, but Forge has no recipe for yet: mesa
[package]
name = "xorg-server"
version = "21.1.25"
archive = "https://www.x.org/releases/individual/xserver/xorg-server-21.1.25.tar.xz"
sha256 = "6ad4e3c7b59a309b32c92e5c15ce1267110f9e13f1ac78da62361a628da1a0eb"
strip_components = 1
description = "X11 server from X.org"
homepage = "https://gitlab.freedesktop.org/xorg/xserver"
license = "MIT, BSD-3-Clause"
deps = ["font-util", "libXaw", "libXfont2", "libXrender", "libXres", "libXtst", "libXv", "libXxf86dga", "libdmx", "libepoxy", "libtirpc", "libxcvt", "libxkbfile", "libxkbui", "libxshmfence", "nettle", "openssl", "pixman", "xcb-util-image", "xcb-util-keysyms", "xcb-util-renderutil", "xcb-util-wm", "xkbcomp", "xkeyboard-config"]
patches = ["patches/abi-break.patch", "patches/autoconfig-ati.patch", "patches/autoconfig-sis.patch", "patches/fix-libshadow-2.patch"]

[build]
system = "meson"
configure_args = ["-Dipv6=true", "-Dxorg=true", "-Dxnest=true", "-Dxephyr=true", "-Dxvfb=true", "-Dhal=false", "-Dudev=true", "-Dlinux_acpi=true", "-Dlinux_apm=false", "-Dsuid_wrapper=true", "-Dxcsecurity=true", "-Dglamor=true", "-Ddri2=true", "-Ddri3=true", "-Dglx=true"]
tools = ["flex", "pkg-config"]

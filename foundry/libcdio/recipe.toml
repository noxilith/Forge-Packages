# Imported from Void Linux's template for 'libcdio'. Review before relying on it.
# hooks not translated: pre_configure
# needs, but Forge has no recipe for yet: ncurses
[package]
name = "libcdio"
version = "2.3.0"
archive = "https://github.com/libcdio/libcdio/releases/download/2.3.0/libcdio-2.3.0.tar.gz"
sha256 = "37bcb13296febbcff9dc4485834bac09212cb463c31fcea52f70ee1dd3a5a5de"
strip_components = 1
description = "CD-ROM access library"
homepage = "http://www.gnu.org/software/libcdio/"
license = "GPL-3.0-or-later"
deps = ["libcddb"]
patches = ["patches/gcc14.patch"]

[build]
system = "autotools"
tools = ["pkg-config"]

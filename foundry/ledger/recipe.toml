# Imported from Void Linux's template for 'ledger'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: boost, mpfr
[package]
name = "ledger"
version = "3.4.1"
archive = "https://github.com/ledger/ledger/archive/v3.4.1.tar.gz"
sha256 = "1cf012cdc8445cab0efc445064ef9b2d3f46ed0165dae803c40fe3d2b23fdaad"
strip_components = 1
description = "Double-entry accounting system with a command-line reporting interface"
homepage = "https://www.ledger-cli.org/"
license = "BSD-3-Clause"
deps = ["gettext", "gmp", "libedit"]
patches = ["patches/utfcpp-cross-find-root-path.patch"]

[build]
system = "cmake"

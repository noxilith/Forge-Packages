# Imported from Void Linux's template for 'htop'. Review before relying on it.
# needs, but Forge has no recipe for yet: ncurses
[package]
name = "htop"
version = "3.5.3"
archive = "https://github.com/htop-dev/htop/releases/download/3.5.3/htop-3.5.3.tar.xz"
sha256 = "a8b164386494cb85bb255a415a3f5f80afe7a0c4491da5d113b3a0f951087e65"
strip_components = 1
description = "Interactive process viewer"
homepage = "https://htop.dev/"
license = "GPL-2.0-only"
deps = ["lm_sensors"]

[build]
system = "autotools"
configure_args = ["--enable-unicode", "--enable-sensors"]

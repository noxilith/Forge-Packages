# Imported from Void Linux's template for 'incus'. Review before relying on it.
# hooks not translated: post_build, post_install
# settings not translated: go_build_tags, go_package, go_import_path, build_helper, make_dirs
# needs, but Forge has no recipe for yet: dnsmasq, incus-client-7.5.1_1, nftables, sqlite
[package]
name = "incus"
version = "7.5.1"
archive = "https://github.com/lxc/incus/archive/refs/tags/v7.5.1.tar.gz"
sha256 = "58efe63b030e47decb79f0d9f4081631b49929bb60a2074cd346aeff810937dd"
strip_components = 1
description = "Powerful system container and virtual machine manager"
homepage = "https://linuxcontainers.org/incus"
license = "Apache-2.0"
deps = ["acl", "attr", "cowsql", "eudev", "libcap", "libuv", "lxc", "raft", "rsync", "squashfs-tools", "xz"]

[build]
system = "go"
tools = ["pkg-config"]

# Imported from Void Linux's template for 'telepathy-mission-control'. Review before relying on it.
# needs, but Forge has no recipe for yet: intltool, telepathy-glib
[package]
name = "telepathy-mission-control"
version = "5.16.6"
archive = "https://telepathy.freedesktop.org/releases/telepathy-mission-control/telepathy-mission-control-5.16.6.tar.gz"
sha256 = "2df8ae3995e919a7670e01aa3568215ef0777e34961ace1cac1c6477cb297a45"
strip_components = 1
description = "Account manager and channel dispatcher for the Telepathy framework"
homepage = "https://telepathy.freedesktop.org"
license = "LGPL-2.1-or-later"
deps = ["NetworkManager", "glib"]

[build]
system = "autotools"
configure_args = ["--disable-static", "--disable-schemas-compile"]
tools = ["pkg-config"]
deps = ["libxslt"]

# Imported from Void Linux's template for 'isoimagewriter'. Review before relying on it.
[package]
name = "isoimagewriter"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/isoimagewriter-26.08.1.tar.xz"
sha256 = "5b477c775740302beec0dc93a644d5f6696a7125371fb5cc499493121843880f"
strip_components = 1
description = "Program to write hybrid ISO files onto USB disks"
homepage = "https://apps.kde.org/isoimagewriter"
license = "GPL-3.0-or-later"
deps = ["gpgme-qt6", "gpgmepp", "kf6-karchive", "kf6-kcoreaddons", "kf6-kcrash", "kf6-ki18n", "kf6-kiconthemes", "kf6-kwidgetsaddons", "kf6-solid", "libgpg-error", "qt6-base"]

[build]
system = "cmake"
configure_args = ["-DQT_MAJOR_VERSION=6"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "gettext"]

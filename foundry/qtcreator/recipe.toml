# Imported from Void Linux's template for 'qtcreator'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_build, post_install
# needs, but Forge has no recipe for yet: mesa, qt6-charts, qt6-qt5compat, qt6-quick3d, qt6-serialport, qt6-shadertools, qt6-svg, qt6-tools, zstd
[package]
name = "qtcreator"
version = "20.0.1"
archive = "https://download.qt.io/official_releases/qtcreator/20.0/20.0.1/qt-creator-opensource-src-20.0.1.tar.xz"
sha256 = "5ec3bccf06ee9a1905a8760ac9fba7a1285672f140a97e0c52c9e248d9051ab8"
strip_components = 1
description = "Cross-platform IDE for Qt developers"
homepage = "https://wiki.qt.io/Category:Tools::QtCreator"
license = "LGPL-3.0-or-later, custom:QtCompany-GPL-Exception-1.0"
deps = ["elfutils", "libarchive", "libsecret", "llvm19", "qt6-base", "qt6-declarative", "yaml-cpp"]
patches = ["patches/cross-designer.patch", "patches/int128.patch", "patches/musl.patch"]

[build]
system = "cmake"
configure_args = ["-DWITH_DOCS=ON", "-DBUILD_WITH_PCH=OFF"]
tools = ["perl", "pkg-config"]
deps = ["which"]

# Imported from Void Linux's template for 'kjobwidgets'. Review before relying on it.
# needs, but Forge has no recipe for yet: qt5
[package]
name = "kjobwidgets"
version = "5.116.0"
archive = "https://download.kde.org/stable/frameworks/5.116/kjobwidgets-5.116.0.tar.xz"
sha256 = "eac37f7d02183f8d4347ab1d86608ee66007a3482a061169e4808caf853dbe87"
strip_components = 1
description = "KDE Widgets for showing progress of asynchronous jobs"
homepage = "https://invent.kde.org/frameworks/kjobwidgets"
license = "LGPL-2.0-only, LGPL-2.0-or-later"
deps = ["kcoreaddons", "kwidgetsaddons"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=ON"]
deps = ["extra-cmake-modules"]

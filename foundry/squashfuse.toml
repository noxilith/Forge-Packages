# Imported from Void Linux's template for 'squashfuse'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: zstd
[package]
name = "squashfuse"
version = "0.6.5"
archive = "https://github.com/vasi/squashfuse/releases/download/0.6.5/squashfuse-0.6.5.tar.gz"
sha256 = "9ec44b8ee6309e09bdcdeba422edc745e876db16136acacb74ecc7e7131e5763"
strip_components = 1
description = "FUSE filesystem to mount squashfs archives"
homepage = "https://github.com/vasi/squashfuse"
license = "BSD-2-Clause"
deps = ["fuse3", "lz4", "lzo", "xz", "zlib"]

[build]
system = "autotools"
tools = ["pkg-config"]

# Imported from Void Linux's template for 'gtkmm4'. Review before relying on it.
# needs, but Forge has no recipe for yet: cairomm1.16
[package]
name = "gtkmm4"
version = "4.20.0"
archive = "https://download.gnome.org/sources/gtkmm/4.20/gtkmm-4.20.0.tar.xz"
sha256 = "daad9bf9b70f90975f91781fc7a656c923a91374261f576c883cd3aebd59c833"
strip_components = 1
description = "C++ bindings for The GTK+ toolkit (v4)"
homepage = "https://gtkmm.org"
license = "LGPL-2.1-or-later"
deps = ["glibmm2.68", "gtk4", "pangomm2.48"]
patches = ["patches/setlocale-sigsegv.patch"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["glib", "mm-common"]

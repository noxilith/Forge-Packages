# Imported from Void Linux's template for 'dia'. Review before relying on it.
# hooks not translated: post_patch
# needs, but Forge has no recipe for yet: docbook-xsl, intltool
[package]
name = "dia"
version = "0.97.3"
archive = "https://download.gnome.org/sources/dia/0.97/dia-0.97.3.tar.xz"
sha256 = "22914e48ef48f894bb5143c5efc3d01ab96e0a0cde80de11058d3b4301377d34"
strip_components = 1
description = "GTK+ based diagram creation program"
homepage = "https://wiki.gnome.org/Apps/Dia"
license = "GPL-2.0-or-later"
deps = ["freetype", "gtk+", "libart", "libpng", "libxml2", "libxslt"]
patches = ["patches/gcc14.patch", "patches/isinf.patch"]

[build]
system = "autotools"
tools = ["pkg-config"]

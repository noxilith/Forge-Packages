# Imported from Void Linux's template for 'plasma-firewall'. Review before relying on it.
# needs, but Forge has no recipe for yet: kde-plasma-base, qt6-tools
[package]
name = "plasma-firewall"
version = "6.7.5"
archive = "https://download.kde.org/stable/plasma/6.7.5/plasma-firewall-6.7.5.tar.xz"
sha256 = "adbc6a62d272a3866461274bb78de49e0f83c9971225f619adb3042399be6997"
strip_components = 1
description = "Control Panel for ufw (Uncomplicated Firewall)"
homepage = "https://invent.kde.org/network/plasma-firewall"
license = "GPL-2.0-only, GPL-3.0-only"
deps = ["kf6-kauth", "kf6-kcmutils", "kf6-kconfig", "libplasma", "plasma5support"]

[build]
system = "cmake"
configure_args = ["-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
deps = ["extra-cmake-modules", "gettext", "qt6-base"]

# Imported from Void Linux's template for 'libxshmfence'. Review before relying on it.
# hooks not translated: post_install
[package]
name = "libxshmfence"
version = "1.3.3"
archive = "https://www.x.org/releases/individual/lib/libxshmfence-1.3.3.tar.xz"
sha256 = "d4a4df096aba96fea02c029ee3a44e11a47eb7f7213c1a729be83e85ec3fde10"
strip_components = 1
description = "X Shared memory 'SyncFence' synchronization primitive"
homepage = "http://xorg.freedesktop.org/"
license = "MIT"
deps = ["xorgproto"]

[build]
system = "autotools"
configure_args = ["--with-shared-memory-dir=/dev/shm"]
tools = ["pkg-config"]

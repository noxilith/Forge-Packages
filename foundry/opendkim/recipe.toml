# Imported from Void Linux's template for 'opendkim'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, pre_configure
# needs, but Forge has no recipe for yet: libmilter, perl
[package]
name = "opendkim"
version = "2.10.3"
archive = "https://downloads.sourceforge.net/sourceforge/project/opendkim/opendkim-2.10.3.tar.gz"
sha256 = "43a0ba57bf942095fe159d0748d8933c6b1dd1117caf0273fa9a0003215e681b"
strip_components = 1
description = "DKIM library"
homepage = "http://www.opendkim.org"
license = "BSD-3-Clause, Sendmail"
deps = ["libbsd", "libmd", "openssl"]
patches = ["patches/openssl_1.1.0_compat.patch", "patches/python3.diff"]

[build]
system = "autotools"
tools = ["pkg-config"]
deps = ["gettext"]

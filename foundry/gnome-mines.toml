# Imported from Void Linux's template for 'gnome-mines'. Review before relying on it.
# needs, but Forge has no recipe for yet: itstool
[package]
name = "gnome-mines"
version = "48.1"
archive = "https://download.gnome.org/sources/gnome-mines/48/gnome-mines-48.1.tar.xz"
sha256 = "ef4b2d2dde3bec614157edde4d9189cc6afe692952a2dd55b2870e2e62ed8104"
strip_components = 1
description = "GNOME puzzle game where you locate mines in the ocean"
homepage = "https://wiki.gnome.org/Apps/Mines"
license = "GPL-3.0-or-later"
deps = ["libadwaita", "libgnome-games-support2", "librsvg"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["desktop-file-utils", "gettext", "glib", "gtk4", "vala"]

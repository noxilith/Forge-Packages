# Imported from Void Linux's template for 'poke'. Review before relying on it.
# needs, but Forge has no recipe for yet: libreadline8
[package]
name = "poke"
version = "5.0"
archive = "https://ftp.gnu.org/gnu/poke/poke-5.0.tar.gz"
sha256 = "6873d59abe821c8111b88623ea7ad9e090892fa95c75562606dd88374e2f5b8f"
strip_components = 1
description = "Extensible editor for structured binary data"
homepage = "https://www.jemarch.net/poke.html"
license = "GPL-3.0-or-later"
deps = ["gc", "json-c", "libatomic_ops"]

[build]
system = "autotools"
configure_args = ["gl_cv_func_strcasecmp_works=yes"]
tools = ["pkg-config"]

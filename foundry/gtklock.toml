# Imported from Void Linux's template for 'gtklock'. Review before relying on it.
# hooks not translated: post_install
[package]
name = "gtklock"
version = "5.0.0"
archive = "https://github.com/jovanlanik/gtklock/archive/refs/tags/v5.0.0.tar.gz"
sha256 = "018c50cf1d7b626f823e797750e5b304511b3b359e7277e8abb3383c11e7aed9"
strip_components = 1
description = "GTK-based lockscreen for Wayland"
homepage = "https://github.com/jovanlanik/gtklock"
license = "GPL-3.0-or-later"
deps = ["gtk+3", "gtk-session-lock", "pam"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["glib", "scdoc"]

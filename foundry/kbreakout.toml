# Imported from Void Linux's template for 'kbreakout'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
[package]
name = "kbreakout"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/kbreakout-26.08.1.tar.xz"
sha256 = "091dc77db85a11818d69277870dd18875aea63e86078b2b5c466882118492f1b"
strip_components = 1
description = "Classic block destroying game"
homepage = "https://kde.org/applications/games/org.kde.kbreakout"
license = "GPL-2.0-or-later"
deps = ["kf6-kconfig", "kf6-kconfigwidgets", "kf6-kcoreaddons", "kf6-kcrash", "kf6-kdbusaddons", "kf6-kdoctools", "kf6-ki18n", "kf6-kiconthemes", "kf6-kio", "kf6-ktextwidgets", "kf6-kwidgetsaddons", "kf6-kxmlgui", "libkdegames", "qt6-declarative"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "gettext", "qt6-base"]

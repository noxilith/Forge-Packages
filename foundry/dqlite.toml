description = "Distributed SQLite database using the Raft algorithm"
homepage = "https://github.com/canonical/dqlite"
license = "LGPL-3.0-only, LGPL-3.0-linking-exception"
deps = ["raft"]

[build]
system = "autotools"
tools = ["pkg-config"]

# Imported from Void Linux's template for 'foomatic-db-engine'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_configure
# needs, but Forge has no recipe for yet: cups, ghostscript, perl
[package]
name = "foomatic-db-engine"
version = "4.0.13"
archive = "https://www.openprinting.org/download/foomatic/foomatic-db-engine-4.0.13.tar.gz"
sha256 = "b5c89027aa26967d2e6db62e2af7db0c4039d2480d4fbf2476a6ddcf609a5faf"
strip_components = 1
description = "OpenPrinting printer support - programs"
homepage = "https://www.openprinting.org/"
license = "GPL-2.0-or-later"
deps = ["cups-filters", "foomatic-db", "libxml2", "wget"]
patches = ["patches/patch-foomatic-getpjloptions.in.diff"]

[build]
system = "autotools"
configure_args = ["PERL_INSTALLDIRS=vendor"]
tools = ["perl"]

# Imported from Void Linux's template for 'seafile-libclient'. Review before relying on it.
# hooks not translated: post_install, pre_configure
# needs, but Forge has no recipe for yet: intltool, sqlite, util-linux-common
[package]
name = "seafile-libclient"
version = "8.0.10"
archive = "https://github.com/haiwen/seafile/archive/v8.0.10.tar.gz"
sha256 = "bcfa6576a272486cf30b7fa2207992b01b071bcc5744f0923a0d924c0257b8a5"
strip_components = 1
description = "Cloud storage system - library"
homepage = "https://seafile.com"
license = "GPL-2.0-or-later"
deps = ["curl", "glib", "libevent", "libsearpc", "libwebsockets"]

[build]
system = "autotools"
configure_args = ["PYTHON=python3", "--disable-static"]
tools = ["pkg-config"]
deps = ["vala"]

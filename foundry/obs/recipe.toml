# Imported from Void Linux's template for 'obs'. Review before relying on it.
# 3 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: pre_configure
# needs, but Forge has no recipe for yet: ffmpeg6, jack, mbedtls, pciutils, qt6-svg, rnnoise, speexdsp, uthash
[package]
name = "obs"
version = "32.2.2"
archive = "https://github.com/obsproject/obs-studio/archive/refs/tags/32.2.2.tar.gz"
sha256 = "35d3cd0979d65664fada7119fdb612eca7c34b61a1623a330caec74bf72626c4"
strip_components = 1
description = "Open Broadcaster Software"
homepage = "https://obsproject.com"
license = "GPL-2.0-or-later"
deps = ["curl", "extra-cmake-modules", "fdk-aac", "glu", "jansson", "json-c++", "libXcomposite", "libdatachannel", "librist", "libva", "libvpl", "libxkbcommon", "pipewire", "pulseaudio", "qt6-base", "simde", "srt", "v4l-utils", "vlc", "wayland", "x264", "xdg-desktop-portal", "xset"]
patches = ["patches/fix-double-free.patch", "patches/gcc14.patch", "patches/qt610-guiprivate.patch"]

[build]
system = "cmake"
configure_args = ["-DOBS_VERSION_OVERRIDE=32.2.2", "-DENABLE_JACK=ON", "-DCMAKE_INSTALL_DATAROOTDIR=share", "-DENABLE_RNNOISE=ON", "-DENABLE_VST=OFF", "-DENABLE_AJA=OFF", "-DCMAKE_COMPILE_WARNING_AS_ERROR=OFF"]
tools = ["pkg-config"]
deps = ["swig"]

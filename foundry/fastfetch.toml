# Imported from Void Linux's template for 'fastfetch'. Review before relying on it.
# hooks not translated: post_install, pre_configure
# settings not translated: CFLAGS
# needs, but Forge has no recipe for yet: lua54, mesa
[package]
name = "fastfetch"
version = "2.70.0"
archive = "https://github.com/fastfetch-cli/fastfetch/archive/refs/tags/2.70.0.tar.gz"
sha256 = "8aa01bd3faff2be1d94f231d76489ce6d9f781f51f6e93eafe82359d6d8669af"
strip_components = 1
description = "System information fetching tool"
homepage = "https://github.com/fastfetch-cli/fastfetch"
license = "MIT"
deps = ["ImageMagick", "OpenCL-Headers", "chafa", "dbus", "dconf", "ddcutil", "efl", "elfutils", "glib", "libXrandr", "libdrm", "libva", "libvdpau", "pulseaudio", "vulkan-loader", "wayland", "yyjson", "zlib"]

[build]
system = "cmake"
configure_args = ["-DENABLE_SYSTEM_YYJSON=ON", "-DBUILD_FLASHFETCH=OFF", "-DINSTALL_LICENSE=OFF", "-DENABLE_QUICKJS=OFF"]
tools = ["pkg-config"]

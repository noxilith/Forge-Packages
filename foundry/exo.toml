# Imported from Void Linux's template for 'exo'. Review before relying on it.
# needs, but Forge has no recipe for yet: hicolor-icon-theme
[package]
name = "exo"
version = "4.20.0"
archive = "https://archive.xfce.org/src/xfce/exo/4.20/exo-4.20.0.tar.bz2"
sha256 = "4277f799245f1efde01cd917fd538ba6b12cf91c9f8a73fe2035fd5456ec078d"
strip_components = 1
description = "Extension library for the Xfce desktop environment"
homepage = "https://docs.xfce.org/xfce/exo/start"
license = "GPL-2.0-or-later, LGPL-2.1-or-later"
deps = ["desktop-file-utils", "gtk+3", "libxfce4ui"]

[build]
system = "autotools"
configure_args = ["--disable-static"]
tools = ["pkg-config"]
deps = ["gettext", "glib"]

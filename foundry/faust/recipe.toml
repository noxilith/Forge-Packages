# Imported from Void Linux's template for 'faust'. Review before relying on it.
# needs, but Forge has no recipe for yet: libcxx
[package]
name = "faust"
version = "2.70.3"
archive = "https://github.com/grame-cncm/faust/releases/download/2.70.3/faust-2.70.3.tar.gz"
sha256 = "3ac3aab87d60257b3fff03ffeb42e190480fb9828266fa1c35574b6cbf6a13bb"
strip_components = 1
description = "Functional Programming Language for Real Time Signal Processing"
homepage = "https://faust.grame.fr/"
license = "GPL-2.0-or-later"
deps = ["libmicrohttpd"]
patches = ["patches/cstdint.patch", "patches/faust-musl-stacktrace.patch", "patches/faust-voidlinux-lib_and_arch_paths.patch"]

[build]
system = "cmake"
configure_args = ["-C../backends/regular.cmake", "-C../targets/regular.cmake", "-DWORKLET=OFF", "-DINCLUDE_LLVM=OFF", "-DUSE_LLVM_CONFIG=ON", "-DBUILD_HTTP_STATIC=OFF"]
subdir = "build"
tools = ["pkg-config"]

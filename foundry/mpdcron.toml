# Imported from Void Linux's template for 'mpdcron'. Review before relying on it.
# hooks not translated: pre_configure
# needs, but Forge has no recipe for yet: libdaemon
[package]
name = "mpdcron"
version = "0.3"
archive = "https://github.com/alip/mpdcron/archive/v0.3.tar.gz"
sha256 = "750383bc2497373bd84ea7c8eea37e10f5f4530267afda4f76f94b83082bca5e"
strip_components = 1
description = "Program for mpd which can execute scripts based on idle events"
homepage = "https://github.com/alip/mpdcron"
license = "GPL-2.0-only"
deps = ["glib", "libmpdclient"]

[build]
system = "autotools"
tools = ["pkg-config"]

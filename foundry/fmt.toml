# Imported from Void Linux's template for 'fmt'. Review before relying on it.
# hooks not translated: post_install
[package]
name = "fmt"
version = "12.1.0"
archive = "https://github.com/fmtlib/fmt/archive/12.1.0.tar.gz"
sha256 = "ea7de4299689e12b6dddd392f9896f08fb0777ac7168897a244a6d6085043fea"
strip_components = 1

# Imported from Void Linux's template for 'kiconthemes'. Review before relying on it.
# needs, but Forge has no recipe for yet: qt5
[package]
name = "kiconthemes"
version = "5.116.0"
archive = "https://download.kde.org/stable/frameworks/5.116/kiconthemes-5.116.0.tar.xz"
sha256 = "9e6efbe228739d799c5968e11c7bebecb8d84894e8d077b954f4682fd74f0561"
strip_components = 1
description = "KDE Icon GUI utilities"
homepage = "https://invent.kde.org/frameworks/kiconthemes"
license = "LGPL-2.0-only, GPL-2.0-or-later"
deps = ["karchive", "kconfigwidgets", "kitemviews"]
patches = ["patches/cross.patch"]

[build]
system = "cmake"
configure_args = ["-DBUILD_DESIGNERPLUGIN=ON"]
deps = ["extra-cmake-modules", "gettext", "kcoreaddons"]

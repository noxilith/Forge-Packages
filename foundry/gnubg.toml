# Imported from Void Linux's template for 'gnubg'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_configure, post_install, pre_configure
# needs, but Forge has no recipe for yet: libcanberra, libreadline8, readline, sqlite
[package]
name = "gnubg"
version = "1.08.003"
archive = "https://ftp.gnu.org/gnu/gnubg/gnubg-release-1.08.003-sources.tar.gz"
sha256 = "6f7d969b13cfff786fba90ff8cc5e5d564b97f4f0aa69afe4f3838f18c445979"
strip_components = 1
description = "GNU Backgammon game"
homepage = "https://www.gnu.org/software/gnubg/"
license = "GPL-3.0-or-later"
deps = ["curl", "glib", "glu", "gtk+3", "libepoxy"]

[build]
system = "autotools"
configure_args = ["--disable-cputest", "ax_cv_gcc_x86_cpuid_0x00000001=6000000", "--with-gtk3"]
tools = ["flex", "pkg-config"]
deps = ["gdk-pixbuf", "gettext"]

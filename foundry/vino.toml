# Imported from Void Linux's template for 'vino'. Review before relying on it.
# needs, but Forge has no recipe for yet: avahi-discover, dbus-glib, intltool, telepathy-glib
[package]
name = "vino"
version = "3.22.0"
archive = "https://download.gnome.org/sources/vino/3.22/vino-3.22.0.tar.xz"
sha256 = "2911c779b6a2c46e5bc8e5a0c94c2a4d5bd4a1ee7e35f2818702cb13d9d23bab"
strip_components = 1
description = "VNC server for the GNOME desktop"
homepage = "https://wiki.gnome.org/action/show/Projects/Vino"
license = "GPL-2.0-only"
deps = ["NetworkManager", "desktop-file-utils", "gnutls", "gtk+3", "libSM", "libXtst", "libjpeg-turbo", "libnotify", "libsecret"]

[build]
system = "autotools"
tools = ["pkg-config"]
deps = ["glib"]

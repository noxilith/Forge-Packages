# Imported from Void Linux's template for 'libixion'. Review before relying on it.
# hooks not translated: pre_configure
# needs, but Forge has no recipe for yet: boost
[package]
name = "libixion"
version = "0.20.0"
archive = "https://gitlab.com/ixion/ixion/-/archive/0.20.0/ixion-0.20.0.tar.gz"
sha256 = "4a6c2c480ad40b706ecf459dfca03f39351e12b48911c7c4803b75c823a1bcb1"
strip_components = 1
description = "General purpose formula parser and interpreter"
homepage = "https://gitlab.com/ixion/ixion/"
license = "MPL-2.0"
deps = ["mdds"]
patches = ["patches/boost-1.89.patch"]

[build]
system = "autotools"
tools = ["pkg-config"]

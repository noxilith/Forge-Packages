# Imported from Void Linux's template for 'autoconf'. Review before relying on it.
# hooks not translated: pre_check
# needs, but Forge has no recipe for yet: perl
[package]
name = "autoconf"
version = "2.73"
archive = "https://ftp.gnu.org/gnu/autoconf/autoconf-2.73.tar.xz"
sha256 = "9fd672b1c8425fac2fa67fa0477b990987268b90ff36d5f016dae57be0d6b52e"
strip_components = 1
description = "Generates automatic source code configuration scripts"
homepage = "http://www.gnu.org/software/autoconf"
license = "GPL-2.0-or-later, GPL-3.0-or-later"
deps = ["m4"]

[build]
system = "autotools"
tools = ["m4", "perl"]
deps = ["help2man"]

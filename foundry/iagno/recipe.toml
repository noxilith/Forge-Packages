# Imported from Void Linux's template for 'iagno'. Review before relying on it.
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: itstool, libcanberra
[package]
name = "iagno"
version = "3.38.1"
archive = "https://download.gnome.org/sources/iagno/3.38/iagno-3.38.1.tar.xz"
sha256 = "84b9f32ce0389758a21d63c7eb1c227db7116b51d3149aa0eae3509168e0ed24"
strip_components = 1
description = "GNOME Reversi (Othello) game"
homepage = "https://wiki.gnome.org/Apps/Iagno"
license = "GPL-3.0-or-later"
deps = ["glib", "gsound", "librsvg"]
patches = ["patches/dont-write-gtkchild.patch"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["gdk-pixbuf", "gettext", "vala"]

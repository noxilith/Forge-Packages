# Imported from Void Linux's template for 'bootchart2'. Review before relying on it.
# hooks not translated: post_patch
# settings not translated: make_install_args, make_dirs
# needs, but Forge has no recipe for yet: python3-setuptools
[package]
name = "bootchart2"
version = "0.14.9"
archive = "https://github.com/xrmx/bootchart/archive/0.14.9.tar.gz"
sha256 = "cec7871c3dba47a1165873b0acde30a82221fde1d3a942da5e7dd09b513d2017"
strip_components = 1
description = "Startup graphing tool"
homepage = "https://github.com/xrmx/bootchart"
license = "GPL-3.0-or-later"
deps = ["python3-cairo"]
patches = ["patches/python-3.9.patch", "patches/rdinit-fix-panic.patch"]

[build]
system = "make"

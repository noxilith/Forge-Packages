# Imported from Void Linux's template for 'kdiamond'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
[package]
name = "kdiamond"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/kdiamond-26.08.1.tar.xz"
sha256 = "f33d98e23670527120ccc214efdc79dfc9963fea0712c8919c85d7f4b7ed97d0"
strip_components = 1
description = "Classic match-three puzzle game"
homepage = "https://kde.org/applications/games/org.kde.kdiamond"
license = "GPL-2.0-or-later"
deps = ["kf6-kconfig", "kf6-kconfigwidgets", "kf6-kcoreaddons", "kf6-kcrash", "kf6-kdbusaddons", "kf6-kdoctools", "kf6-ki18n", "kf6-kiconthemes", "kf6-knotifications", "kf6-knotifyconfig", "kf6-kwidgetsaddons", "libkdegames"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "gettext", "qt6-base"]

# Imported from Void Linux's template for 'squashfs-tools-ng'. Review before relying on it.
# needs, but Forge has no recipe for yet: zstd
[package]
name = "squashfs-tools-ng"
version = "1.3.2"
archive = "https://infraroot.at/pub/squashfs/squashfs-tools-ng-1.3.2.tar.xz"
sha256 = "0d907ac3e735c351e47c867fb51d94bffa3b05fb95bec01f31e848b7c44215a9"
strip_components = 1
description = "Set of tools and libraries for working with SquashFS images"
homepage = "https://infraroot.at/projects/squashfs-tools-ng/index.html"
license = "GPL-3.0-or-later, LGPL-3.0-or-later"
deps = ["lz4", "lzo", "xz", "zlib"]

[build]
system = "autotools"
tools = ["pkg-config"]

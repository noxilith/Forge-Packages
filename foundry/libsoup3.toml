# Imported from Void Linux's template for 'libsoup3'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: sqlite
[package]
name = "libsoup3"
version = "3.6.6"
archive = "https://download.gnome.org/sources/libsoup/3.6/libsoup-3.6.6.tar.xz"
sha256 = "51ed0ae06f9d5a40f401ff459e2e5f652f9a510b7730e1359ee66d14d4872740"
strip_components = 1
description = "HTTP library implementation in C"
homepage = "https://wiki.gnome.org/Projects/libsoup"
license = "LGPL-2.1-or-later"
deps = ["brotli", "glib", "glib-networking", "libpsl", "nghttp2"]

[build]
system = "meson"
configure_args = ["-Dgssapi=disabled", "-Dntlm=disabled", "-Dsysprof=disabled", "-Dtls_check=false"]
tools = ["pkg-config"]
deps = ["gettext", "python3-gobject"]

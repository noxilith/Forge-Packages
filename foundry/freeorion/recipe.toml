# Imported from Void Linux's template for 'freeorion'. Review before relying on it.
# hooks not translated: pre_configure
# needs, but Forge has no recipe for yet: boost, doxygen, glew, hicolor-icon-theme, python3-pycodestyle
[package]
name = "freeorion"
version = "0.5.1.2"
archive = "https://github.com/freeorion/freeorion/releases/download/v0.5.1.2/FreeOrion-v0.5.1.2_Source.tar.gz"
sha256 = "fe6c2577cd2a6a9f88bfe8a69f4c6efa204a85111cb7675d61a1a6d341fdda65"
strip_components = 1
description = "Turn-based space empire and galactic conquest (4X) computer game"
homepage = "https://freeorion.org/index.php/Main_Page"
license = "GPL-2.0-or-later"
deps = ["SDL2", "desktop-file-utils", "freetype", "libopenal", "libvorbis"]
patches = ["patches/fix-cflags.patch", "patches/fix-gigi-config-file-finding.patch"]

[build]
system = "cmake"
deps = ["cppcheck"]

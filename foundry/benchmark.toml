# Imported from Void Linux's template for 'benchmark'. Review before relying on it.
[package]
name = "benchmark"
version = "1.9.5"
archive = "https://github.com/google/benchmark/archive/v1.9.5.tar.gz"
sha256 = "9631341c82bac4a288bef951f8b26b41f69021794184ece969f8473977eaa340"
strip_components = 1
description = "Microbenchmark support library"
homepage = "https://github.com/google/benchmark/"
license = "Apache-2.0"

[build]
system = "cmake"
configure_args = ["-DBUILD_SHARED_LIBS=ON", "-DBENCHMARK_ENABLE_GTEST_TESTS=OFF", "-DBENCHMARK_DOWNLOAD_DEPENDENCIES=OFF"]

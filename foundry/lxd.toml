# Imported from Void Linux's template for 'lxd'. Review before relying on it.
# hooks not translated: post_build, post_install
# settings not translated: go_build_tags, go_package, go_import_path
# needs, but Forge has no recipe for yet: dnsmasq
[package]
name = "lxd"
version = "5.20"
archive = "https://github.com/canonical/lxd/archive/refs/tags/lxd-5.20.tar.gz"
sha256 = "bddfa7b8091ab6bdb5cdaf13b6c09f5a548976cd3118e8c73c3b7881adf94307"
strip_components = 1
description = "Next generation system container manager"
homepage = "https://linuxcontainers.org/lxd"
license = "Apache-2.0"
deps = ["acl", "attr", "dqlite", "eudev", "iptables", "lxc", "rsync", "squashfs-tools", "xz"]

[build]
system = "go"
tools = ["pkg-config"]

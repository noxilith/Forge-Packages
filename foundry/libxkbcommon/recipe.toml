# Imported from Void Linux's template for 'libxkbcommon'. Review before relying on it.
# hooks not translated: post_install
[package]
name = "libxkbcommon"
version = "1.13.2"
archive = "https://github.com/xkbcommon/libxkbcommon/archive/xkbcommon-1.13.2.tar.gz"
sha256 = "acc4d5f7c3cbba5f9f8d08d8bdbeede84ecede46792f47929aa9321873385528"
strip_components = 1
description = "Library to handle keyboard descriptions"
homepage = "https://xkbcommon.org/"
license = "MIT"
deps = ["libxcb", "libxml2", "wayland", "wayland-protocols", "xkeyboard-config", "xorgproto"]
patches = ["patches/remove-fuzzing.patch"]

[build]
system = "meson"
configure_args = ["-Denable-x11=true", "-Denable-docs=false", "-Denable-wayland=true", "-Denable-xkbregistry=true", "-Db_ndebug=false"]
tools = ["bison", "pkg-config"]

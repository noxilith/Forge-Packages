# Imported from Void Linux's template for 'viewnior'. Review before relying on it.
# needs, but Forge has no recipe for yet: intltool
[package]
name = "viewnior"
version = "1.8"
archive = "https://github.com/hellosiyan/Viewnior/archive/viewnior-1.8.tar.gz"
sha256 = "b9319171ebca23929e6ea8039c194b1595d92e764db5e3890836fb5c36e233b0"
strip_components = 1
description = "Elegant Image Viewer"
homepage = "http://siyanpanayotov.com/project/viewnior/"
license = "GPL-3.0-or-later"
deps = ["exiv2", "gtk+"]
patches = ["patches/exiv2-0.28.patch"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["gettext", "glib"]

# Imported from Void Linux's template for 'etckeeper'. Review before relying on it.
# hooks not translated: post_install, pre_install
# settings not translated: conf_files
# needs, but Forge has no recipe for yet: perl
[package]
name = "etckeeper"
version = "1.18.23"
archive = "https://git.joeyh.name/index.cgi/etckeeper.git/snapshot/etckeeper-1.18.23.tar.gz"
sha256 = "cfd068f1f7ae64702747e4ea77e089168743c8b889b941577eac8fc67c232e8c"
strip_components = 1
description = "Tools to store /etc in a git, mercurial, or darcs repository"
homepage = "https://etckeeper.branchable.com"
license = "GPL-2.0-or-later"

[build]
system = "make"
tools = ["perl"]

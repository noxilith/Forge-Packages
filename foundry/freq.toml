# Imported from Void Linux's template for 'freq'. Review before relying on it.
# hooks not translated: post_install, pre_build, pre_install
# needs, but Forge has no recipe for yet: zstd
[package]
name = "freq"
version = "0.9.2"
archive = "https://github.com/ryancdotorg/freq/archive/refs/tags/v0.9.2.tar.gz"
sha256 = "204c206ff061372911a56c0db31ec63b719bdcab104b51f609bd538083d855fd"

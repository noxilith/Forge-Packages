# Imported from Void Linux's template for 'gnome-online-accounts'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: docbook-xsl, gi-docgen, hicolor-icon-theme, mit-krb5
[package]
name = "gnome-online-accounts"
version = "3.54.4"
archive = "https://download.gnome.org/sources/gnome-online-accounts/3.54/gnome-online-accounts-3.54.4.tar.xz"
sha256 = "55739943e747dcb4885ea607a4c2767d8002f71295e1affea62ea36f6d1cf593"
strip_components = 1
description = "GNOME service to access online accounts"
homepage = "https://wiki.gnome.org/Projects/GnomeOnlineAccounts"
license = "LGPL-2.0-or-later"
deps = ["gcr4", "gtk4", "json-glib", "keyutils", "libadwaita", "libsecret", "libsoup3", "rest"]

[build]
system = "meson"
configure_args = ["-Dman=true"]
tools = ["pkg-config"]
deps = ["gettext", "glib", "libxslt", "vala"]

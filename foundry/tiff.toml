# Imported from Void Linux's template for 'tiff'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: libwebp, zstd
[package]
name = "tiff"
version = "4.7.1"
archive = "https://download.osgeo.org/libtiff/tiff-4.7.1.tar.gz"
sha256 = "f698d94f3103da8ca7438d84e0344e453fe0ba3b7486e04c5bf7a9a3fabe9b69"
strip_components = 1
description = "Library and tools for reading and writing TIFF data files"
homepage = "http://www.simplesystems.org/libtiff/"
license = "libtiff"
deps = ["jbigkit", "libjpeg-turbo", "xz", "zlib"]

[build]
system = "autotools"
configure_args = ["--enable-cxx", "--without-x"]

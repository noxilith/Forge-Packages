# Imported from Void Linux's template for 'WoeUSB'. Review before relying on it.
# hooks not translated: post_install, post_patch, pre_configure
# settings not translated: CXXFLAGS
# needs, but Forge has no recipe for yet: WoeUSB-cli
[package]
name = "WoeUSB"
version = "3.3.1"
archive = "https://github.com/slacka/WoeUSB/archive/v3.3.1.tar.gz"
sha256 = "0cab88a1113506f39d2f1c19532b2cd8d968c6a9f59129953c000e29e73f3d4f"
strip_components = 1
description = "Create a Windows USB stick installer from a real Windows DVD or image"
homepage = "https://github.com/slacka/WoeUSB"
license = "GPL-3.0-or-later"
deps = ["wxWidgets-gtk3"]

[build]
system = "autotools"
configure_args = ["--with-wx-config=wx-config-gtk3"]
deps = ["gettext"]

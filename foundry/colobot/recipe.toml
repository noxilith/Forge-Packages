# Imported from Void Linux's template for 'colobot'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: SDL2_image, boost, colobot-data, glew, physfs, po4a
[package]
name = "colobot"
version = "0.2.2"
archive = "https://github.com/colobot/colobot/archive/colobot-gold-0.2.2-alpha.tar.gz"
sha256 = "047eb2bc96725598d918c5b500928e3a08fa3e6e7e730a82169da4524b03ddad"
strip_components = 1
description = "Real-time strategy game, where you can program your units"
homepage = "https://colobot.info/"
license = "GPL-3.0-or-later"
deps = ["SDL2", "SDL2_ttf", "libogg", "libopenal", "libsndfile", "libvorbis"]
patches = ["patches/boost-1.89.patch", "patches/gcc-16.patch", "patches/xmlstarlet-binary-name.patch"]

[build]
system = "cmake"
configure_args = ["-DOpenGL_GL_PREFERENCE=GLVND"]
tools = ["perl"]
deps = ["gettext", "librsvg", "xmlstarlet"]

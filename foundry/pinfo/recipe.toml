# Imported from Void Linux's template for 'pinfo'. Review before relying on it.
# hooks not translated: pre_configure
# settings not translated: CFLAGS
# needs, but Forge has no recipe for yet: ncurses
[package]
name = "pinfo"
version = "0.6.13"
archive = "https://github.com/baszoetekouw/pinfo/archive/v0.6.13.tar.gz"
sha256 = "9dc5e848a7a86cb665a885bc5f0fdf6d09ad60e814d75e78019ae3accb42c217"
strip_components = 1
description = "Lynx-style info and man reader"

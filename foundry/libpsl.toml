# Imported from Void Linux's template for 'libpsl'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: public-suffix
[package]
name = "libpsl"
version = "0.23.3"
archive = "https://github.com/rockdaboot/libpsl/releases/download/0.23.3/libpsl-0.23.3.tar.lz"
sha256 = "9e60f70c9806f5e3f36581e9c05e9d817767953da3428c08e0ed9b9ad321d444"
strip_components = 1
description = "Public Suffix List library functions"
homepage = "https://rockdaboot.github.io/libpsl/"
license = "MIT, BSD-3-Clause"
deps = ["libidn2", "libunistring"]

[build]
system = "autotools"
configure_args = ["--enable-runtime=libidn2"]
tools = ["pkg-config"]

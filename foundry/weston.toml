deps = ["cairo", "dbus", "eudev", "freerdp", "gst-plugins-base1", "lcms2", "libXcursor", "libdisplay-info", "libdrm", "libevdev", "libinput", "libpng", "libxcb", "libxkbcommon", "neatvnc", "pam", "pango", "pipewire", "pixman", "poppler", "seatd", "vulkan-loader", "wayland", "wayland-protocols", "xorg-server-xwayland"]

[build]
system = "meson"
configure_args = ["-Dtests=false"]
tools = ["pkg-config"]

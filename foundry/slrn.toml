# Imported from Void Linux's template for 'slrn'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, post_patch
# needs, but Forge has no recipe for yet: slang
[package]
name = "slrn"
version = "1.0.3a"
archive = "https://ftp.icm.edu.pl/packages/slrn/slrn-1.0.3a.tar.bz2"
sha256 = "3ba8a4d549201640f2b82d53fb1bec1250f908052a7983f0061c983c634c2dac"
strip_components = 1
description = "Text mode Usenet news reader"
homepage = "https://slrn.info/"
license = "GPL-2.0-or-later"
deps = ["openssl"]

[build]
system = "autotools"
configure_args = ["--with-slrnpull", "--with-ssl", "slrn_cv_va_copy=yes", "slrn_cv___va_copy=yes", "slrn_cv_va_val_copy=yes"]

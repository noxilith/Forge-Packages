# Imported from Void Linux's template for 'plata-theme'. Review before relying on it.
# hooks not translated: post_install, pre_configure
# needs, but Forge has no recipe for yet: zip
[package]
name = "plata-theme"
version = "0.9.9"
archive = "https://gitlab.com/tista500/plata-theme/-/archive/0.9.9/plata-theme-0.9.9.tar.gz"
sha256 = "d5cc388b164990d2e88bae1db56ea296054c7c068e64875ec65378221327395c"
strip_components = 1
description = "Gtk theme based on Material Design Refresh"
homepage = "https://gitlab.com/tista500/plata-theme"
license = "CC-BY-SA-4.0, GPL-2.0-or-later"
deps = ["gdk-pixbuf", "glib", "gtk+", "gtk+3", "gtk-engine-murrine", "gtk2-engines", "marco"]

[build]
system = "autotools"
configure_args = ["--enable-parallel", "--enable-telegram"]
tools = ["pkg-config"]
deps = ["inkscape", "libxml2", "parallel", "procps-ng", "sassc"]

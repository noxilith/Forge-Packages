# Imported from Void Linux's template for 'zanshin'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_patch
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "zanshin"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/zanshin-26.08.1.tar.xz"
sha256 = "ebd4d528eb266d3c7fec278134be784c785cb1ce51f1fdaf43bdbbc20e53c623"
strip_components = 1
description = "To-do management application based on Akonadi"
homepage = "https://apps.kde.org/zanshin"
license = "GPL-3.0-or-later"
deps = ["akonadi-calendar", "kdepim-runtime", "kf6-akonadi", "kf6-kcalendarcore", "kf6-kdoctools", "kf6-kpackage", "kf6-krunner", "kontactinterface"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "gettext", "kf6-kconfig", "kf6-kcoreaddons", "qt6-base"]

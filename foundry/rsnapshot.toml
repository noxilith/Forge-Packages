# Imported from Void Linux's template for 'rsnapshot'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: conf_files
# needs, but Forge has no recipe for yet: perl, perl-Lchown
[package]
name = "rsnapshot"
version = "1.5.1"
archive = "https://www.rsnapshot.org/downloads/rsnapshot-1.5.1.tar.gz"
sha256 = "8f6af8046ee6b0293b26389d08cb6950c7f7ddfffc1f74eefcb087bd49d44f62"
strip_components = 1
description = "Remote filesystem snapshot utility"
homepage = "https://www.rsnapshot.org"
license = "GPL-2.0-only"
deps = ["openssh", "rsync"]

[build]
system = "autotools"
tools = ["perl"]

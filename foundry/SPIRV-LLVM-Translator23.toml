# Imported from Void Linux's template for 'SPIRV-LLVM-Translator23'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
[package]
name = "SPIRV-LLVM-Translator23"
version = "23.1.2"
archive = "https://github.com/KhronosGroup/SPIRV-LLVM-Translator/archive/refs/tags/v23.1.2.tar.gz"
sha256 = "b657254b5e0a2dda7914a8cb1eace467f22847d75d877b83829026c1452f827a"
strip_components = 1
description = "LLVM/SPIR-V bi-directional translator - LLVM 23"
homepage = "https://github.com/KhronosGroup/SPIRV-LLVM-Translator"
license = "NCSA"
deps = ["SPIRV-Headers", "SPIRV-Tools", "llvm23"]

[build]
system = "cmake"
configure_args = ["-DBUILD_SHARED_LIBS=ON", "-DCMAKE_SKIP_RPATH=ON", "-DLLVM_LINK_LLVM_DYLIB=ON", "-DLLVM_SPIRV_ENABLE_LIBSPIRV_DIS=ON", "-DLLVM_SPIRV_INCLUDE_TESTS=OFF"]
tools = ["pkg-config"]

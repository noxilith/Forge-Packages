# Imported from Void Linux's template for 'starfighter'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: pre_configure
# needs, but Forge has no recipe for yet: SDL2_image
[package]
name = "starfighter"
version = "2.4"
archive = "https://github.com/pr-starfighter/starfighter/archive/v2.4.tar.gz"
sha256 = "d0757da7657253316053acf37dabf8e54607420d66a4d7cc2a9fc0d4b4d54074"
strip_components = 1
description = "Side-scrolling shoot 'em up space game"
homepage = "https://pr-starfighter.github.io"
license = "GPL-3.0-or-later"
deps = ["SDL2_mixer", "SDL2_ttf", "desktop-file-utils", "pango"]

[build]
system = "autotools"
tools = ["pkg-config"]
deps = ["gettext"]

# Imported from Void Linux's template for 'munge'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, pre_install
# settings not translated: make_dirs
# needs, but Forge has no recipe for yet: bzip2, shadow
[package]
name = "munge"
version = "0.5.15"
archive = "https://github.com/dun/munge/releases/download/munge-0.5.15/munge-0.5.15.tar.xz"
sha256 = "3f979df117a34c74db8fe2835521044bdeb08e3b7d0f168ca97c3547f51da9ba"
strip_components = 1
description = "MUNGE Uid 'N' Gid Emporium authentication service"
homepage = "https://dun.github.io/munge/"
license = "GPL-3.0-or-later"
deps = ["openssl", "zlib"]

[build]
system = "autotools"
configure_args = ["--with-crypto-lib=openssl", "x_ac_cv_check_fifo_recvfd=no", "ac_cv_file__dev_spx=no"]
tools = ["pkg-config"]

# Imported from Void Linux's template for 'crun'. Review before relying on it.
# hooks not translated: post_install
[package]
name = "crun"
version = "1.30.1"
archive = "https://github.com/containers/crun/releases/download/1.30.1/crun-1.30.1.tar.gz"
sha256 = "99d036d95113552b6df66c7c879432835504bf0e525fc0372745071df129527b"
strip_components = 1
description = "Lightweight OCI runtime written in C"
homepage = "https://github.com/containers/crun"
license = "GPL-2.0-or-later AND LGPL-2.1-or-later"
deps = ["json-c", "libblake3", "libcap", "libseccomp"]

[build]
system = "autotools"
configure_args = ["--disable-systemd"]
tools = ["pkg-config"]

# Imported from Void Linux's template for 'libspelling'. Review before relying on it.
# hooks not translated: pre_build
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: gi-docgen
[package]
name = "libspelling"
version = "0.4.9"
archive = "https://download.gnome.org/sources/libspelling/0.4/libspelling-0.4.9.tar.xz"
sha256 = "d093fd35ae0f1c98fb58876505287fc0a885e47da9d2411d6d7cd595f34d4ebf"
strip_components = 1
description = "Spellcheck library for GTK 4"
homepage = "https://gitlab.gnome.org/GNOME/libspelling"
license = "LGPL-3.0-or-later"
deps = ["enchant2", "gtk4", "gtksourceview5", "libadwaita"]

[build]
system = "meson"
configure_args = ["-Dsysprof=false"]
tools = ["pkg-config"]
deps = ["gettext", "glib", "vala"]

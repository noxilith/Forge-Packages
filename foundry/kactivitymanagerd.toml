# Imported from Void Linux's template for 'kactivitymanagerd'. Review before relying on it.
# needs, but Forge has no recipe for yet: boost, kde-plasma-base, qt6-tools
[package]
name = "kactivitymanagerd"
version = "6.7.5"
archive = "https://download.kde.org/stable/plasma/6.7.5/kactivitymanagerd-6.7.5.tar.xz"
sha256 = "6e549b0dacd28797153696e4ee27f8e19aee6f3711f94ee379b8fae8ecfd937a"
strip_components = 1
description = "Manage user's activities and track the usage patterns"
homepage = "https://invent.kde.org/plasma/kactivitymanagerd"
license = "GPL-2.0-or-later"
deps = ["kf6-kcrash", "kf6-kdbusaddons", "kf6-kglobalaccel", "kf6-kio", "kf6-kxmlgui", "qt6-base"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
deps = ["extra-cmake-modules", "gettext", "kf6-kconfig"]

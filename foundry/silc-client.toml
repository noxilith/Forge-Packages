# Imported from Void Linux's template for 'silc-client'. Review before relying on it.
# settings not translated: LDFLAGS, conf_files
# needs, but Forge has no recipe for yet: ncurses
[package]
name = "silc-client"
version = "1.1.11"
archive = "https://downloads.sourceforge.net/sourceforge/silc/silc/client/sources/silc-client-1.1.11.tar.bz2"
sha256 = "36dfc3782e5949433fb8b0f1acf599426fb706555d343095641a49dbaa1b978d"
strip_components = 1
description = "Secure Internet Live Conferencing client"
homepage = "http://www.silcnet.org/client.html"
license = "GPL-2.0-only"
deps = ["glib", "pcre", "silc-toolkit"]

[build]
system = "autotools"
configure_args = ["--enable-debug", "--enable-ipv6", "--disable-optimizations", "ac_cv_func_pthread_rwlock_init=set", "ac_cv_func_epoll_wait=set"]
tools = ["pkg-config"]

# Imported from Void Linux's template for 'cargo-about'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: zstd
[package]
name = "cargo-about"
version = "0.9.0"
archive = "https://github.com/EmbarkStudios/cargo-about/archive/refs/tags/0.9.0.tar.gz"
sha256 = "7dc9b5f87d25b57c044618655a1948857bd03196e3b20cbb8700b41ad6f1614f"
strip_components = 1
description = "Cargo plugin to generate list of all licenses for a crate"
homepage = "https://github.com/EmbarkStudios/cargo-about"
license = "Apache-2.0 OR MIT"

[build]
system = "cargo"
configure_args = ["--features=cli"]
tools = ["pkg-config"]

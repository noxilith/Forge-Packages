# Imported from Void Linux's template for 'kwrited'. Review before relying on it.
# needs, but Forge has no recipe for yet: kde-plasma-base, qt6-tools
[package]
name = "kwrited"
version = "6.7.5"
archive = "https://download.kde.org/stable/plasma/6.7.5/kwrited-6.7.5.tar.xz"
sha256 = "f8aa905734d0ccde796884cfcb06b36084e441fb199ea5aab2bc92cfa4c0506d"
strip_components = 1
description = "KDE daemon listening for wall and write messages"
homepage = "https://invent.kde.org/plasma/kwrited"
license = "GPL-2.0-or-later"
deps = ["kf6-kdbusaddons", "kf6-knotifications", "kf6-kpty"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
deps = ["extra-cmake-modules", "gettext", "kcoreaddons", "qt6-base"]

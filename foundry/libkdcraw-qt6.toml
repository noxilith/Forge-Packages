# Imported from Void Linux's template for 'libkdcraw-qt6'. Review before relying on it.
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "libkdcraw-qt6"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/libkdcraw-26.08.1.tar.xz"
sha256 = "cf49479043a75557f82b0213019c45291d612267e454b66d939f04b189c4f182"
strip_components = 1
description = "C++ interface around LibRaw library used to decode RAW - Qt6"
homepage = "https://www.kde.org/applications/graphics/"
license = "GPL-2.0-or-later"
deps = ["libraw", "qt6-base"]

[build]
system = "cmake"
configure_args = ["-DQT_MAJOR_VERSION=6"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "gettext"]

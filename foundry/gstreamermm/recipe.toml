# Imported from Void Linux's template for 'gstreamermm'. Review before relying on it.
[package]
name = "gstreamermm"
version = "1.10.0"
archive = "https://download.gnome.org/sources/gstreamermm/1.10/gstreamermm-1.10.0.tar.xz"
sha256 = "be58fe9ef7d7e392568ec85e80a84f4730adbf91fb0355ff7d7c616675ea8d60"
strip_components = 1
description = "GStreamer API C++ bindings"
homepage = "https://gstreamer.freedesktop.org/bindings/cplusplus.html"
license = "GPL-2.0-only, LGPL-2.1-or-later"
deps = ["gst-plugins-base1", "pangomm"]
patches = ["patches/fix-build-with-gstreamer1.12.patch", "patches/gstreamermm-1.10.0-no-volatile.patch"]

[build]
system = "autotools"
configure_args = ["--disable-plugins-bad"]
tools = ["perl", "pkg-config"]

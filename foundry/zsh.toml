# Imported from Void Linux's template for 'zsh'. Review before relying on it.
# 8 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, post_patch, pre_configure
# settings not translated: make_install_args, make_build_target, conf_files, lib32disabled
# needs, but Forge has no recipe for yet: ncurses
[package]
name = "zsh"
version = "5.9.2"
archive = "https://www.zsh.org/pub/zsh-5.9.2.tar.xz"
sha256 = "36fa734374b44783582cec09bcd67822e2f992c779ec1624ab5596df078d2f81"
strip_components = 1
description = "Z SHell"
homepage = "https://www.zsh.org"
license = "MIT, GPL-3.0-or-later"
deps = ["gdbm", "libcap", "pcre2"]

[build]
system = "autotools"
configure_args = ["--enable-maildir-support", "--enable-function-subdirs", "--with-term-lib=ncursesw", "--enable-pcre", "--enable-multibyte", "--enable-cap", "--with-tcsetpgrp", "zsh_cv_shared_environ=yes", "zsh_cv_func_dlsym_needs_underscore=no", "zsh_cv_sys_dynamic_execsyms=yes"]
deps = ["texinfo"]

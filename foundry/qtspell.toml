# Imported from Void Linux's template for 'qtspell'. Review before relying on it.
# needs, but Forge has no recipe for yet: qt5
[package]
name = "qtspell"
version = "1.0.2"
archive = "https://github.com/manisandro/qtspell/archive/refs/tags/1.0.2.tar.gz"
sha256 = "faa7add9d771350a63e66bb6c9b91b130097c2399f6f85c2a9a0ea8e0ceb79d8"
strip_components = 1
description = "Spell checking for Qt text widgets"
homepage = "https://github.com/manisandro/qtspell"
license = "GPL-3.0-or-later"
deps = ["enchant2"]

[build]
system = "cmake"
tools = ["pkg-config"]

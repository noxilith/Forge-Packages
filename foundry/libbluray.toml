# Imported from Void Linux's template for 'libbluray'. Review before relying on it.
# hooks not translated: pre_build, pre_check, pre_install
[package]
name = "libbluray"
version = "1.3.4"
archive = "https://download.videolan.org/pub/videolan/libbluray/1.3.4/libbluray-1.3.4.tar.bz2"
sha256 = "478ffd68a0f5dde8ef6ca989b7f035b5a0a22c599142e5cd3ff7b03bbebe5f2b"
strip_components = 1
description = "Library to access Blu-Ray disks for video playback"
homepage = "https://www.videolan.org/developers/libbluray.html"
license = "LGPL-2.1-or-later"
deps = ["fontconfig", "libxml2"]

[build]
system = "autotools"
configure_args = ["--disable-static", "--disable-optimizations"]
tools = ["pkg-config"]

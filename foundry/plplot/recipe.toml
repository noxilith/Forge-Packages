# Imported from Void Linux's template for 'plplot'. Review before relying on it.
# 4 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_configure, post_install, post_patch, pre_build
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: freefont-ttf, lua53, python3-numpy, python3-setuptools, shapelib, tk
[package]
name = "plplot"
version = "5.15.0"
archive = "https://downloads.sourceforge.net/sourceforge/plplot/plplot/5.15.0%20Source/plplot-5.15.0.tar.gz"
sha256 = "b92de4d8f626a9b20c84fc94f4f6a9976edd76e33fb1eae44f6804bdcc628c7b"
strip_components = 1
description = "Scientific graphics plotting with math symbols and human languages"
homepage = "http://plplot.sourceforge.net"
license = "LGPL-3.0-or-later"
deps = ["Haru", "cairo", "freetype", "pango", "qhull"]
patches = ["patches/plplot-5.15.0-swig-4.3.patch", "patches/plplot-5.15.0-swig-4.4.patch"]

[build]
system = "cmake"
configure_args = ["-DPREBUILT_DOC=ON"]
tools = ["pkg-config"]
deps = ["swig"]

# Imported from Void Linux's template for 'timidity'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, pre_build, pre_configure
# needs, but Forge has no recipe for yet: ncurses
[package]
name = "timidity"
version = "2.15.0"
archive = "https://downloads.sourceforge.net/sourceforge/timidity/TiMidity++-2.15.0.tar.xz"
sha256 = "9eaf4fadb0e19eb8e35cd4ac16142d604c589e43d0e8798237333697e6381d39"
strip_components = 1
description = "MIDI to WAVE converter and player"
homepage = "http://timidity.sourceforge.net"
license = "GPL-2.0-or-later"
deps = ["alsa-lib", "flac", "gtk+", "libX11", "libao", "libvorbis"]
patches = ["patches/gcc14.patch", "patches/sffile-2gb.patch"]

[build]
system = "autotools"
configure_args = ["--enable-server", "--enable-alsaseq=yes", "--enable-network", "--enable-gtk", "--enable-ncurses"]
tools = ["pkg-config"]

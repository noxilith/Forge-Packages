# Imported from Void Linux's template for 'tumbler'. Review before relying on it.
[package]
name = "tumbler"
version = "4.20.1"
archive = "https://archive.xfce.org/src/xfce/tumbler/4.20/tumbler-4.20.1.tar.bz2"
sha256 = "87b90df8f30144a292d70889e710c8619d8b8803f0e1db3280a4293367a42eae"
strip_components = 1
description = "D-Bus Thumbnailer service"
homepage = "https://docs.xfce.org/xfce/tumbler/start"
license = "GPL-2.0-or-later"
deps = ["curl", "ffmpegthumbnailer", "freetype", "glib", "libgepub", "libgsf", "libopenraw", "libxfce4util", "poppler"]

[build]
system = "autotools"
configure_args = ["--disable-gstreamer-thumbnailer", "--enable-poppler-thumbnailer"]
tools = ["perl", "pkg-config"]
deps = ["gettext"]

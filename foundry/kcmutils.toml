[package]
name = "kcmutils"
version = "5.116.0"
archive = "https://download.kde.org/stable/frameworks/5.116/kcmutils-5.116.0.tar.xz"
sha256 = "91288dbd552d9d29758b9f73a79b8ec091d33b143158605ea0de8dcd11185c19"

# Imported from Void Linux's template for 'imv'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: conf_files
# needs, but Forge has no recipe for yet: asciidoc, libjxl, libnsbmp, libnsgif, libwebp
[package]
name = "imv"
version = "5.0.1"
archive = "https://git.sr.ht/~exec64/imv/archive/v5.0.1.tar.gz"
sha256 = "8949c1df4b933b1d324e02ce49f1834a4b73dd25fa8103579e0ed105149e080e"
strip_components = 1
description = "Image viewer for X11/Wayland"
homepage = "https://sr.ht/~exec64/imv/"
license = "MIT"
deps = ["cmocka", "desktop-file-utils", "glu", "inih", "libheif", "librsvg", "libxkbcommon", "pango", "wayland", "wayland-protocols"]

[build]
system = "meson"
configure_args = ["-Db_ndebug=false"]
tools = ["pkg-config"]

# Imported from Void Linux's template for 'kf6-attica'. Review before relying on it.
# needs, but Forge has no recipe for yet: kf6-base, qt6-tools
[package]
name = "kf6-attica"
version = "6.30.0"
archive = "https://download.kde.org/stable/frameworks/6.30/attica-6.30.0.tar.xz"
sha256 = "3eec8d2d9c77ad5f7cfd38e44e4b1492c5d0dec695b13f711c09f7d6187c276c"

# Imported from Void Linux's template for 'kwayland'. Review before relying on it.
# needs, but Forge has no recipe for yet: mesa, qt5
[package]
name = "kwayland"
version = "5.116.0"
archive = "https://download.kde.org/stable/frameworks/5.116/kwayland-5.116.0.tar.xz"
sha256 = "88b5970c2d6f6d5f46e6ffac66233bf23f2fcf016dea39fffbd9f47b1fc0aed8"
strip_components = 1
description = "Qt-style client and server library wrapper for Wayland libraries"
homepage = "https://invent.kde.org/frameworks/kwayland"
license = "LGPL-2.1-or-later"
deps = ["libxkbcommon", "wayland", "wayland-protocols"]
patches = ["patches/drm_fourcc-typedef.patch"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DEXCLUDE_DEPRECATED_BEFORE_AND_AT=5.100.0"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "kcoreaddons", "plasma-wayland-protocols"]

# Imported from Void Linux's template for 'plasma-workspace'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: kde-plasma-base, libcanberra, qt6-location, qt6-position, qt6-qt5compat, qt6-shadertools, qt6-tools
[package]
name = "plasma-workspace"
version = "6.7.5"
archive = "https://download.kde.org/stable/plasma/6.7.5/plasma-workspace-6.7.5.tar.xz"
sha256 = "94ab21e2243b7876f65c315f1e545081c6437f5bd0a041ca4fb6c2533ae874c9"
strip_components = 1
description = "KDE Plasma Workspace"
homepage = "https://invent.kde.org/plasma/plasma-workspace"
license = "GPL-2.0-or-later, GFDL-1.2-or-later, LGPL-2.1-or-later"
deps = ["AppStream", "NetworkManager", "elogind", "eudev", "fontconfig", "glib", "iso-codes", "kactivitymanagerd", "kf6-baloo", "kf6-karchive", "kf6-kauth", "kf6-kcmutils", "kf6-kcolorscheme", "kf6-kcoreaddons", "kf6-kcrash", "kf6-kdbusaddons", "kf6-kdeclarative", "kf6-kded", "kf6-kdesu", "kf6-kdoctools", "kf6-kglobalaccel", "kf6-kguiaddons", "kf6-kholidays", "kf6-ki18n", "kf6-kiconthemes", "kf6-kidletime", "kf6-kio", "kf6-kirigami", "kf6-kitemmodels", "kf6-knewstuff", "kf6-knotifications", "kf6-knotifyconfig", "kf6-kpackage", "kf6-kparts", "kf6-kpeople", "kf6-kquickcharts", "kf6-krunner", "kf6-kstatusnotifieritem", "kf6-ksvg", "kf6-ktexteditor", "kf6-ktextwidgets", "kf6-kunitconversion", "kf6-kuserfeedback", "kf6-kwallet", "kf6-kwayland", "kf6-networkmanager-qt", "kf6-prison", "kf6-solid", "kirigami-addons", "knighttime", "kpipewire", "kscreenlocker", "kwin", "layer-shell-qt", "libXft", "libXtst", "libicu78", "libkexiv2", "libkf6screen", "libksysguard", "libplasma", "libqalculate", "libxcb", "milou", "phonon", "plasma-activities", "plasma-activities-stats", "plasma-integration", "plasma-wayland-protocols", "plasma5support", "polkit-qt6", "qcoro-qt6", "qt6-base", "qt6-declarative", "wayland", "xcb-util", "xcb-util-cursor", "xcb-util-image", "xorg-server-xwayland", "zlib"]
patches = ["patches/dbus.patch", "patches/fix-krunner-cwd.patch"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
tools = ["pkg-config"]
deps = ["SPIRV-Tools", "extra-cmake-modules", "gettext", "kf6-kconfig", "kf6-kwindowsystem"]

# Imported from Void Linux's template for 'libcacard'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: nss
[package]
name = "libcacard"
version = "2.8.2"
archive = "https://www.spice-space.org/download/libcacard/libcacard-2.8.2.tar.xz"
sha256 = "45fc28a6ff3c7a359d4448132ca190f0a9c760540c445dba4597a5b71de40f68"
strip_components = 1
description = "Library to provide emulation of smart cards to a virtual card reader"
homepage = "https://cgit.freedesktop.org/spice/libcacard/"
license = "LGPL-2.1-or-later"
deps = ["glib", "pcsclite"]

[build]
system = "meson"
configure_args = ["-Ddisable_tests=true"]
tools = ["pkg-config"]

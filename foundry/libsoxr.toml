# Imported from Void Linux's template for 'libsoxr'. Review before relying on it.
[package]
name = "libsoxr"
version = "0.1.3"
archive = "https://downloads.sourceforge.net/sourceforge/soxr/soxr-0.1.3-Source.tar.xz"
sha256 = "b111c15fdc8c029989330ff559184198c161100a59312f5dc19ddeb9b5a15889"
strip_components = 1
description = "SoX resampler library"
homepage = "http://sourceforge.net/p/soxr/wiki/Home/"
license = "LGPL-2.1-or-later"

[build]
system = "cmake"
configure_args = ["-DBUILD_EXAMPLES=OFF", "-DBUILD_SHARED_LIBS=ON", "-DVISIBILITY_HIDDEN=ON", "-DWITH_AVFFT=ON", "-DWITH_DOUBLE_PRECISION=ON", "-DWITH_LSR_BINDINGS=ON", "-DWITH_OPENMP=ON", "-DWITH_PFFFT=ON"]

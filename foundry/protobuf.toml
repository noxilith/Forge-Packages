# Imported from Void Linux's template for 'protobuf'. Review before relying on it.
# hooks not translated: post_install
[package]
name = "protobuf"
version = "35.1"
archive = "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protobuf-35.1.tar.gz"
sha256 = "f0b6838e7522a8da96126d487068c959bc624926368f3024ac8fd03abd0a1ac4"
strip_components = 1
description = "Protocol buffers compiler"
homepage = "https://developers.google.com/protocol-buffers/"
license = "BSD-3-Clause"
deps = ["abseil-cpp", "gtest", "zlib"]

[build]
system = "cmake"
configure_args = ["-Dprotobuf_BUILD_SHARED_LIBS=ON", "-Dprotobuf_BUILD_LIBPROTOC=ON", "-Dprotobuf_BUILD_TESTS=OFF"]
tools = ["pkg-config"]

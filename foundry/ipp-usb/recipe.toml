# Imported from Void Linux's template for 'ipp-usb'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: go_import_path, conf_files
# needs, but Forge has no recipe for yet: avahi
[package]
name = "ipp-usb"
version = "0.9.23"
archive = "https://github.com/OpenPrinting/ipp-usb/archive/0.9.23.tar.gz"
sha256 = "81f325abc45b4d2b8812022d93dfcebc807c2b0688e2a9f7052f0bddfadf5b01"
strip_components = 1
description = "Allows using the IPP protocol over usb connections"
homepage = "https://github.com/OpenPrinting/ipp-usb"
license = "BSD-2-Clause"
deps = ["libusb"]
patches = ["patches/udev_runit.patch"]

[build]
system = "go"
tools = ["pkg-config"]

# Imported from Void Linux's template for 'merkuro'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-location, qt6-svg, qt6-tools
[package]
name = "merkuro"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/merkuro-26.08.1.tar.xz"
sha256 = "036df52be52c1fc7b239ada44bd45eb7f875c13f59b5009e7029d303b152a16e"
strip_components = 1
description = "Calendar application using Akonadi"
homepage = "https://invent.kde.org/pim/merkuro"
license = "GPL-3.0-or-later"
deps = ["akonadi-calendar", "akonadi-contacts", "akonadi-mime", "akonadi-search", "eventviews", "gpgmepp", "kcalutils", "kdepim-runtime", "kf6-akonadi", "kf6-kcalendarcore", "kf6-kconfigwidgets", "kf6-kcontacts", "kf6-kcoreaddons", "kf6-kdbusaddons", "kf6-kholidays", "kf6-ki18n", "kf6-kiconthemes", "kf6-kio", "kf6-kirigami", "kf6-kitemmodels", "kf6-kmime", "kf6-kpackage", "kf6-kpeople", "kf6-kwindowsystem", "kf6-qqc2-desktop-style", "kidentitymanagement", "kirigami-addons", "kmailtransport", "kmbox", "libkdepim", "libkleo", "mailcommon", "messagelib", "mimetreeparser", "pimcommon", "qt6-base", "qt6-declarative"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "gettext", "kf6-kconfig"]

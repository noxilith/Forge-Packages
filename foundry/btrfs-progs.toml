# Imported from Void Linux's template for 'btrfs-progs'. Review before relying on it.
# hooks not translated: post_install, pre_build
# needs, but Forge has no recipe for yet: python3-Sphinx, python3-sphinx_rtd_theme, util-linux-common, zstd
[package]
name = "btrfs-progs"
version = "6.11"
archive = "https://www.kernel.org/pub/linux/kernel/people/kdave/btrfs-progs/btrfs-progs-v6.11.tar.xz"
sha256 = "ff9ae91521303a90d87e1c4be230f0121f39c44ddbe52c2aeae263c6fecfa099"
strip_components = 1
description = "Btrfs filesystem utilities"
homepage = "https://btrfs.wiki.kernel.org/index.php/Main_Page"
license = "GPL-2.0-only, LGPL-2.1-or-later"
deps = ["acl", "eudev", "lzo", "zlib"]

[build]
system = "autotools"
configure_args = ["--disable-backtrace", "--disable-python"]
tools = ["pkg-config"]

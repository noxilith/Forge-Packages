# Imported from Void Linux's template for 'fltk'. Review before relying on it.
# hooks not translated: post_install, pre_build
# needs, but Forge has no recipe for yet: mesa
[package]
name = "fltk"
version = "1.3.9"
archive = "https://fltk.org/pub/fltk/1.3.9/fltk-1.3.9-source.tar.gz"
sha256 = "d736b0445c50d607432c03d5ba5e82f3fba2660b10bc1618db8e077a42d9511b"
strip_components = 1
description = "Cross-platform C++ GUI toolkit"
homepage = "https://www.fltk.org/"
license = "custom:LGPL-2.0-only WITH FLTK-exception"
deps = ["alsa-lib", "freetype", "libXft", "libXinerama", "libjpeg-turbo", "libpng"]

[build]
system = "autotools"
configure_args = ["--enable-threads", "--enable-xft", "--enable-shared"]
deps = ["man-db"]

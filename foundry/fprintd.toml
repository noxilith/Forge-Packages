# Imported from Void Linux's template for 'fprintd'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# settings not translated: conf_files, lib32disabled
# needs, but Forge has no recipe for yet: dbus-glib, python3-dbusmock
[package]
name = "fprintd"
version = "1.94.5"
archive = "https://gitlab.freedesktop.org/libfprint/fprintd/-/archive/v1.94.5/fprintd-v1.94.5.tar.bz2"
sha256 = "597466f61fdd5bd1d8af4fe96d982eb07528d28e915200ad789279ed7d8dfb6d"
strip_components = 1
description = "Daemon that provides fingerprint scanning functionality"
homepage = "https://www.freedesktop.org/wiki/Software/fprint/"
license = "GPL-2.0-or-later"
deps = ["cairo", "dbus", "elogind", "glib", "libfprint", "pam", "pam_wrapper", "polkit"]

[build]
system = "meson"
configure_args = ["-Dman=true", "-Dgtk_doc=false", "-Dsystemd=false"]
tools = ["perl", "pkg-config"]
deps = ["gettext", "libxslt", "python3-cairo", "python3-dbus"]

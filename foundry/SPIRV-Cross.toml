# Imported from Void Linux's template for 'SPIRV-Cross'. Review before relying on it.
# hooks not translated: post_install
[package]
name = "SPIRV-Cross"
version = "1.4.363.0"
archive = "https://github.com/KhronosGroup/SPIRV-Cross/archive/vulkan-sdk-1.4.363.0.tar.gz"
sha256 = "f708982e88b763ef5b0394ed468fc2c3628f68cdab89f2e7a946cd628c04e721"
strip_components = 1
description = "Tool and library for converting SPIR-V to high level shader languages"
homepage = "https://github.com/KhronosGroup/SPIRV-Cross"
license = "Apache-2.0 OR MIT"

[build]
system = "cmake"
configure_args = ["-DSPIRV_CROSS_SHARED=ON", "-DSPIRV_CROSS_ENABLE_TESTS=OFF", "-DSPIRV_CROSS_FORCE_PIC=ON"]

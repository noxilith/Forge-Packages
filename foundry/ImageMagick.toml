# Imported from Void Linux's template for 'ImageMagick'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, pre_check
# settings not translated: conf_files
# needs, but Forge has no recipe for yet: fftw, ghostscript, libavif, libjxl, libwebp
[package]
name = "ImageMagick"
version = "7.1.2.31"
archive = "https://github.com/ImageMagick/ImageMagick/archive/7.1.2-31.tar.gz"
sha256 = "34d9cc3acddc3e3c429d23af60eda5ceaac477a8b296ddb9469f773f44a80a5f"
strip_components = 1
description = "Create, edit, compose, or convert bitmap images"
homepage = "https://www.imagemagick.org"
license = "ImageMagick"
deps = ["djvulibre", "glib", "graphviz", "lcms2", "libXt", "libheif", "liblqr", "libraqm", "librsvg", "libwmf", "ocl-icd", "openexr", "openjpeg2", "pango"]

[build]
system = "autotools"
configure_args = ["--disable-static", "--enable-opencl", "--with-modules", "--with-gslib", "--with-rsvg", "--with-wmf", "--with-openexr"]
tools = ["pkg-config"]

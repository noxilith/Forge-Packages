# Imported from Void Linux's template for 'gmp'. Review before relying on it.
[package]
name = "gmp"
version = "6.3.0"
archive = "https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz"
sha256 = "a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898"
strip_components = 1
description = "Library for arbitrary precision arithmetic"
homepage = "http://gmplib.org/"
license = "LGPL-3.0-or-later"
deps = ["zlib"]

[build]
system = "autotools"
configure_args = ["--enable-cxx"]
tools = ["m4"]

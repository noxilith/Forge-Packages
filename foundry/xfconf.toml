# Imported from Void Linux's template for 'xfconf'. Review before relying on it.
# settings not translated: build_helper
[package]
name = "xfconf"
version = "4.20.0"
archive = "https://archive.xfce.org/src/xfce/xfconf/4.20/xfconf-4.20.0.tar.bz2"
sha256 = "8bc43c60f1716b13cf35fc899e2a36ea9c6cdc3478a8f051220eef0f53567efd"
strip_components = 1
description = "Xfce hierarchical (tree-like) configuration system"
homepage = "https://xfce.org/"
license = "GPL-2.0-only, LGPL-2.0-only"
deps = ["libxfce4util", "vala"]

[build]
system = "autotools"
configure_args = ["--enable-gsettings-backend"]
tools = ["perl", "pkg-config"]
deps = ["gettext", "glib"]

# Imported from Void Linux's template for 'lightdm-mini-greeter'. Review before relying on it.
# hooks not translated: pre_configure
# settings not translated: conf_files
# needs, but Forge has no recipe for yet: hicolor-icon-theme
[package]
name = "lightdm-mini-greeter"
version = "0.5.1"
archive = "https://github.com/prikhi/lightdm-mini-greeter/archive/0.5.1.tar.gz"
sha256 = "2c48b6686209d9e2940da4dcbb7d5fea2caf68f5a2a11270f536bbdb625ca677"
strip_components = 1
description = "Minimal, Configurable, Single-User GTK3 LightDM Greeter"
homepage = "https://github.com/prikhi/lightdm-mini-greeter"
license = "GPL-3.0-or-later"
deps = ["gtk+3", "libxklavier", "lightdm"]

[build]
system = "autotools"
tools = ["pkg-config"]

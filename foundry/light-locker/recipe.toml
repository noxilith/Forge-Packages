# Imported from Void Linux's template for 'light-locker'. Review before relying on it.
# hooks not translated: pre_patch
# needs, but Forge has no recipe for yet: dbus-glib
[package]
name = "light-locker"
version = "1.9.0"
archive = "https://github.com/the-cavalry/light-locker/archive/v1.9.0.tar.gz"
sha256 = "9915ed34b6c38f519e17902541a180b8b2d775c26edd8ed5aba024722039157c"
strip_components = 1
description = "Simple session-locker for lightdm"
homepage = "https://github.com/the-cavalry/light-locker"
license = "GPL-2.0-or-later"
deps = ["elogind", "gtk+3", "libSM", "libXScrnSaver", "libXxf86vm", "lightdm"]
patches = ["patches/no-intltool.patch"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["gettext", "glib"]

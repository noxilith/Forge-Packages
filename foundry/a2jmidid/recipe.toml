# Imported from Void Linux's template for 'a2jmidid'. Review before relying on it.
# needs, but Forge has no recipe for yet: jack
[package]
name = "a2jmidid"
version = "9"
archive = "https://github.com/linuxaudio/a2jmidid/archive/9.tar.gz"
sha256 = "2828d283e0c9a65f0683881f09676c8c35c45c97a8a56cf77b43b4ef0231df06"
strip_components = 1
description = "ALSA sequencer to JACK MIDI bridging (for jack2)"
homepage = "https://github.com/linuxaudio/a2jmidid/"
license = "GPL-2.0-or-later"
deps = ["alsa-lib", "dbus"]
patches = ["patches/musl-no-execinfo.patch", "patches/musl-ppc.patch"]

[build]
system = "meson"
tools = ["pkg-config"]

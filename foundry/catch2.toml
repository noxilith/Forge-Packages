# Imported from Void Linux's template for 'catch2'. Review before relying on it.
# hooks not translated: post_install
[package]
name = "catch2"
version = "3.6.0"
archive = "https://github.com/catchorg/Catch2/archive/v3.6.0/catch2-v3.6.0.tar.gz"
sha256 = "485932259a75c7c6b72d4b874242c489ea5155d17efa345eb8cc72159f49f356"
strip_components = 1
description = "C++ test framework for unit-tests, TDD and BDD"
homepage = "https://github.com/catchorg/Catch2"
license = "BSL-1.0"

[build]
system = "cmake"
configure_args = ["-DCATCH_USE_VALGRIND=OFF", "-DCATCH_BUILD_TESTING=ON", "-DCATCH_BUILD_EXAMPLES=OFF", "-DCATCH_BUILD_EXTRA_TESTS=OFF", "-DCATCH_ENABLE_COVERAGE=OFF", "-DCATCH_ENABLE_WERROR=OFF", "-DCATCH_INSTALL_DOCS=ON", "-DCATCH_INSTALL_HELPERS=ON"]

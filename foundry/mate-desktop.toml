deps = ["dconf", "gdk-pixbuf", "glib", "gtk+3", "iso-codes", "libXrandr", "startup-notification"]

[build]
system = "meson"
configure_args = ["-Dstartup-notification=enabled"]
tools = ["pkg-config"]
deps = ["gettext", "librsvg"]

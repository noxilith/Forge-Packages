# Imported from Void Linux's template for 'memcached'. Review before relying on it.
# hooks not translated: post_install, pre_configure
[package]
name = "memcached"
version = "1.6.42"
archive = "https://memcached.org/files/memcached-1.6.42.tar.gz"
sha256 = "50f08b879d4f9d36dea9d905e9eaade15c708e38db7e9a73fc21dc8b45395de7"

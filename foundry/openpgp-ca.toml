# Imported from Void Linux's template for 'openpgp-ca'. Review before relying on it.
# settings not translated: make_install_args
# needs, but Forge has no recipe for yet: llvm, sqlite
[package]
name = "openpgp-ca"
version = "0.13.0"
archive = "https://gitlab.com/openpgp-ca/openpgp-ca/-/archive/openpgp-ca/v0.13.0/openpgp-ca-openpgp-ca-v0.13.0.tar.gz"
sha256 = "1ff5cb62e7b0862243e273e02d2011c587d9c6e629d51d368fd07f748bcdc09e"
strip_components = 1
description = "Tool for handling OpenPGP keys in organizaations"
homepage = "https://openpgp-ca.org/"
license = "GPL-3.0-or-later"
deps = ["gnupg", "nettle", "openssl", "pcsclite"]

[build]
system = "cargo"
tools = ["pkg-config"]

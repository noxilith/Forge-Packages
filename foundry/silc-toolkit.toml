# Imported from Void Linux's template for 'silc-toolkit'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
[package]
name = "silc-toolkit"
version = "1.1.12"
archive = "https://downloads.sourceforge.net/sourceforge/silc/silc/client/sources/silc-toolkit-1.1.12.tar.bz2"
sha256 = "be170288f79fbe34971fc26fe762a8329621e11a117f20c218857f2bbad24d6e"
strip_components = 1
description = "Secure Internet Live Conferencing protocol toolkit"
homepage = "http://www.silcnet.org/"
license = "GPL-2.0-or-later, BSD-3-Clause"
deps = ["gmp", "libidn"]

[build]
system = "autotools"
configure_args = ["--with-perl=yes", "--enable-debug", "--enable-ipv6", "--disable-optimizations", "ac_cv_func_pthread_rwlock_init=set", "ac_cv_func_epoll_wait=set"]
tools = ["nasm", "perl"]

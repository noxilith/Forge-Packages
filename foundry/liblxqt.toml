# Imported from Void Linux's template for 'liblxqt'. Review before relying on it.
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "liblxqt"
version = "2.4.0"
archive = "https://github.com/lxqt/liblxqt/archive/2.4.0.tar.gz"
sha256 = "8c93f717e222c63bbfbcff388c08d387604a778e361e5ddb8ae0da4e1ef308ac"
strip_components = 1
description = "Core utility library for all LXQt components"
homepage = "https://lxqt-project.org"
license = "LGPL-2.1-or-later"
deps = ["kf6-kwindowsystem", "libXScrnSaver", "libqtxdg", "polkit-qt6"]

[build]
system = "cmake"
tools = ["pkg-config"]
deps = ["lxqt-build-tools"]

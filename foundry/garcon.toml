# Imported from Void Linux's template for 'garcon'. Review before relying on it.
# hooks not translated: pre_configure
# settings not translated: build_helper, conf_files
[package]
name = "garcon"
version = "4.20.0"
archive = "https://archive.xfce.org/src/xfce/garcon/4.20/garcon-4.20.0.tar.bz2"
sha256 = "7fb8517c12309ca4ddf8b42c34bc0c315e38ea077b5442bfcc4509415feada8f"
strip_components = 1
description = "Glib/GIO freedesktop.org compliant menu implementation"
homepage = "https://xfce.org/"
license = "LGPL-2.0-or-later"
deps = ["glib", "gtk+3", "libxfce4ui", "libxfce4util"]

[build]
system = "autotools"
configure_args = ["--disable-static", "--enable-introspection"]
tools = ["pkg-config"]
deps = ["gettext"]

# Imported from Void Linux's template for 'ncdc'. Review before relying on it.
# hooks not translated: post_install, pre_build
# needs, but Forge has no recipe for yet: bzip2, ncurses, sqlite
[package]
name = "ncdc"
version = "1.24.1"
archive = "https://dev.yorhel.nl/download/ncdc-1.24.1.tar.gz"
sha256 = "2a8ab9ad7d43f018fc73ba8babd689dfa44aba8cec53b88e4770185cb97778f7"
strip_components = 1
description = "Modern and lightweight DC client with a ncurses interface"
homepage = "https://dev.yorhel.nl/ncdc"
license = "MIT"
deps = ["glib", "gnutls", "libmaxminddb", "zlib"]

[build]
system = "autotools"
configure_args = ["--with-geoip"]
tools = ["pkg-config"]

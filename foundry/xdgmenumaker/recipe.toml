# Imported from Void Linux's template for 'xdgmenumaker'. Review before relying on it.
# hooks not translated: pre_build, pre_install
# needs, but Forge has no recipe for yet: python3-Pillow, python3-xdg, txt2tags
[package]
name = "xdgmenumaker"
version = "2.4"
archive = "https://github.com/gapan/xdgmenumaker/archive/2.4.tar.gz"
sha256 = "4729be77a10249acb08ad3ad93056c8d890d499e3f9885c31fc95a7c1ea69bdd"
strip_components = 1
description = "Automatic menu generator for WMs, such as, fluxbox, icewm, jwm, pekwm"
homepage = "https://github.com/gapan/xdgmenumaker"
license = "GPL-3.0-or-later"
deps = ["gobject-introspection", "gtk+3", "python3-gobject"]
patches = ["patches/usr-local-deprecation-fix.patch"]

[build]
system = "make"

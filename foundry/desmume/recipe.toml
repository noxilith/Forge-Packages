# Imported from Void Linux's template for 'desmume'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: CFLAGS, CXXFLAGS, CPPFLAGS
# needs, but Forge has no recipe for yet: intltool
[package]
name = "desmume"
version = "0.9.13"
archive = "https://github.com/TASEmulators/desmume/releases/download/release_0_9_13/desmume-0.9.13.tar.xz"
sha256 = "5734450e0c25f442dd44cda6a40410fd65470f4fe2fa1eb9f0b7b6dae22dabaf"
strip_components = 1
description = "Nintendo DS emulator"
homepage = "http://www.desmume.com"
license = "GPL-2.0-or-later"
deps = ["SDL2", "agg", "alsa-lib", "desktop-file-utils", "glu", "gtk+3", "libpcap", "soundtouch", "zziplib"]
patches = ["patches/aarch64.patch"]

[build]
system = "autotools"
configure_args = ["--enable-wifi", "--enable-hud", "--disable-openal"]
subdir = "desmume/src/frontend/posix"
tools = ["pkg-config"]

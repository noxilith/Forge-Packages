# Imported from Void Linux's template for 'milkytracker'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: jack
[package]
name = "milkytracker"
version = "1.05.01"
archive = "https://github.com/milkytracker/MilkyTracker/archive/v1.05.01.tar.gz"
sha256 = "c487fccf6c97c483f5a624c3a408377393fa45a27cca27323425ad71ee689e16"
strip_components = 1
description = "Fast Tracker II inspired music tracker"
homepage = "http://milkytracker.titandemo.org/"
license = "GPL-3.0-only"
deps = ["SDL2", "alsa-lib", "rtmidi", "zlib"]

[build]
system = "cmake"
tools = ["pkg-config"]

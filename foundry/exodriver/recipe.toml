# Imported from Void Linux's template for 'exodriver'. Review before relying on it.
# hooks not translated: post_install, pre_install
[package]
name = "exodriver"
version = "2.6.0"
archive = "https://github.com/labjack/exodriver/archive/refs/tags/v2.6.0.tar.gz"
sha256 = "d2ccf992bf42b50e7c009ae3d9d3d3191a67bfc8a2027bd54ba4cbd4a80114b2"

# Imported from Void Linux's template for 'libmpc'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: mpfr
[package]
name = "libmpc"
version = "1.4.1"
archive = "https://ftp.gnu.org/gnu/mpc/mpc-1.4.1.tar.xz"
sha256 = "91204cd32f164bd3b7c992d4a6a8ce6519511aadab30f78b6982d0bf8d73e931"

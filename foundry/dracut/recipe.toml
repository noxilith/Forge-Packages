# Imported from Void Linux's template for 'dracut'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# settings not translated: make_dirs, conf_files
# needs, but Forge has no recipe for yet: kpartx, ruby-asciidoctor, util-linux
[package]
name = "dracut"
version = "112"
archive = "https://github.com/dracut-ng/dracut-ng/archive/refs/tags/112.tar.gz"
sha256 = "839d21eb4bd27bb0ee40d74c9da46df088c2e1425fcd8c3ea62b7e3a3dd28a91"
strip_components = 1
description = "Low-level tool for generating an initramfs/initrd image"
homepage = "https://github.com/dracut-ng/dracut-ng/wiki"
license = "GPL-2.0-or-later, LGPL-2.0-or-later"
deps = ["cpio", "eudev", "gzip", "kmod"]
patches = ["patches/plymouth-udev-seat.patch", "patches/revert-fw_devlink.patch"]

[build]
system = "autotools"
configure_args = ["--enable-network-legacy"]
tools = ["pkg-config"]

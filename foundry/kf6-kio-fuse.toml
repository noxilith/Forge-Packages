# Imported from Void Linux's template for 'kf6-kio-fuse'. Review before relying on it.
# needs, but Forge has no recipe for yet: base-devel
[package]
name = "kf6-kio-fuse"
version = "5.1.1"
archive = "https://download.kde.org/stable/kio-fuse/kio-fuse-5.1.1.tar.xz"
sha256 = "adf6aa7ce055c0987e716a93ac01f3c0a97c1280421443cd6b21e0e71d763d14"
strip_components = 1
description = "FUSE Interface for KIO"
homepage = "https://invent.kde.org/system/kio-fuse"
license = "GPL-2.0-or-later, LGPL-2.0-or-later"
deps = ["extra-cmake-modules", "fuse3", "kf6-kcoreaddons", "kf6-kio", "qt6-base"]

[build]
system = "cmake"
configure_args = ["-DQT_MAJOR_VERSION=6", "-DBUILD_WITH_QT6=ON"]
tools = ["pkg-config"]
deps = ["kf6-kconfig"]

# Imported from Void Linux's template for 'audacious-base'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, pre_configure
# needs, but Forge has no recipe for yet: dbus-glib, hicolor-icon-theme
[package]
name = "audacious-base"
version = "4.6.2"
archive = "https://github.com/audacious-media-player/audacious/archive/refs/tags/audacious-4.6.2.tar.gz"
sha256 = "9ff186bfc5d78af79ea5778050cd9b2dcd451525051bd42a169ae732c6bd9624"
strip_components = 1
description = "Lightweight, advanced audio player focused on audio quality"
homepage = "https://audacious-media-player.org/"
license = "BSD-2-Clause"
deps = ["desktop-file-utils", "libSM", "libarchive", "libguess"]

[build]
system = "meson"
configure_args = ["-Dlibarchive=true", "-Dbuildstamp=xbps"]
tools = ["pkg-config"]
deps = ["gettext", "glib"]

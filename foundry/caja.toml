# Imported from Void Linux's template for 'caja'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: itstool
[package]
name = "caja"
version = "1.28.0"
archive = "https://pub.mate-desktop.org/releases/1.28/caja-1.28.0.tar.xz"
sha256 = "1e3014ce1455817ec2ef74d09efdfb6835d8a372ed9a16efb5919ef7b821957a"
strip_components = 1
description = "MATE shell and file manager"
homepage = "https://mate-desktop.org"
license = "GPL-2.0-or-later"
deps = ["dbus", "exempi", "gdk-pixbuf", "glib", "gtk+3", "gtk-layer-shell", "gvfs", "libX11", "libXt", "libexif", "libnotify", "libxml2", "mate-desktop", "mate-icon-theme", "pango", "wayland"]

[build]
system = "autotools"
configure_args = ["--disable-static", "--disable-packagekit", "--disable-schemas-compile", "--disable-update-mimedb", "--disable-self-check", "--enable-wayland", "ac_cv_lib_selinux_is_selinux_enabled=no", "ac_cv_strftime_extensions=yes"]
tools = ["pkg-config"]
deps = ["gettext", "gobject-introspection"]

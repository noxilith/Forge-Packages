# Imported from Void Linux's template for 'usbutils'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: hwids
[package]
name = "usbutils"
version = "019"
archive = "https://www.kernel.org/pub/linux/utils/usb/usbutils/usbutils-019.tar.xz"
sha256 = "659f40c440e31ba865c52c818a33d3ba6a97349e3353f8b1985179cb2aa71ec5"
strip_components = 1
description = "Linux USB utilities"
homepage = "https://github.com/gregkh/usbutils"
license = "GPL-2.0-only"
deps = ["eudev", "libusb"]

[build]
system = "meson"
tools = ["pkg-config"]

# Imported from Void Linux's template for 'ktouch'. Review before relying on it.
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "ktouch"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/ktouch-26.08.1.tar.xz"
sha256 = "262d9374dbf2a4407db7af780f734e8d91fc2005424a24af6db1a2dd8b8a05f7"
strip_components = 1
description = "Learn and practive touch typing"
homepage = "https://apps.kde.org/ktouch"
license = "GPL-2.0-or-later"
deps = ["kf6-kcmutils", "kf6-kcompletion", "kf6-kconfig", "kf6-kconfigwidgets", "kf6-kcoreaddons", "kf6-ki18n", "kf6-kirigami", "kf6-kitemviews", "kf6-ktextwidgets", "kf6-kwidgetsaddons", "kf6-kwindowsystem", "kf6-kxmlgui", "kqtquickcharts", "libxkbfile", "libxml2", "qt6-base", "qt6-declarative"]

[build]
system = "cmake"
configure_args = ["-DWITHOUT_X11=OFF"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "gettext", "kf6-kdoctools"]

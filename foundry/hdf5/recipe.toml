# Imported from Void Linux's template for 'hdf5'. Review before relying on it.
# hooks not translated: post_install, pre_configure
[package]
name = "hdf5"
version = "1.14.6"
archive = "https://github.com/HDFGroup/hdf5/archive/refs/tags/hdf5_1.14.6.tar.gz"
sha256 = "09ee1c671a87401a5201c06106650f62badeea5a3b3941e9b1e2e1e08317357f"

deps = ["zlib"]
patches = ["patches/0af668f4091f1c35f621d2acdeadd34db6756976.patch", "patches/workaround-broken-test-i686.patch"]

[build]
system = "autotools"
configure_args = ["--enable-cxx"]
tools = ["perl"]

# Imported from Void Linux's template for 'kconfig'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: qt5
[package]
name = "kconfig"
version = "5.116.0"
archive = "https://download.kde.org/stable/frameworks/5.116/kconfig-5.116.0.tar.xz"
sha256 = "2c5de3609273aa167a5c49be42470a3bf87d70fc8565ba6cee3717c00067470e"
strip_components = 1
description = "KDE Persistent platform-independent application settings"
homepage = "https://invent.kde.org/frameworks/kconfig"
license = "LGPL-2.0-only, LGPL-2.0-or-later, LGPL-2.1-or-later"
patches = ["patches/add-crossbuild-support-for-its-tools.patch"]

[build]
system = "cmake"
deps = ["extra-cmake-modules", "kcoreaddons"]

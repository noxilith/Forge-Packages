# Imported from Void Linux's template for 'gnupg1'. Review before relying on it.
# hooks not translated: post_extract, post_install, pre_configure
# settings not translated: CFLAGS
# needs, but Forge has no recipe for yet: bzip2, libreadline8
[package]
name = "gnupg1"
version = "1.4.23"
archive = "https://www.gnupg.org/ftp/gcrypt/gnupg/gnupg-1.4.23.tar.bz2"
sha256 = "c9462f17e651b6507848c08c430c791287cd75491f8b5a8b50c6ed46b12678ba"
strip_components = 1
description = "GNU Privacy Guard v1"
homepage = "https://www.gnupg.org/"
license = "GPL-3.0-or-later"
deps = ["curl", "libusb-compat", "openldap", "zlib"]
patches = ["patches/0001-avoid-looking-for-git-info-during-autoreconf.patch", "patches/0003-change-package-name-to-gnupg1.patch", "patches/0004-doc-Enable-SOURCE_DATE_EPOCH-for-reproducibility.patch", "patches/0005-gpg-Change-default-digest-algorithm-to-SHA256.patch"]

[build]
system = "autotools"
configure_args = ["--enable-threads=posix", "--enable-noexecstack", "gnupg_cv_regex_broken=no"]
deps = ["gettext"]

# Imported from Void Linux's template for 'virt-viewer'. Review before relying on it.
# needs, but Forge has no recipe for yet: libvirt-glib
[package]
name = "virt-viewer"
version = "11.0"
archive = "https://releases.pagure.org/virt-viewer/virt-viewer-11.0.tar.xz"
sha256 = "a43fa2325c4c1c77a5c8c98065ac30ef0511a21ac98e590f22340869bad9abd0"
strip_components = 1
description = "Tool for displaying the graphical console of a virtual machine"
homepage = "https://virt-manager.org/"
license = "GPL-2.0-or-later"
deps = ["gtk-vnc", "spice-gtk", "vte3"]
patches = ["patches/meson-0.61.patch"]

[build]
system = "meson"
tools = ["perl", "pkg-config"]
deps = ["bash-completion", "gettext", "glib"]

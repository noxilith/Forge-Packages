# Imported from Void Linux's template for 'lxqt-wayland-session'. Review before relying on it.
# needs, but Forge has no recipe for yet: qt6-tools, xdg-user-dirs
[package]
name = "lxqt-wayland-session"
version = "0.4.0"
archive = "https://github.com/lxqt/lxqt-wayland-session/archive/0.4.0.tar.gz"
sha256 = "caabe1eb1b948d9da460068679ffa64453a7997c256f4a8ff2b8fa8fe21dee34"
strip_components = 1
description = "Files needed for the LXQt Wayland Session"
homepage = "https://github.com/lxqt/lxqt-wayland-session"
license = """
LGPL-2.1-only, GPL-2.0-only, GPL-3.0-only, GPL-3.0-or-later,
 BSD-3-Clause, CC-BY-SA-4.0, MIT"""
deps = ["layer-shell-qt", "liblxqt", "lxqt-session", "qtxdg-tools"]

[build]
system = "cmake"
tools = ["perl", "pkg-config"]
deps = ["lxqt-build-tools", "qt6-base"]

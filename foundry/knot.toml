# Imported from Void Linux's template for 'knot'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# settings not translated: make_dirs, conf_files
# needs, but Forge has no recipe for yet: lmdb
[package]
name = "knot"
version = "3.6.2"
archive = "https://secure.nic.cz/files/knot-dns/knot-3.6.2.tar.xz"
sha256 = "2916ac117ac77d1f2341a6562e47d797493521b791b414960a382cb5bc113e21"
strip_components = 1
description = "High-performance authoritative-only DNS server"
homepage = "https://www.knot-dns.cz/"
license = "GPL-2.0-or-later"
deps = ["fstrm", "gnutls", "libcap-ng", "libedit", "libmaxminddb", "liburcu", "nghttp2", "protobuf-c"]

[build]
system = "autotools"
configure_args = ["--disable-silent-rules", "--enable-dnstap", "--enable-fastparser", "--with-module-dnstap=yes"]
tools = ["pkg-config"]

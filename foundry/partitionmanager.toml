# Imported from Void Linux's template for 'partitionmanager'. Review before relying on it.
# needs, but Forge has no recipe for yet: hicolor-icon-theme
[package]
name = "partitionmanager"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/partitionmanager-26.08.1.tar.xz"
sha256 = "acbdb57638d75f47b6f07d6ead12af370d3f538858d74523a673548cec771110"
strip_components = 1
description = "KDE utility that allows you to manage disks"
homepage = "https://apps.kde.org/partitionmanager"
license = "GPL-3.0-or-later"
deps = ["kf6-kconfig", "kf6-kconfigwidgets", "kf6-kcrash", "kf6-kdbusaddons", "kf6-kdoctools", "kf6-kiconthemes", "kf6-kio", "kf6-kservice", "kf6-kxmlgui", "kpmcore", "qt6-base"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "gettext", "kf6-kcoreaddons"]

# Imported from Void Linux's template for 'libkml'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: boost
[package]
name = "libkml"
version = "1.3.0"
archive = "https://github.com/libkml/libkml/archive/1.3.0.tar.gz"
sha256 = "8892439e5570091965aaffe30b08631fdf7ca7f81f6495b4648f0950d7ea7963"
strip_components = 1
description = "Library to manipulate KML OGC files"
homepage = "https://github.com/libkml/libkml"
license = "BSD-3-Clause"
deps = ["expat", "minizip", "uriparser", "zlib"]
patches = ["patches/NOUNCRYPT.patch"]

[build]
system = "cmake"

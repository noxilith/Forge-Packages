# Imported from Void Linux's template for 'kalarm'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "kalarm"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/kalarm-26.08.1.tar.xz"
sha256 = "5ea59c5ed126768b90cef9da7370d32e02f097e5e2e2140456734bd150dc5ac9"
strip_components = 1
description = "Personal alarm scheduler"
homepage = "https://www.kde.org/applications/utilities/kalarm"
license = "GPL-2.0-or-later"
deps = ["akonadi-contacts", "akonadi-mime", "kcalutils", "kf6-akonadi", "kf6-kauth", "kf6-kcalendarcore", "kf6-kcodecs", "kf6-kcompletion", "kf6-kconfig", "kf6-kconfigwidgets", "kf6-kcontacts", "kf6-kcrash", "kf6-kdbusaddons", "kf6-kglobalaccel", "kf6-kguiaddons", "kf6-kholidays", "kf6-ki18n", "kf6-kiconthemes", "kf6-kio", "kf6-kitemmodels", "kf6-kjobwidgets", "kf6-kmime", "kf6-knotifications", "kf6-knotifyconfig", "kf6-kservice", "kf6-kstatusnotifieritem", "kf6-ktextwidgets", "kf6-kwidgetsaddons", "kf6-kwindowsystem", "kf6-kxmlgui", "kidentitymanagement", "libkdepim", "mailcommon", "messagelib", "mpv", "vlc"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "gettext", "kf6-kdoctools", "libxslt", "qt6-base"]

# Imported from Void Linux's template for 'lightdm'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# settings not translated: build_helper, make_dirs, conf_files
# needs, but Forge has no recipe for yet: dbus-glib, intltool, itstool, qt5
[package]
name = "lightdm"
version = "1.32.0"
archive = "https://github.com/CanonicalLtd/lightdm/releases/download/1.32.0/lightdm-1.32.0.tar.xz"
sha256 = "12f5ab432748f0387c7cf8b94430495a558a035a4f8465e5181af6faff133e4b"
strip_components = 1
description = "Light Display Manager"
homepage = "https://github.com/CanonicalLtd/lightdm"
license = "GPL-3.0-or-later, LGPL-2.0-or-later"
deps = ["accountsservice", "dbus", "gtk+3", "libXdmcp", "libgcrypt", "libxcb", "libxklavier", "libxml2", "pam", "vala"]
patches = ["patches/1.32.0--adjust-PATH-for-usrmerge.patch", "patches/minimum-uid-is-1000.patch", "patches/musl-language.patch", "patches/musl-updwtmpx.patch", "patches/pam-modules.patch"]

[build]
system = "autotools"
configure_args = ["--with-greeter-session=lightdm-gtk-greeter", "--with-greeter-user=lightdm", "--disable-static", "--disable-tests"]
tools = ["pkg-config"]

# Imported from Void Linux's template for 'gnupg'. Review before relying on it.
# 5 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_extract, post_install
# settings not translated: configure_script
# needs, but Forge has no recipe for yet: bzip2, sqlite
[package]
name = "gnupg"
version = "2.5.24"
archive = "https://gnupg.org/ftp/gcrypt/gnupg/gnupg-2.5.24.tar.bz2"
sha256 = "bf149d01a2b9fcc0e4589b8ae8697d3d5c557ea48ed95a3fa55dd3b1187e6039"
strip_components = 1
description = "GNU Privacy Guard (2.x)"
homepage = "https://www.gnupg.org/"
license = "GPL-3.0-or-later"
deps = ["curl", "gnutls", "libassuan", "libgcrypt", "libgpg-error", "libksba", "libusb-compat", "npth", "openldap", "pinentry", "tpm2-tss"]
patches = ["patches/0002-Revert-gpg-Merge-rfc4880bis-features-into-gnupg.patch"]

[build]
system = "autotools"
configure_args = ["--enable-all-tests", "--enable-gnupg-builddir-envvar"]
subdir = "build"
tools = ["pkg-config"]
deps = ["gettext"]

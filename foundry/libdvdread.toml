# Imported from Void Linux's template for 'libdvdread'. Review before relying on it.
[package]
name = "libdvdread"
version = "7.0.1"
archive = "https://get.videolan.org/libdvdread/7.0.1/libdvdread-7.0.1.tar.xz"
sha256 = "2e3e04a305c15c3963aa03ae1b9a83c1d239880003fcf3dde986d3943355d407"
strip_components = 1
description = "DVD access library"
homepage = "https://www.videolan.org/developers/libdvdnav.html"
license = "GPL-2.0-or-later, LGPL-2.1-or-later"
deps = ["libdvdcss"]

[build]
system = "meson"
configure_args = ["-Dlibdvdcss=enabled"]
tools = ["pkg-config"]

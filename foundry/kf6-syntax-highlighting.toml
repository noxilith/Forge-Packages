# Imported from Void Linux's template for 'kf6-syntax-highlighting'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: kf6-base, qt6-tools, xerces-c
[package]
name = "kf6-syntax-highlighting"
version = "6.30.0"
archive = "https://download.kde.org/stable/frameworks/6.30/syntax-highlighting-6.30.0.tar.xz"
sha256 = "fc429b093058bec4878306cbbfb3aa0560ff4a3f166c69504036c507fe72afcc"
strip_components = 1
description = "Syntax highlighting Engine for Structured Text and Code"
homepage = "https://invent.kde.org/frameworks/syntax-highlighting"
license = "LGPL-2.1-or-later"
deps = ["qt6-base", "qt6-declarative"]

[build]
system = "cmake"
configure_args = ["-DKDE_INSTALL_QMLDIR=lib/qt6/qml", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
tools = ["perl"]
deps = ["extra-cmake-modules"]

# Imported from Void Linux's template for 'kf6-kguiaddons'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: kf6-base, qt6-tools
[package]
name = "kf6-kguiaddons"
version = "6.30.0"
archive = "https://download.kde.org/stable/frameworks/6.30/kguiaddons-6.30.0.tar.xz"
sha256 = "e98864228d1c5e23f3428025eb9928697374fdc3eddebb3a9dec570de028a62d"
strip_components = 1
description = "Addons to QtGui"
homepage = "https://invent.kde.org/frameworks/kguiaddons"
license = "LGPL-2.1-or-later"
deps = ["plasma-wayland-protocols", "qt6-base", "qt6-declarative", "wayland"]

[build]
system = "cmake"
configure_args = ["-DKDE_INSTALL_QMLDIR=lib/qt6/qml", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QTMETATYPESDIR=lib/qt6/metatypes"]
deps = ["extra-cmake-modules"]

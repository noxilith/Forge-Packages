# Imported from Void Linux's template for 'libkexiv2'. Review before relying on it.
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "libkexiv2"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/libkexiv2-26.08.1.tar.xz"
sha256 = "d50cc3e641d1d9dd6a0f2ea5cd8e0e210e7386f11ba2729b0ade2785400b0e31"
strip_components = 1
description = "Library to manipulate pictures metadata"
homepage = "https://invent.kde.org/graphics/libkexiv2"
license = "GPL-2.0-or-later"
deps = ["exiv2", "qt6-base"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DQT_MAJOR_VERSION=6"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules"]

# Imported from Void Linux's template for 'colord-gtk'. Review before relying on it.
# 3 configure argument(s) left out (computed values or paths outside the package)
# settings not translated: build_helper
[package]
name = "colord-gtk"
version = "0.3.0"
archive = "https://www.freedesktop.org/software/colord/releases/colord-gtk-0.3.0.tar.xz"
sha256 = "b9466656d66d9a6ffbc2dd04fa91c8f6af516bf9efaacb69744eec0f56f3c1d0"
strip_components = 1
description = "GTK support library for colord"
homepage = "https://github.com/hughsie/colord-gtk"
license = "LGPL-2.1-or-later"
deps = ["colord", "gtk+3", "gtk4"]

[build]
system = "meson"
configure_args = ["-Dtests=false"]
tools = ["pkg-config"]
deps = ["gettext", "glib", "libxslt"]

# Imported from Void Linux's template for 'sysprof'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: itstool
[package]
name = "sysprof"
version = "47.2"
archive = "https://download.gnome.org/sources/sysprof/47/sysprof-47.2.tar.xz"
sha256 = "e4b5ede9fd978ec3f0d5a0d44d0429a6d201c362bf6cb4527319031ae462c54f"
strip_components = 1
description = "System-wide profiler for Linux"
homepage = "https://gitlab.gnome.org/GNOME/sysprof"
license = "GPL-2.0-or-later, GPL-3.0-or-later"
deps = ["gtk4", "json-glib", "libadwaita", "libdex", "libpanel", "libunwind", "polkit"]
patches = ["patches/musl-missing-include.patch"]

[build]
system = "meson"
configure_args = ["-Dgtk=true", "-Db_lto=false"]
tools = ["pkg-config"]
deps = ["desktop-file-utils", "gettext", "glib"]

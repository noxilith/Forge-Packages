# Imported from Void Linux's template for 'gnome-icon-theme'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: icon-naming-utils, intltool
[package]
name = "gnome-icon-theme"
version = "3.12.0"
archive = "https://download.gnome.org/sources/gnome-icon-theme/3.12/gnome-icon-theme-3.12.0.tar.xz"
sha256 = "359e720b9202d3aba8d477752c4cd11eced368182281d51ffd64c8572b4e503a"
strip_components = 1
description = "Theme consisting of a set of icons for GNOME"
homepage = "http://www.gnome.org"
license = "GPL-2.0-or-later"

[build]
system = "autotools"
configure_args = ["--enable-icon-mapping"]
tools = ["pkg-config"]
deps = ["gtk+3", "librsvg"]

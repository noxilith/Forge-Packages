# Imported from Void Linux's template for 'eventviews'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "eventviews"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/eventviews-26.08.1.tar.xz"
sha256 = "6e8fed1a2cbfab0ac10d9b6f5c086060de33435c99d3f34c7437386e8f49ebe2"
strip_components = 1
description = "Library for creating events"
homepage = "https://community.kde.org/KDE_PIM"
license = "GPL-2.0-or-later"
deps = ["calendarsupport", "kdiagram6"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "gettext", "kf6-kconfig", "kf6-kcoreaddons", "qt6-base"]

# Imported from Void Linux's template for 'cclive'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# settings not translated: CPPFLAGS
# needs, but Forge has no recipe for yet: boost
[package]
name = "cclive"
version = "0.9.3"
archive = "https://downloads.sourceforge.net/sourceforge/cclive/cclive-0.9.3.tar.xz"
sha256 = "2edeaf5d76455723577e0b593f0322a97f1e0c8b0cffcc70eca8b5d17374a495"
strip_components = 1
description = "Commandline downloader for popular video websites"
homepage = "https://cclive.sourceforge.net/"
license = "AGPL-3.0-or-later"
deps = ["curl", "glibmm", "libquvi", "pcre"]
patches = ["patches/fix-boost-067.patch", "patches/fix-missing-iostream-includes.patch", "patches/musl-strerror_r.patch"]

[build]
system = "autotools"
configure_args = ["boost_cv_lib_system=-lc"]
tools = ["pkg-config"]

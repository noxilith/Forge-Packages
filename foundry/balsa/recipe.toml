# Imported from Void Linux's template for 'balsa'. Review before relying on it.
# needs, but Forge has no recipe for yet: hicolor-icon-theme, libwebkit2gtk41, sqlite
[package]
name = "balsa"
version = "2.6.4"
archive = "https://pawsa.fedorapeople.org/balsa/balsa-2.6.4.tar.xz"
sha256 = "befa5984511db33d41f2b1ecbfc99e22a15d45d08efe5d737b5174a1a6ac8fc1"
strip_components = 1
description = "Email client for GNOME"
homepage = "https://pawsa.fedorapeople.org/balsa/"
license = "GPL-2.0-or-later"
deps = ["desktop-file-utils", "gmime", "gnutls", "gpgme", "gspell", "iso-codes", "libesmtp", "libical", "libnotify", "libsecret"]
patches = ["patches/gtk-iconcache.patch", "patches/libwebkit2gtk41.patch", "patches/path.patch", "patches/portability.patch"]

[build]
system = "meson"
configure_args = ["-Dlibsecret=true", "-Dsqlite=true", "-Dhtml-widget=webkit2", "-Dspell-checker=gspell"]
tools = ["pkg-config"]
deps = ["gettext", "glib"]

# Imported from Void Linux's template for 'libgeotiff'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: sqlite
[package]
name = "libgeotiff"
version = "1.7.4"
archive = "https://github.com/OSGeo/libgeotiff/releases/download/1.7.4/libgeotiff-1.7.4.tar.gz"
sha256 = "c598d04fdf2ba25c4352844dafa81dde3f7fd968daa7ad131228cd91e9d3dc47"
strip_components = 1
description = "TIFF based interchange format for georeferenced raster imagery"
homepage = "https://github.com/OSGeo/libgeotiff"
license = "MIT"
deps = ["proj", "tiff"]

[build]
system = "cmake"
configure_args = ["-DBUILD_SHARED_LIBS=ON", "-DCMAKE_INSTALL_DOCDIR=share/doc/libgeotiff"]
tools = ["pkg-config"]

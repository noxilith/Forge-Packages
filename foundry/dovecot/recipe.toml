# Imported from Void Linux's template for 'dovecot'. Review before relying on it.
# 3 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: bzip2, ca-certificates, lua54, mit-krb5, snowball, sqlite
[package]
name = "dovecot"
version = "2.4.5"
archive = "https://dovecot.org/releases/2.4/dovecot-2.4.5.tar.gz"
sha256 = "868c2686a61b5f8e00a3e4721789b1ab46e6528fd773a5fbed07a6ecba7731e6"
strip_components = 1
description = "IMAP and POP3 server written with security primarily in mind"
homepage = "https://dovecot.org/"
license = "LGPL-2.1-or-later"
deps = ["curl", "expat", "libcap", "libsodium", "lz4", "mariadb", "openldap", "openssl", "pam", "pcre2", "postgresql18", "xapian-core", "xz", "zlib"]
patches = ["patches/mkcert-ssldir.patch", "patches/system-account.patch"]

[build]
system = "autotools"
configure_args = ["--with-sql=plugin", "--disable-static", "--with-pam", "--with-mysql", "--with-pgsql", "--with-sqlite", "--with-ssl=openssl", "--with-gssapi", "--with-ldap=plugin", "--with-bzlib", "--with-lz4", "--with-libcap", "--with-stemmer", "--with-solr", "--with-flatcurve"]
tools = ["perl", "pkg-config"]

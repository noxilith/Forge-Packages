# Imported from Void Linux's template for 'libksieve'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-location, qt6-tools, qt6-webchannel
[package]
name = "libksieve"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/libksieve-26.08.1.tar.xz"
sha256 = "6e9629c4aae301fb2cfd8d5c383c647bb33a04d0e983dcd4fae8964d5ad67ed6"
strip_components = 1
description = "KDE PIM library for managing sieves"
homepage = "https://community.kde.org/KDE_PIM"
license = "GPL-2.0-or-later, LGPL-2.1-or-later"
deps = ["kidentitymanagement", "kmailtransport", "pimcommon", "qt6-pdf"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "gettext", "kf6-kconfig", "kf6-kcoreaddons", "kf6-kdoctools", "qt6-base"]

# Imported from Void Linux's template for 'drawy'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-tools, zstd
[package]
name = "drawy"
version = "1.0.2"
archive = "https://download.kde.org/stable/drawy/1.0.2/drawy-1.0.2.tar.xz"
sha256 = "5ffaddefa967a6dad6f904c87ff85084c9013f5d1a0a0d87665759880d7c6d6f"
strip_components = 1
description = "Handy, infinite brainstorming tool"
homepage = "https://apps.kde.org/drawy/"
license = "GPL-3.0-or-later"
deps = ["kf6-kcrash", "kf6-kdoctools", "kf6-ki18n", "kf6-kiconthemes", "kf6-kxmlgui", "kf6-syntax-highlighting"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "gettext", "kf6-kconfig", "kf6-kcoreaddons", "qt6-base"]

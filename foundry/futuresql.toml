# Imported from Void Linux's template for 'futuresql'. Review before relying on it.
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "futuresql"
version = "0.1.1"
archive = "https://download.kde.org/stable/futuresql/futuresql-0.1.1.tar.xz"
sha256 = "e44ed8d5a9618b3ca7ba2983ed9c5f7572e6e0a5b199f94868834b71ccbebd43"
strip_components = 1
description = "Non-blocking Qt database framework"
homepage = "https://invent.kde.org/libraries/futuresql"
license = "LGPL-2.1-or-later"
deps = ["qt6-base"]

[build]
system = "cmake"
configure_args = ["-DQT_MAJOR_VERSION=6", "-DBUILD_TESTING=OFF"]
deps = ["extra-cmake-modules"]

# Imported from Void Linux's template for 'libopenshot-audio'. Review before relying on it.
# needs, but Forge has no recipe for yet: doxygen
[package]
name = "libopenshot-audio"
version = "0.4.0"
archive = "https://github.com/OpenShot/libopenshot-audio/archive/v0.4.0.tar.gz"
sha256 = "1abdedf9c8686c972c42225a283f518ed2ade445c2e454996b6709d8cc8d1704"
strip_components = 1
description = "OpenShot audio library"
homepage = "https://github.com/OpenShot/libopenshot-audio"
license = "GPL-3.0-or-later"
deps = ["alsa-lib", "libXcursor", "libXinerama", "libXrandr", "xorg-server", "zlib"]
patches = ["patches/0001-Fix-musl-compilation-error-related-to-LFS64.patch", "patches/fix-musl.patch"]

[build]
system = "cmake"

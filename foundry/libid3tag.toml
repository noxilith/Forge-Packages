[package]
name = "libid3tag"
version = "0.16.4"
archive = "https://codeberg.org/tenacityteam/libid3tag/archive/0.16.4.tar.gz"
sha256 = "ceb88ada1aa867c87c1d748a8aa40e68db5b0d2df636a9dab0ab1f7741d5e009"

# Imported from Void Linux's template for 'potrace'. Review before relying on it.
[package]
name = "potrace"
version = "1.16"
archive = "https://downloads.sourceforge.net/sourceforge/potrace/potrace-1.16.tar.gz"
sha256 = "be8248a17dedd6ccbaab2fcc45835bb0502d062e40fbded3bc56028ce5eb7acc"

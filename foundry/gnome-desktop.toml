# Imported from Void Linux's template for 'gnome-desktop'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: itstool
[package]
name = "gnome-desktop"
version = "44.3"
archive = "https://download.gnome.org/sources/gnome-desktop/44/gnome-desktop-44.3.tar.xz"
sha256 = "40efa9aa8d50effed9227a3d70671e32e9dc35e20f331cab3b562975978f4f8d"
strip_components = 1
description = "GNOME desktop management utilities"
homepage = "https://gitlab.gnome.org/GNOME/gnome-desktop"
license = "GPL-2.0-or-later, LGPL-2.1-or-later"
deps = ["bubblewrap", "eudev", "gdk-pixbuf", "glib", "gsettings-desktop-schemas", "gtk+3", "gtk4", "iso-codes", "libX11", "libXext", "libXrandr", "libseccomp", "libxkbfile", "xkeyboard-config"]

[build]
system = "meson"
configure_args = ["-Dudev=enabled", "-Dsystemd=disabled"]
tools = ["pkg-config"]
deps = ["gettext"]

# Imported from Void Linux's template for 'gtksourceview4'. Review before relying on it.
# 3 configure argument(s) left out (computed values or paths outside the package)
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: itstool
[package]
name = "gtksourceview4"
version = "4.8.4"
archive = "https://download.gnome.org/sources/gtksourceview/4.8/gtksourceview-4.8.4.tar.xz"
sha256 = "7ec9d18fb283d1f84a3a3eff3b7a72b09a10c9c006597b3fbabbb5958420a87d"
strip_components = 1
description = "Text widget that extends GTK+ GtkTextView widget"
homepage = "https://wiki.gnome.org/Projects/GtkSourceView"
license = "GPL-2.0-or-later"
deps = ["glade3", "glib", "gtk+3", "libxml2"]

[build]
system = "meson"
configure_args = ["-Dglade_catalog=true"]
tools = ["pkg-config"]
deps = ["gettext", "libxslt"]

# Imported from Void Linux's template for 'bluez-alsa'. Review before relying on it.
# hooks not translated: post_install, pre_configure
# needs, but Forge has no recipe for yet: python3-docutils
[package]
name = "bluez-alsa"
version = "3.1.0"
archive = "https://github.com/Arkq/bluez-alsa/archive/v3.1.0.tar.gz"
sha256 = "d9a878d9fd7f18842c9c8ed83bc96cab684753c90f2751d575a3cdd776ec78a5"
strip_components = 1
description = "Bluetooth Audio ALSA Backend"
homepage = "https://github.com/Arkq/bluez-alsa"
license = "MIT"
deps = ["alsa-lib", "bluez", "fdk-aac", "glib", "libopenaptx", "sbc"]

[build]
system = "autotools"
configure_args = ["--enable-aac", "--enable-aptx", "--with-libopenaptx", "--enable-manpages", "--disable-debug", "--disable-hcitop"]
tools = ["pkg-config"]

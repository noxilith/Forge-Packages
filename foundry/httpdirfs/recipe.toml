# Imported from Void Linux's template for 'httpdirfs'. Review before relying on it.
# hooks not translated: post_build
# settings not translated: CFLAGS
# needs, but Forge has no recipe for yet: util-linux-common
[package]
name = "httpdirfs"
version = "1.2.5"
archive = "https://github.com/fangfufu/httpdirfs/archive/refs/tags/1.2.5.tar.gz"
sha256 = "d0a85600c3813064ba3cad9491b66fcf458151a49d3926818f5458ab6f615038"
strip_components = 1
description = "Mount HTTP directory listings, with a permanent cache"
homepage = "https://github.com/fangfufu/httpdirfs"
license = "GPL-3.0-only"
deps = ["curl", "expat", "fuse", "gumbo-parser"]
patches = ["patches/musl.patch"]

[build]
system = "make"
tools = ["pkg-config"]
deps = ["help2man"]

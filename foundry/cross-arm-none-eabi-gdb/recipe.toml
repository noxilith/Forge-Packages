# Imported from Void Linux's template for 'cross-arm-none-eabi-gdb'. Review before relying on it.
# 3 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: libreadline8, mpfr, ncurses
[package]
name = "cross-arm-none-eabi-gdb"
version = "15.2"
archive = "https://ftp.gnu.org/gnu/gdb/gdb-15.2.tar.xz"
sha256 = "83350ccd35b5b5a0cba6b334c41294ea968158c573940904f00b92f76345314d"
strip_components = 1
description = "GNU Debugger for ARM"
homepage = "https://www.gnu.org/software/gdb"
license = "GPL-3.0-or-later"
deps = ["babeltrace", "expat", "gdb", "gmp", "zlib"]
patches = ["patches/gdb-mips-linux-nat.patch"]

[build]
system = "autotools"
configure_args = ["--target=arm-none-eabi", "--disable-werror", "--disable-nls", "--with-system-readline", "--with-system-zlib", "--without-isl"]
tools = ["pkg-config"]
deps = ["texinfo"]

# Imported from Void Linux's template for 'kf6-kiconthemes'. Review before relying on it.
# needs, but Forge has no recipe for yet: kf6-base, qt6-svg, qt6-tools
[package]
name = "kf6-kiconthemes"
version = "6.30.0"
archive = "https://download.kde.org/stable/frameworks/6.30/kiconthemes-6.30.0.tar.xz"
sha256 = "c0c684823d0e087f35168cd79f1053fd358bb8fb47b27996a11c7d7ee3da6f4d"
strip_components = 1
description = "KDE Icon GUI utilities"
homepage = "https://invent.kde.org/frameworks/kiconthemes"
license = "LGPL-2.1-or-later"
deps = ["breeze-icons", "kf6-karchive", "kf6-kcolorscheme", "kf6-kconfigwidgets", "kf6-ki18n", "kf6-kwidgetsaddons", "qt6-base"]

[build]
system = "cmake"
configure_args = ["-DKDE_INSTALL_QMLDIR=lib/qt6/qml", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
deps = ["extra-cmake-modules", "gettext", "kf6-kconfig", "qt6-declarative"]

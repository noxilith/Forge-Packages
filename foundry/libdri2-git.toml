# Imported from Void Linux's template for 'libdri2-git'. Review before relying on it.
# hooks not translated: post_install, pre_configure
[package]
name = "libdri2-git"
version = "20140317"
archive = "https://github.com/robclark/libdri2/archive/4f1eef3183df2b270c3d5cbef07343ee5127a6a4.tar.gz"
sha256 = "7c427f5c3fbda3d1df1dc77129e87605f4af1f3ad2adf2653c560d1703aa4395"
strip_components = 1
description = "Library for the DRI2 extension to the X Window System"
homepage = "https://github.com/robclark/libdri2"

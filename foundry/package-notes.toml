# Imported from Void Linux's template for 'package-notes'. Review before relying on it.
# needs, but Forge has no recipe for yet: python3-pyelftools
[package]
name = "package-notes"
version = "0.20"
archive = "https://github.com/systemd/package-notes/archive/refs/tags/v0.20.tar.gz"
sha256 = "d3251dfcb03467c3ae71a7d248e24fa264d49c61c54be7c8f07e18bedf4e04d5"

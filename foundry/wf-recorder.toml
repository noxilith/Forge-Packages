# Imported from Void Linux's template for 'wf-recorder'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: ffmpeg6, mesa
[package]
name = "wf-recorder"
version = "0.6.0"
archive = "https://github.com/ammen99/wf-recorder/archive/v0.6.0.tar.gz"
sha256 = "52d2c952506d63708f9a8f1aacd4d6ca176287caf3507c8ff2882fa0390cb391"
strip_components = 1
description = "Screen recorder for wlroots-based compositors"
homepage = "https://github.com/ammen99/wf-recorder"
license = "MIT"
deps = ["libdrm", "pipewire", "pulseaudio", "wayland", "wayland-protocols", "x264"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["scdoc"]

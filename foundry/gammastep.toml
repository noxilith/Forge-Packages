# Imported from Void Linux's template for 'gammastep'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: pre_configure
# needs, but Forge has no recipe for yet: intltool
[package]
name = "gammastep"
version = "2.0.11"
archive = "https://gitlab.com/chinstrap/gammastep/-/archive/v2.0.11/gammastep-v2.0.11.tar.gz"
sha256 = "e16026b8f21d5e02cfe7cd2f738c80f150c1f06a098e5e47e0fc088244a763bd"
strip_components = 1
description = "Adjusts the color temperature of your screen to your surroundings"
homepage = "https://gitlab.com/chinstrap/gammastep"
license = "GPL-3.0-or-later"
deps = ["libXxf86vm", "libdrm", "wayland"]

[build]
system = "autotools"
configure_args = ["--enable-gui", "--enable-drm", "--enable-vidmode", "--enable-randr", "--enable-wayland", "--enable-apparmor", "--with-systemduserunitdir=no"]
tools = ["pkg-config"]
deps = ["gettext", "tar"]

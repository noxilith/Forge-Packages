# Imported from Void Linux's template for 'capstone'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: python3-packaging-bootstrap, python3-setuptools
[package]
name = "capstone"
version = "5.0.9"
archive = "https://github.com/aquynh/capstone/archive/5.0.9.tar.gz"
sha256 = "0619da31af08152600af95c481527ef6d756c0a8404fca7544a4fdf6dfc2c0f9"
strip_components = 1
description = "Lightweight multi-platform, multi-architecture disassembly framework"

# Imported from Void Linux's template for 'xf86-video-ati'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: CFLAGS, LDFLAGS, lib32disabled
# needs, but Forge has no recipe for yet: mesa
[package]
name = "xf86-video-ati"
version = "22.0.0"
archive = "https://www.x.org/releases/individual/driver/xf86-video-ati-22.0.0.tar.gz"
sha256 = "75f2d4ed4d1041ae9eb2a11816b919e18aee9a25db1556b3d938fff31d3c86f3"
strip_components = 1
description = "Xorg ATI Radeon video driver"
homepage = "https://wiki.freedesktop.org/xorg"
license = "MIT"
deps = ["eudev", "libdrm", "libpciaccess", "pixman", "xorg-server", "xorgproto"]

[build]
system = "autotools"
tools = ["pkg-config"]

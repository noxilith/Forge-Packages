# Imported from Void Linux's template for 'libqaccessibilityclient'. Review before relying on it.
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "libqaccessibilityclient"
version = "0.6.0"
archive = "https://download.kde.org/stable/libqaccessibilityclient/libqaccessibilityclient-0.6.0.tar.xz"
sha256 = "4c50c448622dc9c5041ed10da7d87b3e4e71ccb49d4831a849211d423c5f5d33"
strip_components = 1
description = "Library for accessibility clients such as screen readers"
homepage = "https://phabricator.kde.org/source/libqaccessibilityclient/"
license = "LGPL-2.1-or-later"
deps = ["qt6-base"]

[build]
system = "cmake"
configure_args = ["-DBUILD_WITH_QT6=ON"]
deps = ["extra-cmake-modules"]

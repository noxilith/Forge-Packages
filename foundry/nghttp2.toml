# Imported from Void Linux's template for 'nghttp2'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: libev
[package]
name = "nghttp2"
version = "1.70.0"
archive = "https://github.com/nghttp2/nghttp2/releases/download/v1.70.0/nghttp2-1.70.0.tar.xz"
sha256 = "e05cb1388eaca3830aded4ccf20044b6e1ac1a61411dcca11b0437c4285c8bc2"
strip_components = 1
description = "HTTP/2 C Library"
homepage = "https://nghttp2.org"
license = "MIT"
deps = ["c-ares", "jansson", "libevent", "nghttp3", "ngtcp2", "openssl", "zlib"]

[build]
system = "autotools"
configure_args = ["--disable-python-bindings", "--enable-http3"]
tools = ["pkg-config"]

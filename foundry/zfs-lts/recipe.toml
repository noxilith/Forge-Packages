# Imported from Void Linux's template for 'zfs-lts'. Review before relying on it.
# 4 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, pre_configure
# settings not translated: conf_files
# needs, but Forge has no recipe for yet: dkms, perl, util-linux-common, xbps-triggers
[package]
name = "zfs-lts"
version = "2.3.9"
archive = "https://github.com/openzfs/zfs/releases/download/zfs-2.3.9/zfs-2.3.9.tar.gz"
sha256 = "26b0c7d433ebc3cbea5289b9d06792d628aff13c2c6e5ce70096db1b026c5699"
strip_components = 1
description = "Z File System -- userland, pyzfs, and kernel modules (using DKMS)"
homepage = "https://openzfs.github.io/openzfs-docs/"
license = "CDDL-1.0"
deps = ["attr", "libtirpc", "pam", "zlib"]
patches = ["patches/0001-only-build-the-module-in-dkms.conf.patch", "patches/0003-fix-seektest-musl.patch", "patches/0004-musl-strftime.patch"]

[build]
system = "autotools"
configure_args = ["--with-config=user", "--with-tirpc"]
tools = ["pkg-config"]
deps = ["dracut", "tar"]

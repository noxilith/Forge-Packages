# Imported from Void Linux's template for 'file-roller'. Review before relying on it.
# needs, but Forge has no recipe for yet: hicolor-icon-theme, itstool
[package]
name = "file-roller"
version = "44.5"
archive = "https://download.gnome.org/sources/file-roller/44/file-roller-44.5.tar.xz"
sha256 = "dfaf4bb989c0b8986be8bdae9fffeab8d0f30669ae3a627e8c3df94f23888339"
strip_components = 1
description = "GNOME Front-end to archiving programs like tar and zip"
homepage = "https://wiki.gnome.org/Apps/FileRoller"
license = "GPL-2.0-or-later"
deps = ["desktop-file-utils", "libadwaita", "libarchive", "libportal", "nautilus"]
patches = ["patches/fix-symlink-handling-7zip.patch"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["cpio", "gettext", "glib", "gtk+3"]

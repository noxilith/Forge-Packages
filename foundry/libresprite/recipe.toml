# Imported from Void Linux's template for 'libresprite'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: SDL2_image, libwebp
[package]
name = "libresprite"
version = "1.3"
archive = "https://github.com/libresprite/libresprite/releases/download/v1.3/SOURCE.CODE.+.submodules.tar.gz"
sha256 = "21e149950cc15a551be303440d7721fc180561ffb0918e8aee95ee370b9bf47b"
strip_components = 1
description = "Animated sprite editor & pixel art tool"
homepage = "https://github.com/libresprite/libresprite"
license = "GPL-2.0-only"
deps = ["SDL2", "curl", "freetype", "giflib", "libXi", "libarchive", "libjpeg-turbo", "libpng", "pixman", "tinyxml2"]
patches = ["patches/cross-compilation-use-hostbuilt-gen.patch"]

[build]
system = "cmake"
configure_args = ["-DCMAKE_EXE_LINKER_FLAGS=-lwebp"]
tools = ["pkg-config"]

# Imported from Void Linux's template for 'libvirt'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, post_patch, pre_build
# settings not translated: make_dirs, conf_files
# needs, but Forge has no recipe for yet: apparmor, avahi, dnsmasq, docbook-xsl, libreadline8, libssh2, python3-docutils, util-linux-common
[package]
name = "libvirt"
version = "12.9.0"
archive = "https://libvirt.org/sources/libvirt-12.9.0.tar.xz"
sha256 = "dcf579d8a949f4cbf56820529d48f200382a48ea12855ffded7c16a189353cd7"
strip_components = 1
description = "Virtualization API for controlling virtualization engines"
homepage = "https://libvirt.org"
license = "LGPL-2.1-or-later"
deps = ["attr", "curl", "eudev", "fuse", "gnutls", "iptables", "jansson", "json-c", "libcap-ng", "libpcap", "libpciaccess", "libsasl", "libtirpc", "libxml2", "lvm2", "parted", "polkit"]

[build]
system = "meson"
configure_args = ["-Dqemu_user=libvirt", "-Dqemu_group=libvirt", "-Dpolkit=enabled"]
tools = ["perl", "pkg-config"]
deps = ["gettext", "libxslt", "rpcsvc-proto"]

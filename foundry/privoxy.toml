# Imported from Void Linux's template for 'privoxy'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, pre_configure
# settings not translated: make_install_args, conf_files
[package]
name = "privoxy"
version = "4.1.0"
archive = "https://downloads.sourceforge.net/sourceforge/ijbswa/privoxy-4.1.0-stable-src.tar.gz"
sha256 = "23e4686e5848c74cb680c09c2811f0357739ecfe641f9c4072ee42399092c97b"
strip_components = 1
description = "Non-caching web proxy with advanced filtering capabilities"
homepage = "http://www.privoxy.org/"
license = "GPL-2.0-or-later"
deps = ["pcre2", "zlib"]

[build]
system = "autotools"
configure_args = ["--enable-compression", "--enable-dynamic-pcre"]

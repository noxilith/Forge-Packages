# Imported from Void Linux's template for 'flintlib'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# settings not translated: CFLAGS
# needs, but Forge has no recipe for yet: mpfr, ntl
[package]
name = "flintlib"
version = "3.4.0"
archive = "https://github.com/flintlib/flint/releases/download/v3.4.0/flint-3.4.0.tar.xz"
sha256 = "0550623c85aa37897638a6b10d267c311a788d137509692d8d858fba10a852da"
strip_components = 1
description = "Fast Library for Number Theory"
homepage = "https://flintlib.org"
license = "LGPL-3.0-or-later"

[build]
system = "autotools"
configure_args = ["--with-ntl"]
tools = ["m4"]

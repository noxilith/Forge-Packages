# Imported from Void Linux's template for 'giac'. Review before relying on it.
# hooks not translated: post_install, pre_configure
# settings not translated: LDFLAGS
# needs, but Forge has no recipe for yet: hicolor-icon-theme, libreadline8, mpfr
[package]
name = "giac"
version = "2.0.0.21"
archive = "https://www-fourier.univ-grenoble-alpes.fr/~parisse/debian/dists/stable/main/source/giac_2.0.0-21.tar.gz"
sha256 = "3e7fa1c281a21ab74ed66ef247faffe5a105bc11be1f7715f31b4368ce8dcbc8"
strip_components = 1
description = "Free computer algebra system"
homepage = "https://www-fourier.univ-grenoble-alpes.fr/~parisse/giac.html"
license = "GPL-3.0-or-later"
deps = ["desktop-file-utils", "fltk", "gmp", "gsl", "libjpeg-turbo", "libpng", "pari"]
patches = ["patches/fix-configure.patch"]

[build]
system = "autotools"
configure_args = ["--disable-micropy", "--disable-quickjs"]
deps = ["gettext"]

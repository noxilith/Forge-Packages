# Imported from Void Linux's template for 'cava'. Review before relying on it.
# hooks not translated: post_install, pre_configure
# needs, but Forge has no recipe for yet: fftw, ncurses
[package]
name = "cava"
version = "1.0.0"
archive = "https://github.com/karlstav/cava/archive/refs/tags/1.0.0.tar.gz"
sha256 = "2866cea11d0bd38406924ab2b47d5577f14909a7321ee928b6836391f375af7e"
strip_components = 1
description = "Audio Visualizer for ALSA"
homepage = "https://github.com/karlstav/cava"
license = "MIT"
deps = ["SDL2", "iniparser"]
patches = ["patches/iniparser-pkgconfig.patch"]

[build]
system = "autotools"
tools = ["pkg-config"]
deps = ["autoconf-archive"]

# Imported from Void Linux's template for 'iml'. Review before relying on it.
# hooks not translated: post_install
[package]
name = "iml"
version = "1.0.5"
archive = "https://cs.uwaterloo.ca/~astorjoh/iml-1.0.5.tar.bz2"
sha256 = "1dad666850895a5709b00b97422e2273f293cfadea7697a9f90b90953e847c2a"
strip_components = 1
description = "Integer Matrix Library"
homepage = "https://cs.uwaterloo.ca/~astorjoh/iml.html"
license = "BSD-3-Clause"
deps = ["gmp", "openblas"]

[build]
system = "autotools"
configure_args = ["--enable-shared", "--with-cblas=-lopenblas"]

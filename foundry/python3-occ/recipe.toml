# Imported from Void Linux's template for 'python3-occ'. Review before relying on it.
# needs, but Forge has no recipe for yet: python3-numpy, python3-packaging-bootstrap, python3-setuptools
[package]
name = "python3-occ"
version = "7.9.0"
archive = "https://github.com/tpaviot/pythonocc-core/archive/7.9.0.tar.gz"
sha256 = "98e53657f54e8a9c3477a81c0b4a11bc6659d5f60123e263419521b42a8e111f"
strip_components = 1
description = "Industrial strength 3D CAD Python3 package"
homepage = "http://pythonocc.org"
license = "LGPL-3.0-or-later"
deps = ["freetype", "occt", "rapidjson", "swig"]
patches = ["patches/cmake791.patch"]

[build]
system = "cmake"
configure_args = ["-DPYTHONOCC_BUILD_TYPE=None", "-DCMAKE_BUILD_TYPE=None", "-DPYTHONOCC_MESHDS_NUMPY=ON"]

# Imported from Void Linux's template for 'kpackage'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: qt5
[package]
name = "kpackage"
version = "5.116.0"
archive = "https://download.kde.org/stable/frameworks/5.116/kpackage-5.116.0.tar.xz"
sha256 = "5705b185c72b09f19215fa659fc628dc74529bb7d3f649d1fc953ae5a7ebf1be"
strip_components = 1
description = "KDE Installation and loading of additional content as packages"
homepage = "https://invent.kde.org/frameworks/kpackage"
license = "LGPL-2.1-or-later"
deps = ["karchive", "kconfig", "kcoreaddons", "kdoctools", "ki18n"]

[build]
system = "cmake"
deps = ["extra-cmake-modules", "gettext"]

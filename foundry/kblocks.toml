# Imported from Void Linux's template for 'kblocks'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-svg
[package]
name = "kblocks"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/kblocks-26.08.1.tar.xz"
sha256 = "cc25b631cf44c6d70d0e6e6938eb52b447b22b3e2db4fee4916b5ff8c39184c1"
strip_components = 1
description = "Classic falling blocks game"
homepage = "https://kde.org/applications/games/org.kde.kblocks"
license = "GPL-2.0-or-later"
deps = ["kf6-kconfig", "kf6-kconfigwidgets", "kf6-kcoreaddons", "kf6-kcrash", "kf6-kdbusaddons", "kf6-kdoctools", "kf6-ki18n", "kf6-kiconthemes", "kf6-kio", "kf6-ktextwidgets", "kf6-kwidgetsaddons", "kf6-kxmlgui", "libkdegames"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "gettext", "qt6-base"]

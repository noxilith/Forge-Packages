# Imported from Void Linux's template for 'libosinfo'. Review before relying on it.
# 3 configure argument(s) left out (computed values or paths outside the package)
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: hwids, osinfo-db
[package]
name = "libosinfo"
version = "1.12.0"
archive = "https://gitlab.com/libosinfo/libosinfo/-/archive/v1.12.0/libosinfo-v1.12.0.tar.gz"
sha256 = "3c52fb542d65d1ec5a10f87126d7513c2bd115eaa2f87fb91b15ba588708fc7b"
strip_components = 1
description = "GObject based library API for managing info about operating systems"
homepage = "https://libosinfo.org/"
license = "GPL-2.0-or-later, LGPL-2.1-or-later"
deps = ["glib", "libsoup3", "libxslt"]
patches = ["patches/meson-force-cross.patch"]

[build]
system = "meson"
tools = ["perl", "pkg-config"]
deps = ["gettext", "wget"]

# Imported from Void Linux's template for 'poweralertd'. Review before relying on it.
[package]
name = "poweralertd"
version = "0.3.0"
archive = "https://git.sr.ht/~kennylevinsen/poweralertd/archive/0.3.0.tar.gz"
sha256 = "5b2a1d0fefab62e5ddb5784f2cd3d330f36b3cb5260936f5051f6ff89d8abc3f"

# Imported from Void Linux's template for 'yass'. Review before relying on it.
# hooks not translated: pre_build
# needs, but Forge has no recipe for yet: jack
[package]
name = "yass"
version = "0.1.0"
archive = "https://kokkinizita.linuxaudio.org/linuxaudio/downloads/yass-0.1.0.tar.bz2"
sha256 = "d247798b708303bc7622c3b6b96fb8190f3b3a07424a3b53c95d21ab8fc6d34a"
strip_components = 1
description = "Yet Another Scrolling Scope"
homepage = "https://kokkinizita.linuxaudio.org/linuxaudio/"
license = "GPL-2.0-or-later"
deps = ["clthreads", "clxclient", "freetype", "libX11", "libXft"]

[build]
system = "make"
subdir = "source"
tools = ["pkg-config"]

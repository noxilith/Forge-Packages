description = "Advanced CPU-based password recovery utility"
homepage = "https://hashcat.net/hashcat/"
license = "MIT"
deps = ["OpenCL-Headers", "minizip", "xxHash", "zlib"]
patches = ["patches/no-march-native.patch"]

[build]
system = "make"

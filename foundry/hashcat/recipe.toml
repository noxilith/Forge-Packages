# Imported from Void Linux's template for 'hashcat'. Review before relying on it.
# hooks not translated: post_extract, post_install
# settings not translated: make_build_args, make_install_args, build_helper
# needs, but Forge has no recipe for yet: python3-pybind11
[package]
name = "hashcat"
version = "7.1.2"
archive = "https://hashcat.net/files/hashcat-7.1.2.tar.gz"
sha256 = "9546a6326d747530b44fcc079babad40304a87f32d3c9080016d58b39cfc8b96"

# Imported from Void Linux's template for 'gnutls'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: libreadline8, zstd
[package]
name = "gnutls"
version = "3.8.13"
archive = "https://www.gnupg.org/ftp/gcrypt/gnutls/v3.8/gnutls-3.8.13.tar.xz"
sha256 = "ffed8ec1bf09c2426d4f14aae377de4753b53e537d685e604e99a8b16ca9c97e"
strip_components = 1
description = "GNU Transport Layer Security library"
homepage = "https://gnutls.org"
license = "GPL-3.0-only, LGPL-2.1-or-later"
deps = ["brotli", "libgcrypt", "libgpg-error", "libidn2", "libtasn1", "libunistring", "lzo", "nettle", "p11-kit", "trousers", "unbound", "zlib"]
patches = ["patches/tests-certtool-no-prompt.patch"]

[build]
system = "autotools"
configure_args = ["--disable-static", "--disable-valgrind-tests", "--disable-rpath"]
tools = ["pkg-config"]
deps = ["gettext", "which"]

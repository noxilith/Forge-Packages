# Imported from Void Linux's template for 'pg_top'. Review before relying on it.
# hooks not translated: post_extract, post_install
# needs, but Forge has no recipe for yet: ncurses, python3-docutils
[package]
name = "pg_top"
version = "4.1.3"
archive = "https://gitlab.com/pg_top/pg_top/-/archive/v4.1.3/pg_top-v4.1.3.tar.gz"
sha256 = "2e1e9d8e7b085576d9609d2e3e333e7b212f24d7ebffff9131bb555ef396a65f"
strip_components = 1
description = "'top' for PostgreSQL"
homepage = "https://pg_top.gitlab.io/"
license = "BSD-3-Clause"
deps = ["libbsd", "postgresql18"]

[build]
system = "cmake"

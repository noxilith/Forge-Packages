# Imported from Void Linux's template for 'libicu77'. Review before relying on it.
# hooks not translated: post_install, post_patch, pre_configure
# settings not translated: CFLAGS, CXXFLAGS
[package]
name = "libicu77"
version = "77.1"
archive = "https://github.com/unicode-org/icu/releases/download/release-77-1/icu4c-77_1-src.tgz"
sha256 = "588e431f77327c39031ffbb8843c0e3bc122c211374485fa87dc5f3faff24061"
strip_components = 1
description = "International Components for Unicode v77"
homepage = "https://home.unicode.org/"
license = "ICU"
patches = ["patches/standardize-vtzone-output.patch"]

[build]
system = "autotools"
configure_args = ["--with-data-packaging=archive", "--enable-static"]
subdir = "source"
tools = ["pkg-config"]

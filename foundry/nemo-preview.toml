# Imported from Void Linux's template for 'nemo-preview'. Review before relying on it.
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: libwebkit2gtk41
[package]
name = "nemo-preview"
version = "6.6.0"
archive = "https://github.com/linuxmint/nemo-extensions/archive/refs/tags/6.6.0.tar.gz"
sha256 = "ab610011ea77b00ba760fd151546f271ac92b525fcf1e4b603fbf46b85c3be30"
strip_components = 1
description = "Nemo preview extension"
homepage = "https://github.com/linuxmint/nemo-extensions"
license = "GPL-2.0-or-later"
deps = ["cjs", "clutter", "clutter-gst3", "clutter-gtk", "gtksourceview4", "libmusicbrainz5", "nemo", "xreader"]

[build]
system = "meson"
subdir = "nemo-preview"
tools = ["pkg-config"]
deps = ["gettext", "glib"]

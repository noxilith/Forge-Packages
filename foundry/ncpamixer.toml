# Imported from Void Linux's template for 'ncpamixer'. Review before relying on it.
# hooks not translated: post_extract, post_install
# needs, but Forge has no recipe for yet: ncurses
[package]
name = "ncpamixer"
version = "1.3.11"
archive = "https://github.com/fulhax/ncpamixer/archive/1.3.11.tar.gz"
sha256 = "dcc4a0ce20e9fff3f1ff710697971369aed28b6ed2f6c67c42039670eaf0f717"
strip_components = 1
description = "Ncurses mixer for PulseAudio"
homepage = "https://github.com/fulhax/ncpamixer"
license = "MIT"
deps = ["pulseaudio"]

[build]
system = "cmake"
subdir = "src"

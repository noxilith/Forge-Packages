# Imported from Void Linux's template for 'lvm2'. Review before relying on it.
# 5 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, pre_configure
# settings not translated: make_dirs, conf_files
# needs, but Forge has no recipe for yet: libaio, libreadline8, util-linux-common
[package]
name = "lvm2"
version = "2.03.29"
archive = "https://mirrors.kernel.org/sourceware/lvm2/releases/LVM2.2.03.29.tgz"
sha256 = "30c53776cb4ddf6bf9eca29d0c28dbf9c5ac170c09154321213b11c3dbb5be9c"
strip_components = 1
description = "Logical Volume Manager 2 utilities"
homepage = "https://sourceware.org/lvm2/"
license = "GPL-2.0-only, LGPL-2.1-only, BSD-2-Clause"
deps = ["eudev", "thin-provisioning-tools"]
patches = ["patches/0001-lvresize-use-POSIX-shell.patch", "patches/fix-stdio-usage.patch", "patches/mlockall-default-config.patch", "patches/newudev.patch"]

[build]
system = "autotools"
configure_args = ["--disable-selinux", "--enable-readline", "--enable-pkgconfig", "--enable-fsadm", "--enable-dmeventd", "--enable-cmdlib", "--enable-udev_sync", "--enable-udev_rules", "--without-systemd-run"]
tools = ["pkg-config"]

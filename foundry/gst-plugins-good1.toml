# Imported from Void Linux's template for 'gst-plugins-good1'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: jack, libvpx, orc, qt5, qt6-shadertools, speex
[package]
name = "gst-plugins-good1"
version = "1.28.6"
archive = "https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-1.28.6.tar.xz"
sha256 = "b0c620a4b18b6ee931b4c43bbf1760d308666dc37f730a7e7f1ad327e59ce2df"
strip_components = 1
description = "GStreamer set of well-maintained good plug-ins (1.x)"
homepage = "https://gstreamer.freedesktop.org"
license = "LGPL-2.1-or-later"
deps = ["aalib", "flac", "gst-plugins-base1", "lame", "libXdamage", "libXv", "libcaca", "libgudev", "libpng", "libxml2", "mpg123", "pulseaudio", "qt6-base", "qt6-declarative", "taglib", "twolame", "v4l-utils", "wavpack"]

[build]
system = "meson"
configure_args = ["-Ddv=disabled", "-Ddv1394=disabled", "-Dshout2=disabled", "-Dqt5=enabled", "-Dqt6=enabled", "-Dqt-method=qmake", "-Dpkgconfig.relocatable=true"]
tools = ["pkg-config"]
deps = ["gettext", "glib"]

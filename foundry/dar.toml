# Imported from Void Linux's template for 'dar'. Review before relying on it.
# hooks not translated: post_extract, post_install
# settings not translated: conf_files
# needs, but Forge has no recipe for yet: bzip2
[package]
name = "dar"
version = "2.8.4"
archive = "https://downloads.sourceforge.net/sourceforge/dar/dar-2.8.4.tar.gz"
sha256 = "8e1ba552fd8b0783076d42ac1c2eeda57781c89f9bcc119f9d00ff1326e95e13"
strip_components = 1
description = "Shell command that backs up directory trees and files"
homepage = "http://dar.linux.free.fr/"
license = "GPL-2.0-or-later"
deps = ["acl", "argon2", "curl", "e2fsprogs", "gpgme", "libgcrypt", "librsync", "lzo", "xz"]

[build]
system = "autotools"
configure_args = ["--disable-upx", "--disable-build-html", "--disable-dar-static"]
tools = ["pkg-config"]
deps = ["gettext", "which"]

# Imported from Void Linux's template for 'libfreeglut'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: mesa
[package]
name = "libfreeglut"
version = "3.8.0"
archive = "https://github.com/FreeGLUTProject/freeglut/releases/download/v3.8.0/freeglut-3.8.0.tar.gz"
sha256 = "674dcaff25010e09e450aec458b8870d9e98c46f99538db457ab659b321d9989"

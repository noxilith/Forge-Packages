[package]
name = "gnome-bluetooth"
version = "47.1"
archive = "https://download.gnome.org/sources/gnome-bluetooth/47/gnome-bluetooth-47.1.tar.xz"
sha256 = "03e3e7403a15108ffc1496210a1da5c2961b2834a5c07eccc7a3f493195daba3"
strip_components = 1
description = "GNOME Bluetooth Subsystem"
homepage = "https://wiki.gnome.org/Projects/GnomeBluetooth"

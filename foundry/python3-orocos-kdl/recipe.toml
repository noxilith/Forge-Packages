# Imported from Void Linux's template for 'python3-orocos-kdl'. Review before relying on it.
# needs, but Forge has no recipe for yet: python3-pybind11, python3-setuptools
[package]
name = "python3-orocos-kdl"
version = "1.5.1"
archive = "https://github.com/orocos/orocos_kinematics_dynamics/archive/v1.5.1.tar.gz"
sha256 = "5acb90acd82b10971717aca6c17874390762ecdaa3a8e4db04984ea1d4a2af9b"
strip_components = 1
description = "Python3 Bindings for Orocos Kinematics and Dynamics C++ library"
homepage = "http://www.orocos.org/kdl"
license = "LGPL-2.1-only"
deps = ["eigen3.2", "orocos-kdl"]
patches = ["patches/sys-pybind11.patch"]

[build]
system = "cmake"
configure_args = ["-DPYTHON_VERSION=3"]
subdir = "python_orocos_kdl"

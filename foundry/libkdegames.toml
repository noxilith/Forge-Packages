# Imported from Void Linux's template for 'libkdegames'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-svg
[package]
name = "libkdegames"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/libkdegames-26.08.1.tar.xz"
sha256 = "5644fb0ffc9074465fda0d533e5cf5cd663197fddfafa3e749468eeba58640cb"
strip_components = 1
description = "Common code and data for many KDE games"
homepage = "https://kde.org/applications/games"
license = "GPL-2.0-or-later"
deps = ["kf6-karchive", "kf6-kcolorscheme", "kf6-kcompletion", "kf6-kconfig", "kf6-kconfigwidgets", "kf6-kdeclarative", "kf6-kdnssd", "kf6-kguiaddons", "kf6-ki18n", "kf6-kiconthemes", "kf6-knewstuff", "kf6-kxmlgui", "libopenal", "libsndfile", "qt6-base", "qt6-declarative"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "gettext", "kf6-kcoreaddons", "kf6-kdoctools", "kf6-kpackage"]

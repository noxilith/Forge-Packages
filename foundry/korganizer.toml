# Imported from Void Linux's template for 'korganizer'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-multimedia, qt6-tools
[package]
name = "korganizer"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/korganizer-26.08.1.tar.xz"
sha256 = "5589e15d154831ccdbe0aed38ea04ad5c5569e34d71038f0effdebf270908d2f"
strip_components = 1
description = "Calendar and scheduling Program"
homepage = "https://kde.org/applications/en/office/org.kde.korganizer"
license = "GPL-2.0-or-later"
deps = ["akonadi-calendar", "incidenceeditor", "kf6-kholidays", "kontactinterface"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "gettext", "kf6-kcmutils", "kf6-kconfig", "kf6-kcoreaddons", "kf6-kdoctools", "qt6-base"]

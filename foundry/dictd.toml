# Imported from Void Linux's template for 'dictd'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# settings not translated: conf_files
# needs, but Forge has no recipe for yet: libmaa
[package]
name = "dictd"
version = "1.13.3"
archive = "https://downloads.sourceforge.net/sourceforge/dict/dictd-1.13.3.tar.gz"
sha256 = "192129dfb38fa723f48a9586c79c5198fc4904fec1757176917314dd073f1171"
strip_components = 1
description = "DICT protocol server"
homepage = "http://sourceforge.net/projects/dict/"
license = "GPL-2.0-or-later"
deps = ["flex", "zlib"]

[build]
system = "autotools"
configure_args = ["--enable-dictorg"]
tools = ["flex"]

# Imported from Void Linux's template for 'passwordsafe'. Review before relying on it.
# hooks not translated: post_install, pre_configure
# settings not translated: build_helper, CXXFLAGS
# needs, but Forge has no recipe for yet: util-linux-common, xerces-c, zip
[package]
name = "passwordsafe"
version = "1.16.0"
archive = "https://github.com/pwsafe/pwsafe/archive/1.16.0.tar.gz"
sha256 = "6215f7b052480f03276b3ea590b9cdd23180db8d5d4a19185f3df7b6ddba11f8"
strip_components = 1
description = "Simple & Secure Password Management"
homepage = "https://pwsafe.org"
license = "Artistic-2.0"
deps = ["curl", "file", "libXt", "libXtst", "openssl", "qrencode", "wxWidgets-gtk3", "ykpers"]

[build]
system = "cmake"
tools = ["perl", "pkg-config"]
deps = ["gettext"]

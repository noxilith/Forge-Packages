# Imported from Void Linux's template for 'hitch'. Review before relying on it.
# hooks not translated: post_install, post_patch, pre_configure
# needs, but Forge has no recipe for yet: libev
[package]
name = "hitch"
version = "1.7.0"
archive = "https://hitch-tls.org/source/hitch-1.7.0.tar.gz"
sha256 = "c97ef8f1e115156640c40dfdfe9662d5f6d57a796fccad3bbad198ec797ce5c4"
strip_components = 1
description = "Libev-based high performance SSL/TLS proxy"
homepage = "https://hitch-tls.org/"
license = "BSD-2-Clause"
deps = ["openssl"]
patches = ["patches/cross-compile.diff"]

[build]
system = "autotools"
configure_args = ["ac_cv_so_reuseport_works=yes", "ac_cv_so_tfo=yes"]
tools = ["pkg-config"]

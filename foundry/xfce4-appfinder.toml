# Imported from Void Linux's template for 'xfce4-appfinder'. Review before relying on it.
# needs, but Forge has no recipe for yet: hicolor-icon-theme
[package]
name = "xfce4-appfinder"
version = "4.20.0"
archive = "https://archive.xfce.org/src/xfce/xfce4-appfinder/4.20/xfce4-appfinder-4.20.0.tar.bz2"
sha256 = "82ca82f77dc83e285db45438c2fe31df445148aa986ffebf2faabee4af9e7304"
strip_components = 1
description = "Appfinder for the Xfce Desktop Environment"
homepage = "https://xfce.org/"
license = "GPL-2.0-or-later"
deps = ["desktop-file-utils", "garcon", "gtk+3", "libxfce4ui"]

[build]
system = "autotools"
tools = ["pkg-config"]
deps = ["gettext"]

# Imported from Void Linux's template for 'dbus'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# settings not translated: conf_files
[package]
name = "dbus"
version = "1.16.2"
archive = "https://dbus.freedesktop.org/releases/dbus/dbus-1.16.2.tar.xz"
sha256 = "0ba2a1a4b16afe7bceb2c07e9ce99a8c2c3508e5dec290dbb643384bd6beb7e2"
strip_components = 1
description = "Message bus system"
homepage = "https://dbus.freedesktop.org/"
license = "GPL-2.0-or-later"
deps = ["expat", "libX11", "libcap"]

[build]
system = "meson"
configure_args = ["-Dselinux=disabled", "-Dinotify=enabled", "-Ddbus_user=dbus", "-Dxml_docs=enabled", "-Ddoxygen_docs=disabled", "-Depoll=enabled", "-Dasserts=false", "-Dsystemd=disabled", "-Duser_session=false"]
tools = ["pkg-config"]
deps = ["gettext", "xmlto"]

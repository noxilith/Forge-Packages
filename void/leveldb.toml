# Imported from Void Linux's template for 'leveldb'. Review before relying on it.
# hooks not translated: post_install
[package]
name = "leveldb"
version = "1.23"
archive = "https://github.com/google/leveldb/archive/1.23.tar.gz"
sha256 = "9a37f8a6174f09bd622bc723b55881dc541cd50747cbd08831c2a82d620f6d76"
strip_components = 1
description = "Fast and lightweight key/value database library by Google"
homepage = "https://github.com/google/leveldb"
license = "BSD-3-Clause"

[build]
system = "cmake"
configure_args = ["-DBUILD_SHARED_LIBS=ON", "-DLEVELDB_BUILD_TESTS=OFF", "-DLEVELDB_BUILD_BENCHMARKS=OFF"]

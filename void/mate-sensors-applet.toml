# Imported from Void Linux's template for 'mate-sensors-applet'. Review before relying on it.
# needs, but Forge has no recipe for yet: dbus-glib, itstool, libatasmart
[package]
name = "mate-sensors-applet"
version = "1.28.0"
archive = "https://pub.mate-desktop.org/releases/1.28/mate-sensors-applet-1.28.0.tar.xz"
sha256 = "d465366682af8feb8618283c9789e8b70db6fd17ca8fa950ac6f710102315a81"
strip_components = 1
description = "Sensors applet for MATE"
homepage = "https://mate-desktop.org"
license = "GPL-2.0-or-later"
deps = ["cairo", "dconf", "glib", "libnotify", "lm_sensors", "mate-panel"]

[build]
system = "autotools"
configure_args = ["--disable-schemas-compile", "--disable-static"]
tools = ["pkg-config"]
deps = ["gettext", "libxml2", "libxslt"]

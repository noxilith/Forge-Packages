# Imported from Void Linux's template for 'gpac'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: ffmpeg6, jack, libtheora
[package]
name = "gpac"
version = "26.07.0"
archive = "https://github.com/gpac/gpac/archive/refs/tags/v26.07.0.tar.gz"
sha256 = "57822c1a74dcb83d76ff1f671e1b4fae2e7614e8194a5adb9f20661e0e9421dd"
strip_components = 1
description = "Framework for production, encoding, delivery, playback of media content"
homepage = "https://gpack.io/"
license = "LGPL-2.1-or-later"
deps = ["SDL2", "alsa-lib", "faad2", "freetype", "libXv", "libcaca", "libjpeg-turbo", "libmad", "libpng", "libvorbis", "nghttp2", "openjpeg2", "openssl", "pulseaudio", "xz", "zlib"]
patches = ["patches/cacert.patch"]

[build]
system = "autotools"
configure_args = ["--enable-pic"]
tools = ["pkg-config"]

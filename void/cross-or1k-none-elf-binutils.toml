# Imported from Void Linux's template for 'cross-or1k-none-elf-binutils'. Review before relying on it.
# 3 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
[package]
name = "cross-or1k-none-elf-binutils"
version = "2.35"
archive = "https://ftp.gnu.org/gnu/binutils/binutils-2.35.tar.xz"
sha256 = "1b11659fb49e20e18db460d44485f09442c8c56d5df165de9461eb09c8302f85"
strip_components = 1
description = "GNU binary utilities"
homepage = "https://www.gnu.org/software/binutils/"
license = "GPL-3.0-or-later"
deps = ["zlib"]

[build]
system = "autotools"
configure_args = ["--disable-nls", "--enable-deterministic-archives", "--enable-interwork", "--enable-ld", "--enable-multilib", "--enable-plugins", "--target=or1k-none-elf", "--with-gnu-as", "--with-gnu-ld", "--with-system-zlib", "--without-isl"]
tools = ["bison", "flex", "perl"]

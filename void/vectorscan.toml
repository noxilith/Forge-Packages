# Imported from Void Linux's template for 'vectorscan'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: boost, ragel, sqlite
[package]
name = "vectorscan"
version = "5.4.11"
archive = "https://github.com/VectorCamp/vectorscan/archive/refs/tags/vectorscan/5.4.11.tar.gz"
sha256 = "905f76ad1fa9e4ae0eb28232cac98afdb96c479666202c5a4c27871fb30a2711"
strip_components = 1
description = "High-performance regular expression matching library"
homepage = "https://www.vectorcamp.gr/project/vectorscan/"
license = "BSD-3-Clause"
deps = ["pcre", "simde"]

[build]
system = "cmake"
configure_args = ["-DBUILD_SHARED_LIBS=ON", "-DBUILD_STATIC_LIBS=ON", "-DSIMDE_BACKEND=ON"]
tools = ["pkg-config"]

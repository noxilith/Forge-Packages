# Imported from Void Linux's template for 'knights'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-qt5compat, qt6-tools
[package]
name = "knights"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/knights-26.08.1.tar.xz"
sha256 = "8808b6894715e77aee13b86b25d13f1277c9fa7dea696fee5bf776f00d4bbdb3"
strip_components = 1
description = "Chess board program for KDE"
homepage = "https://kde.org/applications/en/games/org.kde.knights"
license = "LGPL-2.1-or-later"
deps = ["kf6-kcrash", "kf6-kdbusaddons", "kf6-kdoctools", "kf6-kio", "kf6-kplotting", "kf6-ksvg", "kf6-ktextwidgets", "kf6-kwallet", "libkdegames", "libplasma"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "gettext", "kf6-kconfig", "kf6-kcoreaddons", "kf6-kpackage", "qt6-base"]

# Imported from Void Linux's template for 'atari800'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: SDL_image, SDL_mixer, SDL_net, SDL_sound, SDL_ttf, libreadline8
[package]
name = "atari800"
version = "5.2.0"
archive = "https://github.com/atari800/atari800/releases/download/ATARI800_5_2_0/atari800-5.2.0-src.tgz"
sha256 = "3874d02b89d83c8089f75391a4c91ecb4e94001da2020c2617be088eba1f461f"
strip_components = 1
description = "Emulator of Atari 800/800XL/130XE/5200 with various extensions"
homepage = "https://atari800.github.io"
license = "GPL-2.0-or-later"

[build]
system = "autotools"
configure_args = ["--disable-sdltest", "--with-x", "--enable-clipsound", "--enable-monitortrace", "--enable-monitorprofile", "--enable-monitorbreakpoints", "--enable-bufferedlog"]

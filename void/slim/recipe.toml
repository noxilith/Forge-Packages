# Imported from Void Linux's template for 'slim'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: conf_files, lib32disabled
[package]
name = "slim"
version = "1.3.6"
archive = "https://downloads.sourceforge.net/sourceforge/slim.berlios/slim-1.3.6.tar.gz"
sha256 = "21defeed175418c46d71af71fd493cd0cbffd693f9d43c2151529125859810df"
strip_components = 1
description = "Desktop-independent graphical login manager for X11"
homepage = "http://sourceforge.net/projects/slim.berlios/"
license = "GPL-2.0-or-later"
deps = ["freetype", "libXft", "libXmu", "libXrandr", "libjpeg-turbo", "libpng", "pam"]
patches = ["patches/1.3.6--adjust-PATH-for-usrmerge.patch", "patches/slim-1.3.6-add-sessiondir.patch", "patches/slim-1.3.6-fix-libslim-libraries.patch", "patches/slim-1.3.6-gcc11.patch"]

[build]
system = "cmake"
configure_args = ["-DUSE_CONSOLEKIT=no", "-DUSE_PAM=yes"]
tools = ["pkg-config"]

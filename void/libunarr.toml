# Imported from Void Linux's template for 'libunarr'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: bzip2
[package]
name = "libunarr"
version = "1.0.1"
archive = "https://github.com/selmf/unarr/releases/download/v1.0.1/unarr-1.0.1.tar.xz"
sha256 = "54935b1eb30b9a50305f64d38403dab5d2a83e637f48b2b0b118246e260065b5"
strip_components = 1
description = "A decompression library for rar, tar and zip archives"
homepage = "https://github.com/selmf/unarr"
license = "LGPL-3.0-or-later"
deps = ["xz", "zlib"]

[build]
system = "cmake"

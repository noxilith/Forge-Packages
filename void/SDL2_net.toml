# Imported from Void Linux's template for 'SDL2_net'. Review before relying on it.
# hooks not translated: post_install
[package]
name = "SDL2_net"
version = "2.4.0"
archive = "https://www.libsdl.org/projects/SDL_net/release/SDL2_net-2.4.0.tar.gz"
sha256 = "9cbca2527feb3f1a622d48ba65cc7dee9b1e3f2c55ceafb7d7720bb058aafb30"
strip_components = 1
description = "Networking library (SDL 2.x)"
homepage = "https://github.com/libsdl-org/SDL_net"
license = "Zlib"
deps = ["SDL2"]

[build]
system = "cmake"
configure_args = ["-DSDL2NET_SAMPLES=OFF"]
tools = ["pkg-config"]

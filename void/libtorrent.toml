# Imported from Void Linux's template for 'libtorrent'. Review before relying on it.
# hooks not translated: post_configure, pre_configure
[package]
name = "libtorrent"
version = "0.16.20"
archive = "https://github.com/rakshasa/libtorrent/archive/v0.16.20.tar.gz"
sha256 = "f824c9a88dc7c0890476b28248134339163d10159af03127d9e9bbb2097be641"
strip_components = 1
description = "BitTorrent library written in C++"
homepage = "https://github.com/rakshasa/libtorrent"
license = "GPL-2.0-or-later"
deps = ["curl", "openssl", "zlib"]

[build]
system = "autotools"
configure_args = ["--enable-static", "--disable-debug", "--without-kqueue", "--enable-aligned", "--with-posix-fallocate"]
tools = ["pkg-config"]

# Imported from Void Linux's template for 'nsd'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, pre_configure
# settings not translated: make_dirs
[package]
name = "nsd"
version = "4.15.4"
archive = "https://www.nlnetlabs.nl/downloads/nsd/nsd-4.15.4.tar.gz"
sha256 = "74a095fdb774a157c8aec9009e440fc3d2ba94c4372ae9ed86588c1719d1df2f"
strip_components = 1
description = "Authoritative only, high performance and simple DNS server"
homepage = "https://www.nlnetlabs.nl/projects/nsd/"
license = "BSD-3-Clause"
deps = ["fstrm", "libevent", "protobuf-c"]

[build]
system = "autotools"
configure_args = ["--enable-ratelimit", "--enable-ratelimit-default-is-off"]
tools = ["pkg-config"]
deps = ["protobuf"]

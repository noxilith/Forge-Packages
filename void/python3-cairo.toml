# Imported from Void Linux's template for 'python3-cairo'. Review before relying on it.
# needs, but Forge has no recipe for yet: python3-packaging-bootstrap
[package]
name = "python3-cairo"
version = "1.27.0"
archive = "https://github.com/pygobject/pycairo/releases/download/v1.27.0/pycairo-1.27.0.tar.gz"
sha256 = "5cb21e7a00a2afcafea7f14390235be33497a2cce53a98a19389492a60628430"
strip_components = 1
description = "Python3 bindings for the cairo graphics library"
homepage = "https://pycairo.readthedocs.io/"
license = "LGPL-2.1-only, MPL-1.1"
deps = ["cairo"]

[build]
system = "meson"
tools = ["pkg-config"]

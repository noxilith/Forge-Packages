# Imported from Void Linux's template for 'collectd'. Review before relying on it.
# 6 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, pre_configure
# settings not translated: LDFLAGS, conf_files
# needs, but Forge has no recipe for yet: net-snmp
[package]
name = "collectd"
version = "5.12.0"
archive = "https://storage.googleapis.com/collectd-tarballs/collectd-5.12.0.tar.bz2"
sha256 = "5bae043042c19c31f77eb8464e56a01a5454e0b39fa07cf7ad0f1bfc9c3a09d6"
strip_components = 1
description = "Daemon which collects system performance statistics periodically"
homepage = "https://collectd.org"
license = "GPL-2.0-only, MIT"
deps = ["curl", "iptables", "libesmtp", "libgcrypt", "libvirt", "libxml2", "lm_sensors", "mariadb", "openssl", "yajl", "zlib"]
patches = ["patches/gnu_source.patch", "patches/python-3.11-more.patch", "patches/python-3.11.patch"]

[build]
system = "autotools"
configure_args = ["--with-libiptc", "--enable-virt", "--disable-static", "--with-fp-layout=nothing", "--disable-werror"]
tools = ["pkg-config"]
deps = ["glib"]

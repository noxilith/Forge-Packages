# Imported from Void Linux's template for 'calf'. Review before relying on it.
# hooks not translated: pre_configure, pre_install
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: fftw, fluidsynth, hicolor-icon-theme, jack, ladspa-sdk
[package]
name = "calf"
version = "0.90.3"
archive = "https://github.com/calf-studio-gear/calf/archive/0.90.3.tar.gz"
sha256 = "8781cbd1a81dec59b5923a23141ab2ca74e0e724389e15ffcf3820ace138a46c"
strip_components = 1
description = "LV2/DSSI/LADSPA plug-ins suite and standalone JACK host"
homepage = "https://calf-studio-gear.org"
license = "LGPL-2.1-or-later"
deps = ["cairo", "desktop-file-utils", "dssi", "expat", "glib", "gtk+", "lv2"]

[build]
system = "autotools"
configure_args = ["--enable-experimental"]
tools = ["pkg-config"]

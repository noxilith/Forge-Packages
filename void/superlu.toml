# Imported from Void Linux's template for 'superlu'. Review before relying on it.
# hooks not translated: post_install, pre_configure
[package]
name = "superlu"
version = "6.0.1"
archive = "https://github.com/xiaoyeli/superlu/archive/v6.0.1.tar.gz"
sha256 = "6c5a3a9a224cb2658e9da15a6034eed44e45f6963f5a771a6b4562f7afb8f549"
strip_components = 1
description = "Solution of large, sparse, nonsymmetric systems of linear equations"
homepage = "https://portal.nersc.gov/project/sparse/superlu/"
license = "BSD-3-Clause"
deps = ["openblas"]

[build]
system = "cmake"
configure_args = ["-DUSE_XSDK_DEFAULTS=TRUE", "-DBUILD_SHARED_LIBS=TRUE"]

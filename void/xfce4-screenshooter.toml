# Imported from Void Linux's template for 'xfce4-screenshooter'. Review before relying on it.
# needs, but Forge has no recipe for yet: hicolor-icon-theme
[package]
name = "xfce4-screenshooter"
version = "1.11.3"
archive = "https://archive.xfce.org/src/apps/xfce4-screenshooter/1.11/xfce4-screenshooter-1.11.3.tar.xz"
sha256 = "1f6a14f7d1b0c440f31e24a8cc4fe2996185357fa786f0c2cdfe564ef673a710"
strip_components = 1
description = "Plugin that makes screenshots for the Xfce panel"
homepage = "https://goodies.xfce.org/projects/applications/xfce4-screenshooter"
license = "GPL-2.0-or-later"
deps = ["desktop-file-utils", "exo", "libsoup3", "libxfce4ui", "libxfce4util", "wayland", "wayland-protocols", "xfce4-panel", "xfconf"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["gettext", "glib"]

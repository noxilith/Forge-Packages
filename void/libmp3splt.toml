# Imported from Void Linux's template for 'libmp3splt'. Review before relying on it.
[package]
name = "libmp3splt"
version = "0.9.2"
archive = "https://downloads.sourceforge.net/sourceforge/mp3splt/libmp3splt-0.9.2.tar.gz"
sha256 = "30eed64fce58cb379b7cc6a0d8e545579cb99d0f0f31eb00b9acc8aaa1b035dc"
strip_components = 1
description = "Library for splitting mp3 and ogg files without decoding"
homepage = "http://mp3splt.sourceforge.net"
license = "GPL-2.0-or-later"
deps = ["flac", "libid3tag", "libmad", "libvorbis", "pcre"]

[build]
system = "autotools"
configure_args = ["--disable-cutter"]
tools = ["pkg-config"]

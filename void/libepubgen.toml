# Imported from Void Linux's template for 'libepubgen'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: boost, doxygen, libcppunit
[package]
name = "libepubgen"
version = "0.1.1"
archive = "https://downloads.sourceforge.net/sourceforge/libepubgen/libepubgen-0.1.1.tar.xz"
sha256 = "03e084b994cbeffc8c3dd13303b2cb805f44d8f2c3b79f7690d7e3fc7f6215ad"
strip_components = 1
description = "EPUB generator for librevenge"
homepage = "https://sourceforge.net/projects/libepubgen/"
license = "MPL-2.0"
deps = ["librevenge", "libxml2"]

[build]
system = "autotools"
tools = ["pkg-config"]

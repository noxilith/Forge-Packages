# Imported from Void Linux's template for 'drbd-utils'. Review before relying on it.
# 4 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, pre_configure
# settings not translated: build_helper, CFLAGS, conf_files
# needs, but Forge has no recipe for yet: docbook-xsl, po4a
[package]
name = "drbd-utils"
version = "9.12.1"
archive = "https://www.linbit.com/downloads/drbd/utils/drbd-utils-9.12.1.tar.gz"
sha256 = "1102e2a2001a45685c2f4ce5cb14e5a8a099044f53389d38480b3a88f5db3fd1"
strip_components = 1
description = "Distributed replicated storage"
homepage = "http://www.drbd.org"
license = "GPL-2.0-or-later"
deps = ["eudev"]
patches = ["patches/ftbfs.patch"]

[build]
system = "autotools"
configure_args = ["--with-distro=generic", "--with-bashcompletion", "--with-udev", "--without-rgmanager", "--without-pacemaker", "--without-heartbeat", "--without-83support", "--without-xen"]
tools = ["flex", "pkg-config"]
deps = ["libxslt"]

# Imported from Void Linux's template for 'kf6-kxmlgui'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: kf6-base, qt6-tools
[package]
name = "kf6-kxmlgui"
version = "6.30.0"
archive = "https://download.kde.org/stable/frameworks/6.30/kxmlgui-6.30.0.tar.xz"
sha256 = "10fb8a0f7b874248ff60d9a8ee4e1f06a0efcf01b0d34d7635dfff86e848c352"
strip_components = 1
description = "KDE Framework for managing menu and toolbar actions"
homepage = "https://invent.kde.org/frameworks/kxmlgui"
license = "LGPL-2.1-or-later"
deps = ["kf6-kconfig", "kf6-kconfigwidgets", "kf6-kcoreaddons", "kf6-kglobalaccel", "kf6-kguiaddons", "kf6-ki18n", "kf6-kiconthemes", "kf6-kitemviews", "kf6-kwidgetsaddons", "qt6-base"]

[build]
system = "cmake"
deps = ["extra-cmake-modules", "gettext"]

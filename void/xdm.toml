deps = ["libXaw", "libXft", "pam", "sessreg", "xconsole", "xsm"]

[build]
system = "autotools"
configure_args = ["--with-random-device=/dev/urandom", "--with-pam", "--with-xft"]
tools = ["pkg-config"]

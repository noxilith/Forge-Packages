[package]
name = "xdm"
version = "1.1.17"
archive = "https://www.x.org/releases/individual/app/xdm-1.1.17.tar.xz"
sha256 = "9494aef0911a031c53670725b5c8c9bb9d3f7c5ea7318b1f72ddd9dcbbeceb6a"

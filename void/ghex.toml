# Imported from Void Linux's template for 'ghex'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: pre_build
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: hicolor-icon-theme, itstool
[package]
name = "ghex"
version = "46.3"
archive = "https://download.gnome.org/sources/ghex/46/ghex-46.3.tar.xz"
sha256 = "ea16595dfba0a97b55dd106305d56ba2baee95de0b13b75e75966cc31f9b3ec9"
strip_components = 1
description = "Simple binary editor for GNOME"
homepage = "https://gitlab.gnome.org/GNOME/ghex"
license = "GPL-2.0-only, GFDL-1.1-only"
deps = ["desktop-file-utils", "gtk4", "iso-codes", "libadwaita"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["gettext", "glib", "gtk+3"]

# Imported from Void Linux's template for 'atomix'. Review before relying on it.
# needs, but Forge has no recipe for yet: itstool
[package]
name = "atomix"
version = "44.0"
archive = "https://download.gnome.org/sources/atomix/44/atomix-44.0.tar.xz"
sha256 = "c8849317688d87da734c9063035631052007f2a8799b6c6cc915265880b55fb4"

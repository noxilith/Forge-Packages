# Imported from Void Linux's template for 'volume_key'. Review before relying on it.
# hooks not translated: post_extract
# needs, but Forge has no recipe for yet: nss, python3-setuptools
[package]
name = "volume_key"
version = "0.3.12"
archive = "https://releases.pagure.org/volume_key/volume_key-0.3.12.tar.xz"
sha256 = "6ca3748fc1dad22c450bbf6601d4e706cb11c5e662d11bb4aeb473a9cd77309b"
strip_components = 1
description = "Library for manipulating storage volume encryption keys"
homepage = "https://pagure.io/volume_key"
license = "GPL-2.0-or-later"
deps = ["cryptsetup", "glib", "gpgme"]

[build]
system = "autotools"
configure_args = ["--without-python"]
tools = ["pkg-config"]
deps = ["swig"]

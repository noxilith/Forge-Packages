# Imported from Void Linux's template for 'avr-binutils'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: make_install_args
[package]
name = "avr-binutils"
version = "2.44"
archive = "https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz"
sha256 = "ce2017e059d63e67ddb9240e9d4ec49c2893605035cd60e92ad53177f4377237"
strip_components = 1
description = "GNU binary utilities for AVR"
homepage = "http://www.gnu.org/software/binutils/"
license = "GPL-3.0-only"
deps = ["zlib"]

[build]
system = "autotools"
configure_args = ["--disable-werror", "--enable-gold", "--enable-plugins", "--with-system-zlib", "--target=avr", "--with-pic"]

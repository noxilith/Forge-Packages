# Imported from Void Linux's template for 'kwalletmanager'. Review before relying on it.
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "kwalletmanager"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/kwalletmanager-26.08.1.tar.xz"
sha256 = "9c7476a479884278ebe8024807bf25c6709c5a2da8aaba5aecf24cdd11ee721f"
strip_components = 1
description = "KDE Wallet Management Tools"
homepage = "https://kde.org/applications/system/org.kde.kwalletmanager5"
license = "GPL-2.0-only"
deps = ["kf6-karchive", "kf6-kauth", "kf6-kcmutils", "kf6-kconfig", "kf6-kconfigwidgets", "kf6-kcrash", "kf6-kdbusaddons", "kf6-kdoctools", "kf6-ki18n", "kf6-kio", "kf6-kstatusnotifieritem", "kf6-kwallet", "kf6-kwindowsystem", "kf6-kxmlgui"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "gettext", "qt6-base"]

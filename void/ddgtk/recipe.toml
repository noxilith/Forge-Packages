# Imported from Void Linux's template for 'ddgtk'. Review before relying on it.
[package]
name = "ddgtk"
version = "0.1"
archive = "https://github.com/gort818/ddgtk/archive/0.1.tar.gz"
sha256 = "0386336681b24d648cdce3daa0c2b83c77a69773296e97a8427b67cbd27531ed"
strip_components = 1
description = "GUI frontend for dd to create bootable ISO images for Linux"
homepage = "https://github.com/gort818/ddgtk"
license = "GPL-3.0-or-later"
deps = ["gtk+3", "python3-gobject"]
patches = ["patches/001-changes-for-v0.1.patch"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["appstream-glib", "gettext", "glib"]

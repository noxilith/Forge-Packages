# Imported from Void Linux's template for 'libwpd'. Review before relying on it.
# needs, but Forge has no recipe for yet: boost
[package]
name = "libwpd"
version = "0.10.3"
archive = "https://downloads.sourceforge.net/sourceforge/libwpd/libwpd-0.10.3.tar.xz"
sha256 = "2465b0b662fdc5d4e3bebcdc9a79027713fb629ca2bff04a3c9251fdec42dd09"
strip_components = 1
description = "Library for importing WordPerfect documents"
homepage = "http://libwpd.sourceforge.net/"
license = "MPL-2.0, LGPL-2.1"
deps = ["librevenge"]
patches = ["patches/fix-compat-gcc12.patch"]

[build]
system = "autotools"
tools = ["pkg-config"]

# Imported from Void Linux's template for 'drumstick'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: docbook-xsl, doxygen, qt5
[package]
name = "drumstick"
version = "1.1.3"
archive = "https://downloads.sourceforge.net/sourceforge/drumstick/drumstick-1.1.3.tar.bz2"
sha256 = "75aca4281da25fe0186b44c07772c5f0b4d1f2bba875c4667e7e6e9fcedb3cd9"
strip_components = 1
description = "Set of MIDI libraries using C++/Qt5 idioms and style"
homepage = "http://drumstick.sourceforge.net"
license = "GPL-2.0-or-later"
deps = ["alsa-lib", "pulseaudio"]

[build]
system = "cmake"
configure_args = ["-DLIB_SUFFIX=", "-DUPDATE_MIME_DATABASE_EXECUTABLE=true"]
tools = ["pkg-config"]
deps = ["libxslt"]

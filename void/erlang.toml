# Imported from Void Linux's template for 'erlang'. Review before relying on it.
# hooks not translated: post_configure, post_install, pre_configure, pre_install
# settings not translated: make_install_target
# needs, but Forge has no recipe for yet: ncurses
[package]
name = "erlang"
version = "28.2"
archive = "https://github.com/erlang/otp/archive/refs/tags/OTP-28.2.tar.gz"
sha256 = "b984f9e02bb61637997a35daa9070ae8f41cea1667676416438c467fda3d141f"
strip_components = 1
description = "Concurrent functional programming language developed by Ericsson"
homepage = "https://www.erlang.org"
license = "Apache-2.0"
deps = ["openssl", "unixodbc", "zlib"]

[build]
system = "autotools"
configure_args = ["--without-javac", "--disable-year2038"]
tools = ["perl"]
deps = ["curl", "libxslt", "tar"]

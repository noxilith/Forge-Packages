# Imported from Void Linux's template for 'cherrytree'. Review before relying on it.
# needs, but Forge has no recipe for yet: sqlite
[package]
name = "cherrytree"
version = "1.7.2"
archive = "https://github.com/giuspen/cherrytree/archive/refs/tags/v1.7.2.tar.gz"
sha256 = "9055ec335021d1fefa1ea11837cba19cc7f9380939dfab8ca59fa07862b81056"
strip_components = 1
description = "Hierarchial note taking application with syntax highlighting"
homepage = "https://www.giuspen.com/cherrytree/"
license = "GPL-3.0-or-later"
deps = ["curl", "desktop-file-utils", "fmt", "fribidi", "gspell", "gtkmm", "gtksourceview4", "gtksourceviewmm", "libxml++", "spdlog", "uchardet", "vte3"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF"]
tools = ["pkg-config"]
deps = ["gettext", "glib"]

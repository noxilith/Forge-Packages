# Imported from Void Linux's template for 'gd'. Review before relying on it.
# hooks not translated: post_install, pre_check
# needs, but Forge has no recipe for yet: libwebp
[package]
name = "gd"
version = "2.3.3"
archive = "https://github.com/libgd/libgd/releases/download/gd-2.3.3/libgd-2.3.3.tar.xz"
sha256 = "3fe822ece20796060af63b7c60acb151e5844204d289da0ce08f8fdf131e5a61"
strip_components = 1
description = "Graphics library for the dynamic creation of images"
homepage = "http://www.libgd.org/"
license = "custom:BSD-like"
deps = ["fontconfig", "libXpm", "libheif", "libjpeg-turbo", "libpng", "tiff"]

[build]
system = "autotools"
tools = ["pkg-config"]

# Imported from Void Linux's template for 'rpm'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: pre_configure
# settings not translated: CFLAGS
# needs, but Forge has no recipe for yet: lua53, python3-packaging-bootstrap, python3-setuptools, sqlite
[package]
name = "rpm"
version = "4.18.1"
archive = "https://ftp.osuosl.org/pub/rpm/releases/rpm-4.18.x/rpm-4.18.1.tar.bz2"
sha256 = "37f3b42c0966941e2ad3f10fde3639824a6591d07197ba8fd0869ca0779e1f56"
strip_components = 1
description = "Red Hat Package Management Utils"
homepage = "https://rpm.org"
license = "GPL-2.0-or-later"
deps = ["elfutils", "file", "libarchive", "libcap", "libgcrypt", "popt"]
patches = ["patches/include.patch", "patches/python.patch"]

[build]
system = "autotools"
configure_args = ["--with-cap", "--with-acl", "--enable-python", "PYTHON=python3"]
tools = ["pkg-config"]
deps = ["gettext"]

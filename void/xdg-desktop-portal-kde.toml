# Imported from Void Linux's template for 'xdg-desktop-portal-kde'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: kde-plasma-base, qt6-tools
[package]
name = "xdg-desktop-portal-kde"
version = "6.7.5"
archive = "https://download.kde.org/stable/plasma/6.7.5/xdg-desktop-portal-kde-6.7.5.tar.xz"
sha256 = "5ebedc3dcf508e85f2f7bbddffa2cca6805650ffe1dce350c4a1dfc5d2f07c50"
strip_components = 1
description = "Backend implementation for xdg-desktop-portal that is using Qt/KF6"
homepage = "https://invent.kde.org/plasma/xdg-desktop-portal-kde"
license = "GPL-3.0-or-later"
deps = ["glib", "kf6-kconfig", "kf6-kcoreaddons", "kf6-kcrash", "kf6-kdeclarative", "kf6-kglobalaccel", "kf6-ki18n", "kf6-kiconthemes", "kf6-kio", "kf6-kirigami", "kf6-knotifications", "kf6-kservice", "kf6-kstatusnotifieritem", "kf6-kwayland", "kf6-kwidgetsaddons", "kf6-kwindowsystem", "libepoxy", "libplasma", "pipewire", "plasma-workspace", "qt6-base", "qt6-declarative", "xdg-desktop-portal"]

[build]
system = "cmake"
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "gettext", "plasma-wayland-protocols", "wayland"]

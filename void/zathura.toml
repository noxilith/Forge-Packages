# Imported from Void Linux's template for 'zathura'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: python3-Sphinx, sqlite
[package]
name = "zathura"
version = "2026.10.23"
archive = "https://pwmt.org/projects/zathura/download/zathura-2026.10.23.tar.xz"
sha256 = "29a0931527f63c832f50eeef169d885a5db52a3a9e13b12a3a7beca9aaf63d2d"
strip_components = 1
description = "Highly customizable and functional document viewer"
homepage = "https://pwmt.org/projects/zathura/"
license = "Zlib"
deps = ["file", "girara", "glib", "gtk4", "libseccomp", "texlive", "xxHash", "zlib"]

[build]
system = "meson"
configure_args = ["-Dsynctex=enabled"]
tools = ["pkg-config"]
deps = ["appstream-glib", "desktop-file-utils", "gettext", "librsvg"]

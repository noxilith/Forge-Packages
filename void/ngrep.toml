# Imported from Void Linux's template for 'ngrep'. Review before relying on it.
# hooks not translated: post_install
[package]
name = "ngrep"
version = "1.49.0"
archive = "https://github.com/jpr5/ngrep/archive/refs/tags/v1.49.0.tar.gz"
sha256 = "6c94b31681316b7469a3ace92d2aeec7c9f490bd6782453dff2ade0e289a3348"
strip_components = 1
description = "Like GNU grep applied to the network layer"
homepage = "https://github.com/jpr5/ngrep"
license = "MIT"
deps = ["libpcap", "pcre2"]

[build]
system = "autotools"
configure_args = ["--enable-ipv6", "--enable-pcre2", "--disable-pcap-restart"]
tools = ["pkg-config"]

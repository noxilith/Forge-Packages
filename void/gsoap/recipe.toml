# Imported from Void Linux's template for 'gsoap'. Review before relying on it.
# hooks not translated: post_patch, pre_build, pre_configure
# settings not translated: CFLAGS, CXXFLAGS
# needs, but Forge has no recipe for yet: ca-certificates, unzip
[package]
name = "gsoap"
version = "2.8.145"
archive = "https://downloads.sourceforge.net/sourceforge/gsoap2/gsoap_2.8.145.zip"
sha256 = "176767e2443f3586048108209d9424a71b0ae7ba2658655878ab513edec1eede"
strip_components = 1
description = "Toolkit for SOAP and REST Web Services and XML-Based Applications"
homepage = "https://www.genivia.com/dev.html"
license = "GPL-2.0-only"
deps = ["openssl", "zlib"]
patches = ["patches/implicit-function.patch", "patches/libtool.patch"]

[build]
system = "autotools"
configure_args = ["--enable-ipv6"]
tools = ["flex"]

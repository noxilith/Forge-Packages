# Imported from Void Linux's template for 'solarus'. Review before relying on it.
# needs, but Forge has no recipe for yet: LuaJIT, SDL2_image, physfs, qt5
[package]
name = "solarus"
version = "2.1.4"
archive = "https://gitlab.com/solarus-games/solarus/-/archive/v2.1.4/solarus-v2.1.4.tar.bz2"
sha256 = "47f997bb395d5abab89d9cfe3c09ffa12bef728660d3e292bbba2a2c801dbe95"
strip_components = 1
description = "Action-RPG game engine"
homepage = "http://www.solarus-games.org/"
license = "GPL-3.0-or-later"
deps = ["SDL2_ttf", "glm", "libmodplug", "libopenal"]

[build]
system = "cmake"

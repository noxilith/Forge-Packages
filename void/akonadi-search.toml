# Imported from Void Linux's template for 'akonadi-search'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "akonadi-search"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/akonadi-search-26.08.1.tar.xz"
sha256 = "6bce5595f5f1f0d49eaa777d86c4c74c83086e93f17f18a93c51c24738a297a2"
strip_components = 1
description = "Libraries and daemons to implement searching in Akonadi"
homepage = "https://community.kde.org/KDE_PIM"
license = "GPL-2.0-or-later, LGPL-2.1-or-later"
deps = ["akonadi-mime", "kf6-akonadi", "kf6-kcalendarcore", "kf6-kcmutils", "kf6-kcontacts", "kf6-krunner", "ktextaddons", "xapian-core"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["AppStream", "corrosion", "extra-cmake-modules", "gettext", "kf6-kconfig", "kf6-kcoreaddons", "kf6-kpackage", "qt6-base"]

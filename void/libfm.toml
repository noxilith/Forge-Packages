# Imported from Void Linux's template for 'libfm'. Review before relying on it.
# hooks not translated: post_install, pre_configure
# settings not translated: conf_files
# needs, but Forge has no recipe for yet: dbus-glib, intltool
[package]
name = "libfm"
version = "1.4.0"
archive = "https://github.com/lxde/libfm/archive/refs/tags/1.4.0.tar.gz"
sha256 = "7d7b616411992389a4b7f35796109d605f30bc2ceab84d4081d1665254ebbf82"
strip_components = 1
description = "Core library of PCManFM file manager"
homepage = "https://github.com/lxde/libfm"
license = "GPL-2.0-or-later"
deps = ["gtk+3", "libexif", "libfm-extra", "menu-cache"]

[build]
system = "autotools"
configure_args = ["--enable-udisks", "--disable-static", "--with-gtk=3"]
tools = ["pkg-config"]
deps = ["gettext", "glib", "gtk-doc", "vala"]

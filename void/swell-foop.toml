# Imported from Void Linux's template for 'swell-foop'. Review before relying on it.
# needs, but Forge has no recipe for yet: itstool
[package]
name = "swell-foop"
version = "48.1"
archive = "https://download.gnome.org/sources/swell-foop/48/swell-foop-48.1.tar.xz"
sha256 = "5b9630878fe701aee751ed46ff765c2bcd9f815a4e5582676a3c26b31182031b"

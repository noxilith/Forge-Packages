# Imported from Void Linux's template for 'rubberband'. Review before relying on it.
# needs, but Forge has no recipe for yet: fftw, ladspa-sdk
[package]
name = "rubberband"
version = "4.0.0"
archive = "https://breakfastquay.com/files/releases/rubberband-4.0.0.tar.bz2"
sha256 = "af050313ee63bc18b35b2e064e5dce05b276aaf6d1aa2b8a82ced1fe2f8028e9"
strip_components = 1
description = "Time-stretching and pitch-shifting audio library"
homepage = "https://breakfastquay.com/rubberband/"
license = "GPL-2.0-or-later"
deps = ["lv2", "vamp-plugin-sdk"]

[build]
system = "meson"
configure_args = ["-Dfft=fftw"]
tools = ["pkg-config"]

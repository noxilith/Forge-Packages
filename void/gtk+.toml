# Imported from Void Linux's template for 'gtk+'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, pre_configure
# settings not translated: build_helper, CFLAGS, conf_files
[package]
name = "gtk+"
version = "2.24.33"
archive = "https://download.gnome.org/sources/gtk+/2.24/gtk+-2.24.33.tar.xz"
sha256 = "ac2ac757f5942d318a311a54b0c80b5ef295f299c2a73c632f6bfb1ff49cc6da"
strip_components = 1
description = "GTK+ toolkit (v2)"
homepage = "https://gtk.org"
license = "LGPL-2.1-or-later"
deps = ["at-spi2-core", "cairo", "dbus", "fontconfig", "gdk-pixbuf", "glib", "gtk+3", "libXcomposite", "libXcursor", "libXdamage", "libXext", "libXi", "libXinerama", "libXrandr", "libXrender", "pango", "shared-mime-info"]

[build]
system = "autotools"
configure_args = ["--enable-man", "--with-xinput"]
tools = ["perl", "pkg-config"]
deps = ["xmlto"]

# Imported from Void Linux's template for 'qca-qt5'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: botan, ca-certificates, nss, qt5
[package]
name = "qca-qt5"
version = "2.3.10"
archive = "https://download.kde.org/stable/qca/2.3.10/qca-2.3.10.tar.xz"
sha256 = "1c5b722da93d559365719226bb121c726ec3c0dc4c67dea34f1e50e4e0d14a02"
strip_components = 1
description = "Qt5 Cryptographic Architecture"
homepage = "https://userbase.kde.org/QCA"
license = "LGPL-2.1-or-later"
deps = ["libgcrypt", "openssl"]
patches = ["patches/cmake.patch"]

[build]
system = "cmake"
configure_args = ["-DUSE_RELATIVE_PATHS=true"]
tools = ["pkg-config"]

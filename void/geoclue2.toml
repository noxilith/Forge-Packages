# Imported from Void Linux's template for 'geoclue2'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# settings not translated: build_helper, make_dirs, conf_files, lib32disabled
# needs, but Forge has no recipe for yet: avahi-discover, intltool
[package]
name = "geoclue2"
version = "2.8.1"
archive = "https://gitlab.freedesktop.org/geoclue/geoclue/-/archive/2.8.1/geoclue-2.8.1.tar.bz2"
sha256 = "1b5de03936bd8c031a1f6207c1857fa25a9aa1453ffe742f32a0a4a3281f2629"
strip_components = 1
description = "Geoinformation Service (2.x series)"
homepage = "https://gitlab.freedesktop.org/geoclue/geoclue/wikis/home"
license = "LGPL-2.1-or-later"
deps = ["ModemManager", "json-glib", "libnotify", "libsoup3"]

[build]
system = "meson"
configure_args = ["-Ddbus-srv-user=_geoclue2", "-Dgtk-doc=false"]
tools = ["pkg-config"]
deps = ["glib", "vala"]

# Imported from Void Linux's template for 'kdepim-addons'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: discount, qt6-tools
[package]
name = "kdepim-addons"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/kdepim-addons-26.08.1.tar.xz"
sha256 = "09a604e46cbacde0cc99848e18f51ae64019382beb1da11e94319bc48cc8937d"
strip_components = 1
description = "Addons for KDE PIM applications"
homepage = "https://invent.kde.org/pim/kdepim-addons"
license = "GPL-2.0-or-later, GPL-3.0-or-later, LGPL-2.1-or-later, AGPL-3.0-or-later, BSD-3-Clause, BSD-2-Clause"
deps = ["akonadi-import-wizard", "incidenceeditor", "kaddressbook", "kf6-kcmutils", "kf6-kconfig", "kf6-kcoreaddons", "kf6-kdoctools", "kf6-kpackage", "kitinerary", "kontactinterface", "kpkpass", "ktnef", "libksieve", "mailcommon", "mailimporter", "messagelib", "poppler-qt5", "qt6-base"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "gettext"]

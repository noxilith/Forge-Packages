# Imported from Void Linux's template for 'primecount'. Review before relying on it.
# hooks not translated: post_install
[package]
name = "primecount"
version = "8.5"
archive = "https://github.com/kimwalisch/primecount/archive/refs/tags/v8.5.tar.gz"
sha256 = "a2dd9714e723388987183776d068d6845b82b2cf8ea44ecb6cea3fd9dde938ea"
strip_components = 1
description = "Fast prime counting function"
homepage = "https://github.com/kimwalisch/primecount/"
license = "BSD-2-Clause"
deps = ["primesieve"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTS=ON", "-DBUILD_LIBPRIMESIEVE=OFF", "-DBUILD_SHARED_LIBS=ON", "-DBUILD_STATIC_LIBS=OFF"]

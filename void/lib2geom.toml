# Imported from Void Linux's template for 'lib2geom'. Review before relying on it.
# needs, but Forge has no recipe for yet: boost, python3-Cython, ragel
[package]
name = "lib2geom"
version = "1.4"
archive = "https://gitlab.com/inkscape/lib2geom/-/archive/1.4/lib2geom-1.4.tar.bz2"
sha256 = "717a87ce7f2192271a789c1273ae7b432856c522647b9fe33bb4dd662942b3ea"
strip_components = 1
description = "Easy to use 2D geometry library for c++"
homepage = "https://gitlab.com/inkscape/lib2geom"
license = "LGPL-2.1-or-later, MPL-1.1"
deps = ["cairo", "double-conversion", "gsl", "gtest", "gtk+3"]

[build]
system = "cmake"
configure_args = ["-D2GEOM_BUILD_SHARED=ON"]
tools = ["pkg-config"]
deps = ["samurai"]

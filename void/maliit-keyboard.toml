# Imported from Void Linux's template for 'maliit-keyboard'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: libchewing, libpinyin, qt5
[package]
name = "maliit-keyboard"
version = "2.3.1"
archive = "https://github.com/maliit/keyboard/archive/refs/tags/2.3.1.tar.gz"
sha256 = "c3e1eb985b8ae7ce4e3e28412b7e797ff5db437ccd327e0d852a3c37f17fe456"
strip_components = 1
description = "Virtual keyboard based on Maliit framework"
homepage = "https://maliit.github.io"
license = "LGPL-2.1-only"
deps = ["glib", "hunspell", "maliit-framework"]

[build]
system = "cmake"
configure_args = ["-Denable-presage=OFF", "-Denable-tests=OFF"]
tools = ["pkg-config"]
deps = ["gettext"]

# Imported from Void Linux's template for 'procps-ng'. Review before relying on it.
# 3 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_extract, post_install
# settings not translated: conf_files
# needs, but Forge has no recipe for yet: ncurses
[package]
name = "procps-ng"
version = "4.0.6"
archive = "https://downloads.sourceforge.net/sourceforge/procps-ng/Production/procps-ng-4.0.6.tar.xz"
sha256 = "67bea6fbc3a42a535a0230c9e891e5ddfb4d9d39422d46565a2990d1ace15216"
strip_components = 1
description = "Utilities for monitoring your system and its processes"
homepage = "https://gitlab.com/procps-ng/procps"
license = "GPL-2.0-or-later, LGPL-2.1-or-later"

[build]
system = "autotools"
configure_args = ["--exec-prefix=/", "--disable-kill", "--enable-watch8bit", "--disable-modern-top", "--without-systemd"]
tools = ["pkg-config"]
deps = ["gettext"]

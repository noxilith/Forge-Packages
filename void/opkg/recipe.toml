# Imported from Void Linux's template for 'opkg'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: pre_configure
# needs, but Forge has no recipe for yet: zstd
[package]
name = "opkg"
version = "0.6.1"
archive = "https://downloads.yoctoproject.org/releases/opkg/opkg-0.6.1.tar.gz"
sha256 = "e87fccb575c64d3ac0559444016a2795f12125986a0da896bab97c4a1a2f1b2a"
strip_components = 1
description = "Lightweight package management system, compatible with ipkg"
homepage = "http://code.google.com/p/opkg/"
license = "GPL-2.0-or-later"
deps = ["curl", "libarchive"]
patches = ["patches/lock-var-run.patch"]

[build]
system = "autotools"
configure_args = ["--enable-sha256", "--enable-zstd", "--without-libsolv", "--with-static-libopkg"]
tools = ["pkg-config"]

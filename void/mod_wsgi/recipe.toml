# Imported from Void Linux's template for 'mod_wsgi'. Review before relying on it.
# hooks not translated: pre_configure
# settings not translated: lib32disabled
[package]
name = "mod_wsgi"
version = "5.0.2"
archive = "https://github.com/GrahamDumpleton/mod_wsgi/archive/5.0.2.tar.gz"
sha256 = "9a0fdb61405abc300ec6b100c440dd98cf31cb5f97aeef4207390937298cad20"
strip_components = 1
description = "Python WSGI adapter module for Apache"
homepage = "https://modwsgi.readthedocs.io/en/develop/"
license = "Apache-2.0"
deps = ["apache", "apr"]
patches = ["patches/cross-python.patch"]

[build]
system = "autotools"
configure_args = ["--with-python=python3"]
tools = ["perl"]

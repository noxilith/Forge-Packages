# Imported from Void Linux's template for 'lxrandr'. Review before relying on it.
# hooks not translated: pre_configure
# needs, but Forge has no recipe for yet: intltool
[package]
name = "lxrandr"
version = "0.3.3"
archive = "https://github.com/lxde/lxrandr/archive/refs/tags/0.3.3.tar.gz"
sha256 = "24d0abaee830b0b2973ba9d2e46b3c801445342f7d5d3297c021a8a4a471f512"
strip_components = 1
description = "LXDE Monitor configuration tool"
homepage = "http://lxde.org/"
license = "GPL-2.0-or-later"
deps = ["desktop-file-utils", "gtk+3", "xrandr"]

[build]
system = "autotools"
configure_args = ["--enable-gtk3"]
tools = ["pkg-config"]
deps = ["gettext", "glib"]

# Imported from Void Linux's template for 'usbguard'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: make_dirs, conf_files
# needs, but Forge has no recipe for yet: asciidoc
[package]
name = "usbguard"
version = "1.1.4"
archive = "https://github.com/USBGuard/usbguard/releases/download/usbguard-1.1.4/usbguard-1.1.4.tar.gz"
sha256 = "7d76b75e779e3c9e6c2fc10e7389dfa34056864c9f0c6eaca722687b7e75893c"
strip_components = 1
description = "Tool for whitelisting and blacklisting USB devices"
homepage = "https://usbguard.github.io"
license = "GPL-2.0-or-later"
deps = ["libcap-ng", "libqb", "libseccomp", "libsodium", "polkit", "protobuf"]
patches = ["patches/musl.patch"]

[build]
system = "autotools"
configure_args = ["--with-crypto-library=sodium", "--with-bundled-catch", "--with-bundled-pegtl"]
tools = ["pkg-config"]
deps = ["glib"]

# Imported from Void Linux's template for 'shaderc'. Review before relying on it.
# hooks not translated: pre_configure
# settings not translated: CXXFLAGS, LDFLAGS
# needs, but Forge has no recipe for yet: glslang
[package]
name = "shaderc"
version = "2026.4"
archive = "https://github.com/google/shaderc/archive/v2026.4.tar.gz"
sha256 = "f06ce5bcca94e5df7f34e115743597d0ad2e13c5fe9213c67dc8c76031241947"
strip_components = 1
description = "Collection of tools, libraries and tests for shader compilation"
homepage = "https://github.com/google/shaderc"
license = "Apache-2.0"
deps = ["SPIRV-Headers", "SPIRV-Tools"]

[build]
system = "cmake"
configure_args = ["-DSHADERC_SKIP_TESTS=ON", "-DSHADERC_SKIP_EXAMPLES=ON", "-DSHADERC_SKIP_COPYRIGHT_CHECK=ON"]

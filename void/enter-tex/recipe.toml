# Imported from Void Linux's template for 'enter-tex'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, pre_build
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: itstool
[package]
name = "enter-tex"
version = "3.49.0"
archive = "https://gitlab.gnome.org/World/gedit/enter-tex/-/archive/3.49.0/enter-tex-3.49.0.tar.gz"
sha256 = "3d14fd0e6cd5fa761ab88b584efd2ea620090e37fe9e162332fafa08c4196928"
strip_components = 1
description = "LaTeX editor for the GNOME desktop"
homepage = "https://gitlab.gnome.org/World/gedit/enter-tex"
license = "GPL-3.0-or-later"
deps = ["glib", "gsettings-desktop-schemas", "gspell", "gtk+3", "libgedit-gtksourceview", "libgedit-tepl", "libgee"]
patches = ["patches/fix-actions.patch"]

[build]
system = "meson"
configure_args = ["-Ddconf_migration=false"]
tools = ["pkg-config"]
deps = ["desktop-file-utils", "gettext", "gobject-introspection", "vala"]

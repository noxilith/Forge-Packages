# Imported from Void Linux's template for 'xfce4-notifyd'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: dbus-glib, hicolor-icon-theme, libcanberra, sqlite
[package]
name = "xfce4-notifyd"
version = "0.9.7"
archive = "https://archive.xfce.org/src/apps/xfce4-notifyd/0.9/xfce4-notifyd-0.9.7.tar.bz2"
sha256 = "170d18fd5f40cce823ffc7ae3d7e21644007c3f45808ab4835f0401d21b3516a"
strip_components = 1
description = "Simple, visually-appealing notification daemon for Xfce"
homepage = "https://goodies.xfce.org/projects/applications/xfce4-notifyd"
license = "GPL-2.0-or-later"
deps = ["desktop-file-utils", "glib", "gtk-layer-shell", "libnotify", "wayland", "xfce4-panel"]

[build]
system = "meson"
configure_args = ["-Ddbus-start-daemon=true"]
tools = ["pkg-config"]
deps = ["gettext"]

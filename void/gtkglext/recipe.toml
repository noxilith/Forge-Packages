# Imported from Void Linux's template for 'gtkglext'. Review before relying on it.
# hooks not translated: post_patch, pre_configure
[package]
name = "gtkglext"
version = "1.2.0"
archive = "https://downloads.sourceforge.net/sourceforge/gtkglext/gtkglext/1.2.0/gtkglext-1.2.0.tar.gz"
sha256 = "e5073f3c6b816e7fa67d359d9745a5bb5de94a628ac85f624c992925a46844f9"
strip_components = 1
description = "OpenGL extension to GTK+"
homepage = "https://projects.gnome.org/gtkglext"
license = "GPL-2.0-or-later, LGPL-2.1-or-later"
deps = ["glu", "gtk+", "libXt"]
patches = ["patches/Removing_deprecated_flags.patch", "patches/kill-pangox.patch", "patches/name_conflict.patch"]

[build]
system = "autotools"
configure_args = ["--disable-static"]
tools = ["pkg-config"]
deps = ["glib"]

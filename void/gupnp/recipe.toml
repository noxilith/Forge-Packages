# Imported from Void Linux's template for 'gupnp'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: docbook-xsl
[package]
name = "gupnp"
version = "1.6.8"
archive = "https://download.gnome.org/sources/gupnp/1.6/gupnp-1.6.8.tar.xz"
sha256 = "70a003cebd68577293fb3e6af49ff902203bf8768b2fc5d651ddc1f0fa1e11e9"
strip_components = 1
description = "GObject-based library for UPnP"
homepage = "https://wiki.gnome.org/Projects/GUPnP"
license = "LGPL-2.1-or-later"
deps = ["glib", "gssdp", "libsoup3", "libxml2"]
patches = ["patches/fix-tests.patch"]

[build]
system = "meson"
configure_args = ["-Dexamples=false"]
tools = ["pkg-config"]
deps = ["libxslt"]

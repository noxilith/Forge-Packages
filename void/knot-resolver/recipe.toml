# Imported from Void Linux's template for 'knot-resolver'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# settings not translated: conf_files
# needs, but Forge has no recipe for yet: LuaJIT, lmdb
[package]
name = "knot-resolver"
version = "6.2.0"
archive = "https://secure.nic.cz/files/knot-resolver/knot-resolver-6.2.0.tar.xz"
sha256 = "b44633bc843180c0bc7c77cf7b15fe571243ae992b4ddb74afdee4cfa803701b"
strip_components = 1
description = "Full caching DNS resolver implementation"
homepage = "https://www.knot-resolver.cz/"
license = "GPL-3.0-or-later"
deps = ["fstrm", "gnutls", "knot", "libcap-ng", "libedit", "libuv", "nghttp2", "protobuf-c"]
patches = ["patches/fix-cross-build.patch"]

[build]
system = "meson"
configure_args = ["-Dinstall_kresd_conf=enabled", "-Dgroup=_knot_resolver", "-Duser=_knot_resolver", "-Dkres_gen_test=false"]
tools = ["pkg-config"]

# Imported from Void Linux's template for 'kf6-kimageformats'. Review before relying on it.
# needs, but Forge has no recipe for yet: kf6-base, libavif, libjxl, qt6-tools
[package]
name = "kf6-kimageformats"
version = "6.30.0"
archive = "https://download.kde.org/stable/frameworks/6.30/kimageformats-6.30.0.tar.xz"
sha256 = "f74ea9ede7877afb66f4d7dea567f074bf63d806a824c87a9d9067d05848a316"
strip_components = 1
description = "KDE Plugins to allow QImage to support extra file formats"
homepage = "https://invent.kde.org/frameworks/kimageformats"
license = "LGPL-2.1-or-later"
deps = ["kf6-karchive", "libheif", "libraw", "openexr"]

[build]
system = "cmake"
configure_args = ["-DKIMAGEFORMATS_HEIF=ON", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "qt6-base"]

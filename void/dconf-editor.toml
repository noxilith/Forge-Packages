# Imported from Void Linux's template for 'dconf-editor'. Review before relying on it.
# needs, but Forge has no recipe for yet: docbook-xsl
[package]
name = "dconf-editor"
version = "45.0.1"
archive = "https://download.gnome.org/sources/dconf-editor/45/dconf-editor-45.0.1.tar.xz"
sha256 = "1180297678eedae6217cc514a2638c187d2f1d1ef2720cb9079b740c429941dd"
strip_components = 1
description = "Low-level configuration system - GTK+ editor"
homepage = "https://wiki.gnome.org/Apps/DconfEditor"
license = "GPL-3.0-or-later"
deps = ["dconf", "gtk+3", "libhandy1"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["desktop-file-utils", "gettext", "glib", "libxslt", "vala"]

# Imported from Void Linux's template for 'blueprint-compiler'. Review before relying on it.
# needs, but Forge has no recipe for yet: python3-packaging-bootstrap
[package]
name = "blueprint-compiler"
version = "0.22.2"
archive = "https://download.gnome.org/sources/blueprint-compiler/0.22/blueprint-compiler-0.22.2.tar.xz"
sha256 = "231d72efbac931c235ac3e022fe94982095c20d88721d9a8dcf60152f2017e07"
strip_components = 1

# Imported from Void Linux's template for 'squid'. Review before relying on it.
# 7 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, pre_configure
# settings not translated: make_dirs, conf_files
# needs, but Forge has no recipe for yet: libnetfilter_conntrack, perl
[package]
name = "squid"
version = "7.6"
archive = "https://github.com/squid-cache/squid/releases/download/SQUID_7_6/squid-7.6.tar.gz"
sha256 = "57a385d0435768da1f6a469a251f3c951bb79f0ea6d3f04c569d5a50c20e678a"
strip_components = 1
description = "Caching proxy for the Web"
homepage = "http://www.squid-cache.org/"
license = "GPL-2.0-or-later"
deps = ["libcap", "libxml2", "openldap", "pam"]

[build]
system = "autotools"
configure_args = ["--enable-auth", "--enable-auth-basic", "--enable-auth-ntlm", "--enable-auth-digest", "--enable-auth-negotiate", "--enable-esi", "--enable-removal-policies=lru,heap", "--enable-storeio=aufs,ufs,diskd,rock", "--enable-delay-pools", "--enable-arp-acl", "--enable-snmp", "--enable-icmp", "--enable-linux-netfilter", "--enable-ident-lookups", "--enable-cache-digests", "--enable-htcp", "--enable-epoll", "--with-large-files", "--with-default-user=squid", "--enable-async-io", "--enable-icap-client", "--enable-ssl-crtd", "--disable-arch-native", "--disable-strict-error-checking", "--enable-wccpv2", "--with-build-environment=default"]
tools = ["perl", "pkg-config"]

# Imported from Void Linux's template for 'sleuthkit'. Review before relying on it.
# hooks not translated: post_extract, pre_configure
# needs, but Forge has no recipe for yet: perl, sqlite
[package]
name = "sleuthkit"
version = "4.13.0"
archive = "https://github.com/sleuthkit/sleuthkit/archive/sleuthkit-4.13.0.tar.gz"
sha256 = "08cb3f030fc7c3fd73f5ff418f83be309aa59cd90f146e07b529172271633a08"
strip_components = 1
description = "File system and media management forensic analysis tools"
homepage = "https://www.sleuthkit.org/"
license = "GPL-2.0-only, IPL-1.0, CPL-1.0"
deps = ["libewf", "zlib"]

[build]
system = "autotools"

# Imported from Void Linux's template for 'geany-plugins'. Review before relying on it.
# hooks not translated: post_patch, pre_build, pre_configure
# needs, but Forge has no recipe for yet: ctpl, intltool, libwebkit2gtk41, lua51
[package]
name = "geany-plugins"
version = "2.1"
archive = "https://download.geany.org/geany-plugins/geany-plugins-2.1.tar.gz"
sha256 = "77ec3da07be809357ba9c986e9b72d2eca343008ccc0793673c9dcac2ad8dae1"
strip_components = 1
description = "Geany IDE plugins"
homepage = "http://plugins.geany.org"
license = "GPL-2.0-or-later"
deps = ["enchant2", "geany", "gpgme", "gtkspell", "libgit2", "vte3", "zlib"]

[build]
system = "autotools"
configure_args = ["--enable-all-plugins", "--disable-geniuspaste", "--disable-updatechecker", "--disable-debugger"]
tools = ["pkg-config"]
deps = ["gettext", "glib", "vala"]

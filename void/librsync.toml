# Imported from Void Linux's template for 'librsync'. Review before relying on it.
# hooks not translated: post_install, pre_configure
# needs, but Forge has no recipe for yet: bzip2
[package]
name = "librsync"
version = "2.3.4"
archive = "https://github.com/librsync/librsync/archive/v2.3.4.tar.gz"
sha256 = "a0dedf9fff66d8e29e7c25d23c1f42beda2089fb4eac1b36e6acd8a29edfbd1f"
strip_components = 1
description = "Library that implements the rsync remote-delta algorithm (rdiff)"
homepage = "http://librsync.sourceforge.net/"
license = "LGPL-2.1-or-later"
deps = ["popt", "zlib"]

[build]
system = "cmake"
tools = ["perl"]

# Imported from Void Linux's template for 'akonadi-mime'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "akonadi-mime"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/akonadi-mime-26.08.1.tar.xz"
sha256 = "344240cc5277cbc0a68c913f6a4a138287adbd7651f9fb7ef36cf10a70538993"
strip_components = 1
description = "Libraries and daemons to implement basic email handling"
homepage = "https://community.kde.org/KDE_PIM/Akonadi"
license = "LGPL-2.1-or-later, GPL-2.0-or-later"
deps = ["kf6-akonadi", "kf6-kconfig", "kf6-kcoreaddons", "kf6-kdoctools", "kf6-ki18n", "kf6-kio", "kf6-kitemmodels", "kf6-kmime", "kf6-kxmlgui", "qt6-declarative"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "gettext", "libxslt", "qt6-base", "shared-mime-info"]

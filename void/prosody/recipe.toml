# Imported from Void Linux's template for 'prosody'. Review before relying on it.
# 3 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_configure, post_install
# settings not translated: make_dirs, conf_files
# needs, but Forge has no recipe for yet: lua51-luasocket, lua54, lua54-luaexpat, lua54-luafilesystem, lua54-luasec, lua54-unbound
[package]
name = "prosody"
version = "13.0.6"
archive = "https://prosody.im/downloads/source/prosody-13.0.6.tar.gz"
sha256 = "ec696f9cf562c3af4a04b07d3fb36a1cedcc4e69a392fddcfc524bc67d93050f"
strip_components = 1
description = "Lightweight and extensible Jabber/XMPP server written in Lua"
homepage = "https://prosody.im/"
license = "MIT"
deps = ["libicu78", "libidn", "openssl"]
patches = ["patches/config.patch"]

[build]
system = "autotools"
configure_args = ["--ostype=linux", "--no-example-certs", "--lua-version=5.4", "--lua-suffix=5.4", "--runwith=lua5.4"]

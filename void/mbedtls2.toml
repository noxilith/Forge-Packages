# Imported from Void Linux's template for 'mbedtls2'. Review before relying on it.
# hooks not translated: post_install, pre_configure
[package]
name = "mbedtls2"
version = "2.28.10"
archive = "https://github.com/ARMmbed/mbedtls/archive/refs/tags/v2.28.10.tar.gz"
sha256 = "0f2e0525903a89ae1d39ce439d858be66933bda54c5b6102b72a29ed8fe7c088"
strip_components = 1
description = "Portable cryptographic TLS library (version 2)"
homepage = "https://tls.mbed.org/"
license = "Apache-2.0"

[build]
system = "cmake"
configure_args = ["-DENABLE_TESTING=1", "-DUSE_SHARED_MBEDTLS_LIBRARY=1"]
tools = ["perl"]

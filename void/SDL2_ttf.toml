# Imported from Void Linux's template for 'SDL2_ttf'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: harfbuzz
[package]
name = "SDL2_ttf"
version = "2.24.0"
archive = "https://www.libsdl.org/projects/SDL_ttf/release/SDL2_ttf-2.24.0.tar.gz"
sha256 = "0b2bf1e7b6568adbdbc9bb924643f79d9dedafe061fa1ed687d1d9ac4e453bfd"
strip_components = 1
description = "Use TrueType fonts in your SDL 2.x applications"
homepage = "https://github.com/libsdl-org/SDL_ttf"
license = "Zlib"
deps = ["SDL2", "freetype"]

[build]
system = "cmake"
configure_args = ["-DSDL2TTF_HARFBUZZ=ON"]

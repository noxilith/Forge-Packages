# Imported from Void Linux's template for 'gnustep-back'. Review before relying on it.
# needs, but Forge has no recipe for yet: gnustep-make
[package]
name = "gnustep-back"
version = "0.32.0"
archive = "https://github.com/gnustep/libs-back/releases/download/back-0_32_0/gnustep-back-0.32.0.tar.gz"
sha256 = "ce171095012ac5d845f6e1285a5c71e011fd00aa5981ea1d5a5183706478218d"
strip_components = 1
description = "Backend library for drawing GNUstep GUIs"
homepage = "http://www.gnustep.org/"
license = "GPL-3.0-or-later"
deps = ["cairo", "freetype", "gnustep-base", "gnustep-gui", "libXmu", "libXt", "libart"]

[build]
system = "autotools"
tools = ["pkg-config"]

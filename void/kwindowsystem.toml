# Imported from Void Linux's template for 'kwindowsystem'. Review before relying on it.
# needs, but Forge has no recipe for yet: qt5
[package]
name = "kwindowsystem"
version = "5.116.0"
archive = "https://download.kde.org/stable/frameworks/5.116/kwindowsystem-5.116.0.tar.xz"
sha256 = "7ec97633752fbde2505b40d762d933b642cae42b6b86d6e801fbdfcd2eeb5334"
strip_components = 1
description = "KDE frameworks - Access to the windowing system"
homepage = "https://invent.kde.org/frameworks/kwindowsystem"
license = "LGPL-2.1-or-later"
deps = ["libXfixes", "xcb-util-keysyms"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "kcoreaddons"]

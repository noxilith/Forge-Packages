# Imported from Void Linux's template for 'nvme-cli'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: conf_files
[package]
name = "nvme-cli"
version = "2.16"
archive = "https://github.com/linux-nvme/nvme-cli/archive/v2.16.tar.gz"
sha256 = "989682ed7b250a2c7a8127e362ffc5d29f5c370127abe405be09c73216da2b97"
strip_components = 1
description = "NVMe management command line interface"
homepage = "https://nvmexpress.org"
license = "GPL-2.0-only"
deps = ["json-c", "libnvme", "zlib"]

[build]
system = "meson"
configure_args = ["-Ddocs=man", "-Dudevrulesdir=lib/udev/rules.d"]
tools = ["pkg-config"]

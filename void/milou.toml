# Imported from Void Linux's template for 'milou'. Review before relying on it.
# needs, but Forge has no recipe for yet: kde-plasma-base, qt6-tools
[package]
name = "milou"
version = "6.7.5"
archive = "https://download.kde.org/stable/plasma/6.7.5/milou-6.7.5.tar.xz"
sha256 = "b43c7cb765109a91ad9ef7d5856c4584b380349837baf63ccca4b45a67925ab5"
strip_components = 1
description = "KDE dedicated search application built on top of Baloo"
homepage = "https://invent.kde.org/plasma/milou"
license = "GPL-2.0-or-later, LGPL-2.1-or-later"
deps = ["kf6-kitemmodels", "kf6-kpackage", "kf6-krunner", "kf6-ksvg", "kf6-kwindowsystem", "libplasma", "qt6-base", "qt6-declarative"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "gettext", "kf6-kconfig"]

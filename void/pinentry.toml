# Imported from Void Linux's template for 'pinentry'. Review before relying on it.
# hooks not translated: post_install, pre_build
# needs, but Forge has no recipe for yet: ncurses
[package]
name = "pinentry"
version = "1.3.3"
archive = "https://gnupg.org/ftp/gcrypt/pinentry/pinentry-1.3.3.tar.bz2"
sha256 = "c2970f16d6afb66ecddfca767d743936c86239bff936eed7fd7597a678414b63"
strip_components = 1
description = "PIN or passphrase entry dialogs for GnuPG"
homepage = "https://www.gnupg.org/related_software/pinentry/index.html"
license = "GPL-2.0-or-later"
deps = ["libassuan", "libgpg-error"]

[build]
system = "autotools"
configure_args = ["--without-libcap", "--enable-pinentry-tty", "--enable-pinentry-curses", "--enable-fallback-curses", "--enable-pinentry-emacs", "--disable-pinentry-qt", "--disable-libsecret", "--disable-pinentry-gtk2", "--disable-pinentry-gnome3"]
tools = ["pkg-config"]

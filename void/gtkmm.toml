# Imported from Void Linux's template for 'gtkmm'. Review before relying on it.
[package]
name = "gtkmm"
version = "3.24.8"
archive = "https://download.gnome.org/sources/gtkmm/3.24/gtkmm-3.24.8.tar.xz"
sha256 = "d2940c64922e5b958554b23d4c41d1839ea9e43e0d2e5b3819cfb46824a098c4"
strip_components = 1
description = "C++ bindings for The GTK+ toolkit (v3)"
homepage = "https://gtkmm.org"
license = "LGPL-2.1-or-later"
deps = ["atkmm", "glibmm", "gtk+3", "pangomm"]

[build]
system = "meson"
configure_args = ["-Dbuild-demos=false"]
tools = ["pkg-config"]
deps = ["gdk-pixbuf", "mm-common"]

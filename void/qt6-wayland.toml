# Imported from Void Linux's template for 'qt6-wayland'. Review before relying on it.
# needs, but Forge has no recipe for yet: mesa
[package]
name = "qt6-wayland"
version = "6.11.2"
archive = "https://download.qt.io/official_releases/qt/6.11/6.11.2/submodules/qtwayland-everywhere-src-6.11.2.tar.xz"
sha256 = "8eb7615e39332a10f506e8dd70f02d5954bb5949ff54f6dcbf8bd6168222f9df"
strip_components = 1
description = "Cross-platform application and UI framework - Wayland"
homepage = "https://www.qt.io"
license = "GPL-3.0-only WITH Qt-GPL-exception-1.0, LGPL-3.0-only, GPL-2.0-or-later"
deps = ["Vulkan-Headers", "libXcomposite", "libdrm", "libxkbcommon", "qt6-base", "qt6-declarative", "wayland"]

[build]
system = "cmake"
tools = ["perl", "pkg-config"]

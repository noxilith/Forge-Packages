# Imported from Void Linux's template for 'bcc'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_extract
# needs, but Forge has no recipe for yet: ncurses, python3-packaging-bootstrap, python3-setuptools
[package]
name = "bcc"
version = "0.37.0"
archive = "https://github.com/iovisor/bcc/releases/download/v0.37.0/bcc-src-with-submodule-0.37.0.tar.gz"
sha256 = "7734b780202b22dff335780b506b56833ec6cf7435e03b1346d5bf644b4e1f95"
strip_components = 1
description = "BPF-based Linux IO analysis, networking, monitoring, and more"
homepage = "https://github.com/iovisor/bcc"
license = "Apache-2.0"
deps = ["elfutils", "flex", "llvm22", "zlib"]
patches = ["patches/musl.patch"]

[build]
system = "cmake"
configure_args = ["-DREVISION=0.37.0", "-DENABLE_LLVM_SHARED=1"]
tools = ["flex"]

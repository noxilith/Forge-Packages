# Imported from Void Linux's template for 'apostrophe'. Review before relying on it.
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: libwebkit2gtk41, python3-chardet, python3-pypandoc, python3-setuptools, python3-telnetlib-313-and-up
[package]
name = "apostrophe"
version = "2.6.3"
archive = "https://gitlab.gnome.org/World/apostrophe/-/archive/v2.6.3/apostrophe-v2.6.3.tar.gz"
sha256 = "6f73c80146af0820ec705ec8b32ec64f0f323f51de6b6a4cfd4d02f0719876f3"
strip_components = 1
description = "GTK based distraction free Markdown editor"
homepage = "https://gitlab.gnome.org/World/apostrophe"
license = "GPL-3.0-only"
deps = ["glade3", "glib", "gspell", "gtk+3", "iso-codes", "libhandy1", "python3-gobject"]
patches = ["patches/webkit2gtk4.1.patch"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["appstream-glib", "gettext", "sassc"]

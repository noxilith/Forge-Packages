# Imported from Void Linux's template for 'ipset'. Review before relying on it.
# needs, but Forge has no recipe for yet: libmnl
[package]
name = "ipset"
version = "7.24"
archive = "https://ipset.netfilter.org/ipset-7.24.tar.bz2"
sha256 = "fbe3424dff222c1cb5e5c34d38b64524b2217ce80226c14fdcbb13b29ea36112"
strip_components = 1
description = "Administration tool for IP sets"
homepage = "https://ipset.netfilter.org/"
license = "GPL-2.0-only"

[build]
system = "autotools"
configure_args = ["--with-kmod=no", "PKG_CONFIG=pkg-config"]
tools = ["pkg-config"]

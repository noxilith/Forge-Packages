# Imported from Void Linux's template for 'vips'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: doxygen, fftw, gi-docgen, libimagequant, libjxl, libwebp
[package]
name = "vips"
version = "8.18.7"
archive = "https://github.com/libvips/libvips/archive/refs/tags/v8.18.7.tar.gz"
sha256 = "5024b4b36f20e722c267f4a9bfbdbbafb3b37d48d7125cf425c55bbf76cc9286"
strip_components = 1
description = "Fast image processing with low memory needs"
homepage = "https://www.libvips.org/"
license = "LGPL-2.1-or-later"
deps = ["ImageMagick", "cfitsio", "cgif", "expat", "fontconfig", "glib", "highway", "lcms2", "libexif", "libgsf", "libheif", "libjpeg-turbo", "libpng", "librsvg", "openexr", "openjpeg2", "pango", "poppler", "tiff"]

[build]
system = "meson"
configure_args = ["-Dcpp-docs=true", "-Ddocs=true"]
tools = ["pkg-config"]
deps = ["gettext", "graphviz"]

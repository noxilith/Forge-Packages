# Imported from Void Linux's template for 'gnome-clocks'. Review before relying on it.
# needs, but Forge has no recipe for yet: hicolor-icon-theme, itstool
[package]
name = "gnome-clocks"
version = "50.0"
archive = "https://download.gnome.org/sources/gnome-clocks/50/gnome-clocks-50.0.tar.xz"
sha256 = "bf167f7f44f4f2fb424d4716652c9ba1f29e16e49071e26a1bb833f8dce794c6"
strip_components = 1
description = "Clock application for the GNOME Desktop"
homepage = "https://apps.gnome.org/Clocks"
license = "GPL-2.0-or-later"
deps = ["desktop-file-utils", "geoclue2", "geocode-glib", "gnome-desktop", "gtk4", "libadwaita", "libgweather", "libicu78"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["gettext", "glib", "vala", "vorbis-tools"]

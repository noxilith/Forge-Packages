# Imported from Void Linux's template for 'clementine'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: boost, glew, qt5, sqlite
[package]
name = "clementine"
version = "1.4.1"
archive = "https://github.com/clementine-player/Clementine/releases/download/1.4.1-35-g400085808/clementine-1.4.1-35-g400085808.tar.xz"
sha256 = "6333035fd48899768132815cbb6edf3277d247e82d78b74bb505b58baeace84f"
strip_components = 1
description = "Modern music player and library organizer"
homepage = "https://www.clementine-player.org/"
license = "GPL-3.0-or-later"
deps = ["chromaprint", "crypto++", "desktop-file-utils", "glu", "gst-plugins-base1", "libcdio", "libgpod", "liblastfm-qt5", "libmtp", "libmygpo-qt", "libplist", "libusbmuxd", "projectM", "protobuf", "pulseaudio", "taglib"]
patches = ["patches/cmake-version.patch"]

[build]
system = "cmake"
configure_args = ["-DUSE_SYSTEM_TAGLIB=ON", "-DBUILD_WERROR=OFF", "-DUSE_SYSTEM_PROJECTM=ON", "-DFORCE_GIT_REVISION=1.4.1-35-g400085808", "-DCMAKE_CXX_STANDARD=17"]
tools = ["pkg-config"]
deps = ["gettext", "sparsehash"]

# Imported from Void Linux's template for 'libgit2-1.9'. Review before relying on it.
# hooks not translated: post_install, post_patch
# settings not translated: CFLAGS
[package]
name = "libgit2-1.9"
version = "1.9.7"
archive = "https://github.com/libgit2/libgit2/archive/refs/tags/v1.9.7.tar.gz"
sha256 = "1a4fbe7589e814777ae76b64734ad80f4ecad22cd33a22682a2aaea4ae5375e7"
strip_components = 1
description = "Git linkable library 1.9"
homepage = "https://libgit2.org"
license = "GPL-2.0-only WITH GCC-exception-2.0"
deps = ["llhttp", "openssh", "openssl", "zlib"]
patches = ["patches/disable-test-validate_current_user_ownership.patch"]

[build]
system = "cmake"
configure_args = ["-DENABLE_REPRODUCIBLE_BUILDS=ON", "-DBUILD_CLI=OFF", "-DUSE_SSH=exec", "-DUSE_HTTP_PARSER=llhttp"]
tools = ["pkg-config"]

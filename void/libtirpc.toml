# Imported from Void Linux's template for 'libtirpc'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: conf_files
# needs, but Forge has no recipe for yet: mit-krb5
[package]
name = "libtirpc"
version = "1.3.8"
archive = "https://downloads.sourceforge.net/sourceforge/libtirpc/libtirpc-1.3.8.tar.bz2"
sha256 = "8839959bfcc7a0f4c609d8e4f53f1c67ae33de23775ec35beb39ff15adf11920"
strip_components = 1
description = "Transport Independent RPC library (SunRPC replacement)"
homepage = "https://sourceforge.net/projects/libtirpc/"
license = "BSD-3-Clause"
deps = ["libgssglue"]

[build]
system = "autotools"
configure_args = ["--enable-rpcdb"]
tools = ["pkg-config"]

[package]
name = "halloy"
version = "2026.10"
archive = "https://github.com/squidowl/halloy/archive/refs/tags/2026.10.tar.gz"
sha256 = "19b77a7e09cf66ef518bfa5b1e8b3c07713373d7468d30500b093e327729a00b"

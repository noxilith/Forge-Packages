# Imported from Void Linux's template for 'grub-btrfs'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: conf_files
# needs, but Forge has no recipe for yet: grub
[package]
name = "grub-btrfs"
version = "4.14"
archive = "https://github.com/Antynea/grub-btrfs/archive/v4.14.tar.gz"
sha256 = "4fe2f8a49b39e3e561fc51bbc5a0f81a7222c1e9ef8672e014e0ba3bedad20c6"
strip_components = 1
description = "Include btrfs snapshots at Grub menu"
homepage = "https://github.com/Antynea/grub-btrfs"
license = "GPL-3.0-or-later"
deps = ["inotify-tools"]
patches = ["patches/no-root-please.patch"]

[build]
system = "make"

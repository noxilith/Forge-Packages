# Imported from Void Linux's template for 'zeromq'. Review before relying on it.
# needs, but Forge has no recipe for yet: asciidoc
[package]
name = "zeromq"
version = "4.3.5"
archive = "https://github.com/zeromq/libzmq/releases/download/v4.3.5/zeromq-4.3.5.tar.gz"
sha256 = "6653ef5910f17954861fe72332e68b03ca6e4d9c7160eb3a8de5a5a913bfab43"
strip_components = 1
description = "Intelligent Transport Layer"
homepage = "http://www.zeromq.org"
license = "LGPL-3.0-or-later"
deps = ["libsodium"]

[build]
system = "autotools"
configure_args = ["--with-libsodium", "--disable-Werror"]
tools = ["pkg-config"]
deps = ["xmlto"]

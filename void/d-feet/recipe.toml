# Imported from Void Linux's template for 'd-feet'. Review before relying on it.
# hooks not translated: pre_check
# needs, but Forge has no recipe for yet: itstool, python3-pycodestyle
[package]
name = "d-feet"
version = "0.3.16"
archive = "https://download.gnome.org/sources/d-feet/0.3/d-feet-0.3.16.tar.xz"
sha256 = "8733ce4b9a9a54ec185b1d85bf4da9d9d11052882a880760ff60f9779b2d1ccb"
strip_components = 1
description = "D-Bus debugger"
homepage = "https://wiki.gnome.org/action/show/Apps/DFeet"
license = "GPL-2.0-or-later"
deps = ["gobject-introspection", "gtk+3", "libwnck", "python3-gobject"]
patches = ["patches/meson-0.61.patch"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["gettext"]

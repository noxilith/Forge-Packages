# Imported from Void Linux's template for 'pdd'. Review before relying on it.
# needs, but Forge has no recipe for yet: python3-dateutil
[package]
name = "pdd"
version = "1.7"
archive = "https://github.com/jarun/pdd/archive/v1.7.tar.gz"
sha256 = "a81adcac025b08c7c933f028339c55a67d0da6c81845fe3d18fd4187010a63d4"
strip_components = 1
description = "Tiny date, time diff calculator"
homepage = "https://github.com/jarun/pdd"
license = "GPL-3.0-or-later"
patches = ["patches/fix-install.patch"]

[build]
system = "make"

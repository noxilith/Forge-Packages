# Imported from Void Linux's template for 'tilda'. Review before relying on it.
# hooks not translated: pre_configure
[package]
name = "tilda"
version = "2.0.0"
archive = "https://github.com/lanoxx/tilda/archive/tilda-2.0.0.tar.gz"

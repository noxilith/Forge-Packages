# Imported from Void Linux's template for 'colord-kde'. Review before relying on it.
[package]
name = "colord-kde"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/colord-kde-26.08.1.tar.xz"
sha256 = "ff41e51ed655e52bfad85fe74ea17248b1b398ea3c46c0977ab9d26d52551867"
strip_components = 1
description = "KDE colord integration"
homepage = "https://invent.kde.org/graphics/colord-kde"
license = "GPL-2.0-or-later"
deps = ["colord", "kf6-kcmutils", "kf6-kconfig", "kf6-kcoreaddons", "kf6-kdbusaddons", "kf6-ki18n", "kf6-kitemmodels", "kf6-kpackage", "kf6-kwidgetsaddons", "kf6-kwindowsystem", "lcms2", "libXrandr", "libplasma"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "gettext", "qt6-base", "qt6-declarative"]

# Imported from Void Linux's template for 'iproute2'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: make_install_args, conf_files
# needs, but Forge has no recipe for yet: db, libmnl
[package]
name = "iproute2"
version = "7.1.0"
archive = "https://www.kernel.org/pub/linux/utils/net/iproute2/iproute2-7.1.0.tar.xz"
sha256 = "fd9fa1b95809417157ca83dd72957e3261bdbce896353cb936f80af0b33a4b5c"
strip_components = 1
description = "IP Routing Utilities"
homepage = "https://wiki.linuxfoundation.org/networking/iproute2"
license = "GPL-2.0-only"
deps = ["elfutils", "flex", "iptables", "libbpf"]

[build]
system = "autotools"
tools = ["flex", "perl", "pkg-config"]

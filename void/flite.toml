# Imported from Void Linux's template for 'flite'. Review before relying on it.
# hooks not translated: post_install
[package]
name = "flite"
version = "2.2"
archive = "https://github.com/festvox/flite/archive/v2.2.tar.gz"
sha256 = "ab1555fe5adc3f99f1d4a1a0eb1596d329fd6d74f1464a0097c81f53c0cf9e5c"
strip_components = 1
description = "Lightweight speech synthesis engine"
homepage = "http://www.festvox.org/flite/"
license = "BSD-4-Clause"
deps = ["alsa-lib"]

[build]
system = "autotools"
configure_args = ["--enable-shared", "--with-audio=alsa"]

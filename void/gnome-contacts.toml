# Imported from Void Linux's template for 'gnome-contacts'. Review before relying on it.
# hooks not translated: pre_build
# needs, but Forge has no recipe for yet: docbook-xsl, glycin
[package]
name = "gnome-contacts"
version = "50.0"
archive = "https://download.gnome.org/sources/gnome-contacts/50/gnome-contacts-50.0.tar.xz"
sha256 = "2a3bea343171be244f12b7c21a40ca38e9a92dea9890393af5e8ac139bc0dab3"
strip_components = 1
description = "GNOME contacts manager"
homepage = "https://apps.gnome.org//Contacts/"
license = "GPL-2.0-or-later"
deps = ["evolution-data-server", "folks", "gnome-online-accounts", "gstreamer1", "gtk4", "libadwaita", "libgee", "libportal", "qrencode"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["blueprint-compiler", "desktop-file-utils", "gettext", "glib", "gobject-introspection", "libxslt", "vala"]

# Imported from Void Linux's template for 'nzbget'. Review before relying on it.
# 4 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_extract
# needs, but Forge has no recipe for yet: ncurses
[package]
name = "nzbget"
version = "21.1"
archive = "https://github.com/nzbget/nzbget/releases/download/v21.1/nzbget-21.1-src.tar.gz"
sha256 = "4e8fc1beb80dc2af2d6a36a33a33f44dedddd4486002c644f4c4793043072025"
strip_components = 1
description = "Download from Usenet using .nzb files"
homepage = "http://nzbget.net/"
license = "GPL-2.0-or-later"
deps = ["libxml2", "openssl"]
patches = ["patches/openssl3.patch"]

[build]
system = "autotools"
configure_args = ["--with-tlslib=OpenSSL"]
tools = ["pkg-config"]

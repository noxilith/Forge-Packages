[package]
name = "libmatekbd"
version = "1.28.0"
archive = "https://pub.mate-desktop.org/releases/1.28/libmatekbd-1.28.0.tar.xz"
sha256 = "5d2e58483c2b23d33503d24c88f8b90a28cc0189d7e4001b3e273a604f6fe80e"

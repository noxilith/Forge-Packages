deps = ["dconf", "glib", "gtk+3", "iso-codes", "libICE", "libxklavier"]

[build]
system = "autotools"
configure_args = ["--disable-static"]
tools = ["pkg-config"]
deps = ["gettext", "gobject-introspection", "libxml2"]

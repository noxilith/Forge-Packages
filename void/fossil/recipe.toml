# Imported from Void Linux's template for 'fossil'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_extract, post_install
# needs, but Forge has no recipe for yet: sqlite, tcl
[package]
name = "fossil"
version = "2.28"
archive = "https://fossil-scm.org/home/tarball/version-2.28/fossil-2.28.tar.gz"
sha256 = "cb98e85d1f90640c989e24521e90febc98ed8ee3f2663d8b83a445b15bcc83d3"
strip_components = 1
description = "Simple, high-reliability, distributed software configuration management"
homepage = "https://www.fossil-scm.org"
license = "BSD-2-Clause"
deps = ["openssl", "zlib"]
patches = ["patches/cross.patch"]

[build]
system = "autotools"
configure_args = ["--disable-internal-sqlite", "--json"]

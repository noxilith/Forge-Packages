# Imported from Void Linux's template for 'imath'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: boost, python3-numpy
[package]
name = "imath"
version = "3.1.9"
archive = "https://github.com/AcademySoftwareFoundation/Imath/archive/v3.1.9/imath-3.1.9.tar.gz"
sha256 = "f1d8aacd46afed958babfced3190d2d3c8209b66da451f556abd6da94c165cf3"
strip_components = 1
description = "C++/Python library for 2D/3D vector/matrix/math operations"
homepage = "https://imath.readthedocs.io/"
license = "BSD-3-Clause"
patches = ["patches/split-pyimath-cmake-target.patch"]

[build]
system = "cmake"
configure_args = ["-DPYTHON=ON"]

# Imported from Void Linux's template for 'WindowMaker'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_configure, post_install, pre_configure
# settings not translated: conf_files
[package]
name = "WindowMaker"
version = "0.96.0"
archive = "https://github.com/window-maker/wmaker/releases/download/wmaker-0.96.0/WindowMaker-0.96.0.tar.gz"
sha256 = "4fe130ba23cf4aa21c156ec8f01f748df537d0604ec06c6bbcec896df1926f6d"
strip_components = 1
description = "X11 window manager with a NEXTSTEP look and feel"
homepage = "https://www.windowmaker.org/"
license = "GPL-2.0-or-later, WTFPL"
deps = ["fontconfig", "giflib", "libXft", "libXinerama", "libXmu", "libXpm", "libXrandr", "libexif", "libpng", "tiff"]

[build]
system = "autotools"
configure_args = ["--enable-xinerama", "--enable-usermenu", "--enable-modelock", "--enable-xrandr", "--enable-wmreplace", "--disable-static", "LINGUAS=*"]
tools = ["pkg-config"]
deps = ["gettext"]

deps = ["alsa-lib", "gtk4-layer-shell", "gtkmm4", "libdbusmenu-glib", "pam", "pipewire", "pulseaudio", "wayfire", "wireplumber"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["glib", "gobject-introspection", "wayland"]

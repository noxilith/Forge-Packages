[package]
name = "wf-shell"
version = "0.11.0"
archive = "https://github.com/WayfireWM/wf-shell/releases/download/v0.11.0/wf-shell-0.11.0.tar.xz"
sha256 = "8ba3698a6a136cdb85a666e7b597cd183337f05edaabf072cf2f290a2ffa4a3b"
strip_components = 1
description = "Wayfire shell with GTK-based panel and background client"

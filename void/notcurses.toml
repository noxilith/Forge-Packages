# Imported from Void Linux's template for 'notcurses'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: ffmpeg6, ncurses, qrcodegen
[package]
name = "notcurses"
version = "3.0.17"
archive = "https://github.com/dankamongmen/notcurses/archive/v3.0.17.tar.gz"
sha256 = "b0fbe824984fe25b5a16770dbd00b85d44db5d09cc35bd881b95335d0db53128"
strip_components = 1
description = "Blingful character graphics/TUI library"
homepage = "https://nick-black.com/dankwiki/index.php/Notcurses"
license = "Apache-2.0"
deps = ["doctest", "libdeflate", "libunistring"]

[build]
system = "cmake"
configure_args = ["-DUSE_STATIC=ON", "-DUSE_QRCODEGEN=ON"]
tools = ["pkg-config"]

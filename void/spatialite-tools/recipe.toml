# Imported from Void Linux's template for 'spatialite-tools'. Review before relying on it.
# needs, but Forge has no recipe for yet: freexl, libreadline8, libspatialite, sqlite
[package]
name = "spatialite-tools"
version = "5.0.0"
archive = "https://www.gaia-gis.it/gaia-sins/spatialite-tools-5.0.0.tar.gz"
sha256 = "ad092d90ccb2c480f372d1e24b1e6ad9aa8a4bb750e094efdcc6c37edb6b6d32"
strip_components = 1
description = "CLI tools supporting SpatiaLite"
homepage = "https://www.gaia-gis.it/fossil/spatialite-tools/index"
license = "GPL-3.0-or-later"
deps = ["expat", "geos", "librttopo", "libxml2", "minizip", "proj", "readosm", "zlib"]
patches = ["patches/spatialite-tools_lxml2.patch"]

[build]
system = "autotools"
tools = ["pkg-config"]

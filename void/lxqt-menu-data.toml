# Imported from Void Linux's template for 'lxqt-menu-data'. Review before relying on it.
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "lxqt-menu-data"
version = "2.4.0"
archive = "https://github.com/lxqt/lxqt-menu-data/releases/download/2.4.0/lxqt-menu-data-2.4.0.tar.xz"
sha256 = "3487e47562dc19e63358a50c81e51cd0cf1a020397943cadd8db35daeb4866cc"
strip_components = 1
description = "Freedesktop.org compliant menu files for lxqt"
homepage = "https://lxqt-project.org"
license = "LGPL-2.1-or-later"
deps = ["qt6-base"]

[build]
system = "cmake"
tools = ["perl", "pkg-config"]
deps = ["lxqt-build-tools"]

# Imported from Void Linux's template for 'urlview'. Review before relying on it.
# hooks not translated: post_install, pre_configure
# settings not translated: conf_files
# needs, but Forge has no recipe for yet: ncurses
[package]
name = "urlview"
version = "0.9"
archive = "https://gnupg.org/ftp/mutt/contrib/urlview-0.9.tar.gz"
sha256 = "74d18026e84e3cd70a3fdd1a7247a68031b0c1c1c6d761d64b7063ff71091cc3"
strip_components = 1
description = "Extract URLs from a text file and allow the user to select via a menu"
homepage = "https://github.com/sigpipe/urlview"
license = "GPL-2.0-or-later"
patches = ["patches/glibc-missing-include.patch"]

[build]
system = "autotools"
deps = ["mk-configure"]

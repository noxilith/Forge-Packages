# Imported from Void Linux's template for 'vulkan-loader'. Review before relying on it.
[package]
name = "vulkan-loader"
version = "1.4.363.0"
archive = "https://github.com/KhronosGroup/Vulkan-Loader/archive/vulkan-sdk-1.4.363.0.tar.gz"
sha256 = "941eff558fc74f248745fb7df367640cf89a8457f216dae498a74ae14b6ba6f7"
strip_components = 1
description = "Vulkan Installable Client Driver (ICD) loader"
homepage = "https://www.khronos.org/vulkan/"
license = "Apache-2.0"
deps = ["Vulkan-Headers", "libX11", "libXrandr", "libxcb", "wayland"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTS=OFF"]
tools = ["pkg-config"]

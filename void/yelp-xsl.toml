# Imported from Void Linux's template for 'yelp-xsl'. Review before relying on it.
# needs, but Forge has no recipe for yet: itstool
[package]
name = "yelp-xsl"
version = "42.4"
archive = "https://download.gnome.org/sources/yelp-xsl/42/yelp-xsl-42.4.tar.xz"
sha256 = "fdebb07eb2e66a7fb7a0dce6ad8248ad29a4bbb134ba829128ca104f58abd7d1"

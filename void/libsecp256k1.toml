# Imported from Void Linux's template for 'libsecp256k1'. Review before relying on it.
# hooks not translated: post_install, pre_configure
[package]
name = "libsecp256k1"
version = "0.7.0"
archive = "https://github.com/bitcoin-core/secp256k1/archive/v0.7.0.tar.gz"
sha256 = "073d19064f3600014750d6949b31a0c957aa7b98920fb4aaa495be07e8e7cd00"
strip_components = 1
description = "Optimized C library for EC operations on curve secp256k1"
homepage = "https://github.com/bitcoin-core/secp256k1"
license = "MIT"

[build]
system = "autotools"
configure_args = ["--disable-benchmark", "--disable-coverage", "--enable-experimental", "--enable-module-ecdh", "--enable-module-recovery", "--enable-tests", "--enable-exhaustive-tests", "--with-gnu-ld"]
tools = ["m4", "pkg-config"]

# Imported from Void Linux's template for 'parole'. Review before relying on it.
# needs, but Forge has no recipe for yet: dbus-glib, hicolor-icon-theme
[package]
name = "parole"
version = "4.20.0"
archive = "https://archive.xfce.org/src/apps/parole/4.20/parole-4.20.0.tar.xz"
sha256 = "5cf753e670d6518701133eb860d8bceb3a08a496af6a2b7cc67b93320230c983"
strip_components = 1
description = "Modern simple media player"
homepage = "https://docs.xfce.org/apps/parole/start"
license = "GPL-2.0-or-later"
deps = ["dbus", "glib", "gst-libav", "gst-plugins-bad1", "gst-plugins-base1", "gst-plugins-good1", "gst-plugins-ugly1", "gstreamer1", "gtk+3", "libnotify", "libxfce4ui", "libxfce4util", "taglib", "xfconf"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["gettext"]

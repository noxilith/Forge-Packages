# Imported from Void Linux's template for 'lrzip'. Review before relying on it.
# hooks not translated: pre_configure
# needs, but Forge has no recipe for yet: bzip2
[package]
name = "lrzip"
version = "0.660"
archive = "https://github.com/ckolivas/lrzip/archive/v0.660.tar.gz"
sha256 = "fd2cb18fc166e565a23f3415306d71a0f9151e0f1d7016d9a2c7eb038cd3c159"
strip_components = 1
description = "Multi-threaded compression using rzip/lzma, lzo, and zpaq"
homepage = "http://lrzip.kolivas.org/"
license = "GPL-2.0-or-later"
deps = ["lz4", "lzo", "zlib"]

[build]
system = "autotools"
tools = ["perl"]

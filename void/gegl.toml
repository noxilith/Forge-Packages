# Imported from Void Linux's template for 'gegl'. Review before relying on it.
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: libnsgif, libwebp
[package]
name = "gegl"
version = "0.4.72"
archive = "https://download.gimp.org/pub/gegl/0.4/gegl-0.4.72.tar.xz"
sha256 = "ccbb8cdd1db56ecd4ece5dbabae0118ab2c46b5b3439c94f3cec467798ce956d"
strip_components = 1
description = "Graph based image processing framework"
homepage = "https://gegl.org/"
license = "GPL-3.0-only, LGPL-3.0-only"
deps = ["SuiteSparse", "babl", "exiv2", "jasper", "json-glib", "lensfun", "libgexiv2", "libraw", "librsvg", "pango", "poppler", "python3-gobject", "vala"]

[build]
system = "meson"
configure_args = ["-Ddocs=false", "-Dintrospection=true", "-Dvapigen=enabled", "-Dlibspiro=disabled", "-Dlibv4l=disabled", "-Dlibv4l2=disabled", "-Dlua=disabled", "-Dmrg=disabled", "-Dopenexr=disabled", "-Dsdl2=disabled", "-Dlibav=disabled", "-Dumfpack=enabled"]
tools = ["pkg-config"]
deps = ["gettext"]

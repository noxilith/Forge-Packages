# Imported from Void Linux's template for 'breeze-icons'. Review before relying on it.
# needs, but Forge has no recipe for yet: python3-lxml, qt6-tools
[package]
name = "breeze-icons"
version = "6.30.0"
archive = "https://download.kde.org/stable/frameworks/6.30/breeze-icons-6.30.0.tar.xz"
sha256 = "93866c19791838fc9757b305e010e23bb38cb5f201e4ecc96cc8ef5f1173ebe6"
strip_components = 1
description = "Breeze icon theme"
homepage = "https://community.kde.org/Frameworks"
license = "LGPL-3.0-or-later"
deps = ["qt6-base"]

[build]
system = "cmake"
configure_args = ["-DINSTALL_HOST_TOOLS=ON"]
deps = ["extra-cmake-modules", "libxml2"]

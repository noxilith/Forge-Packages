[package]
name = "libchamplain"
version = "0.12.21"
archive = "https://download.gnome.org/sources/libchamplain/0.12/libchamplain-0.12.21.tar.xz"
sha256 = "a915cd172a0c52944c5579fcb4683f8a878c571bf5e928254b5dafefc727e5a7"
strip_components = 1
description = "Library aimed to provide a Clutter widget to display rasterized maps"
homepage = "http://projects.gnome.org/libchamplain/"
license = "LGPL-2.1-or-later"
deps = ["clutter-gtk", "gtk+3", "libsoup3"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["glib"]

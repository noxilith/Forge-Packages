# Imported from Void Linux's template for 'clucene'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: pre_patch
# needs, but Forge has no recipe for yet: boost
[package]
name = "clucene"
version = "2.3.3.4"
archive = "https://downloads.sourceforge.net/sourceforge/clucene/clucene-core-2.3.3.4.tar.gz"
sha256 = "ddfdc433dd8ad31b5c5819cc4404a8d2127472a3b720d3e744e8c51d79732eab"
strip_components = 1
description = "Text search engine written in C++"
homepage = "https://clucene.sourceforge.net/"
license = "LGPL-2+/ASL-2.0"
deps = ["zlib"]
patches = ["patches/clucene-core-2.3.3.4-install_contribs_lib.patch", "patches/clucene-core-2.3.3.4-pkgconfig.patch", "patches/clucene-debug.patch", "patches/clucene-gcc-atomics.patch", "patches/clucene-multimap-put.patch", "patches/clucene-narrowing-conversions.patch", "patches/clucene-pthread.patch", "patches/clucene-warnings.patch", "patches/fix-cl_test.patch", "patches/fix-test.patch", "patches/fix_zlib_detections.diff", "patches/multithreading.patch"]

[build]
system = "cmake"
configure_args = ["-DENABLE_ASCII_MODE=OFF", "-DENABLE_PACKAGING=OFF", "-DBUILD_CONTRIBS_LIB:BOOL=ON"]
tools = ["pkg-config"]

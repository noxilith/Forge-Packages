# Imported from Void Linux's template for 'SDL2_mixer'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: fluidsynth, opusfile
[package]
name = "SDL2_mixer"
version = "2.8.2"
archive = "https://www.libsdl.org/projects/SDL_mixer/release/SDL2_mixer-2.8.2.tar.gz"
sha256 = "938dff531d00ace2296557a6599abe6f34599e2f34f0a4a08a397e2ccac8b8f7"
strip_components = 1
description = "Multi-channel audio mixer library (SDL 2.x)"
homepage = "https://www.libsdl.org/projects/SDL_mixer/"
license = "BSD-3-Clause"
deps = ["SDL2", "flac", "libmikmod", "libmodplug", "libvorbis", "mpg123", "smpeg2"]

[build]
system = "autotools"
tools = ["pkg-config"]

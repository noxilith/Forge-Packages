# Imported from Void Linux's template for 'ktorrent'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: qt6-qt5compat, qt6-tools
[package]
name = "ktorrent"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/ktorrent-26.08.1.tar.xz"
sha256 = "f1bde77b179217013f0baf1020a5202e0d8bedfc332587d9866df699cac7b9eb"
strip_components = 1
description = "BitTorrent client based on the KDE platform"
homepage = "https://apps.kde.org/ktorrent"
license = "GPL-2.0-or-later"
deps = ["geoip", "gmp", "kf6-karchive", "kf6-kcmutils", "kf6-kconfig", "kf6-kcoreaddons", "kf6-kcrash", "kf6-kdbusaddons", "kf6-kdnssd", "kf6-kdoctools", "kf6-kglobalaccel", "kf6-ki18n", "kf6-kiconthemes", "kf6-kio", "kf6-knotifications", "kf6-knotifyconfig", "kf6-kparts", "kf6-kplotting", "kf6-kstatusnotifieritem", "kf6-ktextwidgets", "kf6-kwidgetsaddons", "kf6-kwindowsystem", "kf6-kxmlgui", "kf6-solid", "kf6-syndication", "libktorrent", "libmaxminddb", "phonon", "qt6-base", "taglib"]

[build]
system = "cmake"
configure_args = ["-DWITH_SYSTEM_GEOIP=ON", "-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "gettext"]

# Imported from Void Linux's template for 'OTPClient'. Review before relying on it.
# needs, but Forge has no recipe for yet: util-linux-common
[package]
name = "OTPClient"
version = "4.5.0"
archive = "https://github.com/paolostivanin/OTPClient/archive/refs/tags/v4.5.0.tar.gz"
sha256 = "71656aa31e7143d29e30cc81e9775986a8eda41253b4bb60bbafc588fab1d007"
strip_components = 1
description = "Highly secure and easy to use GTK+ OTP client"
homepage = "https://github.com/paolostivanin/OTPClient"
license = "GPL-3.0-or-later"
deps = ["glib", "gtk+3", "jansson", "libcotp", "libgcrypt", "libpng", "libsecret", "protobuf", "protobuf-c", "qrencode", "zbar"]

[build]
system = "cmake"
tools = ["pkg-config"]

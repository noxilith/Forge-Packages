# Imported from Void Linux's template for 'glpk'. Review before relying on it.
[package]
name = "glpk"
version = "5.0"
archive = "https://ftp.gnu.org/gnu/glpk/glpk-5.0.tar.gz"
sha256 = "4a1013eebb50f728fc601bdd833b0b2870333c3b3e5a816eeba921d95bec6f15"

# Imported from Void Linux's template for 'srain'. Review before relying on it.
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: python3-Sphinx
[package]
name = "srain"
version = "1.7.0"
archive = "https://github.com/SrainApp/srain/archive/refs/tags/1.7.0.tar.gz"
sha256 = "a79bc0d3c257db1c1037b75c330a36c40660580f99327710419a0dacb1b5b18d"
strip_components = 1
description = "Modern IRC client written in GTK"
homepage = "https://srain.silverrainz.me/"
license = "GPL-3.0-linking-exception"
deps = ["glib", "gtk+3", "libayatana-appindicator", "libconfig", "libsecret", "libsoup3", "openssl"]

[build]
system = "meson"
configure_args = ["-Ddoc_builders=[html,man]"]
tools = ["pkg-config"]
deps = ["gettext"]

# Imported from Void Linux's template for 'SDL3_ttf'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: harfbuzz
[package]
name = "SDL3_ttf"
version = "3.2.2"
archive = "https://github.com/libsdl-org/SDL_ttf/releases/download/release-3.2.2/SDL3_ttf-3.2.2.tar.gz"

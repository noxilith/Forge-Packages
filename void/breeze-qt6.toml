# Imported from Void Linux's template for 'breeze-qt6'. Review before relying on it.
# needs, but Forge has no recipe for yet: fftw, kde-plasma-base, qt6-svg, qt6-tools
[package]
name = "breeze-qt6"
version = "6.7.5"
archive = "https://download.kde.org/stable/plasma/6.7.5/breeze-6.7.5.tar.xz"
sha256 = "aa05c0c31c852ed5b137327e7798fd763a54c643875d5d8070625475e0af6976"
strip_components = 1
description = "Breeze visual style for the Plasma Desktop"
homepage = "https://invent.kde.org/plasma/breeze"
license = "GPL-2.0-or-later"
deps = ["breeze-icons", "kf6-frameworkintegration", "kf6-kcmutils", "kf6-kcolorscheme", "kf6-kconfig", "kf6-kcoreaddons", "kf6-kdecoration", "kf6-kguiaddons", "kf6-ki18n", "kf6-kiconthemes", "kf6-kirigami", "kf6-kwindowsystem"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DBUILD_QT5=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
deps = ["extra-cmake-modules", "gettext", "qt6-base"]

# Imported from Void Linux's template for 'dune3d'. Review before relying on it.
# hooks not translated: pre_configure
# needs, but Forge has no recipe for yet: python3-pybind11, util-linux-common
[package]
name = "dune3d"
version = "1.4.0"
archive = "https://github.com/dune3d/dune3d/archive/refs/tags/v1.4.0.tar.gz"
sha256 = "1465cd1d30ff00a82cadb0243065049af35149b0ed37679076ff805ffafd6d62"
strip_components = 1
description = "Parametric 3D CAD application"
homepage = "https://dune3d.org/"
license = "GPL-3.0-only"
deps = ["cairomm", "eigen", "glm", "gtkmm4", "libepoxy", "librsvg", "libspnav", "occt"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["glib", "python3-cairo", "python3-gobject"]

# Imported from Void Linux's template for 'audex'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "audex"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/audex-26.08.1.tar.xz"
sha256 = "cf558c7421bccc611628ba2e333a1ca3efb80922aeb99d407026ebbe0c384162"
strip_components = 1
description = "KDE CD ripping application"
homepage = "https://apps.kde.org/audex/"
license = "GPL-2.0-or-later"
deps = ["kf6-kcmutils", "kf6-kcolorscheme", "kf6-kcompletion", "kf6-kconfig", "kf6-kconfigwidgets", "kf6-kcoreaddons", "kf6-kcrash", "kf6-ki18n", "kf6-kiconthemes", "kf6-kio", "kf6-ktextwidgets", "kf6-kwidgetsaddons", "kf6-kxmlgui", "kf6-solid", "libcdio", "libcdio-paranoia", "libkcddb6", "qt6-base", "qt6-declarative"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DQT_MAJOR_VERSION=6", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "gettext", "kf6-kdoctools"]

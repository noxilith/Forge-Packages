# Imported from Void Linux's template for 'PackageKit'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# settings not translated: build_helper, conf_files
# needs, but Forge has no recipe for yet: docbook-xsl, docbook-xsl-ns, sqlite
[package]
name = "PackageKit"
version = "1.3.6"
archive = "https://github.com/PackageKit/PackageKit/archive/refs/tags/v1.3.6.tar.gz"
sha256 = "799a6e7c3e94d43d254cf793ee19761b475a9b2e86af320d1de1cf39f3fe70a5"
strip_components = 1
description = "D-BUS abstraction layer to package management API"
homepage = "https://packagekit.freedesktop.org/"
license = "GPL-2.0-or-later"
deps = ["bash-completion", "gettext", "glib", "jansson", "libxslt", "polkit"]

[build]
system = "meson"
configure_args = ["-Dgstreamer_plugin=false", "-Dgtk_module=false", "-Dsystemd=false", "-Doffline_update=false", "-Dbash_command_not_found=false", "-Ddaemon_tests=false"]
tools = ["pkg-config"]
deps = ["which"]

# Imported from Void Linux's template for 'kconfigwidgets'. Review before relying on it.
# needs, but Forge has no recipe for yet: qt5
[package]
name = "kconfigwidgets"
version = "5.116.0"
archive = "https://download.kde.org/stable/frameworks/5.116/kconfigwidgets-5.116.0.tar.xz"
sha256 = "e45697f01297a1f7a6058be267e08bdf0b4f7332e3b8d78f932a36e5bd57c5b8"
strip_components = 1
description = "KDE Widgets for configuration dialogs"
homepage = "https://invent.kde.org/frameworks/kconfigwidgets"
license = "LGPL-2.0-or-later"
deps = ["kauth", "kcodecs", "kconfig", "kdoctools", "kguiaddons", "ki18n", "kwidgetsaddons"]
patches = ["patches/cross.patch"]

[build]
system = "cmake"
configure_args = ["-DBUILD_DESIGNERPLUGIN=ON"]
deps = ["extra-cmake-modules", "gettext", "kcoreaddons"]

# Imported from Void Linux's template for 'mairix'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: pre_build
# needs, but Forge has no recipe for yet: bzip2
[package]
name = "mairix"
version = "0.24"
archive = "https://github.com/vandry/mairix/releases/download/0.24/mairix-0.24.tar.gz"
sha256 = "a0702e079c768b6fbe25687ebcbabe7965eb493d269a105998c7c1c2caef4a57"
strip_components = 1
description = "A program for indexing and searching emails"
homepage = "https://github.com/vandry/mairix"
license = "GPL-2.0-only"
deps = ["openssl", "zlib"]
patches = ["patches/issue5.patch"]

[build]
system = "autotools"
tools = ["bison", "flex"]

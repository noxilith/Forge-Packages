# Imported from Void Linux's template for 'wayvnc'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: mesa
[package]
name = "wayvnc"
version = "0.9.1"
archive = "https://github.com/any1/wayvnc/archive/v0.9.1.tar.gz"
sha256 = "aaaca02d36e54ec6ecf457dc266251946d895ac91521fbabb3470c3c09b3753c"
strip_components = 1
description = "VNC server for wlroots based Wayland compositors"
homepage = "https://github.com/any1/wayvnc"
license = "ISC"
deps = ["aml", "gnutls", "jansson", "libdrm", "libjpeg-turbo", "libxkbcommon", "neatvnc", "pixman", "wayland", "zlib"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["scdoc"]

# Imported from Void Linux's template for 'skanpage'. Review before relying on it.
# needs, but Forge has no recipe for yet: qt6-tools, tesseract-ocr
[package]
name = "skanpage"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/skanpage-26.08.1.tar.xz"
sha256 = "849338282311c9a2c936f3aae8f38be8b7ee7a890592912452eb4424e5a82b01"
strip_components = 1
description = "Multi-page scanning application"
homepage = "https://apps.kde.org/skanpage"
license = "GPL-2.0-or-later"
deps = ["kf6-kconfig", "kf6-kcoreaddons", "kf6-kcrash", "kf6-ki18n", "kf6-kio", "kf6-kirigami", "kf6-kxmlgui", "kf6-purpose", "kf6-qqc2-desktop-style", "kquickimageeditor", "leptonica", "libksane6", "qt6-base", "qt6-declarative", "qt6-pdf"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
deps = ["extra-cmake-modules", "gettext"]

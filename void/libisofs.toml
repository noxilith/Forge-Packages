# Imported from Void Linux's template for 'libisofs'. Review before relying on it.
[package]
name = "libisofs"
version = "1.5.8.pl02"
archive = "https://files.libburnia-project.org/releases/libisofs-1.5.8.pl02.tar.gz"
sha256 = "10bd584d8f00d8091e814902b9f0a3e209f16e938f510fc23ba05f3fa469db5a"
strip_components = 1
description = "Library to create ISO9660 images"
homepage = "https://dev.lovelyhq.com/libburnia/web/wiki/Libisofs"
license = "GPL-2.0-or-later"
deps = ["acl", "zlib"]

[build]
system = "autotools"
configure_args = ["--enable-libacl", "--enable-xattr"]

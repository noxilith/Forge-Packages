# Imported from Void Linux's template for 'layer-shell-qt'. Review before relying on it.
# needs, but Forge has no recipe for yet: kde-plasma-base, qt6-tools
[package]
name = "layer-shell-qt"
version = "6.7.5"
archive = "https://download.kde.org/stable/plasma/6.7.5/layer-shell-qt-6.7.5.tar.xz"
sha256 = "ccdcfec7081ca956f7a52c9113a4df3a226575bfbe98b56a2a9a4d7d7e19e8f0"
strip_components = 1
description = "Qt component exposing Wayland wl-layer-shell protocol"
homepage = "https://invent.kde.org/plasma/layer-shell-qt"
license = "GPL-3.0-or-later"
deps = ["libxkbcommon", "qt6-base", "qt6-declarative", "wayland", "wayland-protocols"]

[build]
system = "cmake"
configure_args = ["-DKDE_INSTALL_QMLDIR=lib/qt6/qml", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules"]

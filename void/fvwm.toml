# Imported from Void Linux's template for 'fvwm'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: libreadline8, perl
[package]
name = "fvwm"
version = "2.6.9"
archive = "https://github.com/fvwmorg/fvwm/releases/download/2.6.9/fvwm-2.6.9.tar.gz"
sha256 = "1bc64cf3ccd0073008758168327a8265b8059def9b239b451d6b9fab2cc391ae"
strip_components = 1
description = "Extremely powerful ICCCM-compliant window manager"
homepage = "http://fvwm.org/"
license = "GPL-2.0-or-later, MIT"
deps = ["fribidi", "libXcursor", "libXft", "libXinerama", "libXpm", "libXt", "librsvg"]

[build]
system = "autotools"
tools = ["pkg-config"]
deps = ["libxslt"]

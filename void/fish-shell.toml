# Imported from Void Linux's template for 'fish-shell'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: python3-Sphinx
[package]
name = "fish-shell"
version = "4.9.3"
archive = "https://github.com/fish-shell/fish-shell/releases/download/4.9.3/fish-4.9.3.tar.xz"
sha256 = "20998a25f73217ddcc19f499055fd587e9912d1ad6e7109120fbcf2871f0b98c"
strip_components = 1
description = "User friendly shell intended mostly for interactive use"
homepage = "https://fishshell.com/"
license = "GPL-2.0-only"
deps = ["pcre2"]

[build]
system = "cmake"
configure_args = ["-DCMAKE_BUILD_TYPE=Release"]
tools = ["pkg-config"]
deps = ["cargo-auditable", "gettext"]

# Imported from Void Linux's template for 'gtk-engine-murrine'. Review before relying on it.
# hooks not translated: post_patch
[package]
name = "gtk-engine-murrine"
version = "0.98.2"
archive = "https://download.gnome.org/sources/murrine/0.98/murrine-0.98.2.tar.xz"
sha256 = "e9c68ae001b9130d0f9d1b311e8121a94e5c134b82553ba03971088e57d12c89"
strip_components = 1
description = "GTK2 engine to make your desktop look like a murrina"
homepage = "http://cimitan.com/murrine/project/murrine"
license = "LGPL-2.0-or-later"
deps = ["gtk+"]
patches = ["patches/ftbfs.patch"]

[build]
system = "autotools"
configure_args = ["--enable-animation", "ac_cv_path_INTLTOOL_PERL=true"]
tools = ["pkg-config"]
deps = ["gettext"]

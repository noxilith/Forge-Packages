# Imported from Void Linux's template for 'vba-m'. Review before relying on it.
# settings not translated: build_helper, CFLAGS, CXXFLAGS
# needs, but Forge has no recipe for yet: ffmpeg6, mesa, unzip, zip
[package]
name = "vba-m"
version = "2.2.3"
archive = "https://github.com/visualboyadvance-m/visualboyadvance-m/archive/v2.2.3.tar.gz"
sha256 = "1ed316f6add1552a2d9e077bdddc9890ff8956f98ac4fb3fcfbf682accaf0ecd"
strip_components = 1
description = "Gameboy Advance Emulator"
homepage = "https://github.com/visualboyadvance-m/visualboyadvance-m/"
license = "GPL-2.0-or-later"
deps = ["SDL2", "SFML", "gtk+3", "gtkmm2", "libopenal", "libpng", "wxWidgets-gtk3", "x264", "x265", "zlib"]

[build]
system = "cmake"
configure_args = ["-DENABLE_GTK=TRUE", "-DENABLE_FFMPEG=TRUE", "-DENABLE_LINK=TRUE", "-DCMAKE_BUILD_TYPE=Release"]
tools = ["pkg-config", "yasm"]
deps = ["gettext"]

# Imported from Void Linux's template for 'gpsim'. Review before relying on it.
# hooks not translated: post_patch
# needs, but Forge has no recipe for yet: libreadline8
[package]
name = "gpsim"
version = "0.31.0"
archive = "https://sourceforge.net/projects/gpsim/files/gpsim/0.31.0/gpsim-0.31.0.tar.gz"
sha256 = "110ee6be3a5d02b32803a91e480cbfc9d423ef72e0830703fc0bc97b9569923f"

# Imported from Void Linux's template for 'opencollada'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: CXXFLAGS
[package]
name = "opencollada"
version = "1.6.68"
archive = "https://github.com/KhronosGroup/OpenCOLLADA/archive/v1.6.68.tar.gz"
sha256 = "d9db0c0a518aa6ac0359626f222707c6ca1b63a83cbf229d97a5999c9cde347b"
strip_components = 1
description = "Stream based reader and writer library for COLLADA files"
homepage = "https://github.com/KhronosGroup/OpenCOLLADA"
license = "GPL-3.0-or-later"
deps = ["libxml2", "pcre"]
patches = ["patches/001-fix-no_return_value.patch", "patches/002-fix-stdint_h.patch", "patches/003-musl-stdint_h.patch", "patches/004-fix-libpcre-8.42-compat.patch"]

[build]
system = "cmake"
configure_args = ["-DUSE_SHARED=TRUE"]
tools = ["pkg-config"]

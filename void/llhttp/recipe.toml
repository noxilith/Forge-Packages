# Imported from Void Linux's template for 'llhttp'. Review before relying on it.
# hooks not translated: post_install
[package]
name = "llhttp"
version = "9.4.1"
archive = "https://github.com/nodejs/llhttp/archive/release/v9.4.1.tar.gz"
sha256 = "86a8c16759fdcc7aa2c9841fbe8ba2e77ea98be7d5d45615f2604776d0ff78c7"
strip_components = 1
description = "Port of http_parser to llparse"
homepage = "https://llhttp.org"
license = "MIT"
patches = ["patches/allow-build-type-none.patch"]

[build]
system = "cmake"
configure_args = ["-DLLHTTP_BUILD_SHARED_LIBS=ON", "-DLLHTTP_BUILD_STATIC_LIBS=ON"]

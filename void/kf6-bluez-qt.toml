# Imported from Void Linux's template for 'kf6-bluez-qt'. Review before relying on it.
# needs, but Forge has no recipe for yet: kf6-base, qt6-tools
[package]
name = "kf6-bluez-qt"
version = "6.30.0"
archive = "https://download.kde.org/stable/frameworks/6.30/bluez-qt-6.30.0.tar.xz"
sha256 = "f5045b14a6c689bbfded9437582f943dd4f8f74537085ab6115bcacdea2110d8"
strip_components = 1
description = "Qt wrapper for Bluez 5 DBus API"
homepage = "https://invent.kde.org/frameworks/bluez-qt"
license = "LGPL-2.1-or-later"
deps = ["qt6-declarative"]

[build]
system = "cmake"
configure_args = ["-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "qt6-base"]

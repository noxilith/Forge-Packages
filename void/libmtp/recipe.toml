# Imported from Void Linux's template for 'libmtp'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
[package]
name = "libmtp"
version = "1.1.23"
archive = "https://downloads.sourceforge.net/sourceforge/libmtp/libmtp-1.1.23.tar.gz"
sha256 = "74a2b6e8cb4a0304e95b995496ea3ac644c29371649b892b856e22f12a0bdeed"
strip_components = 1
description = "Library for Microsoft's Media Transfer Protocol (MTP)"
homepage = "https://libmtp.sourceforge.net"
license = "LGPL-2.1-or-later"
deps = ["libgcrypt", "libusb"]
patches = ["patches/fix-warning.patch"]

[build]
system = "autotools"
configure_args = ["--disable-static", "--with-udev-group=plugdev"]
tools = ["pkg-config"]

# Imported from Void Linux's template for 'i3'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: conf_files
# needs, but Forge has no recipe for yet: libev
[package]
name = "i3"
version = "4.25.1"
archive = "https://i3wm.org/downloads/i3-4.25.1.tar.xz"
sha256 = "4a742bbe81b9e5ee6057f42a8e3c691d88894e93f1a5d81fe239128512ac05c0"
strip_components = 1
description = "Improved tiling window manager"
homepage = "https://i3wm.org/"
license = "BSD-3-Clause"
deps = ["libxcb", "libxkbcommon", "pango", "pcre2", "startup-notification", "xcb-util-cursor", "xcb-util-keysyms", "xcb-util-wm", "xcb-util-xrm", "yajl"]

[build]
system = "meson"
tools = ["perl", "pkg-config"]

# Imported from Void Linux's template for 'libnvme'. Review before relying on it.
[package]
name = "libnvme"
version = "1.16.2"
archive = "https://github.com/linux-nvme/libnvme/archive/v1.16.2.tar.gz"
sha256 = "1d850d5a871559abf641d6e6b63bb86047e4cb26f3ad144597c2c64b3cff7231"
strip_components = 1
description = "C Library for NVM Express on Linux"
homepage = "https://github.com/linux-nvme/libnvme"
license = "LGPL-2.1-or-later"
deps = ["json-c", "openssl"]

[build]
system = "meson"
configure_args = ["-Ddocs=man"]
tools = ["pkg-config"]
deps = ["swig", "tar", "xz"]

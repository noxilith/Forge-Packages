# Imported from Void Linux's template for 'libXaw3d'. Review before relying on it.
# hooks not translated: post_install
[package]
name = "libXaw3d"
version = "1.6.6"
archive = "https://www.x.org/releases/individual/lib/libXaw3d-1.6.6.tar.xz"
sha256 = "a41c3e37135ad616b1f28bbde70002afbf3cb59a30df34141f829d32eadc8646"
strip_components = 1
description = "X Athena Widget 3d library"
homepage = "https://cgit.freedesktop.org/xorg/lib/libXaw3d"
license = "MIT/X11"
deps = ["libXmu", "libXpm", "xorg-util-macros"]

[build]
system = "autotools"
configure_args = ["--disable-static", "--enable-internationalization", "--enable-multiplane-bitmaps", "--enable-gray-stipples", "--enable-arrow-scrollbars", "--with-pic", "--with-gnu-ld"]
tools = ["bison", "pkg-config"]

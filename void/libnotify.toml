# Imported from Void Linux's template for 'libnotify'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: docbook-xsl-ns
[package]
name = "libnotify"
version = "0.8.9"
archive = "https://gitlab.gnome.org/GNOME/libnotify/-/archive/0.8.9/libnotify-0.8.9.tar.gz"
sha256 = "6ee0fcaa5e41e10c2c54d470c80748b9bf0e7e669ab7280a8d97a82adeef6017"
strip_components = 1
description = "Desktop notification library"
homepage = "https://gitlab.gnome.org/GNOME/libnotify"
license = "LGPL-2.1-or-later"
deps = ["gdk-pixbuf", "glib", "libpng"]

[build]
system = "meson"
configure_args = ["-Dgtk_doc=false", "-Dtests=false", "-Ddocbook_docs=disabled"]
tools = ["pkg-config"]
deps = ["libxslt"]

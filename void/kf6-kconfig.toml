# Imported from Void Linux's template for 'kf6-kconfig'. Review before relying on it.
# needs, but Forge has no recipe for yet: kf6-base, qt6-tools
[package]
name = "kf6-kconfig"
version = "6.30.0"
archive = "https://download.kde.org/stable/frameworks/6.30/kconfig-6.30.0.tar.xz"
sha256 = "0e98bac324cd716849202d4b246a948e363d6792a8eb09c78417cdde9559f56e"
strip_components = 1
description = "KDE Persistent platform-independent application settings"
homepage = "https://invent.kde.org/frameworks/kconfig"
license = "LGPL-2.1-or-later"
deps = ["qt6-base", "qt6-declarative"]

[build]
system = "cmake"
configure_args = ["-DKDE_INSTALL_QMLDIR=lib/qt6/qml", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QTMETATYPESDIR=lib/qt6/metatypes"]
deps = ["extra-cmake-modules"]

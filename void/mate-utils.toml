# Imported from Void Linux's template for 'mate-utils'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: itstool, libcanberra
[package]
name = "mate-utils"
version = "1.28.0"
archive = "https://pub.mate-desktop.org/releases/1.28/mate-utils-1.28.0.tar.xz"
sha256 = "58449d7a0d1d900ff03b78ca9f7e98c21e97f47fc26bee7ff1c61834f22f88d3"
strip_components = 1
description = "Common utilities for the MATE desktop"
homepage = "https://mate-desktop.org"
license = "GPL-2.0-or-later"
deps = ["desktop-file-utils", "gtk+3", "libICE", "libSM", "libX11", "libXext", "libgtop", "mate-desktop", "mate-panel", "udisks2", "zlib"]

[build]
system = "autotools"
configure_args = ["--disable-static", "--disable-schemas-compile", "--enable-ipv6", "GTK_LAYER_SHELL_REQUIRED_VERSION=0", "GDK_WAYLAND_REQUIRED_VERSION=0"]
tools = ["pkg-config"]
deps = ["gettext", "glib", "inkscape", "librsvg", "libxml2"]

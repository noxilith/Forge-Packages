# Imported from Void Linux's template for 'gtkmm2'. Review before relying on it.
# hooks not translated: pre_configure, pre_install
# settings not translated: CXXFLAGS
[package]
name = "gtkmm2"
version = "2.24.5"
archive = "https://download.gnome.org/sources/gtkmm/2.24/gtkmm-2.24.5.tar.xz"
sha256 = "0680a53b7bf90b4e4bf444d1d89e6df41c777e0bacc96e9c09fc4dd2f5fe6b72"
strip_components = 1
description = "C++ bindings for The GTK+ toolkit (v2)"
homepage = "http://www.gtkmm.org/"
license = "LGPL-2.1-only"
deps = ["atkmm", "gtk+", "libXcursor", "libsigc++", "pangomm"]

[build]
system = "autotools"
configure_args = ["--disable-static", "--disable-documentation"]
tools = ["pkg-config"]
deps = ["mm-common"]

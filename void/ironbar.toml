# Imported from Void Linux's template for 'ironbar'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: LuaJIT, lua54-lgi
[package]
name = "ironbar"
version = "0.19.0"
archive = "https://github.com/JakeStanger/ironbar/archive/refs/tags/v0.19.0.tar.gz"
sha256 = "0d25c2f0c72f839b4018ae12b876a71d04b946ce6fe629a0bb12b8b279ca3699"
strip_components = 1
description = "Customisable Wayland GTK4 bar written in Rust"
homepage = "https://github.com/JakeStanger/ironbar"
license = "MIT"
deps = ["autoconf-archive", "gtk-layer-shell", "gtk4", "gtk4-layer-shell", "libevdev", "libgit2-1.9", "libinput", "pulseaudio", "zlib"]

[build]
system = "cargo"
tools = ["pkg-config"]

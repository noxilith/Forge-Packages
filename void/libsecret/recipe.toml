# Imported from Void Linux's template for 'libsecret'. Review before relying on it.
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: docbook-xsl, gi-docgen
[package]
name = "libsecret"
version = "0.21.7"
archive = "https://download.gnome.org/sources/libsecret/0.21/libsecret-0.21.7.tar.xz"
sha256 = "6b452e4750590a2b5617adc40026f28d2f4903de15f1250e1d1c40bfd68ed55e"
strip_components = 1
description = "GObject based library for accessing the Secret Service API"
homepage = "https://wiki.gnome.org/Projects/Libsecret"
license = "LGPL-2.1-or-later"
deps = ["glib", "libgcrypt", "vala"]
patches = ["patches/remove-test-collection.diff"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["gettext", "libxslt"]

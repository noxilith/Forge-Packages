# Imported from Void Linux's template for 'plasma-integration'. Review before relying on it.
# needs, but Forge has no recipe for yet: font-hack-ttf, kde-plasma-base, noto-fonts-ttf, qt6-tools
[package]
name = "plasma-integration"
version = "6.7.5"
archive = "https://download.kde.org/stable/plasma/6.7.5/plasma-integration-6.7.5.tar.xz"
sha256 = "0786c49f2f357744e0f4cfda49f55284faa1a97da85a667ca6cf1d8ab07aff89"
strip_components = 1
description = "Theme integration plugins for the Plasma workspaces"
homepage = "https://invent.kde.org/plasma/plasma-integration"
license = "LGPL-2.0-or-later"
deps = ["breeze-qt6", "kf6-kconfig", "kf6-kconfigwidgets", "kf6-kguiaddons", "kf6-ki18n", "kf6-kiconthemes", "kf6-kio", "kf6-knotifications", "kf6-kstatusnotifieritem", "kf6-kwayland", "kf6-kwindowsystem", "kf6-kxmlgui", "kf6-qqc2-desktop-style", "libXcursor", "plasma-wayland-protocols", "qt6-base", "qt6-declarative", "wayland"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DBUILD_QT5=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "gettext"]

# Imported from Void Linux's template for 'NetworkManager-strongswan'. Review before relying on it.
[package]
name = "NetworkManager-strongswan"
version = "1.6.3"
archive = "https://download.strongswan.org/NetworkManager/NetworkManager-strongswan-1.6.3.tar.bz2"
sha256 = "96faaf38ac754ab22a0dc4df431c45cb747230666d66f81d12095750e2c19d9a"

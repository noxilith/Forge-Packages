# Imported from Void Linux's template for 'kf6-kcalendarcore'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: kf6-base, qt6-tools
[package]
name = "kf6-kcalendarcore"
version = "6.30.0"
archive = "https://download.kde.org/stable/frameworks/6.30/kcalendarcore-6.30.0.tar.xz"
sha256 = "e8bf60e398e2f8098a4db7db44c5475d70540ad8f8948a123c8bc109dc4db776"
strip_components = 1
description = "Library for Interfacing with Calendars"
homepage = "https://invent.kde.org/frameworks/kcalendarcore"
license = "LGPL-2.1-or-later"
deps = ["libical", "qt6-base", "qt6-declarative"]

[build]
system = "cmake"
configure_args = ["-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules"]

# Imported from Void Linux's template for 'json-glib'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: python3-docutils
[package]
name = "json-glib"
version = "1.10.8"
archive = "https://download.gnome.org/sources/json-glib/1.10/json-glib-1.10.8.tar.xz"
sha256 = "55c5c141a564245b8f8fbe7698663c87a45a7333c2a2c56f06f811ab73b212dd"
strip_components = 1
description = "JSON parser for GLib-based libraries and applications"
homepage = "https://live.gnome.org/JsonGlib"
license = "LGPL-2.1-or-later"
deps = ["glib"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["gettext"]

# Imported from Void Linux's template for 'marco'. Review before relying on it.
# needs, but Forge has no recipe for yet: libcanberra
[package]
name = "marco"
version = "1.28.1"
archive = "https://pub.mate-desktop.org/releases/1.28/marco-1.28.1.tar.xz"
sha256 = "2496e5e40ee980cd6849493ac3e0f8fd0dec8b81c674da8d9ba19a577f0ac2e1"
strip_components = 1
description = "Window manager for MATE"
homepage = "https://mate-desktop.org"
license = "GPL-2.0-or-later"
deps = ["glib", "gtk+3", "libSM", "libX11", "libXcomposite", "libXcursor", "libXinerama", "libXpresent", "libXrandr", "libXrender", "libXres", "libgtop", "mate-desktop", "pango", "startup-notification", "zenity"]
patches = ["patches/musl.patch"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["gdk-pixbuf", "gettext"]

# Imported from Void Linux's template for 'xwallpaper'. Review before relying on it.
# hooks not translated: post_install, pre_configure
[package]
name = "xwallpaper"
version = "0.7.6"
archive = "https://github.com/stoeckmann/xwallpaper/archive/v0.7.6.tar.gz"
sha256 = "380aae8762a296f5e0284eff87ac92babd9c68e3e7612a8208f86b0dea814750"

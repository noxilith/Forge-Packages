[package]
name = "libshumate"
version = "1.6.1"
archive = "https://download.gnome.org/sources/libshumate/1.6/libshumate-1.6.1.tar.xz"
sha256 = "b36aad34500791785f546684d0f2ed644e4819ff4e85ae67a2245f159eccb2d4"

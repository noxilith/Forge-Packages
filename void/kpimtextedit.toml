# Imported from Void Linux's template for 'kpimtextedit'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "kpimtextedit"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/kpimtextedit-26.08.1.tar.xz"
sha256 = "e8cd1bdcd58af6c7eac9ede5ec00c635766e9d32c3922e766028cb0c26eb7163"
strip_components = 1
description = "Textedit with PIM-specific features"
homepage = "https://invent.kde.org/pim/kpimtextedit"
license = "LGPL-2.1-or-later"
deps = ["kf6-kcodecs", "kf6-kconfig", "kf6-kconfigwidgets", "kf6-ki18n", "kf6-kiconthemes", "kf6-kio", "kf6-kwidgetsaddons", "kf6-kxmlgui", "kf6-sonnet", "kf6-syntax-highlighting", "ktextaddons", "qt6-base"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "gettext"]

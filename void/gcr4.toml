# Imported from Void Linux's template for 'gcr4'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: gi-docgen, hicolor-icon-theme
[package]
name = "gcr4"
version = "4.4.0.1"
archive = "https://download.gnome.org/sources/gcr/4.4/gcr-4.4.0.1.tar.xz"
sha256 = "0c3c341e49f9f4f2532a4884509804190a0c2663e6120360bb298c5d174a8098"
strip_components = 1
description = "GNOME crypto package"
homepage = "https://gitlab.gnome.org/GNOME/gcr"
license = "LGPL-2.0-or-later, LGPL-2.1-or-later, GPL-2.0-or-later"
deps = ["desktop-file-utils", "gnupg", "gtk4", "libgcrypt", "libsecret", "libxslt", "p11-kit"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["gettext", "glib", "openssh"]

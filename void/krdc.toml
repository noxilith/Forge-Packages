# Imported from Void Linux's template for 'krdc'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
[package]
name = "krdc"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/krdc-26.08.1.tar.xz"
sha256 = "291ce5f05fc4e67ed659eec9aa8c9f1f06bf1b13a5180375e68d2402341a0ed0"
strip_components = 1
description = "Remote Desktop Client supporting VNC and RDP"
homepage = "https://kde.org/applications/en/internet/org.kde.krdc"
license = "GPL-2.0-or-later, GFDL-1.2-only, LGPL-2.1-or-later"
deps = ["freerdp", "fuse3", "kf6-kbookmarks", "kf6-kcmutils", "kf6-kcompletion", "kf6-kconfig", "kf6-kcrash", "kf6-kdnssd", "kf6-kdoctools", "kf6-ki18n", "kf6-kiconthemes", "kf6-kio", "kf6-knotifications", "kf6-knotifyconfig", "kf6-kstatusnotifieritem", "kf6-kwidgetsaddons", "kf6-kwindowsystem", "kf6-kxmlgui", "libssh", "libvncserver", "plasma-activities", "qt6-base", "qtkeychain-qt6"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DQT_MAJOR_VERSION=6", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "gettext", "kf6-kcoreaddons", "wayland"]

# Imported from Void Linux's template for 'qt6-speech'. Review before relying on it.
# hooks not translated: post_install, pre_check
# needs, but Forge has no recipe for yet: qt6-multimedia
[package]
name = "qt6-speech"
version = "6.11.2"
archive = "https://download.qt.io/official_releases/qt/6.11/6.11.2/submodules/qtspeech-everywhere-src-6.11.2.tar.xz"
sha256 = "9c1d05dc9d710049f20a67680fc6b4293c9b584a90f04f4cf6cc36e758c5cb98"
strip_components = 1
description = "Cross-platform application and UI framework (QT6) - Speech component"
homepage = "https://www.qt.io"
license = "(LGPL-3.0-only OR GPL-2.0-only OR GPL-3.0-only) AND GPL-3.0-only WITH Qt-GPL-exception-1.0"
deps = ["alsa-lib", "flite", "qt6-base", "qt6-declarative", "speech-dispatcher"]

[build]
system = "cmake"
tools = ["perl", "pkg-config"]

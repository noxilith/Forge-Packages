# Imported from Void Linux's template for 'kf6-kirigami'. Review before relying on it.
# needs, but Forge has no recipe for yet: kf6-base, qt6-shadertools, qt6-svg, qt6-tools
[package]
name = "kf6-kirigami"
version = "6.30.0"
archive = "https://download.kde.org/stable/frameworks/6.30/kirigami-6.30.0.tar.xz"
sha256 = "6de811e559c20dc1086c0cf2c34bb98712dbe4d45f960c62c3c3f887332c95f8"
strip_components = 1
description = "QtQuick based components set"
homepage = "https://invent.kde.org/frameworks/kirigami"
license = "LGPL-2.1-or-later"
deps = ["qt6-base", "qt6-declarative"]

[build]
system = "cmake"
configure_args = ["-DKDE_INSTALL_QMLDIR=lib/qt6/qml", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QTMETATYPESDIR=lib/qt6/metatypes"]
deps = ["extra-cmake-modules"]

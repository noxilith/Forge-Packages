# Imported from Void Linux's template for 'gpa'. Review before relying on it.
[package]
name = "gpa"
version = "0.11.1"
archive = "https://gnupg.org/ftp/gcrypt/gpa/gpa-0.11.1.tar.bz2"
sha256 = "0bc5b2cd3e0641d07a2d8af372a09659decd918bee22fdfbefd2133d7c4d5d0b"
strip_components = 1
description = "Graphical user interface for GnuPG"

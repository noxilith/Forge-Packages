# Imported from Void Linux's template for 'chocolate-doom'. Review before relying on it.
# hooks not translated: post_build, pre_configure
# settings not translated: CFLAGS
[package]
name = "chocolate-doom"
version = "3.1.1"
archive = "https://github.com/chocolate-doom/chocolate-doom/archive/chocolate-doom-3.1.1.tar.gz"
sha256 = "1edcc41254bdc194beb0d33e267fae306556c4d24110a1d3d3f865717f25da23"
strip_components = 1
description = "Doom source port that is minimalist and historically accurate"
homepage = "https://www.chocolate-doom.org/"
license = "GPL-2.0-or-later"
deps = ["SDL2", "SDL2_mixer", "SDL2_net", "libpng", "libsamplerate"]

[build]
system = "autotools"
tools = ["pkg-config"]

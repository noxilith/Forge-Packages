# Imported from Void Linux's template for 'kf6-modemmanager-qt'. Review before relying on it.
# needs, but Forge has no recipe for yet: kf6-base, qt6-tools
[package]
name = "kf6-modemmanager-qt"
version = "6.30.0"
archive = "https://download.kde.org/stable/frameworks/6.30/modemmanager-qt-6.30.0.tar.xz"
sha256 = "d7c4106dc130729fdfd435abaeaf85039a874fc18563a41755e14f7ea174ae21"
strip_components = 1
description = "Qt wrapper for ModemManager DBus API"
homepage = "https://invent.kde.org/frameworks/modemmanager-qt"
license = "LGPL-2.1-or-later"
deps = ["ModemManager", "qt6-base"]

[build]
system = "cmake"
tools = ["pkg-config"]
deps = ["extra-cmake-modules"]

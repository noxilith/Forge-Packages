# Imported from Void Linux's template for 'libticables2'. Review before relying on it.
# hooks not translated: pre_configure
# needs, but Forge has no recipe for yet: intltool
[package]
name = "libticables2"
version = "1.3.5"
archive = "https://downloads.sourceforge.net/sourceforge/tilp/tilp2-linux/tilp2-1.18/libticables2-1.3.5.tar.bz2"
sha256 = "0c6fb6516e72ccab081ddb3aecceff694ed93aec689ddd2edba9c7c7406c4522"
strip_components = 1
description = "TI Link Cable Library"
homepage = "https://www.ticalc.org"
license = "GPL-2.0-or-later"
deps = ["gettext", "glib", "libusb"]
patches = ["patches/ppc64le.patch"]

[build]
system = "autotools"
configure_args = ["--enable-libusb10"]
tools = ["bison", "pkg-config"]
deps = ["groff"]

# Imported from Void Linux's template for 'xcmenu'. Review before relying on it.
# hooks not translated: post_install, pre_build
# needs, but Forge has no recipe for yet: dmenu
[package]
name = "xcmenu"
version = "0.1.0"
archive = "https://github.com/dindon-sournois/xcmenu/archive/v0.1.0.tar.gz"
sha256 = "149e95ce715c77eaa179b4b8df6c499a4570915a5a094b49a7d914e0073097f1"
strip_components = 1
description = "Lightweight clipboard manager for X"
homepage = "https://github.com/dindon-sournois/xcmenu"
license = "WTFPL"
deps = ["libxcb", "zlib"]

[build]
system = "make"

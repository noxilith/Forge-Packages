# Imported from Void Linux's template for 'aurorae'. Review before relying on it.
# needs, but Forge has no recipe for yet: kde-plasma-base, qt6-tools
[package]
name = "aurorae"
version = "6.7.5"
archive = "https://download.kde.org/stable/plasma/6.7.5/aurorae-6.7.5.tar.xz"
sha256 = "7e4305d4e28698024fcd797554ccad84bfd4ed4e5bdcb0f42b5da77fab244416"
strip_components = 1
description = "Themeable window decoration for KWin"
homepage = "https://invent.kde.org/plasma/aurorae"
license = "LGPL-2.0-or-later"
deps = ["kf6-kcmutils", "kf6-kcolorscheme", "kf6-kconfig", "kf6-kcoreaddons", "kf6-kdecoration", "kf6-ki18n", "kf6-knewstuff", "kf6-kpackage", "kf6-ksvg"]

[build]
system = "cmake"
configure_args = ["-DKDE_INSTALL_QMLDIR=lib/qt6/qml", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
deps = ["extra-cmake-modules", "gettext", "qt6-base", "qt6-declarative"]

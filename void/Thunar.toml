# Imported from Void Linux's template for 'Thunar'. Review before relying on it.
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: hicolor-icon-theme
[package]
name = "Thunar"
version = "4.20.10"
archive = "https://archive.xfce.org/src/xfce/thunar/4.20/thunar-4.20.10.tar.bz2"
sha256 = "a5a32b51028dc821155e44cdec025fe70398bae193c619ae6ba8b1babf6f49f1"
strip_components = 1
description = "Thunar File Manager"
homepage = "https://docs.xfce.org/xfce/thunar/Start"
license = "GPL-2.0-or-later, LGPL-2.1-or-later"
deps = ["at-spi2-core", "cairo", "desktop-file-utils", "exo", "gdk-pixbuf", "glib", "gtk+3", "libICE", "libSM", "libX11", "libexif", "libgudev", "libnotify", "libxfce4ui", "pango", "pcre2", "xfce4-panel"]

[build]
system = "autotools"
configure_args = ["--enable-gio-unix", "--enable-gudev", "--enable-exif", "--disable-static", "--enable-notifications"]
tools = ["pkg-config"]
deps = ["gettext", "polkit"]

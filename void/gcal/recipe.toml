# Imported from Void Linux's template for 'gcal'. Review before relying on it.
# needs, but Forge has no recipe for yet: ncurses, tzutils
[package]
name = "gcal"
version = "4.1"
archive = "https://ftp.gnu.org/gnu/gcal/gcal-4.1.tar.xz"
sha256 = "91b56c40b93eee9bda27ec63e95a6316d848e3ee047b5880ed71e5e8e60f61ab"
strip_components = 1
description = "Display hybrid and proleptic Julian and Gregorian calendar sheets"
homepage = "http://www.gnu.org/software/gcal/"
license = "GPL-3.0-or-later"
patches = ["patches/fseeko.patch"]

[build]
system = "autotools"
tools = ["perl"]

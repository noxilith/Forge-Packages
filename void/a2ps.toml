[package]
name = "a2ps"
version = "4.15.6"
archive = "https://ftp.gnu.org/gnu/a2ps/a2ps-4.15.6.tar.gz"
sha256 = "87ff9d801cb11969181d5b8cf8b65e65e5b24bb0c76a1b825e8098f2906fbdf4"

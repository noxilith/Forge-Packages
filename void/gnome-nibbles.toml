[package]
name = "gnome-nibbles"
version = "4.5.2"
archive = "https://download.gnome.org/sources/gnome-nibbles/4.5/gnome-nibbles-4.5.2.tar.xz"
sha256 = "76729d3b562cd7862ad30590c3bd40fd251f9d4bb5c53baa84150197f231a5fa"

# Imported from Void Linux's template for 'nudoku'. Review before relying on it.
# hooks not translated: pre_configure
# needs, but Forge has no recipe for yet: ncurses
[package]
name = "nudoku"
version = "8.0.1"
archive = "https://github.com/jubalh/nudoku/archive/refs/tags/8.0.1.tar.gz"
sha256 = "4e8a35950b7b7ce1e49f9457a8aceffbd21fb2b34aa8386847a7a158a2cab551"
strip_components = 1
description = "Ncurses based sudoku game"
homepage = "https://jubalh.github.io/nudoku/"
license = "GPL-3.0-or-later"
deps = ["cairo"]

[build]
system = "autotools"
configure_args = ["--enable-cairo"]
tools = ["pkg-config"]
deps = ["gettext"]

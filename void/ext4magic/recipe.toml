# Imported from Void Linux's template for 'ext4magic'. Review before relying on it.
# hooks not translated: post_extract
# settings not translated: CFLAGS
# needs, but Forge has no recipe for yet: bzip2
[package]
name = "ext4magic"
version = "0.3.2"
archive = "https://downloads.sourceforge.net/sourceforge/ext4magic/ext4magic-0.3.2.tar.gz"
sha256 = "8d9c6a594f212aecf4eb5410d277caeaea3adc03d35378257dfd017ef20ea115"
strip_components = 1
description = "Recover deleted or overwritten files on ext3 and ext4 filesystems"
homepage = "http://sourceforge.net/projects/ext4magic/"
license = "GPL-2.0-or-later"
deps = ["e2fsprogs", "file", "zlib"]
patches = ["patches/fix-glibc-2.27.patch", "patches/fix-i_dir_acl-rename.patch"]

[build]
system = "autotools"
configure_args = ["--enable-expert-mode", "--enable-file-attr"]

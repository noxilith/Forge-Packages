# Imported from Void Linux's template for 'planify'. Review before relying on it.
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: libwebkit2gtk41
[package]
name = "planify"
version = "4.5.12"
archive = "https://github.com/alainm23/planify/archive/4.5.12.tar.gz"
sha256 = "5ee974db43723bd0b90b0c432167ac1d804644ad97cd716e77495020f9528091"
strip_components = 1
description = "Task manager with Todoist support designed for GNU/Linux"
homepage = "https://github.com/alainm23/planify"
license = "GPL-3.0-or-later"
deps = ["curl", "evolution-data-server", "granite7", "gtksourceview5", "gxml", "io.elementary.icons", "io.elementary.stylesheet", "json-glib", "libadwaita", "libgee", "libportal", "libsoup3"]
patches = ["patches/00-musl.patch", "patches/libgee-musl.patch"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["desktop-file-utils", "gettext", "glib", "gtk4", "vala"]

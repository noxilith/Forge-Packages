# Imported from Void Linux's template for 'libmateweather'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: pre_configure
# needs, but Forge has no recipe for yet: mate-common
[package]
name = "libmateweather"
version = "1.28.1"
archive = "https://github.com/mate-desktop/libmateweather/archive/refs/tags/v1.28.1.tar.gz"
sha256 = "dfd0de546afda06e2a4d6837748910fa2074ab6fd76361fa67f642f456e184c1"
strip_components = 1
description = "Provides access to weather information from the Internet for MATE"
homepage = "https://mate-desktop.org"
license = "GPL-2.0-or-later"
deps = ["dconf", "glib", "gtk+3", "libsoup3", "libxml2"]
patches = ["patches/libsoup-3.0.patch", "patches/meta-speci.patch"]

[build]
system = "autotools"
configure_args = ["--disable-static", "--enable-locations-compression"]
tools = ["pkg-config"]
deps = ["autoconf-archive", "gettext", "gtk-doc"]

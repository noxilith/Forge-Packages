# Imported from Void Linux's template for 'xkeyboard-config'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: intltool
[package]
name = "xkeyboard-config"
version = "2.48"
archive = "https://www.x.org/releases/individual/data/xkeyboard-config/xkeyboard-config-2.48.tar.xz"
sha256 = "b77041324f0109f77161ee43743fe04baa485866af8460d31e476ad3f7648fd5"
strip_components = 1
description = "X Keyboard Configuration Database"
homepage = "https://www.freedesktop.org/wiki/Software/XKeyboardConfig"
license = "MIT"
deps = ["libX11", "xkbcomp"]

[build]
system = "meson"
configure_args = ["-Dxorg-rules-symlinks=true", "-Dcompat-rules=true"]
tools = ["perl", "pkg-config"]
deps = ["libxslt"]

# Imported from Void Linux's template for 'libsmbios'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, pre_configure
# needs, but Forge has no recipe for yet: doxygen
[package]
name = "libsmbios"
version = "2.4.3"
archive = "https://github.com/dell/libsmbios/archive/v2.4.3.tar.gz"
sha256 = "36c36a0f6b59190d6b4fef11696886e4511091929a5eb7ae7cf5fea0c32d3f58"
strip_components = 1
description = "Library for SMBIOS access"
homepage = "https://github.com/dell/libsmbios"
license = "GPL-2.0-or-later, OLS-2.1"
deps = ["libxml2"]
patches = ["patches/fix-musl.patch"]

[build]
system = "autotools"
configure_args = ["--disable-static"]
tools = ["pkg-config"]
deps = ["gettext", "help2man"]

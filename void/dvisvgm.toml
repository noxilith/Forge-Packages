# Imported from Void Linux's template for 'dvisvgm'. Review before relying on it.
# needs, but Forge has no recipe for yet: asciidoc, ghostscript, harfbuzz, ttfautohint
[package]
name = "dvisvgm"
version = "3.6"
archive = "https://github.com/mgieseki/dvisvgm/releases/download/3.6/dvisvgm-3.6.tar.gz"
sha256 = "26446bb3b10739ff0925c9e416b76d2d222075c9d5dcfafe6e214609d072ed1a"
strip_components = 1
description = "Fast DVI, EPS, and PDF to SVG converter"
homepage = "https://dvisvgm.de/"
license = "GPL-3.0-or-later"
deps = ["brotli", "freetype", "potrace", "texlive", "woff2", "xxHash", "zlib"]

[build]
system = "autotools"
configure_args = ["--with-ttfautohint"]
tools = ["pkg-config"]
deps = ["libxslt", "xmlto"]

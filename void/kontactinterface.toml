# Imported from Void Linux's template for 'kontactinterface'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "kontactinterface"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/kontactinterface-26.08.1.tar.xz"
sha256 = "c330d3c6f531ec13cd0dd2f291ca12a787cbc35cc4c9a1722e4d117d456eb821"
strip_components = 1
description = "Kontact Plugin Interface Library"
homepage = "https://kontact.kde.org/"
license = "LGPL-2.1-or-later"
deps = ["kf6-kparts", "qt6-base"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "gettext", "kf6-kconfig", "kf6-kcoreaddons"]

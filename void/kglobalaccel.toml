# Imported from Void Linux's template for 'kglobalaccel'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: qt5
[package]
name = "kglobalaccel"
version = "5.116.0"
archive = "https://download.kde.org/stable/frameworks/5.116/kglobalaccel-5.116.0.tar.xz"
sha256 = "f6dfaa2482c8a4dfc12ed40094fd120bd41c5053899d3f85c2ff6b8215659866"
strip_components = 1
description = "KDE Global desktop keyboard shortcuts"
homepage = "https://invent.kde.org/frameworks/kglobalaccel"
license = "LGPL-2.0-or-later"
deps = ["kcrash", "kservice"]

[build]
system = "cmake"
configure_args = ["-DKF6_COMPAT_BUILD=ON"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "kcoreaddons"]

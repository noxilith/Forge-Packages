# Imported from Void Linux's template for 'ispc'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: ncurses
[package]
name = "ispc"
version = "1.31.0"
archive = "https://github.com/ispc/ispc/archive/v1.31.0.tar.gz"
sha256 = "671c79bdff2d97aead3897da1a6b67a163af8c4e329350d07cf3e63d592955ff"
strip_components = 1
description = "Compiler for high-performance SIMD programming on the CPU"
homepage = "https://ispc.github.io"
license = "BSD-3-Clause"
deps = ["llvm22", "zlib"]
patches = ["patches/cmake-build-type-none.patch"]

[build]
system = "cmake"
configure_args = ["-DISPC_INCLUDE_EXAMPLES=OFF", "-DISPC_INCLUDE_RT=OFF"]
tools = ["bison", "flex", "m4"]

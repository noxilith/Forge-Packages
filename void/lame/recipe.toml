# Imported from Void Linux's template for 'lame'. Review before relying on it.
# hooks not translated: pre_configure
# settings not translated: CFLAGS
# needs, but Forge has no recipe for yet: ncurses
[package]
name = "lame"
version = "4.0"
archive = "https://downloads.sourceforge.net/sourceforge/lame/lame-4.0.tar.gz"
sha256 = "3df5124d5ad3a98312ffd7ba6a9b36230e4f8a3e66d3ce0f425e336c32d216eb"
strip_components = 1
description = "Fast, high quality MP3 encoder"
homepage = "https://lame.sourceforge.io/"
license = "LGPL-2.1-or-later"
deps = ["mpg123"]
patches = ["patches/lame-cbr-abr-quality-settings-clamp.patch", "patches/lame-symbols.patch", "patches/translit.patch"]

[build]
system = "autotools"
configure_args = ["--enable-nasm", "--enable-shared"]
tools = ["nasm", "pkg-config"]

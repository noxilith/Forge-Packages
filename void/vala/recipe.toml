# Imported from Void Linux's template for 'vala'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, pre_configure
[package]
name = "vala"
version = "0.56.19"
archive = "https://download.gnome.org/sources/vala/0.56/vala-0.56.19.tar.xz"
sha256 = "5ad7cbbfcc0de61b403d6797c9ef60455bfbebd8e162aec33b5b0b097adfb9d5"
strip_components = 1
description = "Compiler for the GObject type system"
homepage = "https://wiki.gnome.org/Projects/Vala"
license = "LGPL-2.1-or-later"
deps = ["flex", "glib"]
patches = ["patches/array-len-dup-overflow.patch", "patches/disable-unstable-tests.patch"]

[build]
system = "autotools"
configure_args = ["--disable-valadoc"]
tools = ["flex", "pkg-config"]
deps = ["libxslt"]

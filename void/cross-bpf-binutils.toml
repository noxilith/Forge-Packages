# Imported from Void Linux's template for 'cross-bpf-binutils'. Review before relying on it.
# 3 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
[package]
name = "cross-bpf-binutils"
version = "2.44"
archive = "https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz"
sha256 = "ce2017e059d63e67ddb9240e9d4ec49c2893605035cd60e92ad53177f4377237"
strip_components = 1
description = "GNU binary utilities"
homepage = "https://www.gnu.org/software/binutils/"
license = "GPL-3.0-or-later"
deps = ["zlib"]

[build]
system = "autotools"
configure_args = ["--disable-nls", "--enable-deterministic-archives", "--enable-interwork", "--enable-ld", "--enable-multilib", "--target=bpf", "--with-gnu-as", "--with-gnu-ld", "--with-system-zlib", "--without-isl"]
tools = ["bison", "flex", "perl"]

# Imported from Void Linux's template for 'libwebsockets'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: libev
[package]
name = "libwebsockets"
version = "4.5.2"
archive = "https://github.com/warmcat/libwebsockets/archive/v4.5.2.tar.gz"
sha256 = "04244efb7a6438c8c6bfc79b21214db5950f72c9cf57e980af57ca321aae87b2"
strip_components = 1
description = "Lightweight client and server websocket library"
homepage = "https://libwebsockets.org"
license = "MIT"
deps = ["libcap", "libuv", "openssl", "zlib"]

[build]
system = "cmake"
configure_args = ["-DLWS_WITH_LIBEV=ON", "-DLWS_WITH_LIBUV=ON", "-DLWS_WITH_HTTP2=ON", "-DLWS_IPV6=ON", "-DLWS_HAVE_LIBCAP=ON", "-DLWS_WITH_EVLIB_PLUGINS=OFF", "-DDISABLE_WERROR=ON"]

# Imported from Void Linux's template for 'sdcc'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: boost
[package]
name = "sdcc"
version = "4.2.0"
archive = "https://downloads.sourceforge.net/sourceforge/sdcc/sdcc-src-4.2.0.tar.bz2"
sha256 = "b49bae1d23bcd6057a82c4ffe5613f9cd0cbcfd1e940e9d84c4bfe9df0a8c053"
strip_components = 1
description = "Retargettable ANSI C compiler"
homepage = "http://sdcc.sourceforge.net/"
license = "GPL-2.0-or-later"
deps = ["gc", "zlib"]

[build]
system = "autotools"
configure_args = ["--enable-libgc"]
tools = ["bison", "flex"]
deps = ["gputils", "texinfo"]

# Imported from Void Linux's template for 'speech-dispatcher'. Review before relying on it.
# hooks not translated: post_extract, pre_configure
# settings not translated: CFLAGS, conf_files
# needs, but Forge has no recipe for yet: espeak-ng, intltool
[package]
name = "speech-dispatcher"
version = "0.12.1"
archive = "https://github.com/brailcom/speechd/archive/0.12.1.tar.gz"
sha256 = "32a730f6fb5981b9bec7e04f3674fd7d29e54935f46cf6354dbb9ab1f9b23b2d"
strip_components = 1
description = "High-level device independent layer for speech synthesis interface"
homepage = "http://devel.freebsoft.org/speechd"
license = "GPL-2.0-or-later, LGPL-2.1-or-later, GFDL-1.2-or-later"
deps = ["dotconf", "glib", "libao", "libsndfile", "pulseaudio", "sonic"]

[build]
system = "autotools"
configure_args = ["--disable-static", "--without-kali", "--without-ibmtts", "--without-baratinoo", "--without-voxin"]
tools = ["pkg-config"]
deps = ["gettext", "texinfo"]

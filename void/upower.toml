# Imported from Void Linux's template for 'upower'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# settings not translated: build_helper, conf_files
# needs, but Forge has no recipe for yet: dbus-glib, docbook-xsl
[package]
name = "upower"
version = "1.91.3"
archive = "https://gitlab.freedesktop.org/upower/upower/-/archive/v1.91.3/upower-v1.91.3.tar.bz2"
sha256 = "12227b3dcd34c5097bbda25984b192ea0bd5e11dce479358d9ef70415a38e4b6"
strip_components = 1
description = "Abstraction for enumerating power devices"
homepage = "https://gitlab.freedesktop.org/upower/upower"
license = "GPL-2.0-or-later"
deps = ["libgudev", "libimobiledevice", "libusb", "polkit"]

[build]
system = "meson"
configure_args = ["-Dos_backend=linux", "-Dsystemdsystemunitdir=no"]
tools = ["pkg-config"]
deps = ["gettext", "glib", "gobject-introspection", "libxslt"]

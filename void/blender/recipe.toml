# Imported from Void Linux's template for 'blender'. Review before relying on it.
# 4 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_patch
# settings not translated: build_helper, LDFLAGS
# needs, but Forge has no recipe for yet: boost, ffmpeg6, fftw, glew, hicolor-icon-theme, jack, libwebp, llvm, python3-numpy
[package]
name = "blender"
version = "5.0.0"
archive = "https://download.blender.org/source/blender-5.0.0.tar.xz"
sha256 = "120b45227b1dba2ecec116c6f924f3e7efabebac762e030552fdf70baff1b5b4"
strip_components = 1
description = "3D graphics creation suite"
homepage = "https://www.blender.org"
license = "GPL-3.0-or-later"
deps = ["Haru", "OpenSubdiv", "alembic", "desktop-file-utils", "eigen", "freetype", "glu", "gmp", "libXi", "libXrender", "libXxf86vm", "libdecor", "libepoxy", "libopenal", "libpng", "libsamplerate", "libsndfile", "libspnav", "libxkbcommon", "libxml2", "lzo", "opencollada", "opencolorio", "openexr", "openimageio", "openjpeg2", "openvdb", "openxr", "pcre", "pipewire", "potrace", "pugixml", "pulseaudio", "shaderc", "tbb", "tiff", "vulkan-loader", "wayland", "wayland-protocols"]
patches = ["patches/cross.patch", "patches/musl.patch"]

[build]
system = "cmake"
configure_args = ["-DWITH_INSTALL_PORTABLE=OFF", "-DWITH_PYTHON_INSTALL=OFF", "-DWITH_JACK=ON", "-DWITH_CODEC_FFMPEG=ON", "-DWITH_CODEC_SNDFILE=ON", "-DWITH_OPENMP=ON", "-DWITH_FFTW3=ON", "-DWITH_MOD_OCEANSIM=ON", "-DWITH_CYCLES_EMBREE=OFF", "-DWITH_OPENCOLORIO=ON", "-DWITH_IMAGE_OPENEXR=ON", "-DWITH_IMAGE_OPENJPEG=ON", "-DWITH_OPENSUBDIV=ON", "-DWITH_OPENCOLLADA=ON", "-DWITH_SYSTEM_GLEW=ON", "-DWITH_OPENVDB=ON", "-DWITH_ALEMBIC=ON", "-DWITH_GHOST_X11=ON", "-DWITH_GHOST_WAYLAND=ON", "-DWITH_GHOST_LIBDECOR=ON", "-DWITH_BUILDINFO=OFF", "-DWITH_SYSTEM_LZO=ON", "-DWITH_SYSTEM_EIGEN3=ON", "-DWITH_SYSTEM_FREETYPE=ON", "-DWITH_DRACO=OFF"]
tools = ["pkg-config"]

# Imported from Void Linux's template for 'xournalpp'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: libcppunit, lua53, portaudio
[package]
name = "xournalpp"
version = "1.3.4"
archive = "https://github.com/xournalpp/xournalpp/archive/refs/tags/v1.3.4.tar.gz"
sha256 = "acc261afba7b61a5556a10e03f77a141c9a4872a2529d1ed39a0f14dbc0d87db"
strip_components = 1
description = "Handwriting Notetaking software with PDF annotation support"
homepage = "https://xournalpp.github.io/"
license = "GPL-2.0-or-later"
deps = ["gtk+3", "gtksourceview4", "librsvg", "libsndfile", "libxml2", "libzip", "poppler", "qpdf"]

[build]
system = "cmake"
configure_args = ["-DENABLE_CPPTRACE=OFF"]
tools = ["pkg-config"]
deps = ["gettext", "glib"]

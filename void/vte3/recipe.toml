# Imported from Void Linux's template for 'vte3'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# settings not translated: build_helper, CXXFLAGS
[package]
name = "vte3"
version = "0.82.1"
archive = "https://download.gnome.org/sources/vte/0.82/vte-0.82.1.tar.xz"
sha256 = "79376d70402d271e2d38424418e1aea72357934d272e321e3906b71706a78e3a"
strip_components = 1
description = "Terminal widget with improved accessibility and I18N support"
homepage = "https://gitlab.gnome.org/GNOME/vte/"
license = "GPL-3.0-or-later, LGPL-2.1-or-later, LGPL-3.0-or-later"
deps = ["gnutls", "gtk+3", "gtk4", "lz4", "pcre2"]
patches = ["patches/fix-W_EXITCODE.patch"]

[build]
system = "meson"
configure_args = ["-Db_ndebug=false", "-Db_lto=false", "-D_systemd=false", "-Dgtk4=true"]
tools = ["pkg-config"]
deps = ["gettext", "glib"]

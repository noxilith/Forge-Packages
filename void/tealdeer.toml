# Imported from Void Linux's template for 'tealdeer'. Review before relying on it.
# hooks not translated: post_install
[package]
name = "tealdeer"
version = "1.9.0"
archive = "https://github.com/dbrgn/tealdeer/archive/refs/tags/v1.9.0.tar.gz"
sha256 = "1387a04ddba714668ff0925377a2de0d0ab14533d44dd0766d673fbbd71e3119"
strip_components = 1
description = "Very fast implementation of tldr in Rust"
homepage = "https://github.com/dbrgn/tealdeer"
license = "Apache-2.0 OR MIT"
deps = ["openssl"]

[build]
system = "cargo"
configure_args = ["--no-default-features", "--features=native-tls"]
tools = ["pkg-config"]

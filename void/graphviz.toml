# Imported from Void Linux's template for 'graphviz'. Review before relying on it.
# hooks not translated: post_install, pre_configure
# settings not translated: make_build_args
# needs, but Forge has no recipe for yet: liberation-fonts-ttf
[package]
name = "graphviz"
version = "15.1.0"
archive = "https://gitlab.com/graphviz/graphviz/-/archive/15.1.0/graphviz-15.1.0.tar.gz"
sha256 = "cc673e3eb9013f40761590b2b071c0fb89ad5c5d694e25d4e1238c74df86c697"
strip_components = 1
description = "Graph Visualization Software"
homepage = "https://www.graphviz.org"
license = "EPL-2.0"
deps = ["gd", "gtk+3", "gts", "libXaw", "libpng", "librsvg"]

[build]
system = "autotools"
configure_args = ["--with-gts", "--with-ann=no", "PYTHON3=python3"]
tools = ["flex", "perl", "pkg-config"]

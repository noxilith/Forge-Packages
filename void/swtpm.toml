# Imported from Void Linux's template for 'swtpm'. Review before relying on it.
# hooks not translated: post_install, pre_configure
# settings not translated: make_dirs, conf_files
# needs, but Forge has no recipe for yet: socat
[package]
name = "swtpm"
version = "0.10.1"
archive = "https://github.com/stefanberger/swtpm/archive/refs/tags/v0.10.1.tar.gz"
sha256 = "f8da11cadfed27e26d26c5f58a7b8f2d14d684e691927348906b5891f525c684"
strip_components = 1
description = "TPM emulator with socket, character device, and Linux CUSE interface"
homepage = "https://github.com/stefanberger/swtpm"
license = "BSD-3-Clause"
deps = ["fuse", "gnutls", "json-glib", "libseccomp", "libtasn1", "libtpms", "trousers"]

[build]
system = "autotools"
configure_args = ["--with-gnutls", "ac_cv_path_TCSD="]
tools = ["pkg-config"]
deps = ["expect", "iproute2"]

# Imported from Void Linux's template for 'png++'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: make_build_target
# needs, but Forge has no recipe for yet: doxygen
[package]
name = "png++"
version = "0.2.10"
archive = "https://download.savannah.nongnu.org/releases/pngpp/png++-0.2.10.tar.gz"
sha256 = "998af216ab16ebb88543fbaa2dbb9175855e944775b66f2996fc945c8444eee1"
strip_components = 1
description = "C++ wrapper for libpng library"
homepage = "https://www.nongnu.org/pngpp"
license = "BSD-3-Clause"
deps = ["libpng"]
patches = ["patches/fix-destdir.patch", "patches/musl-config.patch"]

[build]
system = "make"

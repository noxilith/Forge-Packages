# Imported from Void Linux's template for 'nootka'. Review before relying on it.
# needs, but Forge has no recipe for yet: fftw, jack, qt5
[package]
name = "nootka"
version = "2.0.2"
archive = "https://downloads.sourceforge.net/sourceforge/nootka/Nootka-2.0.2/nootka-2.0.2-source.tar.bz2"
sha256 = "6477722d9dfe4c2a50efbb5c36e0e5376d76e2a2c366ef43747e71ed12351c8b"
strip_components = 1
description = "Application to learn classical score notation"
homepage = "https://nootka.sourceforge.io"
license = "GPL-3.0-or-later"
deps = ["alsa-lib", "libvorbis", "soundtouch"]
patches = ["patches/signed-char.patch"]

[build]
system = "cmake"

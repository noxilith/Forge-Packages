# Imported from Void Linux's template for 'kontact'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-location, qt6-tools, qt6-webchannel
[package]
name = "kontact"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/kontact-26.08.1.tar.xz"
sha256 = "5be086d1e47793f78bbe607fd9e9c171212db8649bb92d9463dd739800e86424"
strip_components = 1
description = "KDE Personal Information Manager"
homepage = "https://kde.org/applications/en/office/org.kde.kontact"
license = "GPL-2.0-or-later"
deps = ["kf6-akonadi", "kf6-kcmutils", "kontactinterface", "kpimtextedit", "libkdepim", "pimcommon", "qt6-pdf"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "gettext", "kf6-kconfig", "kf6-kcoreaddons", "kf6-kdoctools", "qt6-base"]

deps = ["AppStream", "SDL3", "gtk4", "libadwaita", "libarchive", "libgee", "libnotify", "libsoup3"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["appstream-glib", "desktop-file-utils", "gettext", "glib", "vala"]

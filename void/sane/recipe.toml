# Imported from Void Linux's template for 'sane'. Review before relying on it.
# 3 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_build, post_install
# settings not translated: conf_files
[package]
name = "sane"
version = "1.4.0"
archive = "https://gitlab.com/-/project/429008/uploads/843c156420e211859e974f78f64c3ea3/sane-backends-1.4.0.tar.gz"
sha256 = "f99205c903dfe2fb8990f0c531232c9a00ec9c2c66ac7cb0ce50b4af9f407a72"
strip_components = 1
description = "Scanner Access Now Easy"
homepage = "http://www.sane-project.org/"
license = "custom:GPL-2.0-or-later-with-SANE-exception"
deps = ["libgphoto2", "libjpeg-turbo", "libpng", "libusb", "libxml2", "openssl", "tiff", "v4l-utils"]
patches = ["patches/sane-desc-cross.patch"]

[build]
system = "autotools"
configure_args = ["--disable-locking", "--enable-ipv6", "--enable-pthread", "--with-usb", "ac_cv_func_mmap_fixed_mapped=yes"]
tools = ["pkg-config"]

# Imported from Void Linux's template for 'poppler-qt5'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: nss, qt5
[package]
name = "poppler-qt5"
version = "26.10.0"
archive = "https://poppler.freedesktop.org/poppler-26.10.0.tar.xz"
sha256 = "6792cb7c69205007ad87d2e936cecc5b3a31fac29ab54ffc3175fdb6b2a6ce35"
strip_components = 1
description = "PDF rendering library - Qt5 bindings"
homepage = "https://poppler.freedesktop.org"
license = "GPL-2.0-or-later, GPL-3.0-or-later"
deps = ["cairo", "curl", "fontconfig", "gpgmepp", "lcms2", "libpng", "openjpeg2", "qt6-base", "tiff", "zlib"]
patches = ["patches/cmake-build-type-none.patch"]

[build]
system = "cmake"
configure_args = ["-DENABLE_UNSTABLE_API_ABI_HEADERS=ON", "-DENABLE_GLIB=OFF", "-DENABLE_QT5=ON", "-DENABLE_UTILS=OFF", "-DENABLE_CPP=OFF", "-DENABLE_BOOST=OFF", "-DENABLE_QT6=ON", "-DBUILD_MANUAL_TESTS=OFF", "-DBUILD_QT5_TESTS=OFF", "-DBUILD_QT6_TESTS=OFF"]
tools = ["pkg-config"]

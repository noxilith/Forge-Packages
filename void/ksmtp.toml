# Imported from Void Linux's template for 'ksmtp'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "ksmtp"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/ksmtp-26.08.1.tar.xz"
sha256 = "227c0578def79612a4cae9745445e5dff023458ffffabf305e06d953248f72a0"
strip_components = 1
description = "Job-based library to send email through an SMTP server"
homepage = "https://community.kde.org/KDE_PIM"
license = "LGPL-2.1-or-later"
deps = ["kf6-kio", "kf6-kmime"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "gettext", "kf6-kconfig", "kf6-kcoreaddons", "qt6-base"]

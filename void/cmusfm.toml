# Imported from Void Linux's template for 'cmusfm'. Review before relying on it.
# hooks not translated: pre_configure
[package]
name = "cmusfm"
version = "0.5.0"
archive = "https://github.com/Arkq/cmusfm/archive/v0.5.0.tar.gz"
sha256 = "17aae8fc805e79b367053ad170854edceee5f4c51a9880200d193db9862d8363"
strip_components = 1
description = "Last.fm scrobbler for cmus"
homepage = "https://github.com/Arkq/cmusfm"
license = "GPL-3.0-or-later"
deps = ["curl", "glib", "libnotify", "openssl"]

[build]
system = "autotools"
configure_args = ["--enable-libnotify"]
tools = ["pkg-config"]

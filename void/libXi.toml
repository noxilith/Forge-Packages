# Imported from Void Linux's template for 'libXi'. Review before relying on it.
# hooks not translated: post_install
[package]
name = "libXi"
version = "1.8.3"
archive = "https://www.x.org/releases/individual/lib/libXi-1.8.3.tar.xz"
sha256 = "7ad60056f01af4f786cfe93b3a7707447711626fc8da2637bec71a90409babe5"

# Imported from Void Linux's template for 'gnome-screensaver'. Review before relying on it.
# hooks not translated: post_patch
# needs, but Forge has no recipe for yet: dbus-glib, intltool
[package]
name = "gnome-screensaver"
version = "3.6.1"
archive = "https://download.gnome.org/sources/gnome-screensaver/3.6/gnome-screensaver-3.6.1.tar.xz"
sha256 = "f39b78d4f7fed748c7f0a31d694112fb907c6d3c4e63db22eb858df07e962cd0"
strip_components = 1
description = "GNOME's screensaver that can replace xscreensaver"
homepage = "https://wiki.gnome.org/Projects/GnomeScreensaver"
license = "GPL-3.0-or-later"
deps = ["dbus", "gnome-desktop", "libgnomekbd", "pam"]
patches = ["patches/build.patch"]

[build]
system = "autotools"
configure_args = ["--enable-compile-warnings=minimum"]
tools = ["pkg-config"]
deps = ["glib"]

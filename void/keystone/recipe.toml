# Imported from Void Linux's template for 'keystone'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: python3-setuptools
[package]
name = "keystone"
version = "0.9.2"
archive = "https://github.com/keystone-engine/keystone/archive/0.9.2.tar.gz"
sha256 = "c9b3a343ed3e05ee168d29daf89820aff9effb2c74c6803c2d9e21d55b5b7c24"
strip_components = 1
description = "Lightweight multi-platform, multi-architecture assembler framework"
homepage = "http://www.keystone-engine.org/"
license = "GPL-2.0-only"
patches = ["patches/cmake.patch"]

[build]
system = "cmake"
configure_args = ["-DBUILD_SHARED_LIBS=ON", "-DLLVM_TARGETS_TO_BUILD=all"]
tools = ["pkg-config"]

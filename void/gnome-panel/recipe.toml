# Imported from Void Linux's template for 'gnome-panel'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: itstool
[package]
name = "gnome-panel"
version = "3.52.0"
archive = "https://download.gnome.org/sources/gnome-panel/3.52/gnome-panel-3.52.0.tar.xz"
sha256 = "9e29ba8873cde40d40c2934a464f8f43ba2eb1b522b191447caa27dd7853c5d4"
strip_components = 1
description = "Panel Application for GNOME flashback"
homepage = "https://wiki.gnome.org/Projects/GnomePanel"
license = "GPL-2.0-or-later, GFDL-1.1-or-later, LGPL-2.1-or-later"
deps = ["cairo", "dconf", "elogind", "evolution-data-server", "gdm", "glib", "gnome-desktop", "gnome-menus", "gtk+3", "libX11", "libXrandr", "libgweather", "libwnck", "pango", "polkit"]
patches = ["patches/revert-5ce96e7a5608a7a4b96e2de1c6f8be7037f2c391.patch"]

[build]
system = "autotools"
tools = ["pkg-config"]
deps = ["gettext"]

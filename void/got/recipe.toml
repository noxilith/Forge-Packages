# Imported from Void Linux's template for 'got'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: libtls, ncurses, util-linux-common
[package]
name = "got"
version = "0.103"
archive = "https://gameoftrees.org/releases/portable/got-portable-0.103.tar.gz"
sha256 = "32405e93f353a54fabca5492e5a6c5425f159b7a614450909299c8dc83492878"
strip_components = 1
description = "VCS which prioritizes ease of use and simplicity over flexibility"
homepage = "https://gameoftrees.org"
license = "ISC"
deps = ["libbsd", "libevent", "libmd", "openssl", "zlib"]
patches = ["patches/landlock.patch"]

[build]
system = "autotools"
tools = ["pkg-config"]
deps = ["byacc"]

# Imported from Void Linux's template for 'libjpeg-turbo'. Review before relying on it.
# hooks not translated: post_install
[package]
name = "libjpeg-turbo"
version = "3.1.4.1"
archive = "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.1.4.1/libjpeg-turbo-3.1.4.1.tar.gz"
sha256 = "ecae8008e2cc9ade2f2c1bb9d5e6d4fb73e7c433866a056bd82980741571a022"
strip_components = 1
description = "Derivative of libjpeg which uses SIMD instructions"

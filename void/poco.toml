# Imported from Void Linux's template for 'poco'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: sqlite
[package]
name = "poco"
version = "1.15.4"
archive = "https://pocoproject.org/releases/poco-1.15.4/poco-1.15.4-all.tar.gz"
sha256 = "efdfbc8ce78a67c6c713c533bd6f95bff4b2ce1507bab4e53a86c60160bcdc54"
strip_components = 1
description = "C++ class libraries for building network-based applications"
homepage = "https://pocoproject.org"
license = "BSL-1.0"
deps = ["expat", "libutf8proc", "openssl", "pcre2", "zlib"]

[build]
system = "cmake"
configure_args = ["-DPOCO_UNBUNDLED=ON"]

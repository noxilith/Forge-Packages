# Imported from Void Linux's template for 'taglib'. Review before relying on it.
[package]
name = "taglib"
version = "2.3.1"
archive = "https://github.com/taglib/taglib/archive/v2.3.1.tar.gz"
sha256 = "72c3176432b065978dee670b674aaeae7d9a9f37c721ee578181e9231832bca1"
strip_components = 1
description = "Library for accessing ID tags in various media files"
homepage = "https://taglib.github.io/"
license = "LGPL-2.1-or-later, MPL-1.1"
deps = ["utfcpp", "zlib"]

[build]
system = "cmake"
configure_args = ["-DWITH_MP4=ON", "-DWITH_ASF=ON", "-DBUILD_SHARED_LIBS=ON"]
tools = ["pkg-config"]

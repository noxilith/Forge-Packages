# Imported from Void Linux's template for 'kf6-networkmanager-qt'. Review before relying on it.
# needs, but Forge has no recipe for yet: kf6-base, qt6-tools
[package]
name = "kf6-networkmanager-qt"
version = "6.30.0"
archive = "https://download.kde.org/stable/frameworks/6.30/networkmanager-qt-6.30.0.tar.xz"
sha256 = "f6ba5f54d413ea0b2642207a6ebd0803e7cb8392b91fcf8a1679fd0c21062865"
strip_components = 1
description = "Qt wrapper for NetworkManager API"
homepage = "https://invent.kde.org/frameworks/networkmanager-qt"
license = "LGPL-2.1-or-later"
deps = ["NetworkManager", "qt6-declarative"]

[build]
system = "cmake"
configure_args = ["-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "qt6-base"]

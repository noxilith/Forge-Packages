[package]
name = "skippy-xd"
version = "2016.10.20"
archive = "https://github.com/antonio-malcolm/skippy-xd/archive/v2016.10.20.tar.gz"
sha256 = "221a27e96b3ff759a2fb0f9909063c60e0c206c87d024f49b77484f92a37e4c2"

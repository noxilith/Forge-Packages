description = "A fast Qt IMAP/SMPTP client"
homepage = "http://trojita.flaska.net/"
license = "GPL-2,GPL-3"
deps = ["qt5-webkit", "zlib"]
patches = ["patches/39772585033c1c0aff96f297e93de7be53f9b114.patch", "patches/QPainterPath.patch"]

[build]
system = "cmake"

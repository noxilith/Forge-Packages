# Imported from Void Linux's template for 'trojita'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: qt5
[package]
name = "trojita"
version = "0.7"
archive = "https://downloads.sourceforge.net/sourceforge/trojita/trojita-0.7.tar.xz"
sha256 = "e08da881721cafa00ecd772eaef6b99fd37d068cb703eeb532de0ed1ea0136d9"

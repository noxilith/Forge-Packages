# Imported from Void Linux's template for 'python3-syndom'. Review before relying on it.
# needs, but Forge has no recipe for yet: python3-pybind11
[package]
name = "python3-syndom"
version = "1.0"
archive = "https://gitlab.com/gabmus/syndication-domination/-/archive/1.0/syndication-domination-1.0.tar.gz"
sha256 = "eb8a1d6b3ebc2e3997397b07fe75eb62e4c788ee37d8b2a12e72becd65cf479f"
strip_components = 1
description = "Simple RSS/Atom parser library in C++ - Python3 bindings"
homepage = "https://gitlab.com/gabmus/syndication-domination"
license = "GPL-3.0-or-later"
deps = ["fmt", "pugixml", "tidy5"]
patches = ["patches/add-author-extraction-for-feed-item.patch"]

[build]
system = "meson"
tools = ["pkg-config"]

# Imported from Void Linux's template for 'svgpart'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-svg
[package]
name = "svgpart"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/svgpart-26.08.1.tar.xz"
sha256 = "4523b439a76ec06bce4309ddfc177769f0d67c43b66b4c4f7f611d7d6e9c7468"
strip_components = 1
description = "KPart to display SVG images"
homepage = "https://invent.kde.org/graphics/svgpart"
license = "GPL-2.0-or-later"
deps = ["kf6-kconfigwidgets", "kf6-kcoreaddons", "kf6-ki18n", "kf6-kparts", "kf6-kxmlgui", "qt6-base"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "gettext", "kf6-kconfig"]

# Imported from Void Linux's template for 'nmap'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: libssh2, python3-build, python3-pip, python3-setuptools
[package]
name = "nmap"
version = "7.99"
archive = "https://nmap.org/dist/nmap-7.99.tar.bz2"
sha256 = "df512492ffd108e53a27a06f26d8635bbe89e0e569455dc8ffef058c035d51b2"
strip_components = 1
description = "Utility for network discovery and security auditing"
homepage = "https://nmap.org"
license = "custom:nmap"
deps = ["libpcap", "openssl", "pcre"]

[build]
system = "autotools"
configure_args = ["--without-ndiff", "--with-openssl", "--with-zenmap"]
tools = ["pkg-config"]
deps = ["python3-cairo", "python3-gobject"]

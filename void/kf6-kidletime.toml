# Imported from Void Linux's template for 'kf6-kidletime'. Review before relying on it.
# needs, but Forge has no recipe for yet: kf6-base, qt6-tools
[package]
name = "kf6-kidletime"
version = "6.30.0"
archive = "https://download.kde.org/stable/frameworks/6.30/kidletime-6.30.0.tar.xz"
sha256 = "22873204292ddb757e5a0a57004c57debe1285cd0fd4e796d07e9de2402e60c3"
strip_components = 1
description = "Framework for detection and notification of device idle time"
homepage = "https://invent.kde.org/frameworks/kidletime"
license = "LGPL-2.1-or-later"
deps = ["libXScrnSaver", "plasma-wayland-protocols", "qt6-base", "wayland-protocols"]

[build]
system = "cmake"
configure_args = ["-DKDE_INSTALL_QMLDIR=lib/qt6/qml", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "wayland"]

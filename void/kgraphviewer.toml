# Imported from Void Linux's template for 'kgraphviewer'. Review before relying on it.
# needs, but Forge has no recipe for yet: boost, cups, qt6-qt5compat, qt6-svg
[package]
name = "kgraphviewer"
version = "2.5.0"
archive = "https://download.kde.org/stable/kgraphviewer/2.5.0/kgraphviewer-2.5.0.tar.xz"
sha256 = "872bee63fb4df6f7fb2b4eaf02ff825cba3ca953ac02509a287fe5cd0f1e2b69"
strip_components = 1
description = "Graphviz DOT graph file viewer"
homepage = "https://apps.kde.org/kgraphviewer/"
license = "GPL-2.0-or-later"
deps = ["fontconfig", "freetype", "graphviz", "kf6-kcoreaddons", "kf6-kdoctools", "kf6-ki18n", "kf6-kparts", "kf6-kwidgetsaddons", "qt6-base"]

[build]
system = "cmake"
configure_args = ["-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "gettext", "kf6-kconfig"]

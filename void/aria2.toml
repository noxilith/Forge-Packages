# Imported from Void Linux's template for 'aria2'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: ca-certificates, sqlite
[package]
name = "aria2"
version = "1.37.0"
archive = "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0.tar.xz"
sha256 = "60a420ad7085eb616cb6e2bdf0a7206d68ff3d37fb5a956dc44242eb2f79b66b"
strip_components = 1
description = "Lightweight multi-protocol/multi-source command-line download utility"
homepage = "https://aria2.github.io/"
license = "GPL-2.0-or-later"
deps = ["c-ares", "expat", "gmp", "openssl", "zlib"]

[build]
system = "autotools"
configure_args = ["--with-openssl", "--with-libexpat", "--without-gnutls", "--enable-libaria2"]
tools = ["pkg-config"]

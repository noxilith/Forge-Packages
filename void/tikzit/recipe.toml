# Imported from Void Linux's template for 'tikzit'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: lib32disabled
# needs, but Forge has no recipe for yet: qt5
[package]
name = "tikzit"
version = "2.1.6"
archive = "https://github.com/tikzit/tikzit/archive/refs/tags/v2.1.6.tar.gz"
sha256 = "40e160f654a25a3a36d6a5361eef71a51f9d3b5eec3b42dd9246ec26402149d1"
strip_components = 1
description = "Pgf/TikZ diagram editor"
homepage = "https://tikzit.github.io/"
license = "GPL-3.0-or-later"
deps = ["poppler", "poppler-qt5"]
patches = ["patches/missing-source-files.cmake.patch", "patches/no-update-check.patch"]

[build]
system = "cmake"
tools = ["bison", "flex"]
deps = ["extra-cmake-modules"]

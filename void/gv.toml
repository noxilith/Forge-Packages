# Imported from Void Linux's template for 'gv'. Review before relying on it.
# needs, but Forge has no recipe for yet: bzip2, ghostscript
[package]
name = "gv"
version = "3.7.4"
archive = "https://ftp.gnu.org/gnu/gv/gv-3.7.4.tar.gz"
sha256 = "2162b3b3a95481d3855b3c4e28f974617eef67824523e56e20b56f12fe201a61"
strip_components = 1
description = "Postscript and PDF viewer"
homepage = "http://www.gnu.org/software/gv/"
license = "GPL-3.0-or-later"
deps = ["libICE", "libX11", "libXaw3d", "libXext", "libXinerama", "libXmu", "libXpm", "libXt", "zlib"]

[build]
system = "autotools"
configure_args = ["--with-x", "--enable-backing-pixmap", "--enable-international", "--with-default-papersize=a4"]
tools = ["pkg-config"]
deps = ["xorgproto"]

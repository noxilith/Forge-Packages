# Imported from Void Linux's template for 'zita-at1'. Review before relying on it.
# hooks not translated: pre_build
# settings not translated: CXXFLAGS
# needs, but Forge has no recipe for yet: fftw, jack, zita-resampler
[package]
name = "zita-at1"
version = "0.8.2"
archive = "https://kokkinizita.linuxaudio.org/linuxaudio/downloads/zita-at1-0.8.2.tar.bz2"
sha256 = "35261326680e98bfc280623fac1190baa99c719133bf06207216fb7b85ea9a63"
strip_components = 1
description = "Audio autotuner for JACK"
homepage = "https://kokkinizita.linuxaudio.org/linuxaudio/"
license = "GPL-3.0-or-later"
deps = ["cairo", "clthreads", "clxclient", "freetype", "libX11", "libXft", "libpng"]

[build]
system = "make"
subdir = "source"
tools = ["pkg-config"]

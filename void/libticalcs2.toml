# Imported from Void Linux's template for 'libticalcs2'. Review before relying on it.
# hooks not translated: pre_configure
# needs, but Forge has no recipe for yet: intltool
[package]
name = "libticalcs2"
version = "1.1.9"
archive = "https://downloads.sourceforge.net/sourceforge/tilp/tilp2-linux/tilp2-1.18/libticalcs2-1.1.9.tar.bz2"
sha256 = "76780788bc309b647f97513d38dd5f01611c335a72855e0bd10c7bdbf2e38921"
strip_components = 1
description = "Library for interacting with TI graphing calculators"
homepage = "https://www.ticalc.org"
license = "GPL-2.0-or-later"
deps = ["libticables2", "libtifiles2"]

[build]
system = "autotools"
tools = ["bison", "pkg-config"]
deps = ["groff"]

# Imported from Void Linux's template for 'oidentd'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: conf_files
# needs, but Forge has no recipe for yet: libnetfilter_conntrack
[package]
name = "oidentd"
version = "3.1.0"
archive = "https://files.janikrabe.com/pub/oidentd/releases/3.1.0/oidentd-3.1.0.tar.xz"
sha256 = "feaa1f5e23df9a0a6b351bffd75345d575a209d5908f60cb3aaf4349f38cb0b0"
strip_components = 1
description = "RFC 1413 compliant ident daemon"
homepage = "https://oidentd.janikrabe.com/"
license = "GPL-2.0-only, GFDL-1.1-or-later"
deps = ["libcap-ng"]

[build]
system = "autotools"
tools = ["flex"]

# Imported from Void Linux's template for 'SDL3'. Review before relying on it.
[package]
name = "SDL3"
version = "3.4.18"
archive = "https://www.libsdl.org/release/SDL3-3.4.18.tar.gz"
sha256 = "9c75cf16330322c217dedd2e0609f1124f1b54b8633e763467b4684d0f4334a3"
strip_components = 1
description = "Simple DirectMedia Layer (version 3)"
homepage = "https://www.libsdl.org/"
license = "Zlib"
deps = ["alsa-lib", "dbus", "eudev", "libsamplerate", "libusb-compat"]

[build]
system = "cmake"
configure_args = ["-DSDL_ALSA=ON", "-DSDL_RPATH=OFF", "-DSDL_CLOCK_GETTIME=ON", "-DSDL_PULSEAUDIO_SHARED=OFF", "-DSDL_ALSA_SHARED=OFF", "-DSDL_DBUS=ON"]
tools = ["nasm", "pkg-config"]

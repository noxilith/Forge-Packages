# Imported from Void Linux's template for 'mpdscribble'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: make_dirs, conf_files
# needs, but Forge has no recipe for yet: boost
[package]
name = "mpdscribble"
version = "0.25"
archive = "https://www.musicpd.org/download/mpdscribble/0.25/mpdscribble-0.25.tar.xz"
sha256 = "20f89d945bf517c4d68bf77a77a359fdb13842ab1295e8d21eda79be2b5b35ce"
strip_components = 1
description = "MPD audio scrobbler (e.g. last.fm)"
homepage = "https://github.com/MusicPlayerDaemon/mpdscribble"
license = "GPL-2.0-or-later"
deps = ["curl", "libgcrypt", "libmpdclient"]
patches = ["patches/fix-missing-ctime-include.patch"]

[build]
system = "meson"
tools = ["pkg-config"]

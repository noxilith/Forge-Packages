# Imported from Void Linux's template for 'opensmtpd-extras'. Review before relying on it.
# hooks not translated: pre_configure
# settings not translated: CFLAGS
# needs, but Forge has no recipe for yet: sqlite
[package]
name = "opensmtpd-extras"
version = "6.7.1"
archive = "https://www.opensmtpd.org/archives/opensmtpd-extras-6.7.1.tar.gz"
sha256 = "f84385559a8bb366b2fe25d8b1f78c108f07cc15992350171569d7bdc2e935ac"
strip_components = 1
description = "Free implementation of the server-side SMTP protocol - extras"
homepage = "https://www.opensmtpd.org"
license = "ISC"
deps = ["libevent", "mariadb", "opensmtpd", "openssl", "postgresql18"]
patches = ["patches/fix-musl.patch"]

[build]
system = "autotools"
configure_args = ["--with-table-passwd", "--with-table-ldap", "--with-table-mysql", "--with-table-postgres", "--with-table-socketmap", "--with-table-sqlite"]

# Imported from Void Linux's template for 'criu'. Review before relying on it.
# hooks not translated: post_install, pre_build, pre_install
# settings not translated: make_build_args, make_install_args
# needs, but Forge has no recipe for yet: asciidoc, nftables, python3-pip
[package]
name = "criu"
version = "3.18"
archive = "https://github.com/checkpoint-restore/criu/archive/refs/tags/v3.18.tar.gz"
sha256 = "6a9997981c9fe4730c848ce59346b3a22fad69b803607cb67a3f6ec0557fa474"
strip_components = 1
description = "Utility to checkpoint/restore a process tree"
homepage = "https://criu.org/"
license = "GPL-2.0-or-later, LGPL-2.1-only"
deps = ["libbsd", "libcap", "libnet", "libnl3", "protobuf", "protobuf-c"]
patches = ["patches/aarch64-musl.patch", "patches/capsetget.patch", "patches/ppc64-musl.patch", "patches/sigev-musl.patch"]

[build]
system = "make"
tools = ["perl", "pkg-config"]
deps = ["which", "xmlto"]

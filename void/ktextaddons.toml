# Imported from Void Linux's template for 'ktextaddons'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-multimedia, qt6-tools, reuse
[package]
name = "ktextaddons"
version = "2.1.2"
archive = "https://download.kde.org/stable/ktextaddons/ktextaddons-2.1.2.tar.xz"
sha256 = "f3b4448904f1656d6d7cd5a557d22fe1c50624eb32ed369f34726beff9ce0589"
strip_components = 1
description = "Various text handling addon"
homepage = "https://invent.kde.org/libraries/ktextaddons"
license = "LGPL-2.0-or-later, GPL-2.0-or-later"
deps = ["kf6-kiconthemes", "kf6-kio", "kf6-ktextwidgets", "kf6-kxmlgui", "kf6-sonnet", "kf6-syntax-highlighting", "qt6-speech", "qtkeychain-qt6"]

[build]
system = "cmake"
configure_args = ["-DBUILD_WITH_QT6=ON", "-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "gettext", "kf6-kconfig", "kf6-kcoreaddons", "qt6-base"]

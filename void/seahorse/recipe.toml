# Imported from Void Linux's template for 'seahorse'. Review before relying on it.
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: avahi-discover, hicolor-icon-theme, itstool
[package]
name = "seahorse"
version = "47.0.1"
archive = "https://download.gnome.org/sources/seahorse/47/seahorse-47.0.1.tar.xz"
sha256 = "9c1917e4a61f7febb787849ce36ce717fce706c346880b991d056d54dadbcacc"
strip_components = 1
description = "GNOME application for managing encryption keys"
homepage = "https://gitlab.gnome.org/GNOME/seahorse"
license = "GPL-2.0-or-later"
deps = ["desktop-file-utils", "gcr", "gnupg", "gobject-introspection", "gpgme", "gtk+3", "libhandy1", "libpwquality", "libsecret", "libsoup3", "openldap", "openssh"]
patches = ["patches/gpgme-2.patch"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["gettext", "glib", "vala"]

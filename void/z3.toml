# Imported from Void Linux's template for 'z3'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: python3-packaging-bootstrap, python3-setuptools
[package]
name = "z3"
version = "5.3.3"
archive = "https://github.com/Z3Prover/z3/archive/z3-5.3.3.tar.gz"
sha256 = "f8373e6a753da6e336f0955fca65c7a56346f3de68a56fd353acb4abf33d4823"
strip_components = 1
description = "Z3 theorem prover and SMT solver (command line + Python3 module)"
homepage = "https://github.com/Z3Prover/z3"
license = "MIT"
deps = ["gmp"]

[build]
system = "cmake"
configure_args = ["-DZ3_BUILD_PYTHON_BINDINGS=YES"]
deps = ["which"]

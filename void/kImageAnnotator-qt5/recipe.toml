# Imported from Void Linux's template for 'kImageAnnotator-qt5'. Review before relying on it.
# needs, but Forge has no recipe for yet: qt5
[package]
name = "kImageAnnotator-qt5"
version = "0.7.1"
archive = "https://github.com/DamirPorobic/kImageAnnotator/archive/v0.7.1.tar.gz"
sha256 = "2335c5be15a5dde34c3333c10a6339da114e2232e4c4642dea1793e491e09677"
strip_components = 1
description = "Tool for annotating images"
homepage = "https://github.com/DamirPorobic/kImageAnnotator"
license = "LGPL-2.0-or-later"
deps = ["kColorPicker-qt5"]
patches = ["patches/rename-qt5.patch"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTS=OFF", "-DBUILD_EXAMPLE=OFF", "-DBUILD_SHARED_LIBS=ON"]
deps = ["extra-cmake-modules"]

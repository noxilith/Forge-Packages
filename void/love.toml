# Imported from Void Linux's template for 'love'. Review before relying on it.
# settings not translated: lib32disabled
# needs, but Forge has no recipe for yet: LuaJIT, hicolor-icon-theme, libtheora, physfs
[package]
name = "love"
version = "11.5"
archive = "https://github.com/love2d/love/releases/download/11.5/love-11.5-linux-src.tar.gz"
sha256 = "066e0843f71aa9fd28b8eaf27d41abb74bfaef7556153ac2e3cf08eafc874c39"
strip_components = 1
description = "Framework for writing 2D games in lua"
homepage = "https://love2d.org/"
license = "Zlib"
deps = ["SDL2", "desktop-file-utils", "devil", "freetype", "libmodplug", "libopenal", "libvorbis", "mpg123"]

[build]
system = "autotools"
configure_args = ["--disable-static"]
tools = ["pkg-config"]

# Imported from Void Linux's template for 'libdrm'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: python3-docutils
[package]
name = "libdrm"
version = "2.4.134"
archive = "https://gitlab.freedesktop.org/mesa/libdrm/-/archive/libdrm-2.4.134/libdrm-libdrm-2.4.134.tar.gz"
sha256 = "28af861f62e7a2c3a48c5ff2ad4d01cf440a419f7f877de5caa7f73d3afa5367"
strip_components = 1
description = "Userspace interface to kernel DRM services"
homepage = "https://dri.freedesktop.org/"
license = "MIT"
deps = ["eudev", "libpciaccess"]
patches = ["patches/dont-build-noveau-tests.patch"]

[build]
system = "meson"
configure_args = ["-Dudev=true", "-Dvalgrind=disabled", "-Dinstall-test-programs=true"]
tools = ["pkg-config"]

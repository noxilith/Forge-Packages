# Imported from Void Linux's template for 'gcdemu'. Review before relying on it.
# needs, but Forge has no recipe for yet: intltool
[package]
name = "gcdemu"
version = "3.3.1"
archive = "https://downloads.sourceforge.net/sourceforge/cdemu/gcdemu-3.3.1.tar.xz"
sha256 = "cc1459c5b4fe27ce6931361a4d1c6b577b9aeb59ba29853a692b697a085876f6"

# Imported from Void Linux's template for 'monit'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, pre_configure
# settings not translated: conf_files
[package]
name = "monit"
version = "5.35.2"
archive = "https://mmonit.com/monit/dist/monit-5.35.2.tar.gz"
sha256 = "4dfef54329e63d9772a9e1c36ac99bc41173b79963dc0d8235f2c32f4b9e078f"
strip_components = 1
description = "Utility for monitoring, processes, files, directories and devices"
homepage = "https://mmonit.com/monit/"
license = "AGPL-3.0-only"
deps = ["openssl", "pam", "zlib"]
patches = ["patches/musl-fix.patch"]

[build]
system = "autotools"
configure_args = ["libmonit_cv_setjmp_available=yes", "libmonit_cv_vsnprintf_c99_conformant=yes"]
tools = ["perl"]

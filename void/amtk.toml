# Imported from Void Linux's template for 'amtk'. Review before relying on it.
# settings not translated: build_helper
[package]
name = "amtk"
version = "5.6.1"
archive = "https://download.gnome.org/sources/amtk/5.6/amtk-5.6.1.tar.xz"
sha256 = "d50115b85c872aac296934b5ee726a3fa156c6f5ad96d27e0edd0aa5ad173228"
strip_components = 1
description = "Actions, Menus and Toolbars Kit for GTK+ applications"
homepage = "https://gitlab.gnome.org/World/amtk"
license = "LGPL-2.1-or-later"
deps = ["glib", "gtk+3", "libgedit-amtk"]

[build]
system = "meson"
configure_args = ["-Dgobject_introspection=false", "-Dgtk_doc=false"]
tools = ["pkg-config"]
deps = ["gettext"]

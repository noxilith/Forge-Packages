# Imported from Void Linux's template for 'sc-im'. Review before relying on it.
# hooks not translated: post_extract, post_install
# settings not translated: make_build_args
# needs, but Forge has no recipe for yet: gnuplot, lua54, ncurses
[package]
name = "sc-im"
version = "0.8.5"
archive = "https://github.com/andmarti1424/sc-im/archive/v0.8.5.tar.gz"
sha256 = "49adb76fc55bc3e6ea8ee414f41428db4aef947e247718d9210be8d14a6524bd"
strip_components = 1
description = "SpreadSheet Calculator (sc) Improvised"
homepage = "https://github.com/andmarti1424/sc-im/"
license = "BSD-4-Clause"
deps = ["less", "libxls", "libxlsxwriter", "libxml2", "libzip"]

[build]
system = "make"
subdir = "src"
tools = ["bison", "pkg-config"]
deps = ["which"]

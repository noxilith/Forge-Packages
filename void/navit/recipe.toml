# Imported from Void Linux's template for 'navit'. Review before relying on it.
# needs, but Forge has no recipe for yet: SDL_image, SDL_ttf, dbus-glib, gpsd, qt5
[package]
name = "navit"
version = "0.5.6"
archive = "https://github.com/navit-gps/navit/archive/v0.5.6.tar.gz"
sha256 = "043688e0b34504ca4ee80fb6a80895b938eae41e4031d0977dd30c20c20f1714"
strip_components = 1
description = "Turn-by-turn Navigation Software"
homepage = "http://www.navit-project.org/"
license = "GPL-2.0-only, LGPL-2.0-only"
deps = ["at-spi2-core", "fontconfig", "gdk-pixbuf", "gtk+", "imlib2", "libfreeglut", "libpng", "pango", "sdl12-compat", "zlib"]
patches = ["patches/0001-Fix-graphics-svg_debug-Fix-Wincompatible-pointer-typ.patch"]

[build]
system = "cmake"
configure_args = ["-DLIBDIR=lib/navit", "-DSAMPLE_MAP=n"]
tools = ["pkg-config"]

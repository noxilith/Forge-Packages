# Imported from Void Linux's template for 'presenterm'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: python3-WeasyPrint
[package]
name = "presenterm"
version = "0.16.1"
archive = "https://github.com/mfontanini/presenterm/archive/refs/tags/v0.16.1.tar.gz"
sha256 = "221258deae7204c65a55d3666aaea5fa157312b4196a59abc60ba4d363787c10"
strip_components = 1
description = "Markdown terminal slideshow tool"
homepage = "https://github.com/mfontanini/presenterm"
license = "BSD-2-Clause"
deps = ["oniguruma"]

[build]
system = "cargo"
tools = ["pkg-config"]

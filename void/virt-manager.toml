# Imported from Void Linux's template for 'virt-manager'. Review before relying on it.
# needs, but Forge has no recipe for yet: libvirt-glib, python3-docutils
[package]
name = "virt-manager"
version = "5.1.0"
archive = "https://releases.pagure.org/virt-manager/virt-manager-5.1.0.tar.xz"
sha256 = "ccfc44b6c1c0be8398beb687c675d9ea4ca1c721dfb67bd639209a7b0dec11b1"
strip_components = 1
description = "User interface for managing virtual machines"
homepage = "https://virt-manager.org"
license = "GPL-2.0-or-later"
deps = ["dconf", "gobject-introspection", "gtk-vnc", "gtksourceview4", "spice-gtk", "vte3"]

[build]
system = "meson"
configure_args = ["-Dupdate-icon-cache=false", "-Dcompile-schemas=false"]
deps = ["gettext"]

# Imported from Void Linux's template for 'plotutils'. Review before relying on it.
[package]
name = "plotutils"
version = "2.6"
archive = "https://ftp.gnu.org/gnu/plotutils/plotutils-2.6.tar.gz"
sha256 = "4f4222820f97ca08c7ea707e4c53e5a3556af4d8f1ab51e0da6ff1627ff433ab"

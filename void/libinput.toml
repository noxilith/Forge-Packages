# Imported from Void Linux's template for 'libinput'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: lua54, mtdev
[package]
name = "libinput"
version = "1.31.3"
archive = "https://gitlab.freedesktop.org/libinput/libinput/-/archive/1.31.3/libinput-1.31.3.tar.gz"
sha256 = "b6749bf6f1890f6631c0a70a027c35fec9d2e096a39f720548896e41474a9854"
strip_components = 1
description = "Provides handling input devices in Wayland compositors and X"
homepage = "https://www.freedesktop.org/wiki/Software/libinput"
license = "MIT"
deps = ["eudev", "libevdev", "libwacom"]

[build]
system = "meson"
configure_args = ["-Db_ndebug=false", "-Ddebug-gui=false"]
tools = ["pkg-config"]

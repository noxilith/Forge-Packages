# Imported from Void Linux's template for 'rustnet'. Review before relying on it.
# hooks not translated: pre_build, pre_install
# needs, but Forge has no recipe for yet: llvm
[package]
name = "rustnet"
version = "1.7.0"
archive = "https://github.com/domcyrus/rustnet/archive/refs/tags/v1.7.0.tar.gz"
sha256 = "9d3f6509da06f832c04c5accc7b777c18f3de8b32c885137c9a1346990694dda"
strip_components = 1
description = "Cross-platform network monitoring terminal UI tool built with Rust"
homepage = "https://github.com/domcyrus/rustnet"
license = "Apache-2.0"
deps = ["elfutils", "libpcap", "zlib"]

[build]
system = "cargo"
tools = ["pkg-config"]

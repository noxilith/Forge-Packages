# Imported from Void Linux's template for 'freecell-solver'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: perl-Moo, perl-Path-Tiny, perl-Template-Toolkit, pysolfc, python3-pysol_cards, python3-random2, python3-six, rinutils
[package]
name = "freecell-solver"
version = "6.10.0"
archive = "https://fc-solve.shlomifish.org/downloads/fc-solve/freecell-solver-6.10.0.tar.xz"
sha256 = "443ba29de08be751a60faca42a817b65b342cea93188fd7651741b75048379b4"
strip_components = 1
description = "Automatically solves Freecell and similar variants of solitaire"
homepage = "https://fc-solve.shlomifish.org/"
license = "MIT"
deps = ["gmp"]

[build]
system = "cmake"
configure_args = ["-DFCS_WITH_TEST_SUITE=OFF"]
tools = ["gperf"]

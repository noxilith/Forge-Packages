# Imported from Void Linux's template for 'OpenTimelineIO'. Review before relying on it.
[package]
name = "OpenTimelineIO"
version = "0.18.1"
archive = "https://github.com/AcademySoftwareFoundation/OpenTimelineIO/archive/refs/tags/v0.18.1.tar.gz"
sha256 = "bcb516a43a962dac0cde3e1f9da634c1fd409915d499ff8f3ce6f738a4637d72"
strip_components = 1
description = "Interchange format for editorial timeline information"

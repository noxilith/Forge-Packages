# Imported from Void Linux's template for 'kf6-kpackage'. Review before relying on it.
# needs, but Forge has no recipe for yet: kf6-base, qt6-tools
[package]
name = "kf6-kpackage"
version = "6.30.0"
archive = "https://download.kde.org/stable/frameworks/6.30/kpackage-6.30.0.tar.xz"
sha256 = "58939af0c553f24963652e10d248e2f8f2b2ca2b87dc26d3220675ed0cf33019"
strip_components = 1
description = "Aplications to manage user installable packages of non-binary assets"
homepage = "https://invent.kde.org/frameworks/kpackage"
license = "LGPL-2.1-or-later"
deps = ["kf6-karchive", "kf6-kcoreaddons", "kf6-kdoctools", "kf6-ki18n"]

[build]
system = "cmake"
deps = ["extra-cmake-modules", "gettext", "qt6-base"]

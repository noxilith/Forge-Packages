# Imported from Void Linux's template for 'hugin'. Review before relying on it.
# settings not translated: build_helper, CXXFLAGS
# needs, but Forge has no recipe for yet: exiftool, sqlite
[package]
name = "hugin"
version = "2025.0.1"
archive = "https://downloads.sourceforge.net/sourceforge/hugin/hugin/hugin-2025.0/hugin-2025.0.1.tar.bz2"
sha256 = "7cf8eb33a6a8848cc7f816faf4bc88389228883d5513136dccb5cb243912ab79"
strip_components = 1
description = "Easy to use panoramic imaging toolchain"
homepage = "https://hugin.sourceforge.net/"
license = "GPL-2.0-or-later"
deps = ["enblend-enfuse", "exiv2", "glu", "lapack", "lcms2", "lensfun", "libXi", "libXmu", "libepoxy", "libfreeglut", "libpano13", "libpng", "openexr", "tiff", "vigra", "wxWidgets-gtk3"]
patches = ["patches/0001-disable-vigra-links-exr-check.patch", "patches/fix-cflags.patch"]

[build]
system = "cmake"
configure_args = ["-DBUILD_WITH_EPOXY=on"]
tools = ["pkg-config"]
deps = ["gettext", "swig"]

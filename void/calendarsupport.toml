# Imported from Void Linux's template for 'calendarsupport'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "calendarsupport"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/calendarsupport-26.08.1.tar.xz"
sha256 = "6490d2a70fcf393a8af1daaf571ba0b88972f9ab1b091ffb2dff19ac520423bc"
strip_components = 1
description = "Calendar support library"
homepage = "https://community.kde.org/KDE_PIM"
license = "GPL-2.0-or-later, LGPL-2.1-or-later"
deps = ["akonadi-calendar", "kf6-kholidays", "pimcommon"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "gettext", "kf6-kconfig", "kf6-kcoreaddons", "qt6-base"]

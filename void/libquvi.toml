# Imported from Void Linux's template for 'libquvi'. Review before relying on it.
# hooks not translated: pre_configure
# settings not translated: CFLAGS
# needs, but Forge has no recipe for yet: lua52
[package]
name = "libquvi"
version = "0.4.1"
archive = "https://downloads.sourceforge.net/sourceforge/quvi/libquvi-0.4.1.tar.gz"
sha256 = "143c92b065b7ddc2ac87c4b9679ee99df0f1dccd2d0dbda15da0a54ae280dec8"
strip_components = 1
description = "C library that can be used to parse flash media stream URLs"
homepage = "http://quvi.sourceforge.net/"
license = "LGPL-2.1-or-later"
deps = ["curl", "libquvi-scripts"]

[build]
system = "autotools"
tools = ["pkg-config"]

# Imported from Void Linux's template for 'mold'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: zstd
[package]
name = "mold"
version = "2.40.4"
archive = "https://github.com/rui314/mold/archive/refs/tags/v2.40.4.tar.gz"
sha256 = "69414c702ec1084e1fa8ca16da24f167f549e5e11e9ecd5d70a8dcda6f08c249"
strip_components = 1
description = "Faster drop-in replacement for existing Unix linkers"
homepage = "https://github.com/rui314/mold"
license = "MIT"
deps = ["libblake3", "mimalloc", "tbb", "zlib"]
patches = ["patches/test-target-machine.patch"]

[build]
system = "cmake"
configure_args = ["-DMOLD_USE_SYSTEM_MIMALLOC=ON", "-DMOLD_USE_SYSTEM_TBB=ON"]

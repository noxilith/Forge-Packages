# Imported from Void Linux's template for 'libpurple-steam'. Review before relying on it.
# needs, but Forge has no recipe for yet: nss
[package]
name = "libpurple-steam"
version = "1.7.2"
archive = "https://github.com/EionRobb/pidgin-opensteamworks/archive/1.7.2.tar.gz"
sha256 = "5dbb2e5b57e1a6f76df1b301fec0df8559008722f6a8d537006120052a87e53d"
strip_components = 1
description = "Steam plugin for libpurple - uses the Steam Mobile API"
homepage = "https://github.com/EionRobb/pidgin-opensteamworks"
license = "GPL-3.0-or-later"
deps = ["glib", "json-glib", "libsecret", "pidgin"]

[build]
system = "make"
subdir = "steam-mobile"
tools = ["pkg-config"]

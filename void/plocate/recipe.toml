# Imported from Void Linux's template for 'plocate'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: zstd
[package]
name = "plocate"
version = "1.1.25"
archive = "https://plocate.sesse.net/download/plocate-1.1.25.tar.gz"
sha256 = "68c1d5fbb11864403ae39c1a5937f13afd80b03e68041368831ef58cb613578e"
strip_components = 1
description = "Much faster locate based on posting lists"
homepage = "https://plocate.sesse.net/"
license = "GPL-2.0-or-later"
deps = ["liburing"]
patches = ["patches/fix-missing-include.patch", "patches/fix-musl-build.patch"]

[build]
system = "meson"
configure_args = ["-Dinstall_systemd=true", "-Dlocategroup=_plocate", "-Dupdatedb_progname=pupdatedb"]
tools = ["pkg-config"]

# Imported from Void Linux's template for 'autoconf213'. Review before relying on it.
# hooks not translated: post_install
[package]
name = "autoconf213"
version = "2.13"
archive = "https://ftp.gnu.org/gnu/autoconf/autoconf-2.13.tar.gz"
sha256 = "f0611136bee505811e9ca11ca7ac188ef5323a8e2ef19cffd3edb3cf08fd791e"
strip_components = 1
description = "Generates automatic source code configuration scripts (2.13 version)"
homepage = "http://www.gnu.org/software/autoconf"
license = "GPL-2.0-or-later"
deps = ["diffutils", "m4"]
patches = ["patches/patch-aa.diff", "patches/patch-ab.diff", "patches/patch-ac.diff"]

[build]
system = "autotools"
configure_args = ["--program-suffix=-2.13"]
tools = ["m4", "perl"]
deps = ["texinfo"]

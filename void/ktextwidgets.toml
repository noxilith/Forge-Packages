# Imported from Void Linux's template for 'ktextwidgets'. Review before relying on it.
# needs, but Forge has no recipe for yet: qt5, qt5-speech
[package]
name = "ktextwidgets"
version = "5.116.0"
archive = "https://download.kde.org/stable/frameworks/5.116/ktextwidgets-5.116.0.tar.xz"
sha256 = "34807e502cc0dbb984661c9569e9dfcfb1f005c451c9f3a5afdbb016de117552"
strip_components = 1
description = "KDE Text editing widgets"
homepage = "https://invent.kde.org/frameworks/ktextwidgets"
license = "LGPL-2.0-or-later, LGPL-2.1-or-later"
deps = ["kcompletion", "kiconthemes", "kservice", "sonnet"]

[build]
system = "cmake"
deps = ["extra-cmake-modules", "gettext", "kcoreaddons"]

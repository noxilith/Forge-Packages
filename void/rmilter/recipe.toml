# Imported from Void Linux's template for 'rmilter'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: libmemcached, libmilter, uthash, zstd
[package]
name = "rmilter"
version = "1.10.0"
archive = "https://github.com/vstakhov/rmilter/archive/1.10.0.tar.gz"
sha256 = "ea80563fa7636afed0b5fd9a29aa2300f15793ed85788e4ce69c187d341a7d54"
strip_components = 1
description = "Postfix/sendmail integration for rspamd"
homepage = "https://github.com/vstakhov/rmilter"
license = "BSD-2-Clause, BSD-3-Clause"
deps = ["glib", "hiredis", "http-parser", "libsasl", "libucl", "opendkim", "openssl", "pcre", "xxHash"]
patches = ["patches/de-vendor.patch", "patches/fix-cflags.patch", "patches/fix-gcc11.patch", "patches/fix-gcc14.patch"]

[build]
system = "cmake"
configure_args = ["-DMILTER_USER=rmilter", "-DMILTER_GROUP=_rmilter"]
tools = ["bison", "flex", "pkg-config"]

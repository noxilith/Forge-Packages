# Imported from Void Linux's template for 'grim'. Review before relying on it.
# hooks not translated: post_install
[package]
name = "grim"
version = "1.5.0"
archive = "https://gitlab.freedesktop.org/emersion/grim/-/archive/v1.5.0/grim-v1.5.0.tar.gz"
sha256 = "9e72a98f7621b1f5741b405b8dbd447acf7d300ddb12667ec526db1ce6154eaa"
strip_components = 1
description = "Grab images from a Wayland compositor"
homepage = "https://gitlab.freedesktop.org/emersion/grim"
license = "MIT"
deps = ["libjpeg-turbo", "libpng", "pixman", "wayland", "wayland-protocols"]

[build]
system = "meson"
configure_args = ["-Djpeg=enabled", "-Dwerror=false"]
tools = ["pkg-config"]
deps = ["scdoc"]

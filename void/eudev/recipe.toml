# Imported from Void Linux's template for 'eudev'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: conf_files
# needs, but Forge has no recipe for yet: util-linux-common
[package]
name = "eudev"
version = "3.2.14"
archive = "https://github.com/eudev-project/eudev/releases/download/v3.2.14/eudev-3.2.14.tar.gz"
sha256 = "8da4319102f24abbf7fff5ce9c416af848df163b29590e666d334cc1927f006f"
strip_components = 1
description = "Fork of systemd-udev (enhanced userland device daemon)"
homepage = "https://github.com/eudev-project/eudev"
license = "GPL-2.0-or-later"
deps = ["kmod"]
patches = ["patches/78-sound-card.rules.patch"]

[build]
system = "autotools"
configure_args = ["--enable-hwdb", "--enable-manpages"]
tools = ["gperf", "pkg-config"]

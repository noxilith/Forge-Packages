# Imported from Void Linux's template for 'snappy'. Review before relying on it.
# hooks not translated: post_install
[package]
name = "snappy"
version = "1.2.2"
archive = "https://github.com/google/snappy/archive/1.2.2.tar.gz"
sha256 = "90f74bc1fbf78a6c56b3c4a082a05103b3a56bb17bca1a27e052ea11723292dc"
strip_components = 1
description = "Fast compressor/decompressor library"
homepage = "https://google.github.io/snappy"
license = "BSD-3-Clause"
deps = ["benchmark", "gtest", "lzo", "zlib"]
patches = ["patches/cmakelists_no_3rdparty.patch", "patches/rtti.patch"]

[build]
system = "cmake"
configure_args = ["-DBUILD_SHARED_LIBS=1", "-DSNAPPY_BUILD_TESTS=OFF", "-DSNAPPY_BUILD_BENCHMARKS=OFF"]

# Imported from Void Linux's template for 'kapman'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-svg
[package]
name = "kapman"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/kapman-26.08.1.tar.xz"
sha256 = "4b167b53f50f04397d1f97baa51133278472b0597db95dd89e217b819267cb78"
strip_components = 1
description = "Clone of the well known game Pac-Man"
homepage = "https://kde.org/applications/games/org.kde.kapman"
license = "GPL-2.0-or-later"
deps = ["kf6-kconfig", "kf6-kconfigwidgets", "kf6-kcoreaddons", "kf6-kcrash", "kf6-kdbusaddons", "kf6-kdoctools", "kf6-ki18n", "kf6-kiconthemes", "kf6-kwidgetsaddons", "kf6-kxmlgui", "libkdegames", "qt6-base"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "gettext"]

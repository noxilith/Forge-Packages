# Imported from Void Linux's template for 'sequoia-sop'. Review before relying on it.
# hooks not translated: post_install, post_patch, pre_build
# needs, but Forge has no recipe for yet: bzip2, llvm, sqlite
[package]
name = "sequoia-sop"
version = "0.37.3"
archive = "https://gitlab.com/sequoia-pgp/sequoia-sop/-/archive/v0.37.3/sequoia-sop-v0.37.3.tar.gz"
sha256 = "136c9201d925acc4b79e9ebc0d09ba3f6ad5be798e9c4a3536fcfe8aa4c8e845"
strip_components = 1
description = "Implementation of the Stateless OpenPGP CLI using Sequoia"
homepage = "https://gitlab.com/sequoia-pgp/sequoia-sop/"
license = "GPL-2.0-or-later"
deps = ["openssl"]

[build]
system = "cargo"
configure_args = ["--bin", "sqop", "--no-default-features", "--features", "cli,sequoia-openpgp/compression,sequoia-openpgp/crypto-openssl"]
tools = ["pkg-config"]

# Imported from Void Linux's template for 'libodfgen'. Review before relying on it.
# needs, but Forge has no recipe for yet: boost
[package]
name = "libodfgen"
version = "0.1.8"
archive = "https://downloads.sourceforge.net/sourceforge/libwpd/libodfgen/libodfgen-0.1.8/libodfgen-0.1.8.tar.xz"
sha256 = "55200027fd46623b9bdddd38d275e7452d1b0ff8aeddcad6f9ae6dc25f610625"
strip_components = 1
description = "Library for generating documents in Open Document Format"
homepage = "http://sourceforge.net/p/libwpd/libodfgen/"
license = "LGPL-2.1-or-later, MPL-2.0"
deps = ["librevenge", "libxml2"]

[build]
system = "autotools"
configure_args = ["--enable-debug"]
tools = ["pkg-config"]

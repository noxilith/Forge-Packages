# Imported from Void Linux's template for 'plasma-sdk'. Review before relying on it.
# needs, but Forge has no recipe for yet: kde-plasma-base, qt6-qt5compat, qt6-svg, qt6-tools
[package]
name = "plasma-sdk"
version = "6.7.5"
archive = "https://download.kde.org/stable/plasma/6.7.5/plasma-sdk-6.7.5.tar.xz"
sha256 = "b2d6cfb36dbe6a408f22c9ddabdae623eb7aa0de15485827f30a725a645e6e0f"
strip_components = 1
description = "Plasma development applications"
homepage = "https://invent.kde.org/plasma/plasma-sdk"
license = "GPL-2.0-or-later, LGPL-2.1-or-later"
deps = ["kf6-karchive", "kf6-kcompletion", "kf6-kconfig", "kf6-kcoreaddons", "kf6-kcrash", "kf6-kdbusaddons", "kf6-kdoctools", "kf6-ki18n", "kf6-kiconthemes", "kf6-kio", "kf6-kitemmodels", "kf6-knewstuff", "kf6-ksvg", "kf6-ktexteditor", "kf6-kwidgetsaddons", "libplasma", "plasma5support", "qt6-base", "qt6-declarative"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
deps = ["extra-cmake-modules", "gettext", "kf6-kpackage"]

[package]
name = "openmpi"
version = "5.0.11"
archive = "https://download.open-mpi.org/release/open-mpi/v5.0/openmpi-5.0.11.tar.bz2"
sha256 = "e668a3c4acd50c41dc204c8a6dd98a611e0f26af89cf677577fa9be8a2698003"

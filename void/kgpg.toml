# Imported from Void Linux's template for 'kgpg'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
[package]
name = "kgpg"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/kgpg-26.08.1.tar.xz"
sha256 = "76b71fa853e24d6ab521caaf0e180faca06aa5a0e4103c78a59bc932f4c55381"
strip_components = 1
description = "Simple interface for GnuPG, a powerful encryption utility"
homepage = "https://kde.org/applications/en/utilities/org.kde.kgpg"
license = "GPL-2.0-only"
deps = ["akonadi-contacts", "gnupg", "kf6-kcontacts", "kf6-kcrash", "kf6-kdbusaddons", "kf6-kdoctools", "kf6-kiconthemes", "kf6-kio", "kf6-kjobwidgets", "kf6-knotifications", "kf6-kservice", "kf6-kstatusnotifieritem", "kf6-ktextwidgets", "kf6-kwidgetsaddons", "kf6-kwindowsystem", "kf6-kxmlgui"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "gettext", "kf6-kconfig", "kf6-kcoreaddons", "qt6-base"]

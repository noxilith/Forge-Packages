# Imported from Void Linux's template for 'libvisual-plugins'. Review before relying on it.
# needs, but Forge has no recipe for yet: jack, portaudio
[package]
name = "libvisual-plugins"
version = "0.4.2"
archive = "https://github.com/Libvisual/libvisual/releases/download/libvisual-plugins-0.4.2/libvisual-plugins-0.4.2.tar.bz2"
sha256 = "a1dd04eb3d311d68b4f43a5c707df7aba7a98a9cab820c58395a7f5d7d6d0157"
strip_components = 1
description = "Collection of visualization plugins for use with libvisual"
homepage = "http://libvisual.org"
license = "GPL-2.0-only"
deps = ["alsa-lib", "glu", "gstreamer1", "gtk+3", "libvisual", "pulseaudio"]

[build]
system = "autotools"
tools = ["bison", "pkg-config"]
deps = ["gettext"]

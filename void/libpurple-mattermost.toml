# Imported from Void Linux's template for 'libpurple-mattermost'. Review before relying on it.
# needs, but Forge has no recipe for yet: discount
[package]
name = "libpurple-mattermost"
version = "1.2"
archive = "https://github.com/EionRobb/purple-mattermost/archive/v1.2.tar.gz"
sha256 = "2484c68fcc3c57a176991c143346dc8cc6a0aaf37d5ecd0ff2c0ec201ca094ae"
strip_components = 1
description = "Connects libpurple-based clients with Mattermost server"
homepage = "https://github.com/EionRobb/purple-mattermost/"
license = "GPL-3.0-or-later"
deps = ["glib", "json-glib", "pidgin"]

[build]
system = "make"
tools = ["pkg-config"]

# Imported from Void Linux's template for 'xarcan'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: arcan, mesa
[package]
name = "xarcan"
version = "0.7.1"
archive = "https://codeberg.org/letoram/xarcan/archive/0.7.1.tar.gz"
sha256 = "ff02c6f6ca1c53a1783a027bed6bbdf539b8aa745716c2c8008dfd0b3c1f4c6c"
strip_components = 1
description = "Patched Xserver that bridges connections to Arcan"
homepage = "https://codeberg.org/letoram/xarcan"
license = "MIT, BSD-3-Clause"
deps = ["libX11", "libXfont2", "libdrm", "libepoxy", "libtirpc", "libxkbfile", "libxshmfence", "openssl", "pixman", "xcb-util-image", "xcb-util-wm", "xorgproto"]

[build]
system = "meson"
configure_args = ["-Dglamor=true", "-Dint10=false", "-Dipv6=true", "-Dsystemd_logind=false"]
tools = ["pkg-config"]
deps = ["font-util", "xorg-util-macros", "xtrans"]

# Imported from Void Linux's template for 'git-absorb'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: asciidoc
[package]
name = "git-absorb"
version = "0.9.0"

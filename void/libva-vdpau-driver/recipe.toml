# Imported from Void Linux's template for 'libva-vdpau-driver'. Review before relying on it.
# needs, but Forge has no recipe for yet: mesa
[package]
name = "libva-vdpau-driver"
version = "0.7.4"
archive = "https://www.freedesktop.org/software/vaapi/releases/libva-vdpau-driver/libva-vdpau-driver-0.7.4.tar.bz2"
sha256 = "155c1982f0ac3f5435ba20b221bcaa11be212c37db548cd1f2a030ffa17e9bb9"
strip_components = 1
description = "VDPAU-based backend for VA-API"
homepage = "http://freedesktop.org/wiki/Software/vaapi"
license = "GPL-2.0-only"
deps = ["libva", "libvdpau"]
patches = ["patches/CreateSurfaceFromV4L2Buf.patch", "patches/fix-aarch64-musl.patch", "patches/libva-vdpau-driver-0.7.4-VAEncH264VUIBufferType.patch", "patches/libva-vdpau-driver-0.7.4-glext-missing-definition.patch", "patches/libva-vdpau-driver-0.7.4-libvdpau-0.8.patch"]

[build]
system = "autotools"
tools = ["pkg-config"]

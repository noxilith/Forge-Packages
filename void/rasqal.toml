# Imported from Void Linux's template for 'rasqal'. Review before relying on it.
# needs, but Forge has no recipe for yet: mpfr
[package]
name = "rasqal"
version = "0.9.33"
archive = "https://librdf.org/dist/source/rasqal-0.9.33.tar.gz"
sha256 = "6924c9ac6570bd241a9669f83b467c728a322470bf34f4b2da4f69492ccfd97c"
strip_components = 1
description = "RDF Query Library"
homepage = "https://librdf.org/rasqal"
license = "LGPL-2.1-or-later, GPL-2.0-or-later, Apache-2.0"
deps = ["raptor"]

[build]
system = "autotools"
configure_args = ["--disable-static", "--enable-release"]
tools = ["pkg-config"]

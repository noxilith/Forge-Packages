# Imported from Void Linux's template for 'adwaita-qt'. Review before relying on it.
# hooks not translated: post_build, post_configure, post_install
# needs, but Forge has no recipe for yet: qt5
[package]
name = "adwaita-qt"
version = "1.4.2"

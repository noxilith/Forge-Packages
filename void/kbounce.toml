# Imported from Void Linux's template for 'kbounce'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-svg, qt6-tools
[package]
name = "kbounce"
version = "26.08.2"
archive = "https://download.kde.org/stable/release-service/26.08.2/src/kbounce-26.08.2.tar.xz"
sha256 = "09a7a6aaa5624475da706a4de0d5162f9a05df14b971730e03f4e6fce89424df"
strip_components = 1
description = "Build walls to confine a number of bouncing balls"
homepage = "https://apps.kde.org/kbounce/"
license = "GPL-2.0-or-later"
deps = ["kf6-kcompletion", "kf6-kconfig", "kf6-kcoreaddons", "kf6-kcrash", "kf6-kdbusaddons", "kf6-kdoctools", "kf6-ki18n", "kf6-kio", "kf6-kwidgetsaddons", "kf6-kxmlgui", "libkdegames"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "gettext", "qt6-base"]

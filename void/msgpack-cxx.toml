# Imported from Void Linux's template for 'msgpack-cxx'. Review before relying on it.
# needs, but Forge has no recipe for yet: boost
[package]
name = "msgpack-cxx"
version = "6.1.1"
archive = "https://github.com/msgpack/msgpack-c/releases/download/cpp-6.1.1/msgpack-cxx-6.1.1.tar.gz"
sha256 = "5fd555742e37bbd58d166199e669f01f743c7b3c6177191dd7b31fb0c37fa191"
strip_components = 1
description = "Binary-based efficient object serialization library for C++"
homepage = "https://github.com/msgpack/msgpack-c/tree/cpp_master"
license = "BSL-1.0"

[build]
system = "cmake"
configure_args = ["-DMSGPACK_CXX17=ON"]

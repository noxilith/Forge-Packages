# Imported from Void Linux's template for 'qemu-user'. Review before relying on it.
# 3 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_extract, post_install
# needs, but Forge has no recipe for yet: python3-pycotap, python3-qemu.qmp, python3-wheel, util-linux-common
[package]
name = "qemu-user"
version = "11.1.3"
archive = "https://wiki.qemu.org/download/qemu-11.1.3.tar.bz2"
sha256 = "65567c4ee93ce833c9c7b2fb796c7a12d91ed0af83a2ce6fd9f30aa1b4ee0e72"
strip_components = 1
description = "QEMU user-mode emulators"
homepage = "https://www.qemu.org"
license = "GPL-2.0-only, LGPL-2.1-only"
deps = ["dtc", "glib", "pixman"]
patches = ["patches/musl-initialize-msghdr.patch", "patches/tcg-overflow.patch"]

[build]
system = "autotools"
configure_args = ["--enable-linux-user", "--disable-system", "--static", "--disable-download", "-Dkvm=disabled", "-Dpng=disabled", "-Dvirtfs=disabled", "-Dfdt=disabled", "-Dseccomp=disabled", "-Dtools=disabled"]
tools = ["flex", "perl", "pkg-config"]

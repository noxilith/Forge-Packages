# Imported from Void Linux's template for 'firewalld'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: conf_files
# needs, but Forge has no recipe for yet: docbook-xsl, intltool, nftables
[package]
name = "firewalld"
version = "2.3.0"
archive = "https://github.com/firewalld/firewalld/releases/download/v2.3.0/firewalld-2.3.0.tar.bz2"
sha256 = "f6ba846c92fc08aebda8dfd2856e6c6224d170a5288a2ae1c181d6a43036c009"
strip_components = 1
description = "Dynamically managed firewall with support for network zones"
homepage = "https://firewalld.org/"
license = "GPL-2.0-or-later"
deps = ["ipset", "iptables", "libcap-ng", "polkit", "python3-dbus", "python3-gobject"]

[build]
system = "autotools"
tools = ["pkg-config"]
deps = ["glib", "libxslt", "xmlcatmgr"]

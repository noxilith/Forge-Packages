# Imported from Void Linux's template for 'cereal'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: boost
[package]
name = "cereal"
version = "1.3.2"
archive = "https://github.com/USCiLab/cereal/archive/v1.3.2.tar.gz"
sha256 = "16a7ad9b31ba5880dac55d62b5d6f243c3ebc8d46a3514149e56b5e7ea81f85f"
strip_components = 1
description = "Header-only C++ serialization library"
homepage = "https://uscilab.github.io/cereal"
license = "BSD-3-Clause"

[build]
system = "cmake"
configure_args = ["-DSKIP_PORTABILITY_TEST=1", "-DTHREAD_SAFE=ON", "-DWITH_WERROR=OFF"]

# Imported from Void Linux's template for 'sonnet'. Review before relying on it.
# needs, but Forge has no recipe for yet: qt5
[package]
name = "sonnet"
version = "5.116.0"
archive = "https://download.kde.org/stable/frameworks/5.116/sonnet-5.116.0.tar.xz"
sha256 = "98417080e742829794584a794995c4a08900d22e11b879cb8cc240323b1f4a4a"
strip_components = 1
description = "KDE Multi-language spell checker"
homepage = "https://invent.kde.org/frameworks/sonnet"
license = "LGPL-2.1-or-later"
deps = ["aspell", "hunspell"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=ON"]
deps = ["extra-cmake-modules", "kcoreaddons"]

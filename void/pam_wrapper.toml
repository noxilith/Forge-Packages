# Imported from Void Linux's template for 'pam_wrapper'. Review before relying on it.
# settings not translated: lib32disabled
# needs, but Forge has no recipe for yet: python3-setuptools
[package]
name = "pam_wrapper"
version = "1.1.8"
archive = "https://ftp.samba.org/pub/cwrap/pam_wrapper-1.1.8.tar.gz"
sha256 = "6549c0b3e41d1ebe0c94a1be63c25eec918191462b602ab6f47d4a5fa709c3e4"
strip_components = 1
description = "Tool to test PAM applications and modules"
homepage = "https://cwrap.org/pam_wrapper.html"
license = "GPL-3.0-or-later"
deps = ["cmocka", "pam"]

[build]
system = "cmake"
configure_args = ["-DUNIT_TESTING=ON"]

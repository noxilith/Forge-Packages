# Imported from Void Linux's template for 'kf6-kcontacts'. Review before relying on it.
# needs, but Forge has no recipe for yet: kf6-base, qt6-tools
[package]
name = "kf6-kcontacts"
version = "6.30.0"
archive = "https://download.kde.org/stable/frameworks/6.30/kcontacts-6.30.0.tar.xz"
sha256 = "170b51a41ac132968ea03d5f1ce8c585777155bbdc57e819a0562b1f8d03b7a5"
strip_components = 1
description = "Library for working with contact information"
homepage = "https://invent.kde.org/frameworks/kcontacts"
license = "LGPL-2.1-or-later"
deps = ["kf6-kcodecs", "kf6-kconfig", "kf6-kcoreaddons", "kf6-ki18n", "qt6-base"]

[build]
system = "cmake"
configure_args = ["-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "gettext", "qt6-declarative"]

# Imported from Void Linux's template for 'kqtquickcharts'. Review before relying on it.
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "kqtquickcharts"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/kqtquickcharts-26.08.1.tar.xz"
sha256 = "c768f41e62d71d7ffe8400cfd48986be3a6ebdf6aec64364655abd122210a39a"
strip_components = 1
description = "QtQuick plugin to render beautiful and interactive charts"
homepage = "https://edu.kde.org/"
license = "LGPL-2.1-or-later"
deps = ["qt6-declarative"]

[build]
system = "cmake"
configure_args = ["-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "qt6-base"]

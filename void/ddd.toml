# Imported from Void Linux's template for 'ddd'. Review before relying on it.
# hooks not translated: post_patch
# needs, but Forge has no recipe for yet: ncurses
[package]
name = "ddd"
version = "3.4.1"
archive = "https://ftp.gnu.org/gnu/ddd/ddd-3.4.1.tar.gz"
sha256 = "b87517a6c3f9611566347e283a2cf931fa369919b553536a2235e63402f4ee89"

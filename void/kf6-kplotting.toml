# Imported from Void Linux's template for 'kf6-kplotting'. Review before relying on it.
# needs, but Forge has no recipe for yet: kf6-base, qt6-tools
[package]
name = "kf6-kplotting"
version = "6.30.0"
archive = "https://download.kde.org/stable/frameworks/6.30/kplotting-6.30.0.tar.xz"
sha256 = "f5a67be85c21665e052371301889443196b9de5b3927aff353a3d3e27730dd11"
strip_components = 1
description = "QWidget-derived class for easy data-plotting"
homepage = "https://invent.kde.org/frameworks/kplotting"
license = "LGPL-2.1-or-later"
deps = ["qt6-base"]

[build]
system = "cmake"
deps = ["extra-cmake-modules"]

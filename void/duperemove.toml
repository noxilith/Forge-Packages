# Imported from Void Linux's template for 'duperemove'. Review before relying on it.
# needs, but Forge has no recipe for yet: sqlite
[package]
name = "duperemove"
version = "0.15.2"
archive = "https://github.com/markfasheh/duperemove/archive/v0.15.2.tar.gz"
sha256 = "27809aa91b7b9b7d0810e5329614bf80af2c48e917781e682a3fbcf61fa274da"
strip_components = 1
description = "Tools for deduping file systems"
homepage = "https://github.com/markfasheh/duperemove"
license = "GPL-2.0-only"
deps = ["glib", "libbsd", "libgcrypt", "xxHash"]

[build]
system = "make"
tools = ["pkg-config"]

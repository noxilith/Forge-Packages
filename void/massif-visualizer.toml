# Imported from Void Linux's template for 'massif-visualizer'. Review before relying on it.
# needs, but Forge has no recipe for yet: qt6-qt5compat, qt6-svg
[package]
name = "massif-visualizer"
version = "26.08.2"
archive = "https://download.kde.org/stable/release-service/26.08.2/src/massif-visualizer-26.08.2.tar.xz"
sha256 = "c05c0fab639d72443e6f89f9ddd52b55c32ba0e830910d162d1c95c0b6f20b86"
strip_components = 1
description = "Visualizer for Valgrind Massif data files"
homepage = "https://apps.kde.org/massif_visualizer/"
license = "GPL-2.0-or-later"
deps = ["ecm", "graphviz", "kdiagram6", "kf6-karchive", "kf6-kconfig", "kf6-kcoreaddons", "kf6-ki18n", "kf6-kio", "kf6-kparts", "kgraphviewer", "kparts", "qt6-base"]

[build]
system = "cmake"
deps = ["extra-cmake-modules", "gettext"]

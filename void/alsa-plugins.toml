# Imported from Void Linux's template for 'alsa-plugins'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: ffmpeg6, jack
[package]
name = "alsa-plugins"
version = "1.2.12"
archive = "https://www.alsa-project.org/files/pub/plugins/alsa-plugins-1.2.12.tar.bz2"
sha256 = "7bd8a83d304e8e2d86a25895d8dcb0ef0245a8df32e271959cdbdc6af39b66f2"
strip_components = 1
description = "Advanced Linux Sound Architecture (ALSA) extra plugins"
homepage = "https://www.alsa-project.org/wiki/Main_Page"
license = "GPL-2.0-or-later, LGPL-2.1-or-later"
deps = ["libsamplerate", "pulseaudio"]

[build]
system = "autotools"
configure_args = ["--disable-maemo-plugin"]
tools = ["pkg-config"]

# Imported from Void Linux's template for 'uhd'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: boost, doxygen, grpc, ncurses, python3-Mako, python3-numpy, python3-packaging-bootstrap, python3-requests, python3-ruamel.yaml, python3-setuptools
[package]
name = "uhd"
version = "4.11.0.0"
archive = "https://github.com/EttusResearch/uhd/archive/v4.11.0.0.tar.gz"
sha256 = "1e53faec13ea2be9dd8f765956157d1434f41fa0a124fac8f7b2340f8445b026"
strip_components = 1
description = "Ettus USRP Hardware driver library"
homepage = "https://files.ettus.com/manual/"
license = "GPL-3.0-or-later"
deps = ["libusb", "protobuf"]
patches = ["patches/stdint.patch", "patches/uncompress-manpage.patch"]

[build]
system = "cmake"
configure_args = ["-DCMAKE_BUILD_TYPE=None", "-DENABLE_MAN_PAGE_COMPRESSION=OFF"]
subdir = "host"
tools = ["pkg-config"]
deps = ["graphviz"]

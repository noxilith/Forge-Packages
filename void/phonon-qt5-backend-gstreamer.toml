# Imported from Void Linux's template for 'phonon-qt5-backend-gstreamer'. Review before relying on it.
# settings not translated: lib32disabled
# needs, but Forge has no recipe for yet: hicolor-icon-theme, mesa, qt5
[package]
name = "phonon-qt5-backend-gstreamer"
version = "4.10.0"
archive = "https://download.kde.org/stable/phonon/phonon-backend-gstreamer/4.10.0/phonon-backend-gstreamer-4.10.0.tar.xz"
sha256 = "c5871835521d015ef2ad1276b1f58340d946c2903466337f3170bac3c58d61f2"
strip_components = 1
description = "Phonon GStreamer backend"
homepage = "http://phonon.kde.org/"
license = "LGPL-2.1-or-later"
deps = ["desktop-file-utils", "gst-libav", "gst-plugins-base1", "gst-plugins-good1", "libxml2", "phonon"]

[build]
system = "cmake"
configure_args = ["-DPHONON_BUILD_PHONON4QT5=ON"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules"]

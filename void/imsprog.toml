# Imported from Void Linux's template for 'imsprog'. Review before relying on it.
# needs, but Forge has no recipe for yet: libftdi1, qt5
[package]
name = "imsprog"
version = "1.9.1"
archive = "https://github.com/bigbigmdm/IMSProg/archive/v1.9.1.tar.gz"
sha256 = "8be3cc8775929944ddd3c4dc0b3111c3269dc894cc086c151ff2117e0450c984"
strip_components = 1
description = "I2C, SPI and MicroWire EEPROM/flash chip programmer for CH341a devices"
homepage = "https://antenna-dvb-t2.ru/IMSProg.php"
license = "GPL-3.0-or-later"
deps = ["libusb", "wget"]

[build]
system = "cmake"
tools = ["pkg-config"]

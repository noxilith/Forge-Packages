# Imported from Void Linux's template for 'opensp'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, pre_configure
# needs, but Forge has no recipe for yet: docbook-xsl
[package]
name = "opensp"
version = "1.5.2"
archive = "https://downloads.sourceforge.net/sourceforge/openjade/OpenSP-1.5.2.tar.gz"
sha256 = "57f4898498a368918b0d49c826aa434bb5b703d2c3b169beb348016ab25617ce"
strip_components = 1
description = "SGML parser, successor to sp"
homepage = "http://openjade.sourceforge.net/"
license = "X11"
deps = ["xmlcatmgr"]

[build]
system = "autotools"
configure_args = ["--enable-http"]
deps = ["gettext", "xmlto"]

# Imported from Void Linux's template for 'mimetreeparser'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-qt5compat, qt6-tools
[package]
name = "mimetreeparser"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/mimetreeparser-26.08.1.tar.xz"
sha256 = "b81506a5876039c0aa9969f7bd71040880b171b53014a76a8bbaed02287cc5f9"
strip_components = 1
description = "Parser for MIME trees"
homepage = "https://invent.kde.org/pim/mimetreeparser"
license = "GPL-3.0-or-later"
deps = ["gpgmepp", "kf6-kcalendarcore", "kf6-kcodecs", "kf6-kcolorscheme", "kf6-ki18n", "kf6-kio", "kf6-kmime", "kf6-kwidgetsaddons", "kmbox", "libkleo", "qt6-base", "qt6-declarative"]
patches = ["patches/skip-opentest-headless.patch"]

[build]
system = "cmake"
configure_args = ["-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "gettext", "kf6-kconfig"]

# Imported from Void Linux's template for 'gtkspell'. Review before relying on it.
# hooks not translated: post_patch
# needs, but Forge has no recipe for yet: intltool
[package]
name = "gtkspell"
version = "2.0.16"
archive = "https://downloads.sourceforge.net/sourceforge/gtkspell/gtkspell-2.0.16.tar.gz"
sha256 = "8fc7dc560167b2cb7193e76aca625a152dc19b0ebf49816b78539cbb90d80d02"
strip_components = 1
description = "Provides word-processor-style highlighting"
homepage = "http://gtkspell.sourceforge.net/"
license = "LGPL-2.1-or-later"
deps = ["enchant2", "gtk+"]
patches = ["patches/enchant-2.patch"]

[build]
system = "autotools"
configure_args = ["--disable-static"]
tools = ["pkg-config"]

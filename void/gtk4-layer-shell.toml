# Imported from Void Linux's template for 'gtk4-layer-shell'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: python3-setuptools
[package]
name = "gtk4-layer-shell"
version = "1.3.0"
archive = "https://github.com/wmww/gtk4-layer-shell/archive/v1.3.0.tar.gz"
sha256 = "1ebb01ab14e98afd1727f68f64981c37bd23305b1f131f5667c02b94cf593192"
strip_components = 1
description = "Library to create panels and other desktop components for Wayland (GTK4)"
homepage = "https://github.com/wmww/gtk4-layer-shell"
license = "MIT"
deps = ["gtk4", "vala", "wayland", "wayland-protocols"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["gobject-introspection"]

# Imported from Void Linux's template for 'xlunch'. Review before relying on it.
# settings not translated: make_build_target
# needs, but Forge has no recipe for yet: hicolor-icon-theme
[package]
name = "xlunch"
version = "4.7.5"
archive = "https://github.com/Tomas-M/xlunch/archive/v4.7.5.tar.gz"
sha256 = "594b2f79e0c789b5206b45c41ffd5c16e3b5a96754725286956e39b10261b725"
strip_components = 1
description = "Graphical app launcher for X with little dependencies"
homepage = "http://xlunch.org/"
license = "GPL-3.0-or-later"
deps = ["desktop-file-utils", "findutils", "imlib2"]
patches = ["patches/build.patch"]

[build]
system = "make"

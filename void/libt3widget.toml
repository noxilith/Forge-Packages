# Imported from Void Linux's template for 'libt3widget'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: pre_configure
# needs, but Forge has no recipe for yet: ncurses
[package]
name = "libt3widget"
version = "1.2.2"
archive = "https://os.ghalkes.nl/dist/libt3widget-1.2.2.tar.bz2"
sha256 = "9eb7e1d0ccdfc917f18ba1785a2edb4faa6b0af8b460653d962abf91136ddf1c"
strip_components = 1
description = "Tilde Terminal Toolkit's widget libary"
homepage = "https://os.ghalkes.nl/t3/libt3widget.html"
license = "GPL-3.0-or-later"
deps = ["gettext", "gpm", "libt3config", "libt3key", "libt3window", "libtranscript", "libunistring", "libxcb", "pcre2"]

[build]
system = "autotools"
configure_args = ["LIBTOOL=./hack/libtool"]
tools = ["pkg-config"]

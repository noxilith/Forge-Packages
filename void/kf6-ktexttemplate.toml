# Imported from Void Linux's template for 'kf6-ktexttemplate'. Review before relying on it.
# needs, but Forge has no recipe for yet: kf6-base, qt6-tools
[package]
name = "kf6-ktexttemplate"
version = "6.30.0"
archive = "https://download.kde.org/stable/frameworks/6.30/ktexttemplate-6.30.0.tar.xz"
sha256 = "c3c229944d25294102e4e8a5b49fa0c0f481da9d33f8bec3782e8a53afd47493"
strip_components = 1
description = "Library to separate the structure of documents from the data"
homepage = "https://invent.kde.org/frameworks/ktexttemplate"
license = "LGPL-2.1-or-later"
deps = ["qt6-declarative"]

[build]
system = "cmake"
configure_args = ["-DKDE_INSTALL_QMLDIR=lib/qt6/qml", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
deps = ["extra-cmake-modules", "qt6-base"]

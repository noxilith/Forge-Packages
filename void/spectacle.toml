# Imported from Void Linux's template for 'spectacle'. Review before relying on it.
# needs, but Forge has no recipe for yet: kde-plasma-base, opencv, qt6-multimedia, qt6-tools, tesseract-ocr
[package]
name = "spectacle"
version = "6.7.5"
archive = "https://download.kde.org/stable/plasma/6.7.5/spectacle-6.7.5.tar.xz"
sha256 = "2a63a8da331f9249e0ff0091a38f2fa946c7b85c7b7133bd8b60dd524e8e01b8"
strip_components = 1
description = "KDE screenshot capture utility"
homepage = "https://apps.kde.org/spectacle/"
license = "LGPL-2.0-or-later, GPL-2.0-or-later"
deps = ["kf6-kconfig", "kf6-kcoreaddons", "kf6-kcrash", "kf6-kdbusaddons", "kf6-kglobalaccel", "kf6-kguiaddons", "kf6-ki18n", "kf6-kio", "kf6-kirigami", "kf6-knotifications", "kf6-kstatusnotifieritem", "kf6-kwidgetsaddons", "kf6-kwindowsystem", "kf6-kxmlgui", "kf6-prison", "kf6-purpose", "kpipewire", "kquickimageeditor", "layer-shell-qt", "libxcb", "qt6-base", "qt6-declarative", "wayland", "xcb-util", "xcb-util-cursor", "xcb-util-image"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "gettext", "kf6-kdoctools", "plasma-wayland-protocols"]

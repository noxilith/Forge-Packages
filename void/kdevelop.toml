# Imported from Void Linux's template for 'kdevelop'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: boost, qt6-location, qt6-qt5compat, qt6-tools, qt6-webchannel, subversion
[package]
name = "kdevelop"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/kdevelop-26.08.1.tar.xz"
sha256 = "dd77921d7e403bfbb60bfa8a7998a2e2c1eb53ab7b4b1a2f8a52360493c586ab"
strip_components = 1
description = "Integrated Development Environment for C/C++"
homepage = "https://www.kdevelop.org/"
license = "GPL-2.0-or-later, LGPL-2.1-or-later"
deps = ["apr-util", "astyle", "kf6-karchive", "kf6-kcmutils", "kf6-kconfig", "kf6-kcrash", "kf6-kguiaddons", "kf6-ki18n", "kf6-kiconthemes", "kf6-kio", "kf6-kitemmodels", "kf6-kitemviews", "kf6-kjobwidgets", "kf6-knewstuff", "kf6-knotifications", "kf6-knotifyconfig", "kf6-kpackage", "kf6-kparts", "kf6-krunner", "kf6-kservice", "kf6-ktexteditor", "kf6-ktexttemplate", "kf6-ktextwidgets", "kf6-kwidgetsaddons", "kf6-kwindowsystem", "kf6-kxmlgui", "kf6-purpose", "kf6-sonnet", "kf6-threadweaver", "khelpcenter", "libedit", "libkomparediff2", "libksysguard", "libplasma", "llvm21", "qt6-base", "qt6-declarative", "qt6-pdf"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DCMAKE_C_STANDARD=11"]
tools = ["pkg-config"]
deps = ["clazy", "extra-cmake-modules", "gettext", "kdevelop-pg-qt", "kf6-kdoctools", "shared-mime-info", "tar"]

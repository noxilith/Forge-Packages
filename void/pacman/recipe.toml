# Imported from Void Linux's template for 'pacman'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# settings not translated: make_dirs, conf_files
# needs, but Forge has no recipe for yet: asciidoc
[package]
name = "pacman"
version = "7.1.0"
archive = "https://gitlab.archlinux.org/pacman/pacman/-/releases/v7.1.0/downloads/pacman-7.1.0.tar.xz"
sha256 = "530e50d7edbb2a22581c6d6707d2113240276c1bec4ee39a99488e1243c32171"
strip_components = 1
description = "Simple library-based package manager"
homepage = "https://www.archlinux.org/pacman/"
license = "GPL-2.0-or-later"
deps = ["curl", "gnupg", "gpgme", "libarchive"]
patches = ["patches/0001-libalpm-invalidate-curl-data-in-child.patch"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["gettext"]

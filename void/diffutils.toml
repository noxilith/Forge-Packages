# settings not translated: CFLAGS
[package]
name = "diffutils"
version = "3.12"
archive = "https://ftp.gnu.org/gnu/diffutils/diffutils-3.12.tar.xz"
sha256 = "7c8b7f9fc8609141fdea9cece85249d308624391ff61dedaf528fcb337727dfd"

# Imported from Void Linux's template for 'cppcheck'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: docbook-xsl, qt6-tools
[package]
name = "cppcheck"
version = "2.22.0"
archive = "https://github.com/danmar/cppcheck/archive/refs/tags/2.22.0.tar.gz"
sha256 = "d74945deb2d50393430e07596b766f8a779512c7f60dac2a30ea64e059ece57b"
strip_components = 1
description = "Static analysis of C/C++ code"
homepage = "http://cppcheck.sourceforge.net"
license = "GPL-3.0-or-later"
deps = ["pcre", "qt6-base", "tinyxml2"]
patches = ["patches/fix-cross-build.patch", "patches/musl-no-feenableexcept.patch", "patches/translations-location.patch"]

[build]
system = "cmake"
configure_args = ["-DBUILD_GUI=ON", "-DDISABLE_DMAKE=ON", "-DHAVE_RULES=ON", "-DUSE_BUNDLED_TINYXML2=OFF", "-DUSE_MATCHCOMPILER=ON", "-DUSE_QT6=ON"]
deps = ["libxslt"]

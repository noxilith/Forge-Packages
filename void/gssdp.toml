# Imported from Void Linux's template for 'gssdp'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# settings not translated: build_helper
[package]
name = "gssdp"
version = "1.6.3"
archive = "https://download.gnome.org/sources/gssdp/1.6/gssdp-1.6.3.tar.xz"
sha256 = "2fedb5afdb22cf14d5498a39a773ca89788a250fcf70118783df821e1f3f3446"
strip_components = 1
description = "GObject-based library for SSDP"
homepage = "https://wiki.gnome.org/action/show/Projects/GUPnP"

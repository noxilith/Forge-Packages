# Imported from Void Linux's template for 'lurch'. Review before relying on it.
# settings not translated: LDFLAGS
# needs, but Forge has no recipe for yet: sqlite
[package]
name = "lurch"
version = "0.7.0"
archive = "https://github.com/gkdr/lurch/releases/download/v0.7.0/lurch-0.7.0-src.tar.gz"
sha256 = "1ff595407f72deaa3b83e07d9695c64a4310e1bf38f86811e8b524a7bc7c5a8d"
strip_components = 1
description = "Pidgin/libpurple plugin for XEP-0384: OMEMO Encryption"
homepage = "https://github.com/gkdr/lurch"
license = "GPL-3.0-only"
deps = ["glib", "libgcrypt", "libxml2", "mxml", "pidgin"]
patches = ["patches/cmake-4.patch"]

[build]
system = "make"
tools = ["pkg-config"]

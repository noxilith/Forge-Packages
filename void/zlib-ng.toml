# Imported from Void Linux's template for 'zlib-ng'. Review before relying on it.
[package]
name = "zlib-ng"
version = "2.2.4"
archive = "https://github.com/zlib-ng/zlib-ng/archive/refs/tags/2.2.4/zlib-ng-2.2.4.tar.gz"
sha256 = "a73343c3093e5cdc50d9377997c3815b878fd110bf6511c2c7759f2afb90f5a3"
strip_components = 1
description = "Zlib replacement with optimizations for next generation systems"
homepage = "https://github.com/zlib-ng/zlib-ng"
license = "Zlib"
deps = ["gtest"]

[build]
system = "cmake"
configure_args = ["-DZLIB_COMPAT=OFF"]
tools = ["pkg-config"]

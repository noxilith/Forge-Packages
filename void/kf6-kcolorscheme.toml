# Imported from Void Linux's template for 'kf6-kcolorscheme'. Review before relying on it.
# needs, but Forge has no recipe for yet: kf6-base, python3-pyside6, qt6-tools
[package]
name = "kf6-kcolorscheme"
version = "6.30.0"
archive = "https://download.kde.org/stable/frameworks/6.30/kcolorscheme-6.30.0.tar.xz"
sha256 = "a4128e82e47cd474c777754c4dd8af28a00a57ecf388da1a62f8173d898890d0"
strip_components = 1
description = "Classes to read and interact with KColorScheme"
homepage = "https://invent.kde.org/frameworks/kcolorscheme"
license = "LGPL-2.1-or-later"
deps = ["kf6-kconfig", "kf6-kguiaddons", "kf6-ki18n", "qt6-base"]

[build]
system = "cmake"
deps = ["extra-cmake-modules", "gettext"]

# Imported from Void Linux's template for 'budgie-screensaver'. Review before relying on it.
# needs, but Forge has no recipe for yet: dbus-glib
[package]
name = "budgie-screensaver"
version = "5.1.0"
archive = "https://github.com/BuddiesOfBudgie/budgie-screensaver/releases/download/v5.1.0/budgie-screensaver-v5.1.0.tar.xz"
sha256 = "563ac3f845729e9e6d184d2dbf036ab3f51ff244c27f5b286cfcb89acc147f0c"
strip_components = 1
description = "Fork of GNOME Screensaver for Budgie 10"
homepage = "https://github.com/BuddiesOfBudgie/budgie-screensaver"
license = "GPL-2.0-only"
deps = ["elogind", "gnome-desktop", "libXxf86vm", "libgnomekbd", "pam"]
patches = ["patches/fix-musl.patch", "patches/no-intltool.patch"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["gettext", "glib"]

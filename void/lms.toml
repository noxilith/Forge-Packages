# Imported from Void Linux's template for 'lms'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: make_dirs, conf_files
# needs, but Forge has no recipe for yet: boost, ffmpeg6
[package]
name = "lms"
version = "3.76.0"
archive = "https://github.com/epoupon/lms/archive/refs/tags/v3.76.0.tar.gz"
sha256 = "3c8cd0cc29bb406deab6f7937df6c78d4d9398ccf56f108eaeb589532c397ed7"
strip_components = 1
description = "Lightweight Music Server"
homepage = "https://github.com/epoupon/lms"
license = "GPL-3.0-or-later"
deps = ["GraphicsMagick", "gtest", "libarchive", "libconfig", "pam", "pugixml", "taglib", "wt", "xxHash"]

[build]
system = "cmake"
configure_args = ["-DLMS_IMAGE_BACKEND=graphicsmagick"]
tools = ["pkg-config"]

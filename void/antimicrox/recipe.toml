# Imported from Void Linux's template for 'antimicrox'. Review before relying on it.
# needs, but Forge has no recipe for yet: itstool, qt5
[package]
name = "antimicrox"
version = "3.3.4"
archive = "https://github.com/AntiMicroX/antimicrox/archive/3.3.4.tar.gz"
sha256 = "c5e8d7c827f64b0a162133f9cac2ddc8dc0c9243541fae1a8ced5424b4fb7b3c"
strip_components = 1
description = "Map keyboard buttons and mouse controls to a gamepad"
homepage = "https://github.com/AntiMicroX/antimicrox"
license = "GPL-3.0-or-later"
deps = ["SDL2", "libX11", "libXi", "libXtst"]
patches = ["patches/time64.patch"]

[build]
system = "cmake"
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "gettext"]

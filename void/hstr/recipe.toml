# Imported from Void Linux's template for 'hstr'. Review before relying on it.
# hooks not translated: pre_configure
# needs, but Forge has no recipe for yet: libreadline8
[package]
name = "hstr"
version = "3.2"
archive = "https://github.com/dvorka/hstr/archive/refs/tags/v3.2.tar.gz"
sha256 = "bceab1cb3c3b636d9ff4dfbaf8b035530e76a36d948767ed1735c4e79d7473eb"
strip_components = 1
description = "Easily view, navigate, search and manage your command history"
homepage = "https://github.com/dvorka/hstr"
license = "Apache-2.0"
patches = ["patches/cross.patch"]

[build]
system = "autotools"
tools = ["pkg-config"]

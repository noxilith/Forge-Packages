# Imported from Void Linux's template for 'sudo'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_configure, post_install
# settings not translated: conf_files, lib32disabled
[package]
name = "sudo"
version = "1.9.17p2"
archive = "https://www.sudo.ws/dist/sudo-1.9.17p2.tar.gz"
sha256 = "4a38a1ab3adb1199257edc2a7c4a2bd714665eb605b04368843b06dada2cfcfb"
strip_components = 1
description = "Allow others to run commands as root"
homepage = "https://www.sudo.ws/"
license = "ISC"
deps = ["openssl", "pam", "zlib"]
patches = ["patches/install_perms.patch"]

[build]
system = "autotools"
configure_args = ["--with-ignore-dot", "--with-insults=disabled", "--with-all-insults", "--with-env-editor", "--enable-shell-sets-home", "--enable-noargs-shell", "--without-sendmail", "--with-logfac=auth", "--disable-root-mailer", "--enable-pie", "--with-mdoc", "--disable-log-server"]
deps = ["groff"]

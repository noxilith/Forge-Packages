# Imported from Void Linux's template for 'ktexteditor'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt5
[package]
name = "ktexteditor"
version = "5.116.0"
archive = "https://download.kde.org/stable/frameworks/5.116/ktexteditor-5.116.0.tar.xz"
sha256 = "0542382c7d1261eb02e2e15e4014c6332d39c75f17e72e59ec02b473b92df066"
strip_components = 1
description = "KDE Full text editor component"
homepage = "https://invent.kde.org/frameworks/ktexteditor"
license = "LGPL-2.0-or-later"
deps = ["editorconfig", "kparts", "libgit2", "syntax-highlighting"]

[build]
system = "cmake"
tools = ["pkg-config"]
deps = ["extra-cmake-modules", "gettext", "kauth", "kcoreaddons"]

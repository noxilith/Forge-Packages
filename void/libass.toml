# Imported from Void Linux's template for 'libass'. Review before relying on it.
# hooks not translated: post_install, pre_configure
# needs, but Forge has no recipe for yet: enca, harfbuzz
[package]
name = "libass"
version = "0.17.5"
archive = "https://github.com/libass/libass/archive/0.17.5.tar.gz"
sha256 = "fa286fc9ee1ba3b932703a3df7b8474d01dc8abe29ec69b6fa68781dc4bf7acc"
strip_components = 1
description = "Portable library for SSA/ASS subtitles rendering"
homepage = "https://github.com/libass/libass/"
license = "MIT"
deps = ["fontconfig", "fribidi"]

[build]
system = "autotools"
tools = ["pkg-config"]

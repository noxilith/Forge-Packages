# Imported from Void Linux's template for 'gnome-mahjongg'. Review before relying on it.
# needs, but Forge has no recipe for yet: itstool
[package]
name = "gnome-mahjongg"
version = "51.1"
archive = "https://download.gnome.org/sources/gnome-mahjongg/51/gnome-mahjongg-51.1.tar.xz"
sha256 = "2ef9a1cd246d8ccc9ccd27fa435f972a81def9cf3eccc4c880cbb8929ffb8821"
strip_components = 1
description = "GNOME Mahjongg solitaire game"
homepage = "https://gitlab.gnome.org/GNOME/gnome-mahjongg"
license = "GPL-2.0-or-later"
deps = ["libadwaita", "librsvg"]

[build]
system = "meson"
tools = ["pkg-config"]
deps = ["desktop-file-utils", "gettext", "glib", "gtk4", "vala"]

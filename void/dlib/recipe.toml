# Imported from Void Linux's template for 'dlib'. Review before relying on it.
# hooks not translated: post_build, post_extract, post_install
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: ffmpeg6, python3-distutils-extra, python3-packaging-bootstrap, python3-pybind11, python3-setuptools
[package]
name = "dlib"
version = "20.0"
archive = "https://github.com/davisking/dlib/archive/v20.0.tar.gz"
sha256 = "705749801c7896f5c19c253b6be639f4cef2c1831a9606955f01b600b3d86d80"
strip_components = 1
description = "Modern C++ toolkit containing machine learning algorithms and tools"
homepage = "http://dlib.net"
license = "BSL-1.0"
deps = ["lapack", "libjpeg-turbo", "libpng", "zlib"]
patches = ["patches/pybind11cmake.patch"]

[build]
system = "cmake"
configure_args = ["-DBUILD_SHARED_LIBS=ON"]
tools = ["pkg-config"]

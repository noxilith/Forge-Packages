# Imported from Void Linux's template for 'mtxclient'. Review before relying on it.
# hooks not translated: post_install
[package]
name = "mtxclient"
version = "0.10.1"
archive = "https://github.com/Nheko-Reborn/mtxclient/archive/v0.10.1.tar.gz"
sha256 = "203be46a08e1dc6cfc068d0911f3b09976f48e4cc4302c3517b9c0f4e53631e3"
strip_components = 1
description = "Client API library for the Matrix protocol"
homepage = "https://github.com/Nheko-Reborn/mtxclient"
license = "MIT"
deps = ["coeurl", "json-c++", "olm", "openssl", "re2", "spdlog"]

[build]
system = "cmake"
configure_args = ["-DBUILD_LIB_TESTS=OFF", "-DBUILD_LIB_EXAMPLES=OFF"]
tools = ["pkg-config"]

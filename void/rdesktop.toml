# Imported from Void Linux's template for 'rdesktop'. Review before relying on it.
# hooks not translated: pre_configure
# needs, but Forge has no recipe for yet: mit-krb5
[package]
name = "rdesktop"
version = "1.9.0"
archive = "https://github.com/rdesktop/rdesktop/releases/download/v1.9.0/rdesktop-1.9.0.tar.gz"
sha256 = "473c2f312391379960efe41caad37852c59312bc8f100f9b5f26609ab5704288"
strip_components = 1
description = "Open source client for Windows Remote Desktop Services"
homepage = "http://www.rdesktop.org/"
license = "GPL-3.0-or-later"
deps = ["alsa-lib", "gnutls", "libXcursor", "libXrandr", "libgssglue", "libsamplerate", "libtasn1", "nettle", "pcsclite"]

[build]
system = "autotools"
configure_args = ["--with-ipv6", "--with-sound=alsa"]
tools = ["pkg-config"]

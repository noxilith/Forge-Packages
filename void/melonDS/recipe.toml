# Imported from Void Linux's template for 'melonDS'. Review before relying on it.
# needs, but Forge has no recipe for yet: qt6-multimedia, qt6-svg
[package]
name = "melonDS"
version = "1.1"
archive = "https://github.com/melonDS-emu/melonDS/archive/refs/tags/1.1.tar.gz"
sha256 = "61e339bcb18a68a17485973637d972ea628c5624d7e6b8adf6870f895d5e26fd"
strip_components = 1
description = "Nintendo DS emulator"
homepage = "https://melonds.kuribo64.net/"
license = "GPL-3.0-or-later"
deps = ["SDL2", "faad2", "libarchive", "libenet", "libepoxy", "libslirp", "qt6-base", "wayland"]
patches = ["patches/align-test-case-i686.patch"]

[build]
system = "cmake"
tools = ["pkg-config"]
deps = ["extra-cmake-modules"]

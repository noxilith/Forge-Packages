# Imported from Void Linux's template for 'filelight'. Review before relying on it.
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "filelight"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/filelight-26.08.1.tar.xz"
sha256 = "dbb3aebe51871bf0d9a6d06cefabe1a081a3305d3d0d21b28e0368ccb49b8149"
strip_components = 1
description = "Interactive map that helps visualize disk usage on your computer"
homepage = "https://utils.kde.org/projects/filelight/"
license = "GPL-2.0-only"
deps = ["kf6-kconfig", "kf6-kcoreaddons", "kf6-kcrash", "kf6-kdoctools", "kf6-ki18n", "kf6-kio", "kf6-kirigami", "kf6-kpackage", "kf6-kquickcharts", "kf6-kxmlgui", "kf6-qqc2-desktop-style", "kirigami-addons", "qt6-declarative"]
patches = ["patches/musl.patch"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
deps = ["extra-cmake-modules", "gettext", "qt6-base"]

# Imported from Void Linux's template for 'mellowplayer'. Review before relying on it.
# needs, but Forge has no recipe for yet: qt5, qt5-webengine
[package]
name = "mellowplayer"
version = "3.6.8"
archive = "https://gitlab.com/ColinDuquesnoy/MellowPlayer/-/archive/3.6.8/MellowPlayer-3.6.8.tar.bz2"
sha256 = "7571588a704d0e76e65764f7a7725cf2b22125e06d930f236d19f75c1ecf559d"
strip_components = 1
description = "QT based cloud music integration for your desktop"
homepage = "https://colinduquesnoy.gitlab.io/MellowPlayer/"
license = "GPL-2.0-or-later"
deps = ["libnotify"]
patches = ["patches/no-werror.patch"]

[build]
system = "cmake"
tools = ["pkg-config"]

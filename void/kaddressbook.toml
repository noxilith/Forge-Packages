# Imported from Void Linux's template for 'kaddressbook'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "kaddressbook"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/kaddressbook-26.08.1.tar.xz"
sha256 = "fb37324db737ccdb3f8680ed7b1f03ac24418aeb6f1545e78486c2b9b05cdec9"
strip_components = 1
description = "KDE contact manager"
homepage = "https://kde.org/applications/en/office/org.kde.kaddressbook"
license = "GPL-2.0-or-later"
deps = ["kf6-akonadi", "kf6-kcmutils", "kf6-kuserfeedback", "kontactinterface", "libkdepim", "libkleo", "pimcommon"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "gettext", "kf6-kconfig", "kf6-kcoreaddons", "qt6-base"]

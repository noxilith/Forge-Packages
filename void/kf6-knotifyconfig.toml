# Imported from Void Linux's template for 'kf6-knotifyconfig'. Review before relying on it.
# needs, but Forge has no recipe for yet: kf6-base, libcanberra, qt6-tools
[package]
name = "kf6-knotifyconfig"
version = "6.30.0"
archive = "https://download.kde.org/stable/frameworks/6.30/knotifyconfig-6.30.0.tar.xz"
sha256 = "4a133decdb0d3731dbaa1d3625b30f057089e5c59c8326ff88a047cef35b2efb"
strip_components = 1
description = "KDE Configuration dialog for desktop notification"
homepage = "https://invent.kde.org/frameworks/knotifyconfig"
license = "LGPL-2.1-or-later"
deps = ["kf6-kcompletion", "kf6-kconfig", "kf6-ki18n", "kf6-kio", "kf6-knotifications", "kf6-kxmlgui", "qt6-base"]

[build]
system = "cmake"
deps = ["extra-cmake-modules", "gettext"]

# Imported from Void Linux's template for 'telepathy-haze'. Review before relying on it.
# needs, but Forge has no recipe for yet: telepathy-glib
[package]
name = "telepathy-haze"
version = "0.8.1"
archive = "https://telepathy.freedesktop.org/releases/telepathy-haze/telepathy-haze-0.8.1.tar.gz"
sha256 = "704befa42eec2173eca4bac01ffd004014665f2bad46dc8948e5423364cde30a"
strip_components = 1
description = "Backend for telepathy to use libpurple (Pidgin) protocols"
homepage = "https://telepathy.freedesktop.org"
license = "GPL-2.0-or-later"
deps = ["glib", "pidgin"]
patches = ["patches/incompat-ptr.patch"]

[build]
system = "autotools"
tools = ["pkg-config"]
deps = ["libxslt"]

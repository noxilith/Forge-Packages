# Imported from Void Linux's template for 'logstalgia'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# settings not translated: CXXFLAGS
# needs, but Forge has no recipe for yet: SDL2_image, boost, glew
[package]
name = "logstalgia"
version = "1.1.5"
archive = "https://github.com/acaudwell/Logstalgia//releases/download/logstalgia-1.1.5/logstalgia-1.1.5.tar.gz"
sha256 = "028936e9f663c877d6969ad25f145c7b420797e9a3e01c6c184815ed8309f481"
strip_components = 1
description = "Replay or stream website access logs as a retro arcade game"
homepage = "https://github.com/acaudwell/Logstalgia/"
license = "GPL-3.0-or-later"
deps = ["freetype", "glm", "pcre2"]
patches = ["patches/no-boost.patch"]

[build]
system = "autotools"
configure_args = ["--with-boost-filesystem=c", "--with-boost-system=c"]
tools = ["pkg-config"]

# Imported from Void Linux's template for 'kf6-kitemviews'. Review before relying on it.
# needs, but Forge has no recipe for yet: kf6-base, qt6-tools
[package]
name = "kf6-kitemviews"
version = "6.30.0"
archive = "https://download.kde.org/stable/frameworks/6.30/kitemviews-6.30.0.tar.xz"
sha256 = "9452f2b0cc5dd0214b88c4ce33297866be89af4177af14f5390cfb616e49c153"
strip_components = 1
description = "Set of item views extending the Qt model-view framework"
homepage = "https://invent.kde.org/frameworks/kitemviews"
license = "LGPL-2.1-or-later"
deps = ["qt6-base"]
patches = ["patches/cross-designer.patch"]

[build]
system = "cmake"
configure_args = ["-DBUILD_DESIGNERPLUGIN=ON", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
deps = ["extra-cmake-modules"]

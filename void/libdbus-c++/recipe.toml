# Imported from Void Linux's template for 'libdbus-c++'. Review before relying on it.
# hooks not translated: post_install, pre_configure
[package]
name = "libdbus-c++"
version = "0.9.2pw"
archive = "https://github.com/pkgw/dbus-cplusplus/releases/download/v0.9.2pw/libdbus-c---0.9.2pw.tar.gz"
sha256 = "4f140668f2529ecbdce99afbb89f8a977aa47a36248d5f4943b3660316752ee8"
strip_components = 1
description = "C++ API for D-BUS"
homepage = "http://dbus-cplusplus.sourceforge.net/"
license = "LGPL-2.1-or-later"
deps = ["dbus", "glib"]
patches = ["patches/cross-tools.patch"]

[build]
system = "autotools"
configure_args = ["--enable-glib", "--disable-ecore"]
tools = ["pkg-config"]

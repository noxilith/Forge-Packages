# Imported from Void Linux's template for 'hexter'. Review before relying on it.
# needs, but Forge has no recipe for yet: ladspa-sdk
[package]
name = "hexter"
version = "1.1.1"
archive = "https://github.com/smbolton/hexter/releases/download/version_1.1.1/hexter-1.1.1.tar.bz2"
sha256 = "9965db09b88c16726ec0dc4085e9be07ac1d8e46eae923f37141656e1424254d"

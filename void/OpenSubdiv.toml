# Imported from Void Linux's template for 'OpenSubdiv'. Review before relying on it.
# needs, but Forge has no recipe for yet: glew
[package]
name = "OpenSubdiv"
version = "3.6.0"
archive = "https://github.com/PixarAnimationStudios/OpenSubdiv/archive/v3_6_0.tar.gz"
sha256 = "bebfd61ab6657a4f4ff27845fb66a167d00395783bfbd253254d87447ed1d879"
strip_components = 1
description = "Open-Source subdivision surface library"
homepage = "http://graphics.pixar.com/opensubdiv/docs/intro.html"
license = "Apache-2.0"
deps = ["glfw", "libXcursor", "libXinerama", "libXrandr", "libXxf86vm", "tbb", "zlib"]

[build]
system = "cmake"
configure_args = ["-DOpenGL_GL_PREFERENCE=GLVND", "-DNO_GLTESTS=1", "-DNO_CUDA=1"]

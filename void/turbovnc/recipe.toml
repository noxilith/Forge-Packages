# Imported from Void Linux's template for 'turbovnc'. Review before relying on it.
# 2 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, pre_configure
# settings not translated: CFLAGS, conf_files
# needs, but Forge has no recipe for yet: bzip2, openjdk17, perl
[package]
name = "turbovnc"
version = "3.0.2"
archive = "https://downloads.sourceforge.net/sourceforge/turbovnc/turbovnc-3.0.2.tar.gz"
sha256 = "616dc72ce52351b70a239c2f464c83136e6143a23c7d316e3b29f68ea71c9949"
strip_components = 1
description = "Optimized version of TightVNC VNC client and server"
homepage = "https://turbovnc.org"
license = "GPL-2.0-or-later"
deps = ["freetype", "libX11", "libXext", "libXi", "libjpeg-turbo", "openssl", "pam", "zlib"]
patches = ["patches/viewer-32bit.patch"]

[build]
system = "cmake"
configure_args = ["-DTVNC_SYSTEMLIBS=ON", "-DTVNC_BUILDWEBSERVER=OFF"]

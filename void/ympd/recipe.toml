# Imported from Void Linux's template for 'ympd'. Review before relying on it.
# hooks not translated: pre_configure
[package]
name = "ympd"
version = "1.3.0"
archive = "https://github.com/notandy/ympd/archive/v1.3.0.tar.gz"
sha256 = "d9f68920cd93d1cfa971e1d7b9162a2b1724909bc9753c1338cecb3688d234d5"
strip_components = 1
description = "Standalone MPD Web GUI written in C"
homepage = "https://www.ympd.org"
license = "GPL-2.0-only"
deps = ["libmpdclient", "openssl"]
patches = ["patches/fix-cflags.patch"]

[build]
system = "cmake"
tools = ["perl", "pkg-config"]

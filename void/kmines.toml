# Imported from Void Linux's template for 'kmines'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-tools
[package]
name = "kmines"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/kmines-26.08.1.tar.xz"
sha256 = "0097fd3f17033f9a8ad518ce613ceb0920668a3c7fd6321af6ab18fa2c058074"
strip_components = 1
description = "Classic Minesweeper game"
homepage = "https://kde.org/applications/games/org.kde.kmines"
license = "GPL-2.0-or-later"
deps = ["kf6-kconfig", "kf6-kconfigwidgets", "kf6-kcoreaddons", "kf6-kcrash", "kf6-kdbusaddons", "kf6-kdoctools", "kf6-ki18n", "kf6-kio", "kf6-ktextwidgets", "kf6-kxmlgui", "libkdegames"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "gettext", "qt6-base"]

# Imported from Void Linux's template for 'libsasl'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, pre_configure
# needs, but Forge has no recipe for yet: db
[package]
name = "libsasl"
version = "2.1.28"
archive = "https://github.com/cyrusimap/cyrus-sasl/releases/download/cyrus-sasl-2.1.28/cyrus-sasl-2.1.28.tar.gz"
sha256 = "7ccfc6abd01ed67c1a0924b353e526f1b766b21f42d4562ee635a8ebfc5bb38c"
strip_components = 1
description = "Cyrus SASL - runtime shared libraries"
homepage = "https://www.cyrusimap.org/sasl/"
license = "BSD-3-Clause-Attribution"
patches = ["patches/cross-makemd5.patch", "patches/gcc14.patch"]

[build]
system = "autotools"
configure_args = ["--enable-cram", "--enable-digest", "--enable-auth-sasldb", "--enable-plain", "--enable-anon", "--enable-login", "--enable-gssapi", "--enable-ntlm", "--disable-otp", "--disable-srp", "--disable-srp-setpass", "--disable-krb4", "--with-saslauthd=no", "--with-authdaemond=no", "--with-pwcheck=no", "--with-devrandom=/dev/random", "ac_cv_gssapi_supports_spnego=yes"]
tools = ["pkg-config"]

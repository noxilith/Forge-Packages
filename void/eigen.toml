# Imported from Void Linux's template for 'eigen'. Review before relying on it.
# hooks not translated: post_install
[package]
name = "eigen"
version = "3.4.0"
archive = "https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.bz2"
sha256 = "b4c198460eba6f28d34894e3a5710998818515104d6e74e5cc331ce31e46e626"
strip_components = 1
description = "C++ template library for linear algebra (version 3.x)"
homepage = "https://eigen.tuxfamily.org/"
license = "MPL-2.0, GPL-3.0-or-later, LGPL-2.1-or-later, BSD-3-Clause"

[build]
system = "cmake"
configure_args = ["-DCMAKE_BUILD_TYPE=Release"]

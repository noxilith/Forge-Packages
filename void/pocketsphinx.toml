# Imported from Void Linux's template for 'pocketsphinx'. Review before relying on it.
[package]
name = "pocketsphinx"
version = "0.8"
archive = "https://downloads.sourceforge.net/sourceforge/cmusphinx/pocketsphinx/0.8/pocketsphinx-0.8.tar.gz"
sha256 = "874c4c083d91c8ff26a2aec250b689e537912ff728923c141c4dac48662cce7a"
strip_components = 1
description = "Lightweight speech recognition system"

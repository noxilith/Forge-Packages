# Imported from Void Linux's template for 'openimageio'. Review before relying on it.
# hooks not translated: post_install
# settings not translated: build_helper, CXXFLAGS
# needs, but Forge has no recipe for yet: boost, ffmpeg6, libjxl, libwebp
[package]
name = "openimageio"
version = "3.1.8.0"
archive = "https://github.com/AcademySoftwareFoundation/OpenImageIO/releases/download/v3.1.8.0/OpenImageIO-3.1.8.0.tar.gz"
sha256 = "2848d01d10d70461e5e63035950a4e14d3afdba116be5b71ef8eff5fd660488a"
strip_components = 1
description = "Library for reading and writing images"
homepage = "https://sites.google.com/site/openimageio/home"
license = "BSD-3-Clause"
deps = ["fmt", "freetype", "giflib", "libheif", "libjpeg-turbo", "libpng", "libraw", "opencolorio", "openexr", "openjpeg2", "openvdb", "ptex", "robin-map", "tiff"]

[build]
system = "cmake"
configure_args = ["-DUSE_QT=0", "-DUSE_PYTHON=0", "-DOIIO_BUILD_TESTS=0", "-DSTOP_ON_WARNING=0", "-DOIIO_DOWNLOAD_MISSING_TESTDATA=OFF", "-DCMAKE_CXX_STANDARD=17", "-DBUILD_MISSING_DEPS=OFF", "-DBUILD_MISSING_ROBINMAP=OFF", "-DBUILD_MISSING_FMT=OFF"]
tools = ["pkg-config"]

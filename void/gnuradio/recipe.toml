# Imported from Void Linux's template for 'gnuradio'. Review before relying on it.
# 3 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install
# settings not translated: build_helper, conf_files
# needs, but Forge has no recipe for yet: boost, doxygen, fftw, jack, libgsm, mathjax2, python3-Mako, python3-Sphinx, python3-cheetah3, python3-click, python3-click-plugins, python3-jsonschema (+12)
[package]
name = "gnuradio"
version = "3.10.12.0"
archive = "https://github.com/gnuradio/gnuradio/archive/v3.10.12.0.tar.gz"
sha256 = "fe78ad9f74c8ebf93d5c8ad6fa2c13236af330f3c67149d91a0647b3dc6f3958"
strip_components = 1
description = "Framework for software defined radio"
homepage = "https://www.gnuradio.org"
license = "GPL-3.0-or-later"
deps = ["SoapySDR", "codec2", "cppzmq", "fmt", "gmp", "gsl", "gtk+3", "libiio", "libsndfile", "python3-cairo", "python3-gobject", "sdl12-compat", "spdlog", "uhd"]
patches = ["patches/boost-1.89.patch", "patches/fix-x11-library-call.patch"]

[build]
system = "cmake"
tools = ["pkg-config"]

# Imported from Void Linux's template for 'owncloudclient'. Review before relying on it.
# settings not translated: conf_files
# needs, but Forge has no recipe for yet: qt6-svg, qt6-tools
[package]
name = "owncloudclient"
version = "6.0.3"
archive = "https://github.com/owncloud/client/archive/v6.0.3.tar.gz"
sha256 = "a36b702dcda17340c33a6f6bfbb6214034ee114d441d5c5ea7dee7955f47f57c"
strip_components = 1
description = "Connect to ownCloud servers"
homepage = "https://www.owncloud.org"
license = "GPL-2.0-or-later"
deps = ["KDSingleApplication", "libre-graph-api-cpp-qt-client", "qt6-base", "qt6-declarative", "qtkeychain-qt6"]
patches = ["patches/skip-flaky-test.patch", "patches/skip-root-test.patch"]

[build]
system = "cmake"
configure_args = ["-DWITH_AUTO_UPDATER=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
tools = ["pkg-config"]
deps = ["extra-cmake-modules"]

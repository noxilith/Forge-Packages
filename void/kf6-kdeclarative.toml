# Imported from Void Linux's template for 'kf6-kdeclarative'. Review before relying on it.
# needs, but Forge has no recipe for yet: kf6-base, qt6-shadertools, qt6-tools
[package]
name = "kf6-kdeclarative"
version = "6.30.0"
archive = "https://download.kde.org/stable/frameworks/6.30/kdeclarative-6.30.0.tar.xz"
sha256 = "7ec3583a2cf2cd7143e39936ffb39e22d20563f4c87a8462e0e9d12c59ea89a6"
strip_components = 1
description = "KDE Integration of QML and KDE work spaces"
homepage = "https://invent.kde.org/frameworks/kdeclarative"
license = "LGPL-2.1-or-later"
deps = ["kf6-kconfig", "kf6-kglobalaccel", "kf6-kguiaddons", "kf6-ki18n", "kf6-kwidgetsaddons", "qt6-declarative"]

[build]
system = "cmake"
configure_args = ["-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "gettext", "qt6-base"]

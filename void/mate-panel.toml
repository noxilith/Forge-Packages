# Imported from Void Linux's template for 'mate-panel'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# settings not translated: build_helper
# needs, but Forge has no recipe for yet: dbus-glib, itstool, libcanberra
[package]
name = "mate-panel"
version = "1.28.7"
archive = "https://github.com/mate-desktop/mate-panel/releases/download/v1.28.7/mate-panel-1.28.7.tar.xz"
sha256 = "b254791dc05219566cec9a1cec71a3dcc7674e87d94e9628b98157b764bc724c"
strip_components = 1
description = "MATE Panel"
homepage = "https://mate-desktop.org"
license = "GPL-2.0-or-later"
deps = ["caja", "dconf-editor", "gtk-layer-shell", "libSM", "libmateweather", "librsvg", "libwnck", "marco", "mate-desktop", "mate-menus", "mate-session-manager", "wayland"]

[build]
system = "autotools"
configure_args = ["--disable-static", "--disable-schemas-compile", "--enable-wayland", "--enable-introspection"]
tools = ["pkg-config"]
deps = ["gettext", "glib", "gobject-introspection"]

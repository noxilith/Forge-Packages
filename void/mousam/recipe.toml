# Imported from Void Linux's template for 'mousam'. Review before relying on it.
# needs, but Forge has no recipe for yet: python3-requests
[package]
name = "mousam"
version = "2.0.2"
archive = "https://github.com/amit9838/mousam/archive/refs/tags/v2.0.2.tar.gz"
sha256 = "2657ebc4b11582ed56cd59343c511fb9dca08f46f5974450f746bed80f26c29c"
strip_components = 1
description = "Weather at a glance"
homepage = "https://amit9838.github.io/mousam/"
license = "GPL-3.0-or-later"
patches = ["patches/disable-weak-connect.patch"]

[build]
system = "meson"
deps = ["desktop-file-utils", "gettext", "glib", "gtk+3"]

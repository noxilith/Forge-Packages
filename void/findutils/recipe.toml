# Imported from Void Linux's template for 'findutils'. Review before relying on it.
# hooks not translated: post_configure, post_extract, pre_check
[package]
name = "findutils"
version = "4.10.0"
archive = "https://ftp.gnu.org/gnu/findutils/findutils-4.10.0.tar.xz"
sha256 = "1387e0b67ff247d2abde998f90dfbf70c1491391a59ddfecb8ae698789f0a4f5"
strip_components = 1
description = "GNU Find Utilities"
homepage = "http://www.gnu.org/software/findutils"
license = "GPL-3.0-or-later"
patches = ["patches/fix-musl.patch"]

[build]
system = "autotools"
configure_args = ["--program-prefix=g"]
deps = ["gettext"]

# Imported from Void Linux's template for 'collada-dom'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: boost
[package]
name = "collada-dom"
version = "2.5.0"
archive = "https://github.com/rdiankov/collada-dom/archive/refs/tags/v2.5.0.tar.gz"
sha256 = "3be672407a7aef60b64ce4b39704b32816b0b28f61ebffd4fbd02c8012901e0d"
strip_components = 1
description = "COLLADA Document Object Model (DOM) C++ Library"
homepage = "https://github.com/rdiankov/collada-dom"
license = "MIT"
deps = ["libxml2", "minizip", "uriparser"]
patches = ["patches/boost-1.88.patch", "patches/boost-1.89.patch", "patches/gcc-16.patch", "patches/null.patch"]

[build]
system = "cmake"
tools = ["pkg-config"]

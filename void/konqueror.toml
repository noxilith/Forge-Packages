# Imported from Void Linux's template for 'konqueror'. Review before relying on it.
# 1 configure argument(s) left out (computed values or paths outside the package)
# needs, but Forge has no recipe for yet: qt6-tools, qt6-webchannel
[package]
name = "konqueror"
version = "26.08.1"
archive = "https://download.kde.org/stable/release-service/26.08.1/src/konqueror-26.08.1.tar.xz"
sha256 = "d974853fc14a356e76ac7901c7270323bf93a38e5ae4470b0a32e4b749854ccd"
strip_components = 1
description = "KDE File Manager & Web Browser"
homepage = "https://kde.org/applications/internet/org.kde.konqueror"
license = "GPL-2.0-or-later, LGPL-2.1-or-later"
deps = ["hunspell", "kf6-karchive", "kf6-kcmutils", "kf6-kcodecs", "kf6-kcrash", "kf6-kdbusaddons", "kf6-kdesu", "kf6-kdoctools", "kf6-kguiaddons", "kf6-ki18n", "kf6-kiconthemes", "kf6-kjobwidgets", "kf6-knotifications", "kf6-kparts", "kf6-ktextwidgets", "kf6-kwallet", "kf6-kwindowsystem", "kf6-kxmlgui", "kf6-sonnet", "plasma-activities", "qt6-base", "qt6-pdf"]

[build]
system = "cmake"
configure_args = ["-DBUILD_WITH_QT6=ON", "-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins", "-DKDE_INSTALL_QMLDIR=lib/qt6/qml"]
deps = ["extra-cmake-modules", "gettext", "kf6-kconfig", "kf6-kcoreaddons"]

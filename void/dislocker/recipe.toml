# Imported from Void Linux's template for 'dislocker'. Review before relying on it.
# needs, but Forge has no recipe for yet: mbedtls
[package]
name = "dislocker"
version = "0.7.3"
archive = "https://github.com/Aorimn/dislocker/archive/v0.7.3.tar.gz"
sha256 = "8d5275577c44f2bd87f6e05dd61971a71c0e56a9cbedf000bd38deadd8b6c1e6"
strip_components = 1
description = "FUSE driver to read/write Windows Bitlocker-ed volumes under Linux"
homepage = "https://github.com/Aorimn/dislocker"
license = "GPL-2.0-or-later"
deps = ["fuse"]
patches = ["patches/cross.patch", "patches/fix-cflags.patch", "patches/mbedtls3.patch"]

[build]
system = "cmake"
configure_args = ["-DLIB_INSTALL_DIR=lib"]

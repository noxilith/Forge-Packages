# Imported from Void Linux's template for 'nodejs'. Review before relying on it.
# 9 configure argument(s) left out (computed values or paths outside the package)
# hooks not translated: post_install, post_patch, pre_build, pre_configure
# settings not translated: make_build_args, CFLAGS, CXXFLAGS
# needs, but Forge has no recipe for yet: python3-setuptools, sqlite, zstd
[package]
name = "nodejs"
version = "24.22.1"
archive = "https://nodejs.org/dist/v24.22.1/node-v24.22.1.tar.xz"
sha256 = "4f5379796280cdaeb0c2f358fd04b6a16cc4fb7dfa83b5a8c91a9d963b435231"
strip_components = 1
description = "Evented I/O for V8 javascript"
homepage = "https://nodejs.org/"
license = "MIT"
deps = ["ada", "llhttp", "zlib"]
patches = ["patches/i686.patch", "patches/ppc32.patch", "patches/shared-uv.patch", "patches/v8-int64-lowering-reducer.patch", "patches/xxx-ppc-hwcap-musl.patch"]

[build]
system = "autotools"
configure_args = ["--enable-lto", "--shared-zlib", "--shared-ada", "--shared-sqlite", "--shared-zstd", "--shared-http-parser"]
tools = ["pkg-config"]

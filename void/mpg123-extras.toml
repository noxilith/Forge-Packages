# Imported from Void Linux's template for 'mpg123-extras'. Review before relying on it.
# hooks not translated: post_install
# needs, but Forge has no recipe for yet: jack, sndio
[package]
name = "mpg123-extras"
version = "1.33.7"
archive = "https://www.mpg123.org/download/mpg123-1.33.7.tar.bz2"
sha256 = "31d0e35a4ca567ec9b5ebda6c3062bb4435d6d3eacd6ef0d95cadd7854dc03ee"
strip_components = 1
description = "Fast console MPEG audio decoder/player - extra plugins"
homepage = "https://www.mpg123.org/"
license = "LGPL-2.1-only"
deps = ["SDL2", "alsa-lib", "pulseaudio"]

[build]
system = "autotools"
configure_args = ["--with-optimization=0", "--with-default-audio=alsa"]
tools = ["pkg-config"]

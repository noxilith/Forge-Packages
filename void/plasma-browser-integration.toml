# Imported from Void Linux's template for 'plasma-browser-integration'. Review before relying on it.
# needs, but Forge has no recipe for yet: kde-plasma-base, qt6-tools
[package]
name = "plasma-browser-integration"
version = "6.7.5"
archive = "https://download.kde.org/stable/plasma/6.7.5/plasma-browser-integration-6.7.5.tar.xz"
sha256 = "d88bdf85a990b4ff819e08843c74faa17715d14419981bbe24f68ec7cff0b8ce"
strip_components = 1
description = "Integration of web browsers with the KDE Plasma 6 desktop"
homepage = "https://invent.kde.org/plasma/plasma-browser-integration"
license = "GPL-3.0-or-later"
deps = ["kf6-kconfig", "kf6-kcoreaddons", "kf6-kcrash", "kf6-kdbusaddons", "kf6-kfilemetadata", "kf6-ki18n", "kf6-kio", "kf6-kjobwidgets", "kf6-knotifications", "kf6-krunner", "kf6-kservice", "kf6-kstatusnotifieritem", "kf6-purpose", "plasma-activities", "plasma-workspace", "qt6-base"]

[build]
system = "cmake"
configure_args = ["-DBUILD_TESTING=OFF", "-DKDE_INSTALL_QTPLUGINDIR=lib/qt6/plugins"]
deps = ["extra-cmake-modules", "gettext"]

# Imported from Void Linux's template for 'fcitx5-lua'. Review before relying on it.
# settings not translated: lib32disabled
# needs, but Forge has no recipe for yet: doxygen, fcitx5, lua53
[package]
name = "fcitx5-lua"
version = "5.0.17"
archive = "https://download.fcitx-im.org/fcitx5/fcitx5-lua/fcitx5-lua-5.0.17.tar.zst"
sha256 = "33b1582f40cd08fcd1e731521eeb0e45f1dadb3fd4a6a5aa998b1216e3fc6b52"
strip_components = 1
description = "Lua scripting support for fcitx5"
homepage = "https://github.com/fcitx/fcitx5-lua"
license = "LGPL-2.1-or-later"
deps = ["fmt"]

[build]
system = "cmake"
configure_args = ["-DUSE_DLOPEN=No"]
tools = ["pkg-config"]
deps = ["cldr-emoji-annotation", "extra-cmake-modules", "gettext"]

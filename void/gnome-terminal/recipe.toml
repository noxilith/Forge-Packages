# Imported from Void Linux's template for 'gnome-terminal'. Review before relying on it.
# settings not translated: lib32disabled
# needs, but Forge has no recipe for yet: docbook-xsl, gnome-shell, itstool
[package]
name = "gnome-terminal"
version = "3.56.2"
archive = "https://gitlab.gnome.org/GNOME/gnome-terminal/-/archive/3.56.2/gnome-terminal-3.56.2.tar.gz"
sha256 = "ace8f4613da3162d1f857f5722964b4fa002d351228a32d6f94cb16e4c5bf802"
strip_components = 1
description = "GNOME terminal emulator application"
homepage = "https://wiki.gnome.org/Apps/Terminal"
license = "GPL-2.0-or-later, GFDL-1.3-only"
deps = ["dconf", "desktop-file-utils", "gsettings-desktop-schemas", "libhandy1", "nautilus", "vte3"]
patches = ["patches/fix-W_EXITCODE.patch"]

[build]
system = "meson"
configure_args = ["-Dnautilus_extension=true", "-Db_ndebug=false", "-Db_lto=false"]
tools = ["pkg-config"]
deps = ["gettext", "glib", "libxslt"]

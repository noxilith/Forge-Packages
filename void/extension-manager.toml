# Imported from Void Linux's template for 'extension-manager'. Review before relying on it.
# hooks not translated: pre_build
[package]
name = "extension-manager"
version = "0.6.5"
archive = "https://github.com/mjakeman/extension-manager/archive/v0.6.5.tar.gz"
sha256 = "5a43c7b9570775948a35f402b1c1d5f0f0401e339ab2144d466f75eae26ef9de"
strip_components = 1
description = "Utility for browsing and installing GNOME Shell Extensions"
homepage = "https://github.com/mjakeman/extension-manager"
license = "GPL-3.0-or-later"
deps = ["libadwaita", "libsoup3"]

[build]
system = "meson"
configure_args = ["-Dbacktrace=false"]
tools = ["pkg-config"]
deps = ["blueprint-compiler", "desktop-file-utils", "gettext", "glib", "gtk4"]

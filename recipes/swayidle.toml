# Idle manager. Runs commands, so only its own config is pointed at the package.
# Uses the machine's sd-bus: libsystemd, or elogind where systemd's header isn't installed.
[package]
name = 'swayidle'
repo = 'https://github.com/swaywm/swayidle'
rev = 'v1.9.1'

[build]
system = 'meson'
tools = ['pkg-config', 'wayland-scanner']
# Host libraries (Forge packages above provide their own).
pkgconfig = ['wayland-client', 'wayland-protocols', 'wayland-server']
configure_args = [
  '-Dman-pages=disabled',
  '-Dbash-completions=false',
  '-Dzsh-completions=false',
  '-Dfish-completions=false',
]
# Shell fragments, decided on the build machine.
configure_sh = [
  '-Dlogind-provider=$([ -e /usr/include/systemd/sd-bus.h ] && echo systemd || echo elogind)',
]

[run]
isolate = 'none'
dirs = ['config/swayidle']
args = ['-C', '{data}/config/swayidle/config']
args_commands = ['swayidle']

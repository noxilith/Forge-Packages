[package]
name = 'hyprland-guiutils'
repo = 'https://github.com/hyprwm/hyprland-guiutils'
rev = 'v0.2.2'
deps = ['hyprlang', 'hyprutils', 'hyprtoolkit']

[build]
system = 'cmake'
tools = ['pkg-config']
# Host libraries (Forge packages above provide their own).
pkgconfig = ['pixman-1', 'xkbcommon', 'libdrm']

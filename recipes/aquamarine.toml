[package]
name = 'aquamarine'
repo = 'https://github.com/hyprwm/aquamarine'
rev = 'v0.16.0'
deps = ['hyprutils']

[build]
system = 'cmake'
deps = ['hyprwayland-scanner']   # needed only while building
tools = ['pkg-config']
# Host libraries (Forge packages above provide their own).
pkgconfig = [
  'libdrm',
  'gbm',
  'libinput',
  'libseat',
  'libudev',
  'pixman-1',
  'wayland-client',
  'wayland-protocols',
  'hwdata',
  'egl',
  'glesv2',
]

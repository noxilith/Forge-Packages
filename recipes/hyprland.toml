# The Hyprland compositor. Everything it needs that distributions often lack is a Forge dependency
# (re2, glaze, lua, libcanberra, libxcb-errors, the Hypr* libraries). The machine must provide the usual
# Wayland/graphics libraries below, glslang and a C++ compiler.
# To log in to it: `forge integrate hyprland`.
[package]
name = 'hyprland'
repo = 'https://github.com/hyprwm/Hyprland'
rev = 'v0.57.1'
deps = [
  'hyprutils',
  'hyprlang',
  'hyprcursor',
  'hyprgraphics',
  'aquamarine',
  'hyprland-protocols',
  're2',
  'glaze',
  'lua',
  'libcanberra',
  'xcb-util-errors',
  'sdbus-cpp',
]

[build]
system = 'cmake'
deps = ['hyprwayland-scanner']   # needed only while building
tools = ['pkg-config', 'python3']
# Host libraries (Forge packages above provide their own).
pkgconfig = [
  'xkbcommon',
  'uuid',
  'wayland-server',
  'wayland-protocols',
  'cairo',
  'pango',
  'pangocairo',
  'pixman-1',
  'xcursor',
  'libdrm',
  'libinput',
  'libeis-1.0',
  'gbm',
  'gio-2.0',
  'muparser',
  'lcms2',
  'xcb',
  'xcb-render',
  'xcb-xfixes',
  'xcb-icccm',
  'xcb-composite',
  'xcb-res',
  'egl',
  'glesv2',
]

[run]
isolate = 'none'
dirs = ['config/hypr']
args = ['--config', '{data}/config/hypr/hyprland.conf']
args_commands = ['Hyprland']

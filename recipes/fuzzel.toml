# Application launcher. It starts programs, so only its own --config is pointed at the package.
[package]
name = 'fuzzel'
repo = 'https://codeberg.org/dnkl/fuzzel'
rev = '1.15.0'
deps = ['fcft', 'tllist']

[build]
system = 'meson'
deps = ['scdoc']   # needed only while building
tools = ['pkg-config', 'wayland-scanner']
# Host libraries (Forge packages above provide their own).
pkgconfig = [
  'wayland-client',
  'wayland-cursor',
  'wayland-protocols',
  'xkbcommon',
  'fontconfig',
  'pixman-1',
  'cairo',
]

[run]
isolate = 'none'
dirs = ['config/fuzzel']
args = ['--config', '{data}/config/fuzzel/fuzzel.ini']
args_commands = ['fuzzel']

# Builds the packages in binaries.list from source, signs them, and publishes them to the
# `binaries` release, which `forge install` downloads from.
#
# The packages are split over parallel jobs (so a slow one cannot run into GitHub's six-hour
# limit); a last job merges what they made and replaces the release.
#
# One-time setup:
#   forge binary keygen ./keys            # on your machine; keep forge-binary.key secret
#   -> add the contents of forge-binary.key as the repository secret FORGE_BINARY_KEY
#   -> put the contents of forge-binary.pub into OFFICIAL_PUBKEY (crates/forge-build/src/binary.rs in Forge)
#
# Packages with the install path built in only fit a machine with the same FORGE_ROOT (here
# /opt/forge, the system-wide install); the rest fit any root. Both need a compatible C library.
# A distribution builds its own with its own key and FORGE_PLATFORM.
name: binaries

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

env:
  FORGE_ROOT: /opt/forge
  FORGE_PLATFORM: x86_64-linux
  # Always Forge's own compilers, never whatever the runner has: the binaries must be reproducible.
  FORGE_TOOLCHAINS: managed
  # Hyprland's libraries need C++23 (<print>), which means GCC 14; Ubuntu 24.04 defaults to 13.
  CC: gcc-14
  CXX: g++-14

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          path: packages
      - uses: actions/checkout@v4
        with:
          repository: noxilith/Forge
          path: forge
      - name: Tools the builds need
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap git curl build-essential gcc-14 g++-14 pkg-config cmake ninja-build meson autoconf automake libtool python3
          # The libraries the recipes link against. One missing name must not stop the rest.
          libs="libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev libfontconfig-dev libfreetype-dev
            libharfbuzz-dev libpixman-1-dev libpng-dev libjpeg-dev libcairo2-dev libgdk-pixbuf-2.0-dev libpango1.0-dev
            libglib2.0-dev libdrm-dev libgbm-dev libinput-dev libseat-dev libudev-dev libffi-dev libwebp-dev
            librsvg2-dev libpipewire-0.3-dev libspa-0.2-dev libpam0g-dev libpugixml-dev libtomlplusplus-dev uuid-dev
            libxcb1-dev libxcb-cursor-dev libxcb-render0-dev libxcb-xfixes0-dev libxcb-icccm4-dev
            libxcb-composite0-dev libxcb-res0-dev libxcb-util-dev libxcursor-dev libegl-dev libgles-dev hwdata
            libei-dev libmuparser-dev liblcms2-dev libsystemd-dev zlib1g-dev glslang-tools qt6-base-dev
            qt6-declarative-dev clang libclang-dev libdisplay-info-dev"
          sudo apt-get install -y $libs || for p in $libs; do sudo apt-get install -y "$p" || echo "::warning::could not install $p"; done
          # bubblewrap needs unprivileged user namespaces, which Ubuntu 24.04 restricts by default
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build Forge
        run: cargo build --release --manifest-path forge/Cargo.toml -p forge-cli
      - name: Build and pack this shard
        env:
          FORGE_BINARY_KEY: ${{ secrets.FORGE_BINARY_KEY }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -u
          forge="$PWD/forge/target/release/forge"
          install -m 0600 /dev/null key
          printf '%s\n' "$FORGE_BINARY_KEY" > key
          # The repository under test is this checkout, not the published one.
          export FORGE_REPO="$PWD/packages" FORGE_BINARY_URL=""
          sudo mkdir -p "$FORGE_ROOT"
          : > failed.txt
          for pkg in $(grep -v '^#' packages/binaries.list | grep . | awk -v s="$SHARD" '(NR-1)%3==s'); do
            sudo -E "$forge" --system install "$pkg" --yes --from-source || { echo "$pkg" >> failed.txt; echo "::warning::$pkg failed to build and was left out"; }
          done
          mkdir out
          sudo -E "$forge" --system binary pack --all --out out --secret key || true
          rm -f key
          sudo chown -R "$USER" out
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            out
            failed.txt
          if-no-files-found: warn

  publish:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: shards
      - name: Merge and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir all
          # The same package can be built in several shards (as a dependency); keep one complete
          # set of its three files, never a mix.
          for j in shards/*/out/*.json; do
            [ -e "$j" ] || continue
            stem=$(basename "$j" .json)
            [ -e "all/$stem.json" ] && continue
            cp "shards/$(echo "$j" | cut -d/ -f2)/out/$stem".{json,sig,tar.gz} all/
          done
          echo "packages: $(ls all/*.json | wc -l)"
          { echo "### Prebuilt packages"; echo "published: $(ls all/*.json | wc -l)"; echo; echo "### Failed to build"; cat shards/*/failed.txt 2>/dev/null | sort -u | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$(ls all/*.json 2>/dev/null | wc -l)" -gt 0 ] || { echo "nothing was built; keeping the current release"; exit 1; }
          # Replace the release so packages from older runs do not pile up (a release holds at most 1000 files).
          gh release delete binaries -R "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create binaries -R "$GITHUB_REPOSITORY" --title binaries --notes "Prebuilt packages for forge install (signed)."
          gh release upload binaries -R "$GITHUB_REPOSITORY" all/*
